/* ==================================================================
   Render
   ================================================================== */
const NAV = [
  {id:"home",   icon:"home",     key:"home"},
  {id:"habits", icon:"check",    key:"habits"},
  {id:"tasks",  icon:"list",     key:"tasks"},
  {id:"stats",  icon:"chart",    key:"stats"},
];
//: A project opens from Tasks, so the Tasks tab stays lit while inside one.
const NAV_OF = {project:"tasks"};

/* The blocked screen. A full screen with a way out, not a 403 string:
   join, check, and the session continues from where it was. */
function blockedScreen(){
  const b = state.blocked || {};
  return `<div style="padding:40px 0 0;text-align:center">
      <div style="font-size:34px">🔒</div>
      <h1 style="margin-top:12px">${t("sub_title")}</h1>
      <div class="t2 small" style="margin-top:8px;max-width:340px;
           margin-left:auto;margin-right:auto">${t("sub_body")}</div>
      ${b.note ? `<div class="tag hot" style="margin-top:14px">${esc(b.note)}</div>` : ""}
      <div style="margin-top:22px;text-align:left">
        ${b.channel ? `<button class="btn" data-act="sub-join"
          data-url="${esc(b.channel)}">${icon("globe", 16)} ${t("sub_join")}</button>` : ""}
        <button class="btn secondary" data-act="sub-check" style="margin-top:8px">
          ${icon("check", 16)} ${t("sub_check")}</button>
      </div></div>`;
}

/* An error is never a dead end: every failure screen carries the action
   that could fix it. */
function errorScreen(){
  return `<div style="padding:40px 0 0;text-align:center">
      <div style="font-size:30px">⚠️</div>
      <h1 style="margin-top:12px">${esc(state.error)}</h1>
      <div style="margin-top:20px;text-align:left">
        <button class="btn" data-act="reload">${t("retry")}</button>
        <button class="btn secondary" data-act="nav" data-screen="home"
                style="margin-top:8px">${t("go_home")}</button>
      </div></div>`;
}

function render(){
  const root = document.documentElement;
  /* One attribute drives the entire visual system. Each theme owns its own
     ground — Calm and Muse are light, Titan, Rage and Nexus are dark — so
     there is no separate appearance switch to disagree with it. */
  root.dataset.theme = themeOf(state.me?.theme);

  const app = document.getElementById("app");
  if(state.blocked)      app.innerHTML = blockedScreen();
  else if(state.error)   app.innerHTML = errorScreen();
  else if(state.loading) app.innerHTML = `<div class="spin"></div>`;
  else                   app.innerHTML = (SCREENS[state.screen] || SCREENS.home)();

  document.getElementById("privacy").textContent = t("privacy_line");

  const chromeOff = Boolean(state.blocked || state.error || state.loading);
  document.getElementById("fab").style.display = chromeOff ? "none" : "grid";
  document.getElementById("fab").innerHTML = icon("plus", 24);
  document.getElementById("nav").style.display = chromeOff ? "none" : "grid";

  const active = NAV_OF[state.screen] || state.screen;
  document.getElementById("nav").innerHTML = NAV.map(n => `
    <button data-act="nav" data-screen="${n.id}" class="${active === n.id ? "on" : ""}"
            aria-current="${active === n.id ? "page" : "false"}">
      <span class="ic">${icon(n.icon, 21)}</span><span>${t(n.key)}</span></button>`).join("");

  syncShell();
  syncBackButton();
}

/* The privacy strip and the navigation are both fixed, and their
   combined height changes with the language, the font size and the safe
   area. Measure the real nodes rather than guessing a padding that is
   wrong on one phone. */
function syncShell(){
  const nav = document.getElementById("nav");
  const privacy = document.getElementById("privacy");
  const root = document.documentElement;
  const navH = nav.offsetHeight || 60;
  root.style.setProperty("--nav-h", navH + "px");
  root.style.setProperty("--shell-b", (navH + (privacy.offsetHeight || 28)) + "px");
}

/* ==================================================================
   Loading
   ================================================================== */
async function loadScreen(screen){
  try{
    if(screen === "home"){
      // Home is one request. The week/month figures behind the score switch
      // are fetched only if the user asks for them.
      setState({home: await api("/api/home"), summary: null,
                scorePeriod: "day"});
    } else if(screen === "habits"){
      const [habits, prayer, journal] = await Promise.all([
        api("/api/habits"), api("/api/prayers"),
        api("/api/journal?day=" + todayISO()),
      ]);
      setState({habits, prayer, journal: journal.entry,
                journalQuestions: journal.questions});
    } else if(screen === "tasks"){
      const query = state.taskQuery ? "&q=" + encodeURIComponent(state.taskQuery) : "";
      const [tasks, projects, focus] = await Promise.all([
        api("/api/tasks?days=365" + query), api("/api/projects"),
        api("/api/focus"),
      ]);
      setState({tasks, projects: projects.projects, focus: focus.week});
      if(state.taskTab === "done"){
        const q = state.doneQuery ? "?q=" + encodeURIComponent(state.doneQuery) : "";
        setState({tasksDone: (await api("/api/tasks/done" + q)).groups});
      }
    } else if(screen === "stats"){
      await loadStats(state.statsPeriod);
    } else if(screen === "project"){
      const id = state.project?.project?.id;
      if(id) setState({project: await api(`/api/projects/${id}/tasks`)});
    }
  }catch(e){ handleError(e); }
}

/* Re-reads the habit list without touching the rest of the screen. Used after
   anything that changes a *derived* habit, so two tabs can never disagree
   about whether the same day is done. */
async function refreshHabits(){
  try{ state.habits = await api("/api/habits"); }
  catch(_){ /* the visible data stays as it was; the next load corrects it */ }
}

async function loadStats(period){
  try{ setState({stats: await api("/api/stats?period=" + period),
                 statsPeriod: period}); }
  catch(e){ handleError(e); }
}

function goto(screen, patch){
  haptic();
  setState({screen, reorderMode:false, ...(patch || {})});
  loadScreen(screen);
}

//: Whatever the user typed before a failed save, so a retry does not
//: start from a blank field.
let lastDraft = null;

function handleError(e, draft){
  console.error("ErnestOS:", e);
  if(e.status === 403){
    // Not an error screen — the subscription flow, with a way through it.
    setState({blocked:{channel:state.blocked?.channel}, loading:false});
    checkSubscription(true);
    return;
  }
  if(e.status === 409 && e.detail === "top3_full"){ toast(t("top3_full")); return; }
  if(draft){
    lastDraft = draft;
    openSheet(`
      <h3>${e.status ? t("error") : t("offline")}</h3>
      <div class="hint">${t("draft_kept")}</div>
      <div class="card" style="margin-top:10px">${esc(
        Object.values(draft.body || {}).filter(v => typeof v === "string").join(" · ")
      )}</div>
      <button class="btn" data-act="retry-draft" style="margin-top:14px">
        ${t("retry")}</button>
      <button class="btn secondary" data-act="close" style="margin-top:8px">
        ${t("cancel")}</button>`);
    return;
  }
  toast(e.status ? t("error") : t("offline"));
}

/* Re-checks membership against Telegram. Called from the blocked screen,
   so joining the channel and tapping check continues the session instead
   of restarting the app. */
async function checkSubscription(quiet){
  try{
    const r = await api("/api/subscription");
    if(r.subscribed){
      setState({blocked:null, error:null, loading:true});
      const me = await api("/api/me");
      state.lang = me.language || state.lang;
      setState({me, loading:false, screen:"home"});
      await loadScreen("home");
      return true;
    }
    setState({blocked:{channel:r.channel,
      note: quiet ? "" : r.state === "unknown" ? t("sub_unknown") : t("sub_still")}});
  }catch(e){
    setState({blocked:{channel:state.blocked?.channel, note:t("sub_unknown")}});
  }
  return false;
}

/* ==================================================================
   Actions
   ================================================================== */
async function save(request, reload, quiet, message, draft){
  try{
    await request();
    lastDraft = null;
    closeSheet();
    if(!quiet) toast(message || t("saved"));
    // A caller that updated `state` itself and passed no reload target still
    // needs the screen redrawn, or the write lands in the data and not on the
    // screen.
    if(reload) await loadScreen(reload);
    else render();
  }catch(e){
    closeSheet();
    handleError(e, draft && {...draft, request, reload});
  }
}

/* An optimistic tick: the row changes now, the request follows, and a
   failure puts it back. Waiting 300ms for a checkbox is what makes an
   app feel like a web page. */
function optimistic(mutate, request, reload){
  const snapshot = JSON.stringify({home:state.home, habits:state.habits,
                                   tasks:state.tasks, project:state.project});
  mutate();
  render();
  request().then(() => { if(reload) loadScreen(reload); })
    .catch(e => {
      const back = JSON.parse(snapshot);
      setState(back);
      handleError(e);
    });
}

const A = {
  nav: el => goto(el.dataset.screen),
  reload: () => { setState({error:null, loading:true}); boot(); },
  tab: el => { haptic(); setState({tab:el.dataset.tab, reorderMode:false}); },
  "go-tab": el => goto("habits", {tab:el.dataset.tab}),
  "task-tab": el => { haptic(); setState({taskTab:el.dataset.tab});
                      loadScreen("tasks"); },
  close: closeSheet,
  settings: () => openSheet(settingsSheet()),

  /* ---- quick capture: one field, five seconds ---- */
  "quick-add": () => { haptic(); openSheet(`
    <h3>${icon("plus", 18)} ${t("quick_add")}</h3>
    <input id="quick-title" placeholder="${t("quick_ph")}" autofocus />
    <button class="btn" data-act="quick-save" style="margin-top:12px">
      ${t("save")}</button>
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`);
    setTimeout(() => document.getElementById("quick-title")?.focus(), 60); },
  "quick-save": () => {
    const title = trimmed("quick-title");
    if(!title) return;
    save(() => api("/api/quick", {method:"POST", body:{title}}),
         state.screen, false, t("inbox_saved"), {body:{title}});
  },
  "retry-draft": () => {
    const draft = lastDraft;
    if(!draft?.request) return closeSheet();
    save(draft.request, draft.reload);
  },

  /* ---- wake-up: a real button, in both surfaces ---- */
  wake: async () => {
    haptic("medium");
    try{
      const r = await api("/api/wakeup", {method:"POST"});
      notify(r.done ? "success" : "warning");
      toast(r.done ? t("wake_done_at", {time:r.at})
                   : t("wake_late_at", {time:r.at}));
      closeSheet();
      await loadScreen(state.screen);
    }catch(e){ handleError(e); }
  },

  /* ---- overall explanation ---- */
  "overall-why": async () => {
    try{ openSheet(overallSheet(await api("/api/overall"))); }
    catch(e){ handleError(e); }
  },

  /* ---- week / calendar ---- */
  "week-expand": async () => {
    setState({showCalendar:true});
    if(!state.calendar){
      try{ setState({calendar: await api("/api/calendar")}); }
      catch(e){ handleError(e); }
    }
  },
  "week-collapse": () => setState({showCalendar:false}),
  "cal-prev": () => shiftMonth(-1),
  "cal-next": () => shiftMonth(1),
  "day-open": async el => {
    const iso = el.dataset.date;
    haptic();
    let c = state.calendar;
    if(!c || iso.slice(0, 7) !== `${c.year}-${String(c.month).padStart(2,"0")}`){
      const [y, m] = iso.split("-");
      try{ c = await api(`/api/calendar?year=${Number(y)}&month=${Number(m)}`);
           state.calendar = c; }
      catch(e){ return handleError(e); }
    }
    openSheet(daySheet(iso, c.events[iso] || []));
  },
  // Every calendar row leads somewhere real.
  "event-open": async el => {
    const {kind, id} = el.dataset;
    closeSheet();
    if(kind === "birthday") return A.birthdays();
    if(kind === "project"){
      try{ setState({screen:"project", project: await api(`/api/projects/${id}/tasks`)}); }
      catch(e){ handleError(e); }
      return;
    }
    if(!state.tasks) await loadScreen("tasks");
    openTaskSheet(id);
  },

  /* ---- quote ---- */
  quote: () => openSheet(`
    <h3>${t("quote_add")}</h3>
    <textarea id="quote-text" placeholder="${t("quote_ph")}"
      >${esc(state.home?.quote || "")}</textarea>
    <button class="btn" data-act="quote-save" style="margin-top:12px">
      ${t("save")}</button>
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`),
  "quote-save": () => save(() => api("/api/settings",
    {method:"POST", body:{quote: val("quote-text")}}), "home"),

  /* ---- habits ---- */
  "habit-toggle": el => {
    haptic();
    const id = Number(el.dataset.id);
    optimistic(() => {
      const row = state.habits?.habits?.find(x => x.id === id);
      if(row) row.done = !row.done;
      for(const cat of Object.values(state.habits?.grouped || {}))
        for(const x of cat) if(x.id === id) x.done = row ? row.done : x.done;
    }, () => api(`/api/habits/${id}/toggle`, {method:"POST"}), "habits");
  },
  "habit-toggle-home": el => {
    haptic();
    save(() => api(`/api/habits/${el.dataset.id}/toggle`, {method:"POST"}),
         "home", true);
  },
  "auto-habit": () => toast(t("auto_habit")),
  "habit-open": async el => {
    haptic();
    try{ openSheet(habitSheet(await api(`/api/habits/${el.dataset.id}/history`))); }
    catch(e){ handleError(e); }
  },
  "habit-add": () => openSheet(`
    <h3>${icon("plus", 18)} ${t("add_habit")}</h3>
    <input id="habit-name" placeholder="${t("habit_name")}" />
    <label>${t("category")}</label>
    <select id="habit-cat">
      <option value="non_negotiable">${t("non_negotiable")}</option>
      <option value="target" selected>${t("target")}</option>
      <option value="bonus">${t("bonus")}</option></select>
    <label>${t("schedule")}</label>
    <select id="habit-sched">
      <option value="daily">${t("every_day")}</option>
      <option value="weekdays">${t("weekdays_only")}</option></select>
    <button class="btn" data-act="habit-save" style="margin-top:16px">
      ${t("save")}</button>
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`),
  "habit-save": () => {
    const name = trimmed("habit-name");
    if(!name) return;
    save(() => api("/api/habits", {method:"POST", body:{
      name, category: val("habit-cat"), schedule: val("habit-sched"),
    }}), "habits");
  },
  "habit-name-save": el => save(() => api(`/api/habits/${el.dataset.id}`,
    {method:"PATCH", body:{name: trimmed("habit-name")}}), "habits"),
  "habit-cat": el => save(() => api(`/api/habits/${el.dataset.id}`,
    {method:"PATCH", body:{category: el.dataset.value}}), "habits", true),
  "habit-sched": el => {
    const value = el.dataset.value;
    if(value !== "custom")
      return save(() => api(`/api/habits/${el.dataset.id}`,
        {method:"PATCH", body:{schedule:value}}), "habits", true)
        .then(() => A["habit-open"](el));
    // Start a custom schedule from the working week rather than from
    // nothing, so the user is editing a set instead of building one.
    save(() => api(`/api/habits/${el.dataset.id}`,
      {method:"PATCH", body:{schedule:"days:0,2,4"}}), "habits", true)
      .then(() => A["habit-open"](el));
  },
  "habit-day": async el => {
    haptic();
    try{
      const h = await api(`/api/habits/${el.dataset.id}/history`);
      const day = Number(el.dataset.day);
      const days = new Set(h.days);
      days.has(day) ? days.delete(day) : days.add(day);
      const list = [...days].sort();
      // An empty set would mean "never due", which is what pausing is
      // for; keep at least one day so the habit stays meaningful.
      if(!list.length) return;
      await api(`/api/habits/${el.dataset.id}`,
        {method:"PATCH", body:{schedule:"days:" + list.join(",")}});
      openSheet(habitSheet(await api(`/api/habits/${el.dataset.id}/history`)));
      loadScreen("habits");
    }catch(e){ handleError(e); }
  },

/* Opens the edit sheet for a task found in whatever is currently loaded. */
function openTaskSheet(id){
  const pools = [state.tasks?.overdue, state.tasks?.upcoming, state.tasks?.undated,
                 state.tasks?.later, state.project?.tasks, state.home?.top3,
                 ...(state.home?.tasks_today || []).map(g => g.tasks)];
  const task = pools.flat().filter(Boolean).find(x => String(x.id) === String(id));
  if(!task) return;
  state.form = {
    id: task.id, title: task.title, description: task.description || "",
    deadline: task.deadline, due_time: task.due_time,
    remind_before: task.remind_before, recurrence: task.recurrence || "",
    priority: task.priority, project_id: task.project_id,
    when: task.deadline ? "pick" : "none", open:false,
  };
  openSheet(taskSheet(task));
}

async function settingSave(patch){
  try{
    await api("/api/settings", {method:"POST", body:patch});
    const me = await api("/api/me");
    state.lang = me.language;
    setState({me});
    if(sheetOpen()) openSheet(settingsSheet());
    toast(t("saved"));
    await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

async function prefSave(patch){
  try{
    const r = await api("/api/prefs", {method:"POST", body:patch});
    state.me = {...state.me, prefs:r.prefs};
    render();
    if(sheetOpen()) openSheet(settingsSheet());
    toast(t("saved"));
    // A timezone change moves what "today" means, so the screen is refetched.
    if(patch.timezone) await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

async function shiftMonth(delta){
  const c = state.calendar;
  if(!c) return;
  let year = c.year, month = c.month + delta;
  if(month < 1){ month = 12; year--; }
  if(month > 12){ month = 1; year++; }
  try{ setState({calendar: await api(`/api/calendar?year=${year}&month=${month}`)}); }
  catch(e){ handleError(e); }
}

/* ---------- habit reordering ----------
   The list is written back whole, so the server stores an order the user
   can see rather than a diff it has to reconstruct. The local list moves
   first so the row does not visibly snap back while the request is in
   flight; a failed save reloads the truth. */
async function saveOrder(ids){
  const previous = state.habits;
  try{
    const body = await api("/api/habits/reorder",
      {method:"PATCH", body:{habit_ids:ids}});
    const grouped = {};
    (state.habits?.categories || []).forEach(c => grouped[c] = []);
    body.habits.forEach(x => (grouped[x.category] = grouped[x.category] || []).push(x));
    setState({habits:{...state.habits, habits: body.habits, grouped}});
  }catch(e){
    setState({habits: previous});
    handleError(e);
  }
}

function moveHabit(index, delta){
  const items = state.habits?.habits || [];
  const target = index + delta;
  if(index < 0 || target < 0 || target >= items.length) return;
  haptic();
  const ids = items.map(x => x.id);
  [ids[index], ids[target]] = [ids[target], ids[index]];
  saveOrder(ids);
}

/* Touch drag. Telegram's in-app browser does not fire HTML5 drag events
   on iOS, so the reorder is driven by pointer events, which work on both. */
let dragFrom = null;
const reorderRowAt = y =>
  document.elementFromPoint(window.innerWidth / 2, y)?.closest("[data-drag-id]");

document.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".handle");
  if(!handle) return;
  const row = handle.closest("[data-drag-id]");
  if(!row) return;
  dragFrom = Number(row.dataset.index);
  row.style.opacity = ".55";
  row.setPointerCapture?.(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if(dragFrom === null) return;
  e.preventDefault();
  document.querySelectorAll("[data-drag-id]")
    .forEach(x => x.style.borderColor = "");
  const over = reorderRowAt(e.clientY);
  if(over) over.style.borderColor = "var(--accent)";
}, {passive:false});
document.addEventListener("pointerup", e => {
  if(dragFrom === null) return;
  const over = reorderRowAt(e.clientY);
  const from = dragFrom;
  dragFrom = null;
  if(!over) return render();
  const to = Number(over.dataset.index);
  if(to === from) return render();
  const ids = (state.habits?.habits || []).map(x => x.id);
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  haptic("medium");
  saveOrder(ids);
});

/* One delegated listener: rebuilt HTML never loses its handlers because
   the handler lives on document, not on the nodes. */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const action = A[el.dataset.act];
  if(action){ e.preventDefault(); action(el); }
});
// Search runs on Enter rather than per keystroke: one request per intent.
document.addEventListener("keydown", e => {
  const el = e.target.closest("[data-search]");
  if(el && e.key === "Enter"){ e.preventDefault(); A[el.dataset.search]?.(el); }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act='pref-time'],[data-act='set-tz']");
  if(el) A[el.dataset.act]?.(el);
});
window.addEventListener("resize", syncShell);
tg?.onEvent?.("viewportChanged", syncShell);

/* ---------- boot ---------- */
async function boot(){
  try{
    const me = await api("/api/me");
    state.lang = me.language || "uz";
    if(!me.is_subscribed && me.onboarded){
      // Blocked, not broken. The screen offers join and check.
      setState({me, loading:false});
      await checkSubscription(true);
      return;
    }
    setState({me, loading:false, blocked:null, error:null});
    await loadScreen("home");
    if(Object.keys(loadDraft()).length) toast(t("draft_restored"));
  }catch(e){
    console.error("ErnestOS boot failed:", e);
    if(e.status === 403){ setState({loading:false}); await checkSubscription(true); return; }
    setState({loading:false,
      error: e.status ? t("error") : t("offline")});
  }
}
boot();
