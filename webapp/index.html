<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>ErnestOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ==================================================================
   Design tokens.

   A theme is not a palette swap. Each of the five declares its own
   colour, radius, shadow, border weight, density, gradient policy and
   type scale, so switching one changes how the app *feels* and not
   only what colour it is:

     ocean     royal blue on neutral. Restrained, works light or dark.
     pure      paper and charcoal. Hairlines, no gradients, whitespace.
     midnight  graphite and near-black with one electric accent.
     sage      warm white and muted green. Soft edges, low contrast.
     aurora    dark neutral with a controlled violet-to-rose gradient.

   The five colours are the only per-theme *colour* decision; every
   other colour on the page is mixed from them further down, and custom
   properties resolve where they are used, so overriding the five
   re-derives all of them. The structural tokens (--r, --shadow,
   --btn-bg, --pad, --lift) are what make the themes different systems
   rather than different hues.

   ocean is the only theme that follows the phone's light/dark setting.
   pure and sage are light by design, midnight and aurora dark by
   design — a "soft warm calm" theme rendered near-black is not that
   theme any more, so they commit, and the picker says so.
   ================================================================== */
:root{
  /* ---- ocean: the default ---- */
  --c-bg:#0a1020; --c-surface:#121a30;
  --c-accent:#2f6bff; --c-flow:#37c2ff; --c-signal:#ff5470;
  --fg:#ffffff;

  /* ---- structure: what each theme sets besides colour ---- */
  /* The floating button's height plus its offset, so page content can
     always scroll clear of it. */
  --fab-clear:72px;
  --r-sm:9px; --r:13px; --r-lg:18px; --r-pill:999px;
  --pad:16px;            /* page gutter */
  --gap:8px;             /* the 8px grid everything steps in */
  --card-pad:14px;
  --row-min:54px;
  --border:1px;
  --shadow:0 10px 30px rgba(0,0,0,.34);
  --ring:0 0 0 1px rgba(255,255,255,.05) inset;
  --glow:0 6px 18px color-mix(in srgb, var(--c-accent) 34%, transparent);
  /* Primary buttons and the one hero card read from these, so a theme
     that wants flat surfaces sets them flat once instead of every
     component opting out. */
  --btn-bg:linear-gradient(140deg,var(--c-accent),
            color-mix(in srgb, var(--c-flow) 62%, var(--c-accent)));
  --hero-bg:linear-gradient(145deg,var(--c-accent),
             color-mix(in srgb, var(--c-flow) 70%, var(--c-accent)));
  --hero-fg:#fff;
  --hero-shadow:var(--glow);
  --h1-weight:750; --h1-size:21px; --h1-track:-.4px;
  --lift:1;              /* 0 turns off the corner highlight on hero cards */

  /* ---- derived: not chosen per theme ---- */
  --bg:var(--c-bg);
  --bg-glow:color-mix(in srgb, var(--c-accent) 20%, var(--c-bg));
  --bg-glow-2:color-mix(in srgb, var(--c-flow) 13%, transparent);
  --surface:var(--c-surface);
  --surface-2:color-mix(in srgb, var(--c-surface) 90%, var(--fg));
  --tap:color-mix(in srgb, var(--c-surface) 88%, var(--c-accent));
  --tap-line:color-mix(in srgb, var(--c-surface) 66%, var(--c-accent));
  --line:color-mix(in srgb, var(--c-surface) 88%, var(--fg));
  --line-soft:color-mix(in srgb, var(--c-surface) 94%, var(--fg));
  --text:color-mix(in srgb, var(--fg) 96%, var(--c-accent));
  --muted:color-mix(in srgb, var(--fg) 58%, var(--c-surface));
  --faint:color-mix(in srgb, var(--fg) 38%, var(--c-surface));
  --accent:var(--c-accent);
  --accent-2:var(--c-flow);
  --accent-dim:color-mix(in srgb, var(--c-accent) 20%, var(--c-bg));
  --on-accent:#fff;
  --ok:var(--c-flow);
  --warn:color-mix(in srgb, var(--c-signal) 70%, #ffb020);
  --danger:var(--c-signal);
  /* The three habit tiers, hardest first. */
  --t1:var(--c-signal); --t2:var(--c-flow); --t3:var(--c-accent);
}

/* ocean, light appearance. The accent is untouched — a theme keeps its
   identity in daylight; only the surfaces flip.

   Scoped to ocean on purpose. `:root[data-scheme=...]` is an element plus an
   attribute, so it outranks the single-attribute `[data-theme=...]` blocks
   below: unscoped, it handed Pure and Sage ocean's cool white instead of their
   own paper and warm white, and the two "light" themes rendered identically. */
:root[data-theme="ocean"][data-scheme="light"]{
  --c-bg:#f2f5fb; --c-surface:#ffffff;
  --fg:#0a1020;
  --shadow:0 8px 22px rgba(10,16,32,.08);
  --ring:0 0 0 1px rgba(0,0,0,.03) inset;
}

/* ---- pure: Apple Settings × Notion. Paper, charcoal, hairlines. ----
   No gradient anywhere, almost no shadow, wider spacing, tighter
   radius. The accent is nearly monochrome on purpose: on this theme
   the *type* carries the hierarchy, not colour. */
[data-theme="pure"]{
  --c-bg:#f6f6f7; --c-surface:#ffffff;
  --c-accent:#1c1c1e; --c-flow:#3f7d5c; --c-signal:#c0392b;
  --fg:#111113;
  --r-sm:7px; --r:10px; --r-lg:12px;
  --card-pad:15px; --gap:8px; --pad:18px;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --ring:none;
  --glow:none;
  --btn-bg:var(--c-accent);
  --hero-bg:var(--c-surface);
  --hero-fg:var(--text);
  --hero-shadow:0 1px 2px rgba(0,0,0,.06);
  --h1-weight:680; --h1-size:22px; --h1-track:-.5px;
  --lift:0;
}
/* Hairlines rather than filled borders: on paper a card is a rule, not
   a box. */
[data-theme="pure"] .card,[data-theme="pure"] .item,[data-theme="pure"] .trow{
  border-color:color-mix(in srgb, var(--fg) 11%, transparent)}

/* ---- midnight: premium dark dashboard. Graphite, near-black, one
   electric blue. Restrained glow — a productivity tool, not a gaming
   rig. ---- */
[data-theme="midnight"]{
  --c-bg:#08090c; --c-surface:#14161c;
  --c-accent:#3b82f6; --c-flow:#60a5fa; --c-signal:#f87171;
  --fg:#f4f6fb;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 12px 34px rgba(0,0,0,.6);
  --ring:0 0 0 1px rgba(255,255,255,.04) inset;
  --glow:0 4px 14px color-mix(in srgb, var(--c-accent) 22%, transparent);
  --btn-bg:color-mix(in srgb, var(--c-accent) 92%, #000);
  --hero-bg:linear-gradient(155deg,
             color-mix(in srgb, var(--c-accent) 22%, var(--c-surface)),
             var(--c-surface) 78%);
  --hero-fg:var(--text);
  --hero-shadow:var(--shadow);
  --h1-weight:700; --h1-size:21px; --h1-track:-.3px;
  --lift:0;
  --bg-glow:color-mix(in srgb, var(--c-accent) 9%, var(--c-bg));
  --bg-glow-2:transparent;
}

/* ---- sage: calm personal growth. Warm white, stone, muted green.
   The softest radius of the five and the lowest contrast. Not an eco
   app: the green is a single desaturated accent, not the theme. ---- */
[data-theme="sage"]{
  --c-bg:#f7f5f0; --c-surface:#fffefb;
  --c-accent:#5c7f6b; --c-flow:#8fae9b; --c-signal:#c2724f;
  --fg:#26251f;
  --r-sm:12px; --r:18px; --r-lg:24px;
  --card-pad:16px; --pad:18px;
  --shadow:0 6px 20px rgba(66,60,48,.07);
  --ring:none;
  --glow:0 4px 14px color-mix(in srgb, var(--c-accent) 18%, transparent);
  --btn-bg:color-mix(in srgb, var(--c-accent) 94%, #000);
  --hero-bg:color-mix(in srgb, var(--c-accent) 12%, var(--c-surface));
  --hero-fg:var(--text);
  --hero-shadow:var(--shadow);
  --h1-weight:640; --h1-size:22px; --h1-track:-.2px;
  --lift:0;
  --bg-glow:color-mix(in srgb, var(--c-accent) 7%, var(--c-bg));
  --bg-glow-2:transparent;
}

/* ---- aurora: premium expressive. Dark neutral ground so the one
   violet-to-rose gradient can carry the screen without turning the
   whole app pink. ---- */
[data-theme="aurora"]{
  --c-bg:#0c0b13; --c-surface:#181527;
  --c-accent:#8b5cf6; --c-flow:#f43f5e; --c-signal:#fbbf24;
  --fg:#f6f3ff;
  --r-sm:12px; --r:16px; --r-lg:22px;
  --shadow:0 14px 36px rgba(0,0,0,.5);
  --glow:0 8px 24px color-mix(in srgb, var(--c-accent) 32%, transparent);
  --h1-weight:720; --h1-size:22px; --h1-track:-.5px;
  --lift:1;
  --bg-glow:color-mix(in srgb, var(--c-accent) 17%, var(--c-bg));
  --bg-glow-2:color-mix(in srgb, var(--c-flow) 10%, transparent);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(120% 52% at 50% 0%, var(--bg-glow) 0%, transparent 60%),
    radial-gradient(80% 40% at 100% 3%, var(--bg-glow-2) 0%, transparent 58%);
  background-attachment:fixed;
  color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* Telegram reports its own usable height; 100vh is wrong inside the
     in-app browser, so --vh is kept in sync from JS. */
  min-height:var(--vh, 100dvh);
  /* Room for the two fixed strips at the bottom, plus the quick-capture
     button that floats above them. --shell-b is measured from the real
     nodes after every render, so a two-line privacy message on a narrow
     screen cannot cover the last card; --fab-clear is what stops the
     last row of a screen from ending up underneath the ＋ button. */
  padding-bottom:calc(var(--shell-b, 132px) + var(--fab-clear) + 12px)}
#app{padding:calc(12px + var(--safe-t, 0px)) var(--pad) 12px;
     max-width:620px;margin:0 auto;width:100%}

h1{font-size:var(--h1-size);font-weight:var(--h1-weight);
   letter-spacing:var(--h1-track);line-height:1.28;overflow-wrap:anywhere}
/* Section labels are the third level of the hierarchy and are drawn as
   quietly as that implies: small, spaced, faint, never bold black. */
h2{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:1.1px;
   color:var(--faint);margin:24px 0 8px;display:flex;align-items:center;
   justify-content:space-between;gap:8px}
h2 .act{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:650;
        color:var(--accent);display:inline-flex;align-items:center;gap:4px;
        padding:4px 2px;position:relative}
h2 .act::after{content:"";position:absolute;inset:-8px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:13px} .tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{overflow-wrap:anywhere}
.strike{text-decoration:line-through;opacity:.55}
.i{flex:none;vertical-align:-2px}

/* ---------- header ---------- */
.hero{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:var(--r);flex:none;display:grid;
        place-items:center;font-weight:750;font-size:16px;color:var(--on-accent);
        overflow:hidden;background:var(--btn-bg);box-shadow:var(--ring)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.iconbtn{width:38px;height:38px;min-width:38px;border-radius:var(--r-sm);flex:none;
         display:grid;place-items:center;background:var(--tap);
         border:var(--border) solid var(--tap-line);color:var(--text);
         box-shadow:var(--ring);position:relative;cursor:pointer}
.iconbtn::after{content:"";position:absolute;inset:-4px}
.iconbtn.sm{width:32px;height:32px;min-width:32px;border-radius:var(--r-sm)}
.iconbtn.plain{background:none;border-color:transparent;box-shadow:none;
               color:var(--muted)}

/* ---------- surfaces ----------
   Level 2 of the hierarchy: a card is a bordered panel and nothing
   else. No glow, no inner highlight, no gradient. Twenty cards each
   with their own highlight means nothing on the screen leads. */
.card{background:var(--surface);border:var(--border) solid var(--line);
      border-radius:var(--r);padding:var(--card-pad);margin-bottom:var(--gap);
      box-shadow:var(--ring)}
.card.flat{box-shadow:none}
.item{background:var(--surface);border:var(--border) solid var(--line);
      border-radius:var(--r);padding:12px var(--card-pad);margin-bottom:var(--gap);
      display:flex;align-items:center;gap:12px;min-height:var(--row-min)}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;
            align-items:center;gap:6px;flex-wrap:wrap}
.item.t1{border-left:3px solid var(--t1)}
.item.t2{border-left:3px solid var(--t2)}
.item.t3{border-left:3px solid var(--t3)}
.item.off{opacity:.5}
.item.pick{border-style:dashed;border-color:var(--danger)}

/* Level 1: exactly one block per screen is painted in the accent. On
   Home that is the NOW card; nothing else competes with it. */
.lead{background:var(--hero-bg);color:var(--hero-fg);
      border:var(--border) solid transparent;border-radius:var(--r-lg);
      padding:16px;margin-bottom:var(--gap);box-shadow:var(--hero-shadow);
      position:relative;overflow:hidden}
.lead::after{content:"";position:absolute;top:-70px;right:-46px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 66%);
  opacity:var(--lift);pointer-events:none}
.lead .k{font-size:10.5px;font-weight:760;letter-spacing:1px;text-transform:uppercase;
         opacity:.78}
.lead>*{position:relative;z-index:1}

/* ---------- controls ---------- */
.check{width:25px;height:25px;border-radius:50%;flex:none;display:grid;
       place-items:center;position:relative;cursor:pointer;
       border:2px solid var(--tap-line);color:transparent;
       transition:transform .12s,background .14s,border-color .14s}
.check::after{content:"";position:absolute;inset:-10px}
.check.on{background:var(--ok);border-color:var(--ok);
          color:color-mix(in srgb, var(--c-bg) 88%, #000)}
[data-theme="pure"] .check.on,[data-theme="sage"] .check.on{color:#fff}
.check:active{transform:scale(.88)}
.check.lock{opacity:.4;cursor:default}
.check.sq{border-radius:var(--r-sm)}
/* On the accent-painted lead card the ordinary --tap-line border disappears,
   and `currentColor` is no help because the tick itself is transparent until
   it is ticked. So the one control the whole screen is built around gets its
   own pair of rules, keyed to the card's own foreground. */
.lead .check{border-color:color-mix(in srgb, var(--hero-fg) 62%, transparent)}
.lead .check.on{background:var(--hero-fg);border-color:var(--hero-fg);
                color:var(--c-accent)}

.btn{background:var(--btn-bg);color:var(--on-accent);border:0;
     border-radius:var(--r-sm);padding:12px 15px;font:inherit;font-size:15px;
     font-weight:660;cursor:pointer;min-height:46px;width:100%;
     box-shadow:var(--glow);display:inline-flex;align-items:center;
     justify-content:center;gap:7px}
.btn:active{filter:brightness(.94)}
/* Secondary and destructive actions never look like the primary one.
   Delete is outlined, never filled — it must not be the thing a thumb
   lands on by accident. */
.btn.ghost{background:var(--tap);color:var(--text);
           border:var(--border) solid var(--tap-line);box-shadow:var(--ring)}
.btn.danger{background:transparent;color:var(--danger);
            border:var(--border) solid var(--danger);box-shadow:none}
.btn.sm{width:auto;padding:9px 13px;font-size:13.5px;min-height:40px}
.btn.link{background:none;border:0;box-shadow:none;color:var(--accent);
          width:auto;min-height:38px;padding:6px 2px;font-weight:640}
.btns{display:flex;gap:var(--gap);margin-top:12px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:132px}

input,textarea,select{width:100%;background:var(--tap);
  border:var(--border) solid var(--tap-line);color:var(--text);
  border-radius:var(--r-sm);padding:12px;font:inherit;min-height:46px;
  -webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
       linear-gradient(135deg,var(--muted) 50%,transparent 50%);
       background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;
       background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:10.5px;color:var(--faint);margin:14px 0 5px;
      text-transform:uppercase;letter-spacing:.8px;font-weight:720}
.field{display:flex;gap:var(--gap)}
.field>*{min-width:0}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--tap);
      border:var(--border) solid var(--tap-line);border-radius:var(--r-pill);
      padding:8px 13px;font-size:13px;font-weight:600;white-space:nowrap;
      cursor:pointer;color:var(--text)}
.pill.on{background:var(--btn-bg);border-color:transparent;color:var(--on-accent);
         box-shadow:var(--glow)}
.pill.sm{padding:6px 11px;font-size:12.5px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
              margin:0 calc(var(--pad) * -1);padding:0 var(--pad) 2px}
.pills.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--tap);border:var(--border) solid var(--tap-line);
     border-radius:var(--r-pill);padding:3px;gap:2px}
.seg>*{flex:1;text-align:center;padding:8px 6px;border-radius:var(--r-pill);
       font-size:13px;font-weight:640;cursor:pointer;color:var(--muted);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg>*.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* A switch, so an on/off setting does not need a Save button to look
   like it did something. */
.sw{width:44px;height:27px;border-radius:var(--r-pill);flex:none;position:relative;
    background:var(--tap);border:var(--border) solid var(--tap-line);cursor:pointer;
    transition:background .16s}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;
  border-radius:50%;background:var(--muted);transition:transform .16s,background .16s}
.sw.on{background:var(--accent);border-color:transparent}
.sw.on::before{transform:translateX(17px);background:#fff}
.setrow{display:flex;align-items:center;gap:12px;padding:11px 0;
        border-bottom:var(--border) solid var(--line-soft)}
.setrow:last-child{border-bottom:0}
.setrow .lbl{font-size:14.5px;font-weight:600}

.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.p-high{background:var(--danger)} .p-medium{background:var(--warn)}
.p-low{background:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:730;
     letter-spacing:.4px;text-transform:uppercase;color:var(--muted);
     border:var(--border) solid var(--line);border-radius:var(--r-pill);
     padding:3px 8px}
.tag.hot{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.lead .tag{color:inherit;border-color:color-mix(in srgb,var(--hero-fg) 34%,transparent);
           background:color-mix(in srgb,var(--hero-fg) 12%,transparent)}

.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;
     margin-top:8px}
.bar span{display:block;height:100%;border-radius:3px;background:var(--btn-bg)}

/* Home's numbers as a bento: different cell sizes so the block reads
   in one pass instead of as four identical boxes. The lead cell is
   last in the DOM because that is where the markup puts it; `order`
   moves it visually and a screen reader still hears written order. */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin:12px 0 4px}
.metric{background:var(--surface);border:var(--border) solid var(--line);
        border-radius:var(--r);padding:12px 13px;box-shadow:var(--ring);min-width:0}
.metric .k{font-size:10px;color:var(--faint);text-transform:uppercase;
           letter-spacing:.6px;font-weight:750}
.metric .v{font-size:19px;font-weight:740;letter-spacing:-.4px;margin-top:3px;
           display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.metric.wide{grid-column:1 / -1;display:flex;align-items:center;
             justify-content:space-between;gap:12px}
.metric.wide .v{margin-top:0}
.metrics.lead-first .metric.hd{order:-1;grid-column:1 / -1;display:flex;
  align-items:center;justify-content:space-between;gap:12px}
.metrics.lead-first .metric.hd .v{font-size:30px;letter-spacing:-1.2px;margin-top:0}
.trend{font-size:12.5px;font-weight:700}
.trend.up{color:var(--ok)} .trend.down{color:var(--danger)}
.trend.flat{color:var(--muted)}

/* Task rows: flat, with the coloured left edge as the only decoration
   and priority as the only thing it carries. */
.trow{background:var(--surface);border:var(--border) solid var(--line);
      border-left:3px solid var(--t2);border-radius:var(--r);
      padding:11px var(--card-pad);margin-bottom:var(--gap);display:flex;
      align-items:flex-start;gap:11px}
.trow.pri-high{border-left-color:var(--t1)}
.trow.pri-medium{border-left-color:var(--t2)}
.trow.pri-low{border-left-color:var(--t3)}
.trow .tt{font-weight:620;line-height:1.34;overflow-wrap:anywhere}
.trow .td{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;
          align-items:center;gap:6px;flex-wrap:wrap}
.trow .quick{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}

   yet; the month is one tap away instead. */

          border:var(--border) solid var(--line);padding:7px 2px 6px;
          text-align:center;min-width:0;cursor:pointer}

.strip .dow{font-size:9px;font-weight:750;color:var(--faint);text-transform:uppercase;
            letter-spacing:.3px}
.strip .dd{font-size:14px;font-weight:700;margin-top:2px}
.strip .mk{height:4px;margin-top:4px;display:flex;justify-content:center;gap:2px}
.strip .mk i{width:4px;height:4px;border-radius:50%;background:var(--accent)}

.cal-head{display:flex;align-items:center;justify-content:space-between;
          margin-bottom:10px;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%}
.cal-dow{text-align:center;font-size:9px;color:var(--faint);padding:2px 0;
         font-weight:750;min-width:0;overflow:hidden;text-transform:uppercase}
.cal-day{aspect-ratio:1;min-width:0;border-radius:var(--r-sm);
         background:var(--surface-2);border:var(--border) solid transparent;
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         font-size:12px;gap:3px}
.cal-day.empty{background:transparent}
.cal-day.today{border-color:var(--accent);color:var(--accent);font-weight:750}
.cal-day.has{cursor:pointer}
.cal-dots{display:flex;gap:2px;height:4px}
.cal-dots i{width:4px;height:4px;border-radius:50%}
.k-task{background:var(--accent)} .k-project{background:var(--warn)}
.k-birthday{background:var(--t1)}

/* ---------- habit history grid ---------- */
.hgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.hgrid i{aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.hgrid i.due{background:color-mix(in srgb, var(--muted) 34%, transparent)}

   card, no gradient — five decorated panels made entering five
   prayers feel like filling in a form. */

.prow:last-of-type{border-bottom:0}
.prow .pn{font-size:14px;font-weight:640;display:flex;align-items:center;gap:6px;
          margin-bottom:7px}
/* One strip that scrolls, never a wrapped block: five statuses plus the clear
   button do not fit on 375px in any language, and wrapping turned each prayer
   into a three-line card — which is what made entering five of them feel like
   filling in a form. */

nav button .ic{display:grid;place-items:center;height:24px}

.fab{position:fixed;right:calc(var(--pad) + 2px);z-index:41;
     bottom:calc(var(--shell-b, 132px) + 14px);

     box-shadow:var(--shadow),var(--glow);display:grid;place-items:center}
.fab:active{filter:brightness(.94)}

  -webkit-backdrop-filter:saturate(150%) blur(12px);

  padding:6px calc(var(--pad) + 4px);text-align:center;
  font-size:11px;line-height:1.35;color:var(--faint);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

             backdrop-filter:saturate(170%) blur(26px);
             -webkit-backdrop-filter:saturate(170%) blur(26px);
             width:100%;max-width:620px;margin:0 auto;
             border-radius:calc(var(--r-lg) + 8px) calc(var(--r-lg) + 8px) 0 0;
             border-top:var(--border) solid color-mix(in srgb, var(--fg) 13%, transparent);
             padding:8px var(--pad) calc(18px + var(--safe-b, 0px));
             max-height:calc(var(--vh, 100dvh) - 32px);overflow-y:auto;
             -webkit-overflow-scrolling:touch}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--line);
         margin:0 auto 12px}
.sheet h3{font-size:17px;font-weight:720;margin-bottom:3px;
          display:flex;align-items:center;gap:7px}
.sheet .hint{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
/* Progressive disclosure: the long half of a form starts closed. */
details{margin-top:14px;border-top:var(--border) solid var(--line-soft);padding-top:6px}
details>summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:640;
                color:var(--accent);padding:8px 0;display:flex;align-items:center;
                gap:6px}
details>summary::-webkit-details-marker{display:none}
details[open]>summary .chev{transform:rotate(90deg)}
.chev{transition:transform .15s}

.toast{position:fixed;left:50%;transform:translateX(-50%);
       bottom:calc(var(--shell-b, 132px) + 16px);
       background:var(--surface-2);border:var(--border) solid var(--line);
       color:var(--text);padding:10px 16px;border-radius:var(--r-sm);z-index:60;
       opacity:0;transition:opacity .2s;pointer-events:none;font-size:14px;
       box-shadow:var(--shadow);max-width:86vw;text-align:center;
       display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;pointer-events:auto}
.toast .undo{color:var(--accent);font-weight:700;cursor:pointer;flex:none}

   dead end. */

      border-top-color:var(--accent);border-radius:50%;
      animation:r .7s linear infinite;margin:40px auto}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;justify-content:center;font-size:12px;
        color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.legend span.off{opacity:.35}
.legend i{width:11px;height:3px;border-radius:2px;display:inline-block}
/* Wide content scrolls inside itself; the page never scrolls sideways. */
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Telegram's in-app browser reports a usable height that 100vh gets
   wrong, and the value changes as the keyboard opens. Mirror it, plus
   both safe-area insets, into custom properties. */
function syncViewport(){
  const root = document.documentElement;
  const h = tg?.viewportStableHeight || tg?.viewportHeight || window.innerHeight;
  root.style.setProperty("--vh", h + "px");
  const inset = tg?.contentSafeAreaInset || tg?.safeAreaInset;
  const outer = tg?.safeAreaInset;
  root.style.setProperty("--safe-t",
    Math.max(inset?.top ?? 0, outer?.top ?? 0) + "px");
  root.style.setProperty("--safe-b",
    `max(${Math.max(inset?.bottom ?? 0, outer?.bottom ?? 0)}px, env(safe-area-inset-bottom, 0px))`);
}
syncViewport();
tg?.onEvent?.("viewportChanged", syncViewport);
tg?.onEvent?.("safeAreaChanged", syncViewport);
tg?.onEvent?.("contentSafeAreaChanged", syncViewport);

/* ---------- themes ----------
   `a`/`b` paint the picker's preview card in the same colours the theme
   actually uses, so the swatch is a preview of the thing the user will
   tap rather than a decorative dot. `mode` says whether the theme
   follows the phone's light/dark setting or commits to one: a "warm,
   calm, low-contrast" theme rendered near-black is not that theme, so
   sage and pure stay light and midnight and aurora stay dark. */

  {id:"ocean",    a:"#2f6bff", b:"#37c2ff", bg:"#0a1020", mode:"both"},

                     sage:"Sage", aurora:"Aurora"};

const themeMeta = name => THEMES.find(x => x.id === themeOf(name));

const D = () => DICT[state.lang] || DICT.uz;
/* A missing key returns the key itself rather than "undefined", so a gap
   is visible in testing instead of silently shipping. */
const t = (k, vars) => {
  let s = D()[k];
  if(s === undefined) s = DICT.uz[k] ?? k;
  if(vars) for(const [key, value] of Object.entries(vars))
    s = String(s).split("{" + key + "}").join(value);
  return s;
};
const esc = s => String(s ?? "").replace(/[<>&"']/g,
  c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
function setState(patch){ Object.assign(state, patch); render(); }

/* ---------- api ---------- */
async function api(path, options = {}){
  const res = await fetch(path, {
    ...options,
    headers:{"Content-Type":"application/json",
             "X-Telegram-Init-Data": tg?.initData || "", ...(options.headers||{})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if(!res.ok){
    const err = new Error("http_" + res.status);
    err.status = res.status;
    try{ err.detail = (await res.json())?.detail; }catch(_){}
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

let toastTimer;
/* A toast may carry one action. Undo is offered wherever the action is
   reversible in one call, which is what makes a destructive tap safe to
   make with a thumb. */
function toast(msg, undoLabel, undoFn){
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>` +
    (undoFn ? `<span class="undo" id="toast-undo">${esc(undoLabel)}</span>` : "");
  el.classList.add("show");
  if(undoFn) document.getElementById("toast-undo").onclick = () => {
    el.classList.remove("show");
    undoFn();
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), undoFn ? 5000 : 2000);
}

const notify = s => tg?.HapticFeedback?.notificationOccurred?.(s || "success");

/* Telegram's own Back button, wired to whatever is currently "back":
   the open sheet first, then a sub-screen, then nothing. Without this,
   the hardware back gesture closes the whole Mini App from a detail
   view, which loses whatever the user was doing. */
function syncBackButton(){
  const bb = tg?.BackButton;
  if(!bb) return;

  else bb.hide?.();

/* A signed delta, drawn with its own arrow so the direction survives a
   monochrome screen. Zero is written as a dash, not "+0%". */
function deltaTag(value){
  if(!value) return `<span class="trend flat">·</span>`;
  const up = value > 0;
  return `<span class="trend ${up ? "up" : "down"}">${up ? "↑" : "↓"}${Math.abs(value)}</span>`;
}

/* Local dates without pulling in a formatting library: the payload
   already carries ISO strings and the month names are in DICT. */
function isoToLabel(iso){
  if(!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${D().months[m - 1]}`;
}
function shiftISO(iso, days){
  const dt = new Date(iso + "T00:00:00");
  dt.setDate(dt.getDate() + days);
  return dt.toISOString().slice(0, 10);
}
const todayISO = () => state.home?.date || new Date().toISOString().slice(0, 10);

/* ---------- line chart (inline SVG, no libraries) ---------- */
function lineChart(series, keys){
  if(!series.length) return `<div class="empty">${t("no_data")}</div>`;
  const W = 320, H = 148, L = 18, R = 8, TOP = 12, BOT = 24;
  const stepX = series.length > 1 ? (W - L - R) / (series.length - 1) : 0;
  const y = v => H - BOT - (v / 100) * (H - TOP - BOT);
  const x = i => L + i * stepX;

  const grid = [0, 50, 100].map(v =>
    `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"
       stroke-width="1" stroke-dasharray="2 5"/>
     <text x="0" y="${y(v)+3}" font-size="8" fill="var(--faint)">${v}</text>`).join("");

  const paths = keys.map((k, n) => {
    const pts = series.map((p, i) => `${x(i)},${y(p[k.field] ?? 0)}`).join(" ");
    const area = `${L},${y(0)} ${pts} ${x(series.length-1)},${y(0)}`;
    const dots = series.length <= 12
      ? series.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[k.field] ?? 0)}" r="2.5"
          fill="${k.color}"/>`).join("") : "";
    return `<polygon points="${area}" fill="${k.color}" opacity="${n === 0 ? .10 : .05}"/>
      <polyline points="${pts}" fill="none" stroke="${k.color}" stroke-width="2.3"
        stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");

  // Anchor the first and last labels inward so they are not clipped by
  // the SVG edge; everything between stays centred on its point.
  const every = Math.ceil(series.length / 6);
  const last = series.length - 1;
  const labels = series.map((p, i) => {
    if(i % every !== 0 && i !== last) return "";
    const anchor = i === 0 ? "start" : i === last ? "end" : "middle";
    return `<text x="${x(i)}" y="${H-6}" font-size="8.5" fill="var(--faint)"
              text-anchor="${anchor}">${p.label}</text>`;
  }).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${paths}${labels}</svg>`;
}

const SCREENS = {};

/* Home, top to bottom: who and when, then ONE action, then today's
   numbers, then the three that matter, the week's focus, the rest of
   today, and the week strip. Everything on this screen is either the
   next action or a number about today. Editing and deleting live on the
   screens that own the data, so a mis-tap here cannot destroy
   anything. */
SCREENS.home = () => {
  const d = state.home;
  if(!d) return `<div class="spin"></div>`;

  let h = heroBlock(d);
  h += breakBlock(d);
  h += nowBlock(d);
  h += metricsBlock(d);
  h += top3Block(d);
  h += focusBlock(d.focus);
  h += remainingBlock(d);
  h += birthdayBlock(d.birthdays);
  h += weekBlock(d);
  h += reviewPrompt();
  return h;
};

function heroBlock(d){
  const initial = (d.name || "E").charAt(0).toUpperCase();
  /* Telegram already knows the user's photo and hands it to the Mini App
     in initData, so there is nothing to upload and nothing to ask for.
     The signed-blob endpoint stays as the fallback for an avatar that was
     sent to the bot before this existed. */
  const tgPhoto = tg?.initDataUnsafe?.user?.photo_url;
  const avatar = tgPhoto
    ? `<img src="${esc(tgPhoto)}" alt="" />`
    : state.me?.has_photo
      ? `<img src="/api/avatar?tgdata=${encodeURIComponent(tg?.initData || "")}" alt="" />`
      : esc(initial);

  let h = `
    <div class="hero">
      <div class="grow">
        <h1>${t("greet")}, ${esc(d.name)}</h1>
        <div class="muted small">${esc(d.date_label)}</div>
      </div>
      <button class="iconbtn" data-act="settings"
              aria-label="${t("settings")}">${icon("settings")}</button>
      <div class="avatar" aria-hidden="true">${avatar}</div>
    </div>`;

  // The quote is optional and stays a single line when empty: an empty
  // motivational card is a demand for input, not encouragement.
  h += d.quote
    ? `<div class="muted small wrap" data-act="quote"
            style="margin-top:10px">“${esc(d.quote)}”</div>`
    : `<div class="faint tiny" data-act="quote"
            style="margin-top:8px;text-decoration:underline">${t("quote_add")}</div>`;
  return h;
}

/* Coming back after a break is met with one offer, not a wall of red.

/* The one dominant block on the screen. Its content is decided by the
   backend so the bot and the Mini App can never suggest different next

function nowBlock(d){
  const n = d.now || {kind:"clear"};
  const wake = d.wake;

  if(n.kind === "wake"){

          </div>
          <button class="btn sm" data-act="wake"
                  style="background:rgba(255,255,255,.2);color:inherit;box-shadow:none">
            ${icon("check", 17)} ${t("now_wake")}</button>
        </div></div>`;
  }

  if(n.kind === "task"){
    return `<div class="lead" style="margin-top:14px">
        <div class="k">${t("now")}</div>
        <div class="row" style="margin-top:8px">

               aria-label="${t("now_done")}">${icon("check", 15)}</div>

            <div class="wrap" style="font-size:17px;font-weight:720">
              ${esc(n.title)}</div>
            ${n.meta ? `<div class="tiny" style="opacity:.8;margin-top:3px">
              ${icon("clock", 13)} ${esc(n.meta)}</div>` : ""}
          </div>
        </div></div>`;
  }

  if(n.kind === "habit"){
    return `<div class="lead" style="margin-top:14px">
        <div class="k">${t("now")}</div>
        <div class="row" style="margin-top:8px">
          <div class="check sq" data-act="habit-toggle-home" data-id="${n.id}"
               >${icon("check", 15)}</div>
          <div class="grow wrap" style="font-size:17px;font-weight:720">
            ${esc(n.title)}</div>
        </div></div>`;
  }

  if(n.kind === "prayer" || n.kind === "journal"){
    const tab = n.kind === "prayer" ? "prayer" : "journal";

const TREND_ICON = {up:"↑", down:"↓", flat:""};

function metricsBlock(d){
  const o = d.overall || {value:0, trend:"flat"};

  return `<div class="metrics lead-first">
      <div class="metric"><div class="k">${t("tasks")}</div>

      <div class="metric wide"><div class="k">${t("prayer")}</div>

          <span class="k">🔥 ${d.streak}</span></div></div>
      <div class="metric hd" data-act="overall-why">

/* The three the user chose for today. Empty slots are shown as empty
   slots — that is the invitation to fill them, and it keeps the block

function top3Block(d){
  const picks = d.top3 || [];

/* One primary mission, drawn large, with the supporting priorities

/* Everything else due today, grouped by project. The top three are
   excluded by the backend so nothing appears twice. */

function birthdayBlock(list){

    return `<div class="item" style="min-height:46px" data-act="birthdays">

          <div class="meta">${when} · ${b.turning} ${t("turning")}</div></div>

/* The current week as a strip, with the full month one tap away. */
function weekBlock(d){
  const w = d.week;
  if(!w) return "";
  if(state.showCalendar) return `<h2>${t("calendar")}

function calendarBlock(){
  const c = state.calendar;
  if(!c) return `<div class="card"><div class="spin"></div></div>`;
  const dows = D().dow.map(x => `<div class="cal-dow">${x}</div>`).join("");
  let cells = "";
  for(let i = 0; i < c.first_weekday; i++) cells += `<div class="cal-day empty"></div>`;
  for(let day = 1; day <= c.days_in_month; day++){
    const iso = `${c.year}-${String(c.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const events = c.events[iso] || [];
    const kinds = [...new Set(events.map(e => e.kind))].slice(0, 4);
    cells += `<div class="cal-day num ${iso === c.today ? "today" : ""}
      ${events.length ? "has" : ""}"
      ${events.length ? `data-act="day-open" data-date="${iso}"` : ""}>
      <span>${day}</span>
      <span class="cal-dots">${kinds.map(k => `<i class="k-${k}"></i>`).join("")}</span></div>`;
  }
  return `<div class="card">
    <div class="cal-head">
      <button class="iconbtn sm" data-act="cal-prev"
              aria-label="‹">${icon("back", 16)}</button>
      <b>${D().months[c.month - 1]} ${c.year}</b>
      <button class="iconbtn sm" data-act="cal-next"
              aria-label="›">${icon("chevron", 16)}</button>
    </div>
    <div class="cal-grid">${dows}${cells}</div></div>`;
}

/* Offered from Friday, once, and dismissible. A weekly review that
   nags is a weekly review that gets skipped for good. */
function reviewPrompt(){
  const r = state.home?.review;
  if(!r || !r.is_week_end || r.saved || state.dismissedReview) return "";
  return `<div class="card" style="margin-top:18px">
      <div class="row">
        <div class="grow"><b>${t("review_prompt")}</b>
          <div class="muted small">${t("review_q3")}</div></div>
        <button class="iconbtn sm plain" data-act="review-dismiss"
                aria-label="${t("skip")}">${icon("x", 16)}</button>
      </div>
      <div class="btns">
        <button class="btn sm" data-act="review-open">${t("review")}</button>
      </div></div>`;
}

/* ---------- Habits / Prayer / Journal ---------- */
SCREENS.habits = () => {
  const tabs = [["habits","habits"],["prayer","prayer"],["journal","journal"]];
  let h = `<h1>${t(state.tab)}</h1>
    <div class="seg" style="margin:12px 0 14px">
      ${tabs.map(([id, key]) => `<div class="${state.tab === id ? "on" : ""}"
        data-act="tab" data-tab="${id}">${t(key)}</div>`).join("")}
    </div>`;
  if(state.tab === "prayer") return h + prayerTab();
  if(state.tab === "journal") return h + journalTab();
  return h + habitsTab();
};

const TIERS = {non_negotiable:"t1", target:"t2", bonus:"t3"};

function habitsTab(){
  const data = state.habits;
  if(!data) return `<div class="spin"></div>`;

  if(state.reorderMode) return `<div class="muted small"
      style="margin-bottom:10px">${t("reorder_hint")}</div>`
    + reorderList()
    + `<button class="btn" data-act="reorder-off"
         style="margin-top:14px">${t("finish")}</button>`;

  let h = "";
  if(data.streak)
    h += `<div class="card flat" style="text-align:center">🔥
        <b class="num">${data.streak}</b>
        <span class="muted small">${t("streak")}</span></div>`;

  // The wake-up control sits in the habit it belongs to, and it is a
  // real button rather than an instruction to go and use the chat.
  const anyDue = data.habits.some(x => x.due);

  data.categories.forEach(cat => {
    const items = (data.grouped[cat] || []);
    if(!items.length) return;
    h += `<h2>${t(cat)}</h2>`;
    h += items.map(x => habitRow(x, cat, data.wake)).join("");
  });

  if(!anyDue) h += `<div class="empty">${t("no_habits_today")}</div>`;

  // Editing, pausing and deleting a habit all live in the habit's own
  // sheet, one tap in. A screen-wide "delete mode" made removal as
  // prominent as ticking, and a mis-tap there costs every log the habit
  // ever had.
  h += `<div class="btns">
      <button class="btn" data-act="habit-add">
        ${icon("plus", 16)} ${t("add_habit")}</button>
      <button class="btn ghost" data-act="reorder-on">
        ${icon("drag", 16)} ${t("reorder")}</button>
    </div>`;
  return h;
}

function habitRow(x, cat, wake){
  if(x.paused){
    return `<div class="item ${TIERS[cat]} off">
        <div class="grow"><div class="ellipsis">${esc(x.name)}</div>
          <div class="meta">${t("paused")}</div></div>
        <button class="btn ghost sm" data-act="habit-resume" data-id="${x.id}">
          ${icon("play", 15)} ${t("resume")}</button></div>`;
  }

  const isWake = x.system_key === "wakeup";
  // A wake-up that has not happened yet gets the button; once it has, the
  // row shows the time it actually happened.
  const wakeBtn = isWake && wake && !wake.logged
    ? `<button class="btn sm" data-act="wake">☀️ ${t("wake_btn")}</button>` : "";
  const wakeMeta = isWake && wake && wake.logged
    ? (wake.done
        ? t("wake_done_at", {time: wake.at || wake.now})
        : t("wake_late_at", {time: wake.at || wake.now}))
    : isWake && x.target_time ? `${t("wake_target")} ${x.target_time}` : "";

  const meta = [];
  if(wakeMeta) meta.push(wakeMeta);
  else if(!x.due) meta.push(t("not_today"));
  else if(x.protected) meta.push(t("habit_auto_prayer"));
  if(x.remind_at) meta.push(`${icon("bell", 12)} ${x.remind_at}`);
  if(x.schedule !== "daily" && !isWake) meta.push(scheduleLabel(x));

  const box = !x.due
    ? `<div class="check lock" aria-hidden="true"></div>`
    : x.protected
      ? `<div class="check ${x.done ? "on" : ""} lock"
             data-act="auto-habit">${x.done ? icon("check", 14) : ""}</div>`
      : `<div class="check ${x.done ? "on" : ""}" data-act="habit-toggle"
             data-id="${x.id}">${icon("check", 14)}</div>`;

  return `<div class="item ${TIERS[cat]} ${x.due ? "" : "off"}">
      ${box}
      <div class="grow" data-act="habit-open" data-id="${x.id}">
        <div class="ellipsis">${esc(x.name)}</div>
        ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
      </div>
      ${wakeBtn || `<button class="iconbtn sm plain" data-act="habit-open"
          data-id="${x.id}" aria-label="${t("edit")}">${icon("chevron", 16)}</button>`}
    </div>`;
}

function scheduleLabel(x){
  if(x.schedule === "weekdays") return t("weekdays_only");
  if(x.schedule === "daily") return t("every_day");
  return (x.days || []).map(d => D().dow[d]).join(" ");
}

/* Reordering shows one flat list, not the three tiers: dragging between
   tiers would silently change a habit's category. The Up/Down buttons
   are not a fallback for the drag — they are the accessible way to do
   it, and they work with one thumb. */
function reorderList(){
  const items = state.habits?.habits || [];
  return items.map((x, i) => `
    <div class="item" data-drag-id="${x.id}" data-index="${i}">
      <div class="handle" aria-hidden="true"
           style="cursor:grab;touch-action:none;color:var(--faint)">
        ${icon("drag", 18)}</div>
      <div class="grow ellipsis">${esc(x.name)}</div>
      <button class="iconbtn sm" data-act="habit-up" data-index="${i}"
              aria-label="${t("move_up")}" ${i === 0 ? "disabled" : ""}
              >${icon("up", 15)}</button>
      <button class="iconbtn sm" data-act="habit-down" data-index="${i}"
              aria-label="${t("move_down")}"
              ${i === items.length - 1 ? "disabled" : ""}>${icon("down", 15)}</button>
    </div>`).join("");
}

/* ---------- prayer ----------
   Five compact rows, not five decorated cards. Entering five prayers is
   a five-tap job and the UI should not make it feel like a form. */
function prayerTab(){
  const p = state.prayer;
  if(!p) return `<div class="spin"></div>`;

  // Gender is only asked here, only once, and only because the set of
  // statuses genuinely differs. The reason is on screen with the
  // question rather than buried in Settings.
  if(!state.me?.gender){
    return `<div class="card">
        <b>${t("ask_gender")}</b>
        <div class="muted small" style="margin-top:4px">${t("ask_gender_why")}</div>
        <div class="btns">
          <button class="btn ghost" data-act="set-gender" data-value="male">
            ${t("male")}</button>
          <button class="btn ghost" data-act="set-gender" data-value="female">
            ${t("female")}</button>
        </div></div>`;
  }

  const ICON = {bomdod:"🌅", peshin:"☀️", asr:"🌤", shom:"🌆", xufton:"🌙"};
  const female = state.me?.gender === "female";
  let h = "";

  if(female){
    h += `<div class="item" data-act="excused" style="min-height:46px">
        <div class="check ${p.excused ? "on" : ""}">${icon("check", 14)}</div>
        <div class="grow">🌸 ${t("excused")}</div></div>`;
  }

  h += `<div class="card">`;
  ["bomdod","peshin","asr","shom","xufton"].forEach(name => {
    const cur = p.prayers[name];
    h += `<div class="prow">
        <div class="pn"><span>${ICON[name]}</span>
          <span class="ellipsis">${t(name)}</span></div>
        <div class="ps">${p.statuses.map(st =>
          `<div class="st ${st} ${cur === st ? "on" : ""}" data-act="prayer"
            data-prayer="${name}" data-status="${st}">${t(st)}</div>`).join("")}
          ${cur ? `<div class="st" data-act="prayer-clear" data-prayer="${name}"
            aria-label="${t("prayer_clear")}">${icon("x", 13)}</div>` : ""}
        </div></div>`;
  });
  h += `</div>`;

  // Two numbers, never merged: how many were prayed, and how well they were
  // prayed. The bar tracks the first of those, because that is the one the
  // `5x namoz` habit turns on.
  h += `<div class="metrics">
      <div class="metric"><div class="k">${t("performed")}</div>
        <div class="v num">${p.performed} / ${p.required}
          ${p.complete ? `<span class="trend up">✓</span>` : ""}</div></div>
      <div class="metric"><div class="k">${t("score")}</div>
        <div class="v num">${p.score} / ${p.max}</div></div>
    </div>
    <div class="card flat" style="margin-top:8px">
      <div class="row"><div class="grow small ${p.complete ? "" : "muted"}">
        ${p.complete ? `✓ ${t("full_day")}`
          : t("performed_of", {done:p.performed, total:p.required})}</div></div>
      ${bar(Math.round(p.performed / p.required * 100))}</div>`;
  return h;
}

/* ---------- journal ----------
   Not homework. Whatever is written is saved, the count is stated
   plainly, and nothing on this screen calls an unfinished entry a
   failure. Drafts survive Telegram being closed mid-sentence. */
function journalTab(){
  const entry = state.journal, questions = state.journalQuestions;
  if(!questions.length) return `<div class="spin"></div>`;
  const answers = entry?.answers || {};
  const draft = loadDraft();
  const answered = questions.filter(q =>
    String(draft[q.id] ?? answers[q.id] ?? "").trim()).length;

  let h = `<div class="row" style="margin-bottom:12px">
      <div class="grow small ${answered === questions.length ? "" : "muted"}">
        ${answered === questions.length ? `✓ ${t("journal_complete")}`
          : t("journal_progress", {done:answered, total:questions.length})}</div>
      <div class="faint tiny" id="jsave"></div>
    </div>`;

  h += `<div class="faint tiny" style="margin-bottom:10px">${t("journal_hint")}</div>`;

  questions.forEach((q, i) => {
    const value = draft[q.id] ?? answers[q.id] ?? "";
    h += `<label>${i + 1}. ${esc(q.text)}</label>
      <textarea id="jq-${q.id}" data-journal="${q.id}"
        style="min-height:72px">${esc(value)}</textarea>`;
  });

  // Mood is an optional one-tap check-in, not a mood diary. ErnestOS is
  // not a mental-health app and must not pretend to be one.
  const moods = [["awful","😞"],["low","😕"],["ok","😐"],["good","🙂"],["great","😄"]];
  h += `<label>${t("mood_q")} <span class="faint">(${t("optional")})</span></label>
    <div class="pills">${moods.map(([id, face]) =>
      `<div class="pill ${entry?.mood === id ? "on" : ""}" data-act="mood"
        data-value="${id}" aria-label="${t("mood_" + id)}"
        >${face}</div>`).join("")}</div>`;

  h += `<div class="btns">
      <button class="btn" data-act="journal-save">${t("save")}</button>
      <button class="btn ghost" data-act="journal-history">
        ${icon("book", 16)} ${t("journal_history")}</button></div>`;

  if(state.journalHistory){
    h += `<h2>${t("journal_history")}</h2>`;
    h += state.journalHistory.length ? state.journalHistory.map(e => `
      <div class="item" data-act="journal-open" data-day="${e.day}">
        <div class="grow"><div class="num small">${isoToLabel(e.day)}</div>
          <div class="meta">${esc(e.preview) || "—"}</div></div>
        <div class="faint tiny">${e.complete ? "✓"
          : `${e.answered}/${e.total}`}</div>
      </div>`).join("") : `<div class="empty">${t("empty")}</div>`;
  }
  return h;
}

/* ---------- journal drafts ----------
   Telegram can be closed by a call, a swipe or the OS at any moment. A
   long entry lost to that is the fastest way to teach someone never to
   write a long entry again, so every keystroke goes to localStorage and
   the backend gets a debounced save. */
const draftKey = () => `ernestos-journal-${todayISO()}`;

function loadDraft(){
  try{ return JSON.parse(localStorage.getItem(draftKey()) || "{}"); }
  catch(_){ return {}; }
}
function saveDraft(id, value){
  try{
    const draft = loadDraft();
    draft[id] = value;
    localStorage.setItem(draftKey(), JSON.stringify(draft));
  }catch(_){}
}
function clearDraft(){
  try{ localStorage.removeItem(draftKey()); }catch(_){}
}

let journalTimer;
function onJournalInput(el){
  saveDraft(el.dataset.journal, el.value);
  const note = document.getElementById("jsave");
  if(note) note.textContent = t("autosaved");
  clearTimeout(journalTimer);
  // Debounced so a paragraph is one request, not one per keystroke.
  journalTimer = setTimeout(async () => {
    try{
      const body = {answers:{[el.dataset.journal]: el.value}};
      const r = await api("/api/journal", {method:"POST", body});
      if(note) note.textContent = "✓";
      state.journal = {...(state.journal || {}), answered:r.answered,
                       complete:r.complete,
                       answers:{...(state.journal?.answers || {}),
                                [el.dataset.journal]: el.value}};
    }catch(_){
      // The draft is already on disk, so a failed save is recoverable.
      if(note) note.textContent = "…";
    }
  }, 900);
}
document.addEventListener("input", e => {
  const el = e.target.closest("[data-journal]");
  if(el) onJournalInput(el);
});

/* ---------- Tasks ---------- */
SCREENS.tasks = () => {
  let h = `<div class="hero">
      <h1 class="grow">${t("tasks")}</h1>
      <button class="iconbtn" data-act="task-add"
              aria-label="${t("add_task")}">${icon("plus")}</button>
    </div>
    <div class="seg" style="margin:12px 0 12px">
      <div class="${state.taskTab === "open" ? "on" : ""}"
           data-act="task-tab" data-tab="open">${t("open_tab")}</div>
      <div class="${state.taskTab === "done" ? "on" : ""}"
           data-act="task-tab" data-tab="done">${t("done_tab")}</div>
    </div>`;

  return h + (state.taskTab === "done" ? doneTab() : openTab());
};

function searchBox(id, value, placeholder, action){
  return `<div class="row" style="margin-bottom:10px">
      <div class="grow" style="position:relative">
        <input id="${id}" value="${esc(value)}" placeholder="${placeholder}"
               data-search="${action}" style="padding-left:38px" />
        <span style="position:absolute;left:12px;top:13px;color:var(--faint)"
              >${icon("search", 17)}</span>
      </div>
      ${value ? `<button class="iconbtn" data-act="${action}-clear"
        aria-label="${t("clear")}">${icon("x", 16)}</button>` : ""}
    </div>`;
}

function openTab(){
  const d = state.tasks;
  let h = searchBox("task-q", state.taskQuery, t("search_tasks"), "task-search");

  // Filters appear as chips rather than a menu: one tap to narrow, one
  // to clear, and the active one is visible without opening anything.
  const filters = [["", t("all")], ["overdue", t("overdue")],
                   ["today", t("today")], ["undated", t("no_date")],
                   ["high", t("high")]];
  h += `<div class="pills scroll" style="margin-bottom:12px">
      ${filters.map(([id, label]) => `<div class="pill sm
        ${state.taskFilter === id ? "on" : ""}" data-act="task-filter"
        data-value="${id}">${label}</div>`).join("")}</div>`;

  if(!d) return h + `<div class="spin"></div>`;

  const show = key => !state.taskFilter
    || (state.taskFilter === "overdue" && key === "overdue")
    || (state.taskFilter === "today" && key === "upcoming")
    || (state.taskFilter === "undated" && key === "undated")
    || state.taskFilter === "high";

  const highOnly = rows => state.taskFilter === "high"
    ? rows.filter(x => x.priority === "high") : rows;

  const section = (label, rows, key) => {
    const items = highOnly(show(key) ? rows : []);
    return items.length ? `<h2>${label}</h2>` + items.map(taskRow).join("") : "";
  };

  let body = "";
  body += section(t("overdue"), d.overdue, "overdue");
  body += section(t("upcoming"), d.upcoming, "upcoming");
  body += section(t("no_date"), d.undated, "undated");
  body += section(t("later"), d.later || [], "later");

  if(!body){
    h += (state.taskQuery || state.taskFilter)
      ? `<div class="empty">${t("no_results")}</div>`
      : `<div class="empty">${t("no_tasks_yet")}
          <button class="btn ghost sm" data-act="task-add"
                  style="margin:12px auto 0;display:flex">
            ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else h += body;

  h += projectsSection();
  return h;
}

function doneTab(){
  const g = state.tasksDone;
  let h = searchBox("done-q", state.doneQuery, t("search"), "done-search");
  if(!g) return h + `<div class="spin"></div>`;

  const section = (label, rows) => rows.length
    ? `<h2>${label}</h2>` + rows.map(doneRow).join("") : "";

  const body = section(t("done_today"), g.today)
    + section(t("done_week"), g.week)
    + section(t("done_earlier"), g.earlier);

  return h + (body || `<div class="empty">${
    state.doneQuery ? t("no_results") : t("empty")}</div>`);
}

function doneRow(task){
  return `<div class="item" style="min-height:46px">
      <div class="check on" data-act="task-reopen" data-id="${task.id}"
           aria-label="${t("reopen")}">${icon("check", 14)}</div>
      <div class="grow"><div class="ellipsis strike">${esc(task.title)}</div>
        <div class="meta">${esc(task.project || t("standalone"))}
          ${task.recurrence ? `· ${icon("repeat", 12)}` : ""}</div></div>
    </div>`;
}

/* An overdue task gets four ways out instead of a red badge. Nothing on
   this row calls the user late; the actions are what a person actually
   needs at that moment. */
function taskRow(task){
  const meta = [];
  if(task.project) meta.push(esc(task.project));
  if(task.deadline) meta.push(`<span class="num">${isoToLabel(task.deadline)}</span>`);
  if(task.due_time) meta.push(`<span class="num">${icon("clock", 12)} ${task.due_time}</span>`);
  if(task.recurrence) meta.push(icon("repeat", 12));
  if(task.remind_before !== null && task.remind_before !== undefined)
    meta.push(icon("bell", 12));

  const quick = task.overdue ? `
      <div class="quick">
        <div class="pill sm" data-act="task-move" data-id="${task.id}"
             data-when="today">${t("when_today")}</div>
        <div class="pill sm" data-act="task-move" data-id="${task.id}"
             data-when="tomorrow">${t("when_tomorrow")}</div>
        <div class="pill sm" data-act="task-move" data-id="${task.id}"
             data-when="week">${t("when_week")}</div>
        <div class="pill sm" data-act="task-move" data-id="${task.id}"
             data-when="none">${t("when_none")}</div>
      </div>` : "";

  return `<div class="trow pri-${task.priority}">
      <div class="check" data-act="task-done" data-id="${task.id}"
           aria-label="${t("now_done")}">${icon("check", 14)}</div>
      <div class="grow">
        <div class="tt wrap" data-act="task-open" data-id="${task.id}">
          ${esc(task.title)}</div>
        ${meta.length ? `<div class="td">${meta.join(" · ")}</div>` : ""}
        ${quick}
      </div>
      <button class="iconbtn sm plain" data-act="task-top3" data-id="${task.id}"
              aria-label="${task.top3 ? t("top3_unpick") : t("top3_pick")}"
              >${task.top3 ? "★" : "☆"}</button>
    </div>`;
}

/* Projects are a section of Tasks, not a fifth tab. */
function projectsSection(){
  const list = state.projects || [];
  let h = `<h2>${t("projects")}
      <span class="act" data-act="project-add">${icon("plus", 14)}
        ${t("add_project")}</span></h2>`;
  if(!list.length)
    return h + `<div class="empty">${t("no_projects")}
      <button class="btn ghost sm" data-act="project-add"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_project")}</button></div>`;

  return h + list.map(p => `
    <div class="card" data-act="project-open" data-id="${p.id}">
      <div class="row">
        <div class="grow ellipsis">${esc(p.name)}
          ${p.status === "done" ? `<span class="tag">${t("st_done")}</span>` : ""}</div>
        <div class="faint tiny num">${p.progress}%</div>
        ${icon("chevron", 15)}
      </div>${bar(p.progress)}</div>`).join("");
}

/* ---------- one project and the work inside it ---------- */
SCREENS.project = () => {
  const d = state.project;
  if(!d) return `<div class="spin"></div>`;
  const p = d.project;

  let h = `<div class="hero">
      <button class="iconbtn" data-act="nav" data-screen="tasks"
              aria-label="${t("tasks")}">${icon("back")}</button>
      <h1 class="grow">${esc(p.name)}</h1>

    h += `<div class="muted small wrap" style="margin-top:8px">${esc(p.description)}</div>`;

  h += `<div class="card" style="margin-top:12px">
      <div class="row">
        <div class="grow">
          <div style="font-size:24px;font-weight:750" class="num">${p.progress}%</div>
          <div class="muted small">${t("of_tasks", {done:p.tasks_done,
            total:p.tasks_total})}</div>
        </div>
        <div style="text-align:right">
          ${p.deadline ? `<div class="small num">${icon("calendar", 13)}
            ${isoToLabel(p.deadline)}</div>` : ""}
          <div class="tag" style="margin-top:5px">${
            p.archived ? t("st_archived")
              : p.status === "done" ? t("st_done") : t("st_active")}</div>
        </div>
      </div>${bar(p.progress)}</div>`;

  h += `<h2>${t("project_tasks")}
      <span class="act" data-act="task-add" data-project="${p.id}">
        ${icon("plus", 14)} ${t("add_task")}</span></h2>`;

  if(!d.tasks.length){
    h += `<div class="empty">${t("no_tasks_yet")}
      <button class="btn ghost sm" data-act="task-add" data-project="${p.id}"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else {
    const open = d.tasks.filter(x => x.status !== "done");
    const done = d.tasks.filter(x => x.status === "done");
    if(open.length) h += open.map(taskRow).join("");
    if(done.length){
      h += `<div class="group">${t("completed")} · ${done.length}</div>`;
      h += done.map(doneRow).join("");
    }
  }

  h += `<div class="btns">
      ${p.status === "done"
        ? `<button class="btn ghost" data-act="project-status" data-id="${p.id}"
             data-value="active">${t("mark_active")}</button>`
        : `<button class="btn ghost" data-act="project-status" data-id="${p.id}"
             data-value="done">${icon("check", 15)} ${t("mark_done")}</button>`}
      <button class="btn ghost" data-act="project-archive" data-id="${p.id}"
              data-value="${p.archived ? 0 : 1}">
        ${p.archived ? t("unarchive") : t("archive")}</button>
    </div>
    <button class="btn danger" data-act="project-delete" data-id="${p.id}"
            style="margin-top:8px">${icon("trash", 15)} ${t("delete")}</button>`;
  return h;
};

/* ---------- Statistics ----------
   Its own screen, loaded only when opened: Home never pays for chart
   history it does not show. Every number comes from the backend, from
   the same functions Home reads, so the two cannot disagree. */
SCREENS.stats = () => {
  const st = state.stats;
  if(!st) return `<h1>${t("stats")}</h1><div class="spin"></div>`;
  const today = st.today;
  const arrow = TREND_ICON[today.trend] || "";

  let h = `<h1>${t("stats")}</h1>
    <div class="lead" style="margin-top:14px" data-act="overall-why">
      <div class="row">
        <div class="grow">
          <div class="k">${t("overall")}</div>
          <div class="num" style="font-size:32px;font-weight:760;letter-spacing:-1px">
            ${today.overall}%
            ${arrow ? `<span class="trend ${today.trend}">${arrow}</span>` : ""}</div>
        </div>
        <div class="tag">${icon("info", 13)} ${t("how_calculated")}</div>
      </div></div>`;

  // Four numbers, each with how it moved. A percentage on its own is not
  // actionable; a percentage and a direction is.
  const cell = (key, value, delta) =>
    `<div class="metric"><div class="k">${t(key)}</div>
       <div class="v num">${pct(value)} ${deltaTag(delta)}</div></div>`;
  h += `<div class="metrics">
      ${cell("tasks", today.tasks, st.deltas.tasks)}
      ${cell("habits", today.habits, st.deltas.habits)}
      <div class="metric wide"><div class="k">${t("prayer")}</div>
        <div class="v num">${today.prayer_performed} / ${today.prayer_required}
          ${deltaTag(st.deltas.prayer)}
          <span class="k">🔥 ${today.streak}</span></div></div>
    </div>`;

  h += `<div class="seg" style="margin:16px 0 12px">
      ${["week","month","year"].map(p => `<div class="${st.period === p ? "on" : ""}"
        data-act="stats-period" data-period="${p}">${t(p)}</div>`).join("")}</div>`;

  // The series are togglable, because four lines at once is a mess and
  // which two matter is the user's call, not ours.
  const SERIES = [
    {field:"overall", color:"var(--accent)",  label:t("overall")},
    {field:"tasks",   color:"var(--t2)",      label:t("tasks")},
    {field:"habits",  color:"var(--t1)",      label:t("habits")},
    {field:"prayer",  color:"var(--warn)",    label:t("prayer")},
  ];
  const active = SERIES.filter(k => state.statsSeries[k.field]);
  h += `<div class="card">
      ${lineChart(st.series, active.length ? active : [SERIES[0]])}
      <div class="legend">${SERIES.map(k =>
        `<span class="${state.statsSeries[k.field] ? "" : "off"}"
          data-act="series-toggle" data-field="${k.field}">
          <i style="background:${k.color}"></i>${k.label}</span>`).join("")}</div>
    </div>`;

  h += `<h2>${t("average")}</h2>
    <div class="metrics">
      ${cell("overall", st.averages.overall, st.deltas.overall)}
      ${cell("tasks", st.averages.tasks, st.deltas.tasks)}
      ${cell("habits", st.averages.habits, st.deltas.habits)}
      ${cell("prayer", st.averages.prayer, st.deltas.prayer)}
    </div>
    <div class="faint tiny" style="margin-top:6px">${t("vs_prev")}</div>`;

  if(st.best_day){
    h += `<div class="card" style="margin-top:12px"><div class="row">
        <div class="grow"><div class="k faint tiny"
          style="text-transform:uppercase;letter-spacing:.6px;font-weight:750"
          >${t("best_day")}</div>
          <div style="font-weight:680;margin-top:2px">${isoToLabel(st.best_day.day)}</div>
        </div>
        <div class="num" style="font-size:20px;font-weight:740"
          >${st.best_day.overall}%</div></div></div>`;
  }

  // Prayer as five separate facts, not one opaque score.
  const pd = st.prayer_detail;
  h += `<h2>${t("prayer_detail")}</h2>
    <div class="metrics">
      <div class="metric"><div class="k">${t("pr_full_days")}</div>
        <div class="v num">${pd.full_days} / ${pd.days}</div></div>
      <div class="metric"><div class="k">${t("pr_on_time")}</div>
        <div class="v num">${pd.on_time_percent}%</div></div>
      <div class="metric"><div class="k">${t("pr_jamaat")}</div>
        <div class="v num">${pd.jamaat}</div></div>
      <div class="metric"><div class="k">${t("pr_qaza")}</div>
        <div class="v num">${pd.qaza}</div></div>
      <div class="metric"><div class="k">${t("pr_missed")}</div>
        <div class="v num">${pd.missed}</div></div>
      <div class="metric"><div class="k">${t("pr_consistency")}</div>
        <div class="v num">${pd.consistency}%</div></div>
    </div>`;

  h += `<div class="btns">
      <button class="btn ghost" data-act="stats-download">
        ${icon("download", 16)} ${t("download")}</button></div>`;
  return h;
};

/* The task form. First view is one field and four chips, because that
   covers almost every task anyone ever writes. Dates, times, reminders,
   repeats, projects and descriptions exist, and they are one tap down
   rather than seven fields to scroll past.

   `state.form` holds the in-progress choices so a chip can re-render the
   sheet without losing what was typed. */
state.form = {};

function taskSheet(task, presetProject){
  const editing = Boolean(task?.id);
  const f = state.form;
  const projects = state.projects || [];
  const options = projects.map(p =>
    `<option value="${p.id}" ${String(p.id) === String(f.project_id) ? "selected" : ""}
      >${esc(p.name)}</option>`).join("");

  const chips = [["today", t("when_today")], ["tomorrow", t("when_tomorrow")],
                 ["week", t("when_week")], ["none", t("when_none")]];

  return `
    <h3>${icon("list", 18)} ${editing ? t("edit") : t("add_task")}</h3>
    <input id="task-title" placeholder="${t("task_name")}"
           value="${esc(f.title || "")}" />

    <div class="pills" style="margin-top:10px">
      ${chips.map(([id, label]) => `<div class="pill sm
        ${f.when === id ? "on" : ""}" data-act="task-when"
        data-value="${id}">${label}</div>`).join("")}
      <div class="pill sm ${f.when === "pick" ? "on" : ""}"
           data-act="task-when" data-value="pick">
        ${icon("calendar", 14)} ${f.when === "pick" && f.deadline
          ? isoToLabel(f.deadline) : t("when_pick")}</div>
    </div>

    ${f.when === "pick" ? `<label>${t("deadline")}</label>
      <input type="date" id="task-deadline" value="${f.deadline || ""}"
             data-form="deadline" />` : ""}

    <details ${f.open ? "open" : ""}>
      <summary>${icon("chevron", 15)}<span class="chev"></span>
        ${t("more_options")}</summary>

      <label>${t("due_time")} <span class="faint">(${t("optional")})</span></label>
      <input type="time" id="task-time" value="${f.due_time || ""}" />

      <label>${t("reminder")}</label>
      <select id="task-remind">
        <option value="" ${f.remind_before === null || f.remind_before === undefined
          ? "selected" : ""}>${t("remind_none")}</option>
        ${[0, 10, 60, 1440].map(m =>
          `<option value="${m}" ${String(f.remind_before) === String(m)
            ? "selected" : ""}>${t("remind_" + m)}</option>`).join("")}
      </select>

      <label>${t("repeat")}</label>
      <select id="task-repeat">
        <option value="">${t("repeat_none")}</option>
        ${["daily","weekdays","weekly","monthly"].map(r =>
          `<option value="${r}" ${f.recurrence === r ? "selected" : ""}
            >${t("repeat_" + r)}</option>`).join("")}
      </select>

      <label>${t("priority")}</label>
      <div class="pills">${["high","medium","low"].map(p =>
        `<div class="pill sm ${(f.priority || "medium") === p ? "on" : ""}"
          data-act="task-priority" data-value="${p}">
          <span class="dot p-${p}"></span>${t(p)}</div>`).join("")}</div>

      <label>${t("project")}</label>
      <select id="task-project">
        <option value="">${t("standalone")}</option>${options}</select>

      <label>${t("task_desc")}</label>
      <textarea id="task-desc">${esc(f.description || "")}</textarea>
    </details>

    <button class="btn" style="margin-top:16px"
      ${editing ? `data-act="task-update" data-id="${task.id}"`
                : `data-act="task-save"${presetProject ? ` data-project="${presetProject}"` : ""}`}
      >${t("save")}</button>
    ${editing ? `<button class="btn danger" data-act="task-delete-go"
      data-id="${task.id}" style="margin-top:8px">
      ${icon("trash", 15)} ${t("delete")}</button>` : ""}
    <button class="btn ghost" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`;
}

/* Reads the sheet's current inputs into state.form, so re-rendering for
   a chip tap never loses typed text. */
function readTaskForm(){
  const f = state.form;
  const get = id => document.getElementById(id);
  if(get("task-title")) f.title = get("task-title").value;
  if(get("task-deadline")) f.deadline = get("task-deadline").value || null;
  if(get("task-time")) f.due_time = get("task-time").value || null;
  if(get("task-desc")) f.description = get("task-desc").value;
  if(get("task-project")) f.project_id = get("task-project").value || null;
  if(get("task-remind")){
    const v = get("task-remind").value;
    f.remind_before = v === "" ? null : Number(v);
  }
  if(get("task-repeat")) f.recurrence = get("task-repeat").value || "";
  const details = document.querySelector(".sheet details");
  if(details) f.open = details.open;
  return f;
}

/* Turns the chip choice into an actual date. `pick` keeps whatever the
   date input holds. */
function formDeadline(){
  const f = state.form;
  const today = todayISO();
  if(f.when === "today") return today;
  if(f.when === "tomorrow") return shiftISO(today, 1);
  if(f.when === "week") return shiftISO(today, 7);
  if(f.when === "none") return null;
  if(f.when === "pick") return f.deadline || null;
  return f.deadline ?? null;
}

function taskBody(){
  const f = readTaskForm();
  return {
    title: (f.title || "").trim(),
    description: f.description || "",
    deadline: formDeadline(),
    due_time: f.due_time || null,
    remind_before: f.remind_before ?? null,
    recurrence: f.recurrence || "",
    priority: f.priority || "medium",
    project_id: f.project_id ? Number(f.project_id) : null,
  };
}

/* ---------- habit sheet ----------
   Name, tier, which days, reminder, and the habit's own history. Pause
   sits next to delete and reads as the softer option, because for a
   holiday or an injury it is the right one and deleting throws away
   every log. */
function habitSheet(h){
  const days = h.days || [0,1,2,3,4,5,6];
  const custom = h.schedule !== "daily" && h.schedule !== "weekdays";
  const grid = h.grid || [];

  return `
    <h3>${icon("check", 18)} ${t("edit_habit")}</h3>
    ${h.protected
      ? `<div class="hint">${t("auto_habit")}</div>`
      : `<input id="habit-name" value="${esc(h.name)}" />`}

    ${h.protected ? "" : `<label>${t("category")}</label>
      <div class="pills">${["non_negotiable","target","bonus"].map(c =>
        `<div class="pill sm ${h.category === c ? "on" : ""}"
          data-act="habit-cat" data-id="${h.id}" data-value="${c}">${t(c)}</div>`).join("")}
      </div>`}

    <label>${t("schedule")}</label>
    <div class="pills">
      <div class="pill sm ${h.schedule === "daily" ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="daily">${t("every_day")}</div>
      <div class="pill sm ${h.schedule === "weekdays" ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="weekdays">${t("weekdays_only")}</div>
      <div class="pill sm ${custom ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="custom">${t("pick_days")}</div>
    </div>
    ${custom ? `<div class="pills" style="margin-top:8px">
      ${D().dow.map((label, i) => `<div class="pill sm
        ${days.includes(i) ? "on" : ""}" data-act="habit-day"
        data-id="${h.id}" data-day="${i}">${label}</div>`).join("")}</div>` : ""}

    ${h.system_key === "wakeup" ? `<label>${t("wake_at")}</label>
      <div class="field">
        <input type="time" id="habit-target" value="${h.target_time || "05:00"}" />
        <button class="btn sm" data-act="habit-target-save" data-id="${h.id}"
                style="min-width:96px">${t("save")}</button>
      </div>` : ""}

    <label>${t("reminder")} <span class="faint">(${t("optional")})</span></label>
    <div class="field">
      <input type="time" id="habit-remind" value="${h.remind_at || ""}" />
      <button class="btn sm" data-act="habit-remind-save" data-id="${h.id}"
              style="min-width:96px">${t("save")}</button>
    </div>

    <label>${t("history")}</label>
    <div class="metrics">
      <div class="metric"><div class="k">${t("streak")}</div>
        <div class="v num">🔥 ${h.streak}</div></div>
      <div class="metric"><div class="k">${t("completion")}</div>
        <div class="v num">${h.percent}%</div></div>
      <div class="metric wide"><div class="k">${t("last7")} · ${t("last30")}</div>
        <div class="v num">${h.last7_done}/${h.last7_due}
          <span class="k">${h.last30_done}/${h.last30_due}</span></div></div>
    </div>
    <div class="hgrid" style="margin-top:10px">${grid.map(g =>
      `<i class="${g.done ? "done" : g.due ? "due" : ""}" title="${g.day}"></i>`).join("")}</div>

    ${h.protected ? "" : `
      <div class="btns">
        <button class="btn ghost" data-act="habit-pause" data-id="${h.id}"
                data-value="${h.paused ? 0 : 1}">
          ${h.paused ? icon("play", 15) + " " + t("resume")
                     : icon("pause", 15) + " " + t("pause")}</button>
        ${h.name !== undefined ? `<button class="btn ghost"
          data-act="habit-name-save" data-id="${h.id}">${t("save")}</button>` : ""}
      </div>
      <button class="btn danger" data-act="habit-delete-confirm" data-id="${h.id}"
              style="margin-top:8px">${icon("trash", 15)} ${t("delete")}</button>`}
    <button class="btn ghost" data-act="close" style="margin-top:8px">
      ${t("close")}</button>`;
}

/* ---------- top-3 picker ----------
   Chooses from the tasks that already exist rather than creating a
   parallel list. Picking one also dates it for today, which is what the
   user meant. */
function top3Sheet(){
  const d = state.tasks;
  const picked = new Set((state.home?.top3 || []).map(x => x.id));
  const pool = d
    ? [...d.overdue, ...d.upcoming, ...d.undated, ...(d.later || [])]
        .filter(x => x.status !== "done" && !picked.has(x.id)).slice(0, 40)
    : [];

  return `<h3>${icon("target", 18)} ${t("top3_add")}</h3>
    <div class="hint">${t("top3_hint")}</div>
    ${pool.length ? pool.map(x => `
      <div class="item" style="min-height:46px" data-act="top3-add" data-id="${x.id}">
        <div class="grow"><div class="ellipsis">${esc(x.title)}</div>
          <div class="meta">${x.deadline ? isoToLabel(x.deadline) : t("no_date")}
            ${x.project ? `· ${esc(x.project)}` : ""}</div></div>
        <span class="faint">☆</span></div>`).join("")
      : `<div class="empty">${t("no_tasks_yet")}
          <button class="btn ghost sm" data-act="task-add"
                  style="margin:12px auto 0;display:flex">
            ${icon("plus", 16)} ${t("add_first_task")}</button></div>`}
    <button class="btn ghost" data-act="close" style="margin-top:12px">
      ${t("close")}</button>`;
}

/* ---------- overall explanation ----------

/* ==================================================================
   Render
   ================================================================== */
const NAV = [
  {id:"home",   icon:"home",     key:"home"},
  {id:"habits", icon:"check",    key:"habits"},
  {id:"tasks",  icon:"list",     key:"tasks"},
  {id:"stats",  icon:"chart",    key:"stats"},
];
//: A project opens from Tasks, so the Tasks tab stays lit while inside one.
const NAV_OF = {project:"tasks"};

/* The blocked screen. A full screen with a way out, not a 403 string:
   join, check, and the session continues from where it was. */
function blockedScreen(){
  const b = state.blocked || {};
  return `<div style="padding:40px 0 0;text-align:center">
      <div style="font-size:34px">🔒</div>
      <h1 style="margin-top:12px">${t("sub_title")}</h1>
