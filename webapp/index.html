      await api(`/api/projects/${el.dataset.id}`, {method:"DELETE"});
      closeSheet(); toast(t("deleted"));
      setState({screen:"tasks", project:null});
      await loadScreen("tasks");
    }catch(e){ closeSheet(); handleError(e); }
  },

  /* ---- birthdays ---- */
  birthdays: async () => {
    try{ state.birthdays = (await api("/api/birthdays")).birthdays;
         openSheet(birthdaySheet()); }
    catch(e){ handleError(e); }
  },
  "birthday-save": () => {
    const name = trimmed("bd-name"), date = val("bd-date");
    if(!name || !date) return;
    save(async () => {
      await api("/api/birthdays", {method:"POST",
        body:{person_name:name, birth_date:date, note: val("bd-note")}});
      state.birthdays = (await api("/api/birthdays")).birthdays;
      openSheet(birthdaySheet());
    }, "home", true);
  },
  "birthday-delete": el => save(async () => {
    await api(`/api/birthdays/${el.dataset.id}`, {method:"DELETE"});
    state.birthdays = (await api("/api/birthdays")).birthdays;
    openSheet(birthdaySheet());
  }, "home", true),

  /* ---- weekly review ---- */
  "review-open": async () => {
    try{ openSheet(reviewSheet(await api("/api/review"))); }
    catch(e){ handleError(e); }
  },
  "review-save": () => save(() => api("/api/review", {method:"POST", body:{
    went_well: val("rv-well"), blocked: val("rv-blocked"),
    next_focus: val("rv-next"),
  }}), "home"),
  "review-dismiss": () => closeSheet(),
  "break-dismiss": () => setState({dismissedBreak:true}),

  /* ---- fresh start ---- */
  "fresh-start": async () => {
    try{ openSheet(freshStartSheet(await api("/api/fresh-start"))); }
    catch(e){ handleError(e); }
  },
  "fresh-go": async el => {
    try{
      const r = await api("/api/fresh-start",
        {method:"POST", body:{mode: el.dataset.mode}});
      closeSheet();
      toast(t("fs_done", {n:r.moved}));
      setState({dismissedBreak:true});
      await loadScreen(state.screen);
    }catch(e){ closeSheet(); handleError(e); }
  },

  /* ---- settings ---- */
  "set-lang": el => { state.lang = el.dataset.value;
                      settingSave({language: el.dataset.value}); },
  "set-gender": el => settingSave({gender: el.dataset.value}),
  "set-theme": el => { haptic(); settingSave({theme: el.dataset.value}); },
  "set-appearance": el => {
    haptic();
    state.appearance = el.dataset.value;
    // Remembered locally: it is a device preference, not account data — the
    // same account may be read on a bright phone and a dark desktop.
    try{ localStorage.setItem("ernestos-appearance", el.dataset.value); }catch(_){}
    render();
    reopenSettings();
  },
  /* The two below fire on `change`, from the control itself, and save without
     rebuilding the sheet — see the listener at the foot of this file. */
  "set-tz": el => prefSave({timezone: el.value || val("tz-select")}, false),
  "pref-toggle": el => {
    haptic();
    const key = el.dataset.key;
    prefSave({[key]: !(state.me?.prefs || {})[key]});
  },
  "pref-time": el => {
    // An empty field is the picker being cleared, not a request to save 00:00.
    if(!el.value) return;
    prefSave({[el.dataset.key]: el.value}, false);
  },

  /* ---- data and privacy ---- */
  "set-privacy": () => { haptic(); openSettings("privacy"); },
  "privacy-info": () => openSheet(privacySheet()),
  sessions: () => openSheet(sessionsSheet()),
  export: async () => {
    try{ await api("/api/export/send", {method:"POST"});
         toast(t("export_sent")); }
    catch(e){ handleError(e); }
  },
  /* A backup is the same bytes as the export, taken a different way: straight
     into a file on the device. Telegram's in-app browser blocks ordinary
     downloads, so a browser that refuses falls back to the route that always
     works rather than failing silently — a backup button that does nothing is
     worse than no backup button. */
  backup: async () => {
    try{
      const data = await api("/api/export");
      const blob = new Blob([JSON.stringify(data, null, 2)],
                            {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ernestos-${todayISO()}.json`;
      if(a.download === undefined) throw new Error("no download support");
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(t("backup_saved"));
    }catch(_){
      try{ await api("/api/export/send", {method:"POST"});
           toast(t("export_sent")); }
      catch(e){ handleError(e); }
    }
  },
  "wipe-data": () => { haptic(); openSheet(wipeDataSheet()); },
  "wipe-data-confirm": async () => {
    // Step two of two. The first tap opened a sheet naming what goes; this one
    // sends the word the server insists on, so a stray tap cannot reach here.
    try{
      await api("/api/account/wipe", {method:"POST", body:{confirm:"WIPE"}});
      closeSheet();
      toast(t("wipe_done"));
      state.calendar = null;
      await loadScreen(state.screen);
    }catch(e){ handleError(e); }
  },
  feedback: () => openSheet(feedbackSheet()),
  "feedback-send": async () => {
    const message = trimmed("fb-text");
    if(!message) return;
    try{
      const r = await api("/api/feedback", {method:"POST", body:{message}});
      closeSheet();
      // Never claim delivery that did not happen.
      toast(r.delivered ? t("feedback_sent") : t("feedback_saved"));
    }catch(e){ closeSheet(); handleError(e); }
  },
  "delete-account": () => openSheet(deleteAccountSheet()),
  "delete-account-go": async () => {
    if(trimmed("del-confirm").toUpperCase() !== "DELETE") return;
    try{
      await api("/api/account/delete", {method:"POST",
        body:{confirm:"DELETE"}});
      closeSheet();
      setState({error:t("account_deleted"), loading:false, me:null, home:null});
      tg?.close?.();
    }catch(e){ closeSheet(); handleError(e); }
  },

  /* ---- statistics ---- */
  "stats-period": el => { haptic(); loadStats(el.dataset.period); },
  "prayer-detail": () => { haptic();
    if(state.stats?.prayer_detail)
      openSheet(prayerDetailSheet(state.stats.prayer_detail)); },
  "series-toggle": el => { haptic();
    state.statsSeries[el.dataset.field] = !state.statsSeries[el.dataset.field];
    render(); },
  "stats-download": async () => {
    // The bot sends the file into the chat: Telegram's browser blocks
    // plain downloads, and putting the credential in a URL would leak it.
    haptic("medium");
    try{
      await api("/api/stats/export?period=" + state.statsPeriod, {method:"POST"});
      toast(t("report_sent"));
    }catch(e){ handleError(e); }
  },

  /* ---- subscription ---- */
  "sub-join": el => { tg?.openTelegramLink?.(el.dataset.url)
    || window.open(el.dataset.url, "_blank"); },
  "sub-check": async el => {
    el.textContent = t("sub_checking");
    await checkSubscription(false);
  },
};

/* Opens the edit sheet for a task found in whatever is currently loaded. */
function openTaskSheet(id){
  const pools = [state.tasks?.overdue, state.tasks?.upcoming, state.tasks?.undated,
                 state.tasks?.later, state.project?.tasks, state.home?.top3,
                 ...(state.home?.tasks_today || []).map(g => g.tasks)];
  const task = pools.flat().filter(Boolean).find(x => String(x.id) === String(id));
  if(!task) return;
  state.form = {
    id: task.id, title: task.title, description: task.description || "",
    deadline: task.deadline, due_time: task.due_time,
    remind_before: task.remind_before, recurrence: task.recurrence || "",
    priority: task.priority, project_id: task.project_id,
    when: task.deadline ? "pick" : "none", open:false,
  };
  openSheet(taskSheet(task));
}

async function settingSave(patch){
  try{
    await api("/api/settings", {method:"POST", body:patch});
    const me = await api("/api/me");
    state.lang = me.language;
    setState({me});
    reopenSettings();
    toast(t("saved"));
    await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

async function prefSave(patch, redraw = true){
  try{
    const r = await api("/api/prefs", {method:"POST", body:patch});
    state.me = {...state.me, prefs:r.prefs};
    /* A switch has to be redrawn, because the switch itself is the only thing
       showing its new state. A time field and the timezone select are already
       showing exactly what the user picked — and rebuilding the sheet under an
       open picker closes it, which on iOS meant a value could be set once and
       never adjusted. */
    if(redraw){ render(); reopenSettings(); }
    toast(t("saved"));
    // A timezone change moves what "today" means, so the screen is refetched.
    if(patch.timezone) await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

/* The grid now lives in a sheet, and `setState` only repaints `#app` — so the
   new month is written back into the sheet directly. */
async function shiftMonth(delta){
  const c = state.calendar;
  if(!c) return;
  let year = c.year, month = c.month + delta;
  if(month < 1){ month = 12; year--; }
  if(month > 12){ month = 1; year++; }
  try{ state.calendar = await api(`/api/calendar?year=${year}&month=${month}`); }
  catch(e){ return handleError(e); }
  if(sheetOpen()) openSheet(calendarSheet()); else render();
}

/* ---------- habit reordering ----------
   The list is written back whole, so the server stores an order the user
   can see rather than a diff it has to reconstruct. The local list moves
   first so the row does not visibly snap back while the request is in
   flight; a failed save reloads the truth. */
async function saveOrder(ids){
  const previous = state.habits;
  try{
    const body = await api("/api/habits/reorder",
      {method:"PATCH", body:{habit_ids:ids}});
    const grouped = {};
    (state.habits?.categories || []).forEach(c => grouped[c] = []);
    body.habits.forEach(x => (grouped[x.category] = grouped[x.category] || []).push(x));
    setState({habits:{...state.habits, habits: body.habits, grouped}});
  }catch(e){
    setState({habits: previous});
    handleError(e);
  }
}

function moveHabit(index, delta){
  const items = state.habits?.habits || [];
  const target = index + delta;
  if(index < 0 || target < 0 || target >= items.length) return;
  haptic();
  const ids = items.map(x => x.id);
  [ids[index], ids[target]] = [ids[target], ids[index]];
  saveOrder(ids);
}

/* Touch drag. Telegram's in-app browser does not fire HTML5 drag events
   on iOS, so the reorder is driven by pointer events, which work on both. */
let dragFrom = null;
const reorderRowAt = y =>
  document.elementFromPoint(window.innerWidth / 2, y)?.closest("[data-drag-id]");

document.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".handle");
  if(!handle) return;
  const row = handle.closest("[data-drag-id]");
  if(!row) return;
  dragFrom = Number(row.dataset.index);
  row.style.opacity = ".55";
  row.setPointerCapture?.(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if(dragFrom === null) return;
  e.preventDefault();
  document.querySelectorAll("[data-drag-id]")
    .forEach(x => x.style.borderColor = "");
  const over = reorderRowAt(e.clientY);
  if(over) over.style.borderColor = "var(--accent)";
}, {passive:false});
document.addEventListener("pointerup", e => {
  if(dragFrom === null) return;
  const over = reorderRowAt(e.clientY);
  const from = dragFrom;
  dragFrom = null;
  if(!over) return render();
  const to = Number(over.dataset.index);
  if(to === from) return render();
  const ids = (state.habits?.habits || []).map(x => x.id);
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  haptic("medium");
  saveOrder(ids);
});

/* A form control carries its action on `change`, never on `click`.

   This is the bug that made the report times and the timezone impossible to
   edit. Clicking an `<input type="time">` or a `<select>` is how its picker
   *opens*; the delegated click handler below matched the control, called
   `preventDefault()` — which stopped the picker from ever appearing — and
   then ran the save with the value that was already in the field. The screen
   answered "Saqlandi" every time and nothing ever changed, which is the worst
   shape a bug can take: it looks like it worked.

   The tag is the rule rather than a list of act names, so a control added
   later cannot bring the behaviour back by accident. */
const CHANGE_TAGS = new Set(["INPUT", "SELECT", "TEXTAREA"]);

/* One delegated listener: rebuilt HTML never loses its handlers because
   the handler lives on document, not on the nodes. */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  if(CHANGE_TAGS.has(el.tagName)) return;
  const action = A[el.dataset.act];
  if(action){ e.preventDefault(); action(el); }
});
// Search runs on Enter rather than per keystroke: one request per intent.
document.addEventListener("keydown", e => {
  const el = e.target.closest("[data-search]");
  if(el && e.key === "Enter"){ e.preventDefault(); A[el.dataset.search]?.(el); }
});
/* …and the other half of the same rule: every form control with an action
   runs it here, when the value has actually changed. */
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if(el && CHANGE_TAGS.has(el.tagName)) A[el.dataset.act]?.(el);
});
window.matchMedia("(prefers-color-scheme: light)")
  .addEventListener?.("change", () => render());
tg?.onEvent?.("themeChanged", () => render());
window.addEventListener("resize", syncShell);
tg?.onEvent?.("viewportChanged", syncShell);

/* ---------- boot ---------- */
async function boot(){
  try{ state.appearance = localStorage.getItem("ernestos-appearance") || "auto"; }
  catch(_){}
  try{
    const me = await api("/api/me");
    state.lang = me.language || "uz";
    if(!me.is_subscribed && me.onboarded){
      // Blocked, not broken. The screen offers join and check.
      setState({me, loading:false});
      await checkSubscription(true);
      return;
    }
    setState({me, loading:false, blocked:null, error:null});
    await loadScreen("home");
    if(Object.keys(loadDraft()).length) toast(t("draft_restored"));
  }catch(e){
    console.error("ErnestOS boot failed:", e);
    if(e.status === 403){ setState({loading:false}); await checkSubscription(true); return; }
    setState({loading:false,
      error: e.status ? t("error") : t("offline")});
  }
}
boot();
