<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>ErnestOS</title>

<style>
/* ==================================================================
   Design tokens.

   Each theme redefines the whole palette — surfaces, accent, glow and
   the three habit-tier colours — so switching theme restyles the app
   rather than just recolouring buttons.
   ================================================================== */
:root{
  --bg:#080d17; --bg-glow:#12203a; --surface:#0f1727; --surface-2:#141e33;
  --line:#1e2b45; --line-soft:#18233a;
  --text:#eaf0fa; --muted:#7e8fab; --faint:#4d5c76;
  --accent:#4f8cff; --accent-2:#7cb0ff; --accent-dim:#1a2f57; --on-accent:#04101f;
  --ok:#2fd27a; --warn:#f5a524; --danger:#f4515f;
  --t1:#f4515f; --t2:#f5a524; --t3:#2fd27a;

  --r-sm:10px; --r:14px; --r-lg:20px;
  --pad:16px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --ring:0 0 0 1px rgba(255,255,255,.04) inset;
}
[data-theme="emerald"]{
  --bg:#04120e; --bg-glow:#0a2b21; --surface:#08201a; --surface-2:#0c2b22;
  --line:#124635; --line-soft:#0f3a2c;
  --accent:#12d18a; --accent-2:#5ce7b4; --accent-dim:#0a3a2c; --on-accent:#03170f;
  --t1:#fb7185; --t2:#fbbf24; --t3:#12d18a;
}
[data-theme="obsidian"]{
  --bg:#000; --bg-glow:#151519; --surface:#0d0d10; --surface-2:#141418;
  --line:#26262e; --line-soft:#1d1d24;
  --text:#f4f4f5; --muted:#8b8b95; --faint:#55555f;
  --accent:#e4e4e7; --accent-2:#fafafa; --accent-dim:#232329; --on-accent:#09090b;
  --t1:#f87171; --t2:#fbbf24; --t3:#4ade80;
}
[data-theme="rose"]{
  --bg:#14060c; --bg-glow:#2e0d1c; --surface:#1e0912; --surface-2:#290d19;
  --line:#45182b; --line-soft:#391423;
  --accent:#ff4d6d; --accent-2:#ff8098; --accent-dim:#450f21; --on-accent:#1a0308;
  --t1:#ff8098; --t2:#fbbf24; --t3:#2fd27a;
}
[data-theme="pink"]{
  --bg:#14061a; --bg-glow:#2d0d38; --surface:#1d0824; --surface-2:#280c31;
  --line:#44184f; --line-soft:#391442;
  --accent:#f65bb5; --accent-2:#fb92cf; --accent-dim:#420f3b; --on-accent:#1b0413;
  --t1:#fb7185; --t2:#fbbf24; --t3:#2fd27a;
}
[data-theme="aurora"]{
  --bg:#07061a; --bg-glow:#1a1147; --surface:#100d2e; --surface-2:#17123c;
  --line:#2a2166; --line-soft:#221a54;
  --accent:#8b7bff; --accent-2:#c4a8ff; --accent-dim:#241a58; --on-accent:#0a0620;
  --t1:#f472b6; --t2:#facc15; --t3:#22d3ee;
}

/* Light appearance overlays every theme */
:root[data-appearance="light"],
:root[data-appearance="auto"]:not([data-dark="1"]){
  --bg:#f4f7fc; --bg-glow:#e3ecfa; --surface:#fff; --surface-2:#f6f9fd;
  --line:#e2e9f4; --line-soft:#edf2f9;
  --text:#0d1626; --muted:#5f6f88; --faint:#9aa8bd;
  --accent-dim:#e6efff; --on-accent:#fff;
  --shadow:0 8px 24px rgba(16,26,43,.07);
  --ring:0 0 0 1px rgba(0,0,0,.02) inset;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% 0%, var(--bg-glow) 0%, transparent 62%);
  background-attachment:fixed;
  color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* Telegram reports its own usable height; --vh is kept in sync from JS
     because 100vh is wrong inside the in-app browser. */
  min-height:var(--vh, 100dvh);
  padding-bottom:calc(74px + var(--safe-b, 0px));
}
#app{padding:calc(14px + var(--safe-t, 0px)) var(--pad) 12px;
     max-width:620px;margin:0 auto;width:100%}

h1{font-size:20px;font-weight:760;letter-spacing:-.4px;line-height:1.3;
   overflow-wrap:anywhere}
h2{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:1.2px;
   color:var(--faint);margin:26px 0 10px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}

.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* header */
.hero{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.avatar{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;
        font-weight:750;font-size:18px;color:var(--on-accent);overflow:hidden;
        background:linear-gradient(140deg,var(--accent),var(--accent-2));
        box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.gear{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;
      background:var(--surface);border:1px solid var(--line);font-size:16px;
      box-shadow:var(--ring);min-width:40px}
/* Compact variant still keeps a 40px tap area via the padded ::after. */
.gear.mini{width:32px;height:32px;min-width:32px;border-radius:10px;font-size:13px;
           position:relative}
.gear.mini::after{content:"";position:absolute;inset:-5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:15px;margin-bottom:10px;box-shadow:var(--ring)}
.card.glow{background:linear-gradient(150deg,var(--accent-dim),var(--surface) 70%);
           border-color:var(--accent-dim)}

.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
      min-height:56px;box-shadow:var(--ring)}
.item .meta{font-size:12px;color:var(--muted);margin-top:3px;
            display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item.t1{border-left:3px solid var(--t1)}
.item.t2{border-left:3px solid var(--t2)}
.item.t3{border-left:3px solid var(--t3)}
.item.pick{border-style:dashed;border-color:var(--danger)}

.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;
       display:grid;place-items:center;font-size:14px;position:relative;
       transition:transform .12s,background .15s}
/* Invisible 44px hit area around the 26px control — comfortable to tap
   without making the tick itself look heavy. */
.check::after{content:"";position:absolute;inset:-9px}
.check.on{background:var(--ok);border-color:var(--ok);color:#04140a}
.check:active{transform:scale(.9)}
.check.lock{opacity:.42}

.btn{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--on-accent);
     border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:680;
     cursor:pointer;min-height:48px;width:100%;box-shadow:var(--shadow)}
.btn:active{filter:brightness(.94)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:var(--ring)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.btn.sm{width:auto;padding:10px 14px;font-size:13px;min-height:42px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:140px}

input,textarea,select{width:100%;background:var(--surface-2);border:1px solid var(--line);
  color:var(--text);border-radius:12px;padding:13px;font:inherit;min-height:48px;
  -webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
       linear-gradient(135deg,var(--muted) 50%,transparent 50%);
       background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;
       background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:11px;color:var(--faint);margin:15px 0 6px;
      text-transform:uppercase;letter-spacing:.8px;font-weight:700}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);
      border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;
      font-weight:600;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pills.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
              margin:0 calc(var(--pad) * -1);padding:0 var(--pad) 2px}
.pills.scroll::-webkit-scrollbar{display:none}

.swatch{width:28px;height:28px;border-radius:9px;flex:none;box-shadow:var(--ring)}
.theme-row{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;
           background:var(--surface-2);border:1px solid var(--line);margin-bottom:7px}
.theme-row.on{border-color:var(--accent);background:var(--accent-dim)}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.p-high{background:var(--danger)} .p-medium{background:var(--warn)} .p-low{background:var(--ok)}

.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:9px}
.bar span{display:block;height:100%;border-radius:3px;
          background:linear-gradient(90deg,var(--accent),var(--accent-2))}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .card{text-align:center;padding:14px 6px;margin:0}
.stat .v{font-size:20px;font-weight:760;letter-spacing:-.5px}
.stat .k{font-size:10px;color:var(--faint);margin-top:3px;text-transform:uppercase;
         letter-spacing:.6px;font-weight:700}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
         background:var(--surface-2);border:1px solid var(--line);font-size:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;
          width:100%}
.cal-dow{text-align:center;font-size:9px;color:var(--faint);padding:2px 0;font-weight:750;
         min-width:0;overflow:hidden;
         text-transform:uppercase;letter-spacing:.4px}
.cal-day{aspect-ratio:1;min-width:0;border-radius:9px;background:var(--surface-2);
         border:1px solid transparent;display:flex;flex-direction:column;
         align-items:center;justify-content:center;font-size:12px;gap:3px}
.cal-day.empty{background:transparent}
.cal-day.today{border-color:var(--accent);color:var(--accent);font-weight:760}
.cal-dots{display:flex;gap:2px;height:4px}
.cal-dots i{width:4px;height:4px;border-radius:50%}
.k-task{background:var(--accent)} .k-project{background:var(--warn)}
.k-goal{background:var(--t3)} .k-birthday{background:var(--t1)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:grid;grid-template-columns:repeat(4,1fr);
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-top:1px solid var(--line);padding-bottom:var(--safe-b, 0px)}
nav button{background:0;border:0;color:var(--faint);padding:9px 4px 10px;font-size:10px;
           font-weight:700;cursor:pointer;display:grid;gap:3px;justify-items:center;
           min-height:56px;letter-spacing:.2px}
nav button.on{color:var(--accent)}
nav .ic{font-size:19px;line-height:1}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
       align-items:flex-end;z-index:50;backdrop-filter:blur(3px)}
.sheet.show{display:flex}
.sheet-inner{background:var(--surface);width:100%;max-width:620px;margin:0 auto;
             border-radius:22px 22px 0 0;border-top:1px solid var(--line);
             padding:8px var(--pad) calc(20px + var(--safe-b, 0px));
             max-height:88vh;max-height:calc(var(--vh, 100dvh) - 40px);overflow-y:auto;
             -webkit-overflow-scrolling:touch}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--line);
         margin:0 auto 14px}
.sheet h3{font-size:17px;margin-bottom:4px;font-weight:730}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe-b,0px));
       background:var(--surface-2);border:1px solid var(--line);color:var(--text);
       padding:11px 18px;border-radius:12px;z-index:60;opacity:0;transition:opacity .2s;
       pointer-events:none;font-size:14px;box-shadow:var(--shadow);max-width:86vw;
       text-align:center}
.toast.show{opacity:1}

.empty{text-align:center;color:var(--faint);padding:28px 12px;font-size:14px}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);
      border-radius:50%;animation:r .7s linear infinite;margin:44px auto}
@keyframes r{to{transform:rotate(360deg)}}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);
        margin-top:8px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;
          vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app"><div class="spin"></div></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

"use strict";
/* ==================================================================
   ErnestOS Mini App.

   Screens are pure functions of `state` returning HTML; the page is
   re-rendered from that state. Nothing patches a node by id, so
   removing a feature cannot leave a dangling lookup that blanks the
   page — a failure this app shipped with once before.
   ================================================================== */

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
tg?.disableVerticalSwipes?.();

/* Telegram's in-app browser reports a usable height that 100vh gets wrong,
   and the value changes as the keyboard opens. Mirror it into --vh. */
function syncViewport(){
  const root = document.documentElement;
  const h = tg?.viewportStableHeight || tg?.viewportHeight || window.innerHeight;
  root.style.setProperty("--vh", h + "px");
  const inset = tg?.safeAreaInset || tg?.contentSafeAreaInset;
  root.style.setProperty("--safe-t", (inset?.top ?? 0) + "px");
  root.style.setProperty("--safe-b",
    `max(${inset?.bottom ?? 0}px, env(safe-area-inset-bottom, 0px))`);
}
syncViewport();
tg?.onEvent?.("viewportChanged", syncViewport);
tg?.onEvent?.("safeAreaChanged", syncViewport);
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", () => setTimeout(syncViewport, 250));

/* ---------- api ---------- */
async function api(path, options = {}){
  const res = await fetch(path, {
    ...options,
    headers:{"Content-Type":"application/json",
             "X-Telegram-Init-Data": tg?.initData || "", ...(options.headers||{})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if(!res.ok){
    const err = new Error("http_" + res.status);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

/* ---------- line chart (inline SVG, no libraries) ---------- */
function lineChart(series, keys){
  if(!series.length) return `<div class="empty">${t("empty")}</div>`;
  const W = 320, H = 150, L = 18, R = 8, TOP = 12, BOT = 24;
  const stepX = series.length > 1 ? (W - L - R) / (series.length - 1) : 0;
  const y = v => H - BOT - (v / 100) * (H - TOP - BOT);
  const x = i => L + i * stepX;

  const grid = [0, 50, 100].map(v =>
    `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"
       stroke-width="1" stroke-dasharray="2 5"/>
     <text x="0" y="${y(v)+3}" font-size="8" fill="var(--faint)">${v}</text>`).join("");

  const paths = keys.map((k, n) => {
    const pts = series.map((p, i) => `${x(i)},${y(p[k.field])}`).join(" ");
    const area = `${L},${y(0)} ${pts} ${x(series.length-1)},${y(0)}`;
    const dots = series.length <= 12
      ? series.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[k.field])}" r="2.6"
          fill="${k.color}"/>`).join("") : "";
    return `
      <polygon points="${area}" fill="${k.color}" opacity="${n === 0 ? .10 : .06}"/>
      <polyline points="${pts}" fill="none" stroke="${k.color}" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");

  // Anchor the first and last labels inward so they are not clipped by the
  // SVG edge; everything between stays centred on its point.
  const every = Math.ceil(series.length / 6);
  const last = series.length - 1;
  const labels = series.map((p, i) => {
    if(i % every !== 0 && i !== last) return "";
    const anchor = i === 0 ? "start" : i === last ? "end" : "middle";
    return `<text x="${x(i)}" y="${H-6}" font-size="8.5" fill="var(--faint)"
              text-anchor="${anchor}">${p.label}</text>`;
  }).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${paths}${labels}</svg>
    <div class="legend">${keys.map(k =>
      `<span><i style="background:${k.color}"></i>${k.label}</span>`).join("")}</div>`;
}

function taskItem(task){
  return `<div class="item">
      <div class="check" data-act="task-done" data-id="${task.id}"></div>
      <div class="grow" data-act="task-open" data-id="${task.id}">

          ${task.deadline ? `<span class="num">· ${task.deadline}</span>` : ""}</div>
      </div></div>`;
}

function calendarBlock(){
  const c = state.calendar;
  if(!c) return `<div class="card"><div class="spin"></div></div>`;
  const dows = DICT[state.lang].dow.map(d => `<div class="cal-dow">${d}</div>`).join("");
  let cells = "";
  for(let i = 0; i < c.first_weekday; i++) cells += `<div class="cal-day empty"></div>`;
  for(let day = 1; day <= c.days_in_month; day++){
    const iso = `${c.year}-${String(c.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const events = c.events[iso] || [];
    const kinds = [...new Set(events.map(e => e.kind))].slice(0, 4);
    cells += `<div class="cal-day num ${iso===c.today?"today":""}"
      ${events.length?`data-act="cal-day" data-date="${iso}"`:""}>
      <span>${day}</span>
      <span class="cal-dots">${kinds.map(k=>`<i class="k-${k}"></i>`).join("")}</span></div>`;
  }
  return `<div class="card">
    <div class="cal-head">
      <div class="cal-nav" data-act="cal-prev">‹</div>
      <b>${DICT[state.lang].months[c.month-1]} ${c.year}</b>
      <div class="cal-nav" data-act="cal-next">›</div>
    </div>
    <div class="cal-grid">${dows}${cells}</div></div>`;
}

function habitsTab(){
  const data = state.habits;
  if(!data) return `<div class="spin"></div>`;
  const tiers = {non_negotiable:"t1", target:"t2", bonus:"t3"};
  let h = "";

  if(state.deleteMode)
    h += `<div class="card glow">${t("pick_delete")}</div>`;
  else if(data.streak)
    h += `<div class="card" style="text-align:center">🔥 <b class="num">${data.streak}</b>
            <span class="muted small">${t("streak")}</span></div>`;

  data.categories.forEach(cat => {
    const items = data.grouped[cat] || [];
    if(!items.length) return;
    h += `<h2>${t(cat)}</h2>`;
    h += items.map(x => {
      const clock = x.target_time
        ? `<span class="meta num" style="margin:0">⏰ ${x.target_time}</span>` : "";
      if(state.deleteMode){
        // Derived habits have no delete affordance at all.
        return x.protected ? "" : `
          <div class="item ${tiers[cat]} pick" data-act="habit-delete" data-id="${x.id}">
            <div class="grow ellipsis">${esc(x.name)}</div><div>🗑</div></div>`;
      }
      return `
        <div class="item ${tiers[cat]}">
          <div class="check ${x.done?"on":""} ${x.protected?"lock":""}"
               ${x.protected?'data-act="auto-habit"':`data-act="habit-toggle" data-id="${x.id}"`}
          >${x.done?"✓":""}</div>
          <div class="grow">
            <div class="ellipsis">${esc(x.name)}${x.protected?" 🔒":""}</div>
            ${clock ? `<div class="meta">${clock} · ${t("wake_hint")}</div>` : ""}
          </div>
          ${x.system_key === "wakeup"
            ? `<div class="gear mini" data-act="wake-time" data-time="${x.target_time||"05:00"}"
                 class="mini">⏰</div>` : ""}
        </div>`;
    }).join("");
  });

  h += state.deleteMode
    ? `<button class="btn" data-act="delete-mode-off" style="margin-top:14px">${t("finish")}</button>`
    : `<div class="btns">
         <button class="btn" data-act="habit-add">+ ${t("add_habit")}</button>
         <button class="btn ghost" data-act="delete-mode-on">🗑 ${t("del_habit")}</button>
       </div>`;
  return h;
}

  const icons = {ultimate:"👑", milestone:"🏆", tactical:"⚡"};
  let any = false;
  ["ultimate","milestone","tactical"].forEach(cat => {
    const items = (g[cat] || []).filter(x => x.status !== "completed");
    if(!items.length) return;
    any = true;
    h += `<h2>${icons[cat]} ${t(cat)}</h2>` + items.map(goal => `
      <div class="item">
        <div class="check" data-act="goal-complete" data-id="${goal.id}"></div>
        <div class="grow"><div class="ellipsis">${esc(goal.title)}</div>
          ${goal.progress ? `<div class="meta num">${goal.progress}%</div>` : ""}</div>
        <div class="gear mini" data-act="goal-delete" data-id="${goal.id}"
             class="mini">🗑</div>
      </div>`).join("");
  });
  if(!any) h += `<div class="empty">${t("empty")}</div>`;
  h += `<button class="btn ghost" data-act="goal-add" style="margin-top:12px">+ ${t("add_goal")}</button>`;
  return h;
};

/* ---------- settings sheet ---------- */

  const langs = [["uz","🇺🇿 O'zbek"],["en","🇬🇧 English"],["ru","🇷🇺 Русский"]];
  const modes = [["auto",t("auto")],["light",t("light")],["dark",t("dark")]];
  return `
    <h3>⚙️ ${t("settings")}</h3>
    <div class="muted small">${t("member")} #${me.member_no ?? "—"}</div>
    <label>${t("language")}</label>
    <div class="pills">${langs.map(([c,l]) =>
      `<div class="pill ${me.language===c?"on":""}" data-act="set-lang" data-value="${c}">${l}</div>`).join("")}</div>
    <label>${t("gender")}</label>
    <div class="pills">
      <div class="pill ${me.gender==="male"?"on":""}" data-act="set-gender" data-value="male">👨 ${t("male")}</div>
      <div class="pill ${me.gender==="female"?"on":""}" data-act="set-gender" data-value="female">👩 ${t("female")}</div>
    </div>

/* ---------- render ---------- */
const NAV = [
  {id:"home",   icon:"🏠", key:"home"},
  {id:"habits", icon:"✅", key:"habits"},
  {id:"tasks",  icon:"⚡", key:"tasks"},
  {id:"vision", icon:"🎯", key:"vision"},
];

function render(){
  const root = document.documentElement;
  root.dataset.theme = state.me?.theme || "ocean";
  root.dataset.appearance = state.appearance;
  root.dataset.dark = (state.appearance === "dark" ||
    (state.appearance === "auto" &&
     !window.matchMedia("(prefers-color-scheme: light)").matches)) ? "1" : "0";

  const app = document.getElementById("app");
  if(state.error)        app.innerHTML = `<div class="empty">${esc(state.error)}</div>`;
  else if(state.loading) app.innerHTML = `<div class="spin"></div>`;
  else                   app.innerHTML = (SCREENS[state.screen] || SCREENS.home)();

  document.getElementById("nav").innerHTML = NAV.map(n => `
    <button data-act="nav" data-screen="${n.id}" class="${state.screen===n.id?"on":""}">
      <span class="ic">${n.icon}</span><span>${t(n.key)}</span></button>`).join("");
}

/* ---------- loading ---------- */
async function loadScreen(screen){
  try{
    if(screen === "home"){
      const [home, calendar] = await Promise.all([api("/api/home"), api("/api/calendar")]);
      setState({home, calendar});
    } else if(screen === "habits"){
      const [habits, prayer, journal] = await Promise.all([
        api("/api/habits"), api("/api/prayers"), api("/api/journal?day=" + todayISO()),
      ]);
      setState({habits, prayer, journal: journal.entry, journalQuestions: journal.questions});
      if(state.tab === "stats") await loadStats(state.statsPeriod);
    } else if(screen === "tasks"){
      const [tasks, projects] = await Promise.all([api("/api/tasks?days=7"), api("/api/projects")]);
      setState({tasks, projects: projects.projects});
      if(state.taskTab === "done") setState({tasksDone:(await api("/api/tasks/done")).tasks});
    } else if(screen === "vision"){
      setState({goals: await api("/api/goals")});
      if(state.visionTab === "done") setState({goalsDone:(await api("/api/goals/done")).goals});
    }
  }catch(e){ handleError(e); }
}
async function loadStats(period){
  try{ setState({stats: await api("/api/stats?period=" + period), statsPeriod: period}); }
  catch(e){ handleError(e); }
}
const todayISO = () => state.home?.date || new Date().toISOString().slice(0,10);

function handleError(e){
  console.error("ErnestOS:", e);
  if(e.status === 403){ setState({error:t("sub_required"), loading:false}); return; }
  toast(e.status ? t("error") : t("offline"));
}

function confirmSheet(action, id){
  openSheet(`<h3>${t("delete")}?</h3>
    <button class="btn danger" data-act="${action}" data-id="${id}" style="margin-top:14px">${t("delete")}</button>
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`);
}

async function shiftMonth(delta){
  const c = state.calendar;
  let year = c.year, month = c.month + delta;
  if(month < 1){ month = 12; year--; }
  if(month > 12){ month = 1; year++; }
  try{ setState({calendar: await api(`/api/calendar?year=${year}&month=${month}`)}); }
  catch(e){ handleError(e); }
}

async function save(request, reload, quiet, message){
  try{
    await request();
    closeSheet();
    if(!quiet) toast(message || t("saved"));
    if(reload) await loadScreen(reload);
  }catch(e){ closeSheet(); handleError(e); }
}

async function settingSave(patch){
  try{
    await api("/api/settings", {method:"POST", body:patch});
    const me = await api("/api/me");
    state.lang = me.language;
    setState({me});
    openSheet(settingsSheet());
    toast(t("saved"));
    await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

/* One delegated listener: rebuilt HTML never loses its handlers because the
   handler lives on document, not on the nodes. */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const action = A[el.dataset.act];
  if(action){ e.preventDefault(); action(el); }
});
window.matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", render);

/* ---------- boot ---------- */
(async function boot(){
  try{ state.appearance = localStorage.getItem("ernestos-appearance") || "auto"; }catch(_){}
  try{
    const me = await api("/api/me");
    state.lang = me.language || "uz";
    setState({me, loading:false});
    await loadScreen("home");
  }catch(e){
    console.error("ErnestOS boot failed:", e);
    setState({loading:false,
      error: e.status === 403 ? t("sub_required") : e.status ? t("error") : t("offline")});
  }
})();
