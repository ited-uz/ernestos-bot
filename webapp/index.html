<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>ErnestOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Design preview only. With ?preview in the URL, preview.js (a sibling file
   the server never serves) answers /api/* with clearly-labelled sample data,
   so the interface can be reviewed without Telegram or a backend. Production
   opens the app without the parameter and never reaches this branch. */
if(/[?&]preview(=|&|$)/.test(location.search))
  document.write('<script src="preview.js?v=12.1"><\/script>');
</script>
<style>
/* ==================================================================
   ErnestOS design system — Soft Minimalism (v9).

   Calm by default: a soft grey ground, white surfaces, dark readable ink
   and one restrained accent. Colour is spent on meaning — the primary
   action, the active place, and state — never on decoration.

   One set of semantic tokens; five accent themes redefine them. No
   component below the theme blocks names a colour:

     --bg / --surface / --surface-2   ground and panels
     --text / --text-2 / --text-3     primary, secondary, tertiary (all AA)
     --primary                        accent as text/icon (AA on surfaces)
     --primary-fill / --on-primary    accent as a filled control + its label
     --accent / --accent-2            analytics, charts
     --border / --border-2            hairlines and stronger dividers
     --ok / --warn / --danger         state — always paired with a word or
                                      a glyph, never colour alone

   The five themes share one structure (radius, spacing, type, motion);
   they differ in accent and in the faint temperature of the ground, so
   switching theme changes the mood without changing how the app works.

   Spacing is an 8px scale (--s1..--s6) with 4px available as --s0.
   ================================================================== */
/* ------------------------------------------------------------------
   Structure. Shared by every theme and every mode.
   ------------------------------------------------------------------ */
:root{
  --radius-sm:12px;
  --radius:16px;
  --radius-lg:20px;
  --radius-pill:999px;
  --border-w:1px;
  --shadow-1:0 1px 2px rgba(var(--shadow-rgb), calc(.05 * var(--shadow-k)));
  --shadow-2:0 1px 2px rgba(var(--shadow-rgb), calc(.04 * var(--shadow-k))),
             0 6px 20px rgba(var(--shadow-rgb), calc(.06 * var(--shadow-k)));
  --shadow-3:0 16px 40px rgba(var(--shadow-rgb), calc(.14 * var(--shadow-k)));
  --primary-fill:var(--primary);
  --hero-fill:var(--surface);
  --hero-text:var(--text);
  --hero-border:var(--border);
  --ring:0 0 0 3px color-mix(in srgb, var(--primary) 28%, transparent);
  --line:var(--border);
  --title-w:650;
  --display-w:680;
  --motion:180ms;
  /* No frosted glass anywhere: surfaces are opaque, so text contrast is
     what the tokens say it is, on every phone. */
  --card-bg:var(--surface);
  --card-2-bg:var(--surface-2);
  --blur:none;
  --backdrop:none;

  /* ---- 8px spacing scale ---- */
  --s0:4px; --s1:8px; --s2:12px; --s3:16px; --s4:24px; --s5:32px; --s6:48px;
  --pad:var(--s3);
}

/* ------------------------------------------------------------------
   Themes: five accents, each in a light and a dark mode.

   The five brand colours --c1..--c5 are Apple system colours (charts,
   calendar dots, icon tiles). The accent used for text and filled
   controls is a calmer, contrast-checked shade of --c1, set separately
   as --primary / --primary-fill, so a vivid swatch never ends up as
   unreadable body text.
   ------------------------------------------------------------------ */

/* ---- CALM BLUE — the default. ---- */

:root[data-theme="ocean"][data-mode="light"]{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#EEF0F3;
  --text:#15171C; --text-2:#4F5561; --text-3:#666C78;
  --border:#E2E5EA; --border-2:#CBD0D8;
  --c1:#007AFF; --c2:#30B0C7; --c3:#5856D6; --c4:#FF9500; --c5:#34C759;
  --primary:#2B66D6; --primary-2:#1F52B5; --primary-fill:#2B66D6;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:20,28,45; --shadow-k:1;
}

:root[data-theme="ocean"][data-mode="dark"]{
  --bg:#111215; --surface:#1A1C20; --surface-2:#24272C;
  --text:#F1F2F4; --text-2:#B3B8C1; --text-3:#8E949E;
  --border:#2A2D33; --border-2:#3A3E46;
  --c1:#0A84FF; --c2:#40C8E0; --c3:#5E5CE6; --c4:#FF9F0A; --c5:#30D158;
  --primary:#79A6FF; --primary-2:#9BBDFF; --primary-fill:#3569D6;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:3;
}

/* ---- INDIGO ---- */

:root[data-theme="midnight"][data-mode="light"]{
  --bg:#F3F3F7; --surface:#FFFFFF; --surface-2:#EEEEF4;
  --text:#16161D; --text-2:#52525F; --text-3:#686876;
  --border:#E3E3EB; --border-2:#CCCCD8;
  --c1:#5856D6; --c2:#32ADE6; --c3:#AF52DE; --c4:#FF9500; --c5:#34C759;
  --primary:#5250C8; --primary-2:#413FB0; --primary-fill:#5250C8;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:24,22,60; --shadow-k:1;
}

:root[data-theme="midnight"][data-mode="dark"]{
  --bg:#121218; --surface:#1B1B23; --surface-2:#25252F;
  --text:#F1F1F5; --text-2:#B5B5C3; --text-3:#9090A0;
  --border:#2C2C38; --border-2:#3C3C4A;
  --c1:#5E5CE6; --c2:#64D2FF; --c3:#BF5AF2; --c4:#FF9F0A; --c5:#30D158;
  --primary:#A4A3FF; --primary-2:#BDBCFF; --primary-fill:#5552D0;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:3;
}

/* ---- LILAC ---- */

:root[data-theme="aurora"][data-mode="light"]{
  --bg:#F5F3F7; --surface:#FFFFFF; --surface-2:#F0EDF3;
  --text:#18151C; --text-2:#554F5D; --text-3:#6B6474;
  --border:#E6E1EB; --border-2:#D0C9D8;
  --c1:#AF52DE; --c2:#5856D6; --c3:#32ADE6; --c4:#FF2D55; --c5:#00C7BE;
  --primary:#8A3FBF; --primary-2:#7432A3; --primary-fill:#8A3FBF;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:40,20,60; --shadow-k:1;
}

:root[data-theme="aurora"][data-mode="dark"]{
  --bg:#151218; --surface:#1E1A22; --surface-2:#28232D;
  --text:#F3F1F5; --text-2:#BBB3C3; --text-3:#968D9F;
  --border:#302A36; --border-2:#413946;
  --c1:#BF5AF2; --c2:#5E5CE6; --c3:#64D2FF; --c4:#FF375F; --c5:#66D4CF;
  --primary:#D2A3F5; --primary-2:#E0BDF8; --primary-fill:#8A3FBF;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:3;
}

/* ---- INK — monochrome; the accent is the ink itself. ---- */

:root[data-theme="bento"][data-mode="light"]{
  --bg:#F4F4F2; --surface:#FFFFFF; --surface-2:#EFEFEC;
  --text:#141413; --text-2:#52524D; --text-3:#696963;
  --border:#E3E3DF; --border-2:#CDCDC7;
  --c1:#1C1C1A; --c2:#007AFF; --c3:#00C7BE; --c4:#FF9500; --c5:#AF52DE;
  --primary:#2A2A27; --primary-2:#111110; --primary-fill:#2A2A27;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:20,20,18; --shadow-k:1;
}

:root[data-theme="bento"][data-mode="dark"]{
  --bg:#121211; --surface:#1B1B19; --surface-2:#252522;
  --text:#F2F2ED; --text-2:#B6B6AE; --text-3:#909088;
  --border:#2D2D2A; --border-2:#3D3D39;
  --c1:#F2F2ED; --c2:#0A84FF; --c3:#66D4CF; --c4:#FF9F0A; --c5:#BF5AF2;
  --primary:#ECECE6; --primary-2:#FFFFFF; --primary-fill:#ECECE6;
  --on-primary:#141413;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:3;
}

/* ---- TEAL ---- */

:root[data-theme="spatial"][data-mode="light"]{
  --bg:#F1F5F5; --surface:#FFFFFF; --surface-2:#EBF0F1;
  --text:#121819; --text-2:#4B5759; --text-3:#616E70;
  --border:#DEE5E6; --border-2:#C6D0D2;
  --c1:#30B0C7; --c2:#007AFF; --c3:#5856D6; --c4:#FF9500; --c5:#34C759;
  --primary:#0E7385; --primary-2:#0A5E6D; --primary-fill:#0E7385;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:14,36,40; --shadow-k:1;
}

:root[data-theme="spatial"][data-mode="dark"]{
  --bg:#101516; --surface:#182021; --surface-2:#212A2C;
  --text:#EEF3F3; --text-2:#AFBDBF; --text-3:#8A9A9C;
  --border:#283234; --border-2:#384447;
  --c1:#32ADE6; --c2:#0A84FF; --c3:#5E5CE6; --c4:#FF9F0A; --c5:#30D158;
  --primary:#6FD0DE; --primary-2:#95DDE7; --primary-fill:#117A8C;
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:3;
}

/* ------------------------------------------------------------------
   Per-theme structure. Deliberately close to one another: the accent
   carries the identity, the geometry stays familiar.
   ------------------------------------------------------------------ */
[data-theme="ocean"]{
  --radius-sm:12px; --radius:16px; --radius-lg:20px;
  --title-w:650; --display-w:680; --motion:180ms;
  --hero-fill:color-mix(in srgb, var(--primary) 7%, var(--surface));
  --hero-border:color-mix(in srgb, var(--primary) 22%, var(--border));
}
[data-theme="midnight"]{
  --radius-sm:12px; --radius:16px; --radius-lg:20px;
  --title-w:650; --display-w:680; --motion:180ms;
  --hero-fill:color-mix(in srgb, var(--primary) 7%, var(--surface));
  --hero-border:color-mix(in srgb, var(--primary) 22%, var(--border));
}
[data-theme="aurora"]{
  --radius-sm:14px; --radius:18px; --radius-lg:22px;
  --title-w:640; --display-w:670; --motion:200ms;
  --hero-fill:color-mix(in srgb, var(--primary) 7%, var(--surface));
  --hero-border:color-mix(in srgb, var(--primary) 22%, var(--border));
}
[data-theme="bento"]{
  --radius-sm:10px; --radius:14px; --radius-lg:18px;
  --title-w:680; --display-w:720; --motion:160ms;
  --hero-fill:var(--surface);
  --hero-border:var(--border-2);
}
[data-theme="spatial"]{
  --radius-sm:12px; --radius:16px; --radius-lg:20px;
  --title-w:650; --display-w:680; --motion:180ms;
  --hero-fill:color-mix(in srgb, var(--primary) 7%, var(--surface));
  --hero-border:color-mix(in srgb, var(--primary) 22%, var(--border));
}

/* ==================================================================
   Base
   ================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",
       Roboto,"Noto Sans",Inter,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:var(--vh, 100dvh);
  /* Only the tab bar is fixed now — there is no floating button to clear —
     so the last row of every screen scrolls to just above the bar. */
  padding-bottom:calc(var(--shell-b, 58px) + var(--s4))}
#app{padding:calc(var(--s3) + var(--safe-t, 0px)) var(--pad) var(--s2);
     max-width:640px;margin:0 auto;width:100%}
@media (max-width:359px){ :root{--pad:12px} }
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-2);text-decoration:underline}
button{font:inherit;color:inherit}

/* Type scale: 24 / 20 / 17 / 16 / 14 / 13. Sentence case everywhere —
   uppercase labels are the first thing to become unreadable in Russian. */
h1{font-size:24px;font-weight:var(--title-w);letter-spacing:-.4px;line-height:1.2;
   overflow-wrap:anywhere;text-wrap:balance}
h1.greet{font-size:20px;letter-spacing:-.3px}
h2{font-size:16px;font-weight:620;letter-spacing:-.1px;color:var(--text);
   margin:var(--s5) 0 var(--s2);line-height:1.3;
   display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
h2 .act{font-size:14px;font-weight:600;color:var(--primary);
        display:inline-flex;align-items:center;gap:4px;
        position:relative;cursor:pointer;white-space:nowrap;
        min-height:32px;padding:0 2px}
h2 .act::after{content:"";position:absolute;inset:-8px -6px}
h3{font-size:18px;font-weight:640;letter-spacing:-.3px;line-height:1.3;
   display:flex;align-items:center;gap:var(--s1);overflow-wrap:anywhere}
.display{font-size:34px;font-weight:var(--display-w);letter-spacing:-1px;
         line-height:1}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}
.small{font-size:14px} .tiny{font-size:13px;line-height:1.4}
.eyebrow{font-size:12.5px;font-weight:620;letter-spacing:.3px;
         text-transform:uppercase;color:var(--text-2)}
.hero .eyebrow{color:var(--primary)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:var(--s2)}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{overflow-wrap:anywhere}
.strike{text-decoration:line-through;color:var(--text-2)}
.i{flex:none;vertical-align:-3px}
.hide{display:none}

/* ==================================================================
   Surfaces
   ================================================================== */
.card{background:var(--surface);border:var(--border-w) solid var(--border);
      border-radius:var(--radius);padding:var(--s3);box-shadow:var(--shadow-1)}
.card + .card{margin-top:var(--s2)}
.card.tight{padding:var(--s2) var(--s3)}
.card.plain{background:none;border-color:transparent;box-shadow:none;padding:0}
.card.flat{box-shadow:none}

/* The one surface per screen that carries the accent: Home's "Now" and the
   day's score on Statistics. A whisper of the accent, not a gradient. */
.hero{background:var(--hero-fill);color:var(--hero-text);
      border:var(--border-w) solid var(--hero-border);
      border-radius:var(--radius-lg);
      padding:var(--s3) var(--s3) var(--s3);box-shadow:var(--shadow-2);
      position:relative;overflow:hidden}
.hero .t2{color:var(--text-2)} .hero .t3{color:var(--text-3)}
/* The ErnestOS signature: the Now card sits on a hairline of today's
   progress, so the one thing to do next is always read against how far the
   day has come. */
.now-rail{position:absolute;left:0;right:0;bottom:0;height:3px;
          background:color-mix(in srgb, var(--primary) 12%, transparent)}
.now-rail > span{display:block;height:100%;background:var(--primary);
                 border-radius:0 var(--radius-pill) var(--radius-pill) 0;
                 transition:width var(--motion)}
.now-title{font-size:19px;font-weight:640;line-height:1.3;letter-spacing:-.2px;
           margin-top:var(--s1);overflow-wrap:anywhere}
.now-meta{display:flex;flex-wrap:wrap;gap:4px var(--s2);margin-top:var(--s1);
          font-size:14px;color:var(--text-2);align-items:center}
.now-why{font-size:13px;color:var(--text-3);margin-top:4px}
.now-acts{display:flex;gap:var(--s1);margin-top:var(--s3);flex-wrap:wrap}
.now-acts .btn{flex:1 1 160px}

.stack{display:flex;flex-direction:column;gap:var(--s1)}
.divide > * + *{border-top:var(--border-w) solid var(--border);
                padding-top:var(--s2);margin-top:var(--s2)}

/* ==================================================================
   Controls
   ================================================================== */
/* The tick. A 26px ring with a 46px hit area. */
.check{width:26px;height:26px;border-radius:var(--radius-pill);flex:none;
       display:grid;place-items:center;position:relative;cursor:pointer;
       border:2px solid var(--border-2);color:transparent;background:var(--surface);
       transition:transform var(--motion),background var(--motion),
                  border-color var(--motion)}
.check::after{content:"";position:absolute;inset:-10px}
.check:hover{border-color:var(--primary)}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check:active{transform:scale(.9)}
.check.lock{opacity:.5;cursor:default;border-style:dashed}
.check.lock.on{border-style:solid}
.check.sq{border-radius:8px}
.check.timed{color:var(--primary);border-color:color-mix(in srgb, var(--primary) 55%, var(--border))}
.hero .check{border-color:color-mix(in srgb, var(--hero-text) 32%, transparent)}
.hero .check.timed{color:var(--primary)}
.hero .check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}

.btn{background:var(--primary-fill);color:var(--on-primary);border:0;
     border-radius:var(--radius-sm);padding:var(--s2) var(--s3);font:inherit;
     font-size:16px;font-weight:620;cursor:pointer;min-height:48px;width:100%;
     display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);
     text-align:center;line-height:1.25;position:relative;
     box-shadow:var(--shadow-1);transition:filter var(--motion),
                transform var(--motion),background var(--motion)}
.btn:hover{filter:brightness(1.04)}
.btn:active{filter:brightness(.94);transform:scale(.99)}
.btn:focus-visible{outline:0;box-shadow:var(--ring)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.secondary{background:var(--surface);color:var(--text);
               border:var(--border-w) solid var(--border-2);box-shadow:none}
.btn.secondary:hover{background:var(--surface-2);filter:none}
.btn.quiet{background:none;border:var(--border-w) solid var(--border-2);
           color:var(--text);box-shadow:none}
.btn.danger{background:none;border:var(--border-w) solid
              color-mix(in srgb, var(--danger) 45%, var(--border));
            color:var(--danger);box-shadow:none}
.btn.text{background:none;border:0;box-shadow:none;color:var(--primary);
          width:auto;min-height:44px;padding:var(--s0) var(--s1);font-weight:600}
.btn.sm{width:auto;padding:var(--s1) var(--s3);font-size:14.5px;min-height:44px}
/* Saving: the pressed button keeps its size, dims its label and shows a
   small ring, so a slow network reads as "working", not "broken". */
.btn.busy{pointer-events:none;color:transparent}
.btn.busy::after{content:"";position:absolute;width:18px;height:18px;
  top:calc(50% - 9px);left:calc(50% - 9px);border-radius:50%;
  border:2px solid color-mix(in srgb, var(--on-primary) 35%, transparent);
  border-top-color:var(--on-primary);animation:spin .7s linear infinite}
.btn.secondary.busy::after,.btn.quiet.busy::after,.btn.danger.busy::after{
  border-color:var(--border-2);border-top-color:var(--text)}
.btns{display:flex;gap:var(--s1);margin-top:var(--s3);flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

input,textarea,select{width:100%;background:var(--surface);
  border:var(--border-w) solid var(--border-2);color:var(--text);
  border-radius:var(--radius-sm);padding:var(--s2) 14px;font:inherit;
  font-size:16px;min-height:48px;
  -webkit-appearance:none;appearance:none;transition:box-shadow var(--motion),
  border-color var(--motion)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),
       linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
       background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;
       background-size:5px 5px,5px 5px;background-repeat:no-repeat;
       padding-right:40px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--primary);
  box-shadow:var(--ring)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
label{display:block;font-size:14px;color:var(--text-2);margin:var(--s3) 0 6px;
      font-weight:600}
.sheet h3 + input,.sheet h3 + .hint{margin-top:var(--s3)}

.chip{display:inline-flex;align-items:center;gap:6px;position:relative;
      background:var(--surface);border:var(--border-w) solid var(--border-2);
      border-radius:var(--radius-pill);padding:var(--s1) 14px;font-size:14.5px;
      font-weight:560;white-space:nowrap;cursor:pointer;color:var(--text);
      min-height:40px;
      transition:background var(--motion),color var(--motion),
                 border-color var(--motion)}
.chip::after{content:"";position:absolute;inset:-3px}
.chip:hover{border-color:var(--text-3)}
.chip.on{background:var(--primary-fill);border-color:transparent;
         color:var(--on-primary)}
.chip.sm{padding:6px 12px;font-size:14px;min-height:40px}
.chips{display:flex;gap:var(--s1);flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
              margin:0 calc(var(--pad) * -1);padding:0 var(--pad) 2px}
.chips.scroll::-webkit-scrollbar{display:none}

/* Segmented control: a quiet track and a raised white cell. */
.seg{display:flex;background:var(--surface-2);
     border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg > *{flex:1;text-align:center;padding:var(--s1) 6px;min-height:44px;
         display:flex;align-items:center;justify-content:center;
         border-radius:calc(var(--radius-sm) - 3px);font-size:14.5px;font-weight:580;
         cursor:pointer;color:var(--text-2);white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;min-width:0;transition:background var(--motion),
         color var(--motion)}
.seg > *.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.hero .seg{background:color-mix(in srgb, var(--hero-text) 7%, transparent)}

.sw{width:48px;height:28px;border-radius:var(--radius-pill);flex:none;
    position:relative;background:var(--border-2);border:0;cursor:pointer;
    transition:background var(--motion)}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1);
  transition:transform var(--motion),background var(--motion)}
.sw::after{content:"";position:absolute;inset:-8px}
.sw.on{background:var(--primary-fill)}
.sw.on::before{transform:translateX(20px);background:var(--on-primary)}
.setrow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) 0;
        min-height:52px;border-bottom:var(--border-w) solid var(--border)}
.setrow:last-child{border-bottom:0}
.lbl{font-size:15.5px}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.p-high{background:var(--danger)} .p-medium{background:var(--warn)}
.p-low{background:var(--text-3)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;
     font-weight:600;color:var(--text-2);background:var(--surface-2);
     border-radius:var(--radius-pill);padding:2px var(--s1);line-height:1.5}
.tag.hot{color:var(--danger);
         background:color-mix(in srgb,var(--danger) 10%,transparent)}
.tag.warn{color:var(--warn);
          background:color-mix(in srgb,var(--warn) 12%,transparent)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}

/* ==================================================================
   Progress
   ================================================================== */
.bar{height:6px;background:var(--surface-2);border-radius:var(--radius-pill);
     overflow:hidden}
.bar > span,.bar > i{display:block;height:100%;border-radius:var(--radius-pill);
            background:var(--primary);transition:width var(--motion)}
.bar.accent > span{background:var(--primary)}
.hero .bar{background:color-mix(in srgb, var(--primary) 14%, transparent)}

/* Day, week and month on one line; today leads because it is the only one
   the user can still change. Hairlines divide, boxes do not. */
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.scores > div{padding:0 var(--s2);min-width:0}
.scores > div + div{border-left:var(--border-w) solid var(--border)}
.scores > div:first-child{padding-left:0}
.score-cell .k{font-size:13px;color:var(--text-2);font-weight:560;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-cell .v{font-size:20px;font-weight:660;letter-spacing:-.4px;
               margin-top:2px;display:flex;align-items:baseline;gap:6px;
               flex-wrap:wrap;line-height:1.2}
.score-cell.lead .k{color:var(--text)}
.score-cell.lead .v{font-size:24px;font-weight:700;letter-spacing:-.6px}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center}
.trio > div{padding:0 var(--s1);text-align:center;min-width:0}
.trio > div + div{border-left:var(--border-w) solid var(--border)}
.trio .k{font-size:12.5px;color:var(--text-2);font-weight:560;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trio .v{font-size:17px;font-weight:640;margin-top:2px;letter-spacing:-.3px}
@media (max-width:440px){
  .trio[style*="repeat(5"]{grid-template-columns:repeat(3,minmax(0,1fr))!important;
                           row-gap:var(--s2)}
  .trio[style*="repeat(5"] > div:nth-child(4){border-left:0}
}

.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s1)}
.metric{background:var(--surface-2);border:0;
        border-radius:var(--radius-sm);padding:var(--s2) var(--s3);min-width:0}
.metric .k{font-size:13px;color:var(--text-2);font-weight:560}
.metric .v{font-size:20px;font-weight:640;letter-spacing:-.4px;margin-top:2px;
           display:flex;align-items:baseline;gap:var(--s0);flex-wrap:wrap}
.metric.wide{grid-column:1 / -1;display:flex;align-items:center;
             justify-content:space-between;gap:var(--s2)}
.metric.wide .v{margin-top:0}
/* Score bands. Mirrors services.SCORE_BANDS. A band is always printed next
   to its number, so the colour only repeats what the digits already say. */
.band-great{color:var(--ok)} .band-good{color:var(--primary)}
.band-fair{color:var(--warn)} .band-low{color:var(--danger)}
.band-none{color:var(--text-3)}
.bar i.band-great{background:var(--ok)}
.bar i.band-good{background:var(--primary)}
.bar i.band-fair{background:var(--warn)} .bar i.band-low{background:var(--danger)}
.bar i.band-none{background:var(--border-2)}
.delta{font-size:13px;font-weight:620;white-space:nowrap}
.delta small{font-size:12px;font-weight:560}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)}
.delta.flat{color:var(--text-3)}
.count-line{font-size:13.5px;color:var(--text-2);margin-top:var(--s1)}

/* ==================================================================
   Tinted blocks
   ==================================================================
   Blocks are plain white panels now. The theme hue survives in one place
   only — the small icon tile in front of a title — where it helps a list
   of blocks be scanned without painting whole surfaces. */
.tinted{--tint:var(--c1);
  background:var(--surface);
  border:var(--border-w) solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-1)}
.tone-1{--tint:var(--c1)} .tone-2{--tint:var(--c2)} .tone-3{--tint:var(--c3)}
.tone-4{--tint:var(--c4)} .tone-5{--tint:var(--c5)}

.itile{width:32px;height:32px;border-radius:10px;flex:none;display:grid;
  place-items:center;
  background:color-mix(in srgb, var(--tint, var(--c1)) 11%, var(--surface));
  color:color-mix(in srgb, var(--tint, var(--c1)) 55%, var(--text))}
.itile.lg{width:36px;height:36px;border-radius:11px}
.itile.sm{width:24px;height:24px;border-radius:8px;font-size:12px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:340px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.wt{font-size:12px;font-weight:600;color:var(--text-2);
    background:var(--surface-2);
    border-radius:var(--radius-pill);padding:2px 8px;flex:none;white-space:nowrap}
.tile{padding:14px;min-width:0;cursor:pointer;
      transition:transform var(--motion),border-color var(--motion)}
.tile:hover{border-color:var(--border-2)}
.tile:active{transform:scale(.985)}
.tile .k{font-size:14px;font-weight:580;color:var(--text-2);margin-top:var(--s2);
         line-height:1.3}
.tile .v{font-size:22px;font-weight:680;letter-spacing:-.5px;margin-top:2px;
         line-height:1.15;overflow-wrap:anywhere}
.tile .sub{font-size:13px;color:var(--text-2);margin-top:2px;min-height:18px}
.tile .bar{margin-top:var(--s2);height:5px}

.block{padding:var(--s3)}
.block + .block{margin-top:var(--s2)}
.tinted.off{opacity:.62}
.tinted[data-act]{cursor:pointer;transition:transform var(--motion),
                  border-color var(--motion)}
.tinted[data-act]:hover{border-color:var(--border-2)}
.tinted[data-act]:active{transform:scale(.995)}
.block .bh{display:flex;align-items:center;gap:var(--s2)}
.block .bt{font-size:16px;font-weight:620;letter-spacing:-.15px;line-height:1.3}

.sechead{display:flex;align-items:center;gap:var(--s2);
         margin:var(--s4) 0 var(--s2)}
.sechead .itile{width:28px;height:28px;border-radius:9px}
.sechead .lbl{font-size:16px;font-weight:620;color:var(--text);flex:1;min-width:0;
              overflow-wrap:anywhere;line-height:1.3}
.sechead .act{font-size:14px;font-weight:600;color:var(--primary);
              display:inline-flex;align-items:center;gap:4px;position:relative;
              cursor:pointer;white-space:nowrap}
.sechead .act::after{content:"";position:absolute;inset:-10px}
.sechead .dotline{display:none}

/* ==================================================================
   Rows
   ================================================================== */
/* Consecutive rows join into one grouped list: a single rounded surface
   divided by hairlines, instead of a stack of little cards. */
.item,.trow{background:var(--surface);
      border:var(--border-w) solid var(--border);
      border-radius:var(--radius);padding:var(--s2) var(--s3);
      display:flex;gap:var(--s2);min-width:0}
.item{align-items:center;min-height:56px}
:is(.item,.trow) + :is(.item,.trow){margin-top:var(--s1)}
@supports selector(:has(+ *)){
  :is(.item,.trow):has(+ :is(.item,.trow)){
    border-bottom-left-radius:0;border-bottom-right-radius:0;
    border-bottom-color:transparent}
  :is(.item,.trow) + :is(.item,.trow){margin-top:0;
    border-top-left-radius:0;border-top-right-radius:0}
}
.item .meta{font-size:13.5px;color:var(--text-2);margin-top:2px;display:flex;
            align-items:center;gap:4px 8px;flex-wrap:wrap;line-height:1.35}
.item.off{opacity:.6}
.item.pressable{cursor:pointer;transition:background var(--motion)}
.item.pressable:hover{background:var(--surface-2)}
.item.pressable:active{background:var(--surface-2)}

/* A task row. Priority is written on the row (a tag for High) and echoed
   by a quiet edge; urgent work is never signalled by colour alone. */
.trow{align-items:flex-start;border-left-width:3px}
.trow.pri-high{border-left-color:var(--danger)}
.trow.pri-medium{border-left-color:color-mix(in srgb,var(--warn) 30%,var(--border))}
.trow.pri-low{border-left-color:var(--border)}
.trow > .check{margin-top:1px}
.trow .tt{font-weight:560;line-height:1.4;overflow-wrap:anywhere;cursor:pointer;
          min-height:28px;display:flex;align-items:center}
.trow .td{font-size:13.5px;color:var(--text-2);margin-top:2px;display:flex;
          align-items:center;gap:4px 8px;flex-wrap:wrap;line-height:1.35}
/* The three ways out of "late" as one row of equal cells, with their label
   above — never a chip dangling alone on a second line. */
.trow .quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
             margin-top:var(--s2)}
.trow .quick .qlbl{grid-column:1 / -1;font-size:12.5px;color:var(--text-2)}
.trow .quick .chip{justify-content:center;padding:6px 4px;min-width:0}
.group{font-size:14px;font-weight:600;color:var(--text-2);
       margin:var(--s3) 0 var(--s1);display:flex;align-items:center;gap:6px}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.strip .d{border-radius:var(--radius-sm);background:var(--surface);
          border:var(--border-w) solid var(--border);padding:6px 2px;
          text-align:center;min-width:0;cursor:pointer}
.strip .d.now{border-color:var(--primary);
              background:color-mix(in srgb, var(--primary) 8%, var(--surface))}
.strip .dow{font-size:11px;font-weight:600;color:var(--text-2)}
.strip .dd{font-size:15px;font-weight:620;margin-top:2px}
.strip .mk{height:4px;margin-top:3px;display:flex;justify-content:center;gap:2px}
.strip .mk i{width:4px;height:4px;border-radius:50%;background:var(--primary)}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;
          margin-bottom:var(--s2);gap:var(--s1)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;
          width:100%}
.cal-dow{text-align:center;font-size:12px;color:var(--text-2);padding:4px 0;
         font-weight:600;min-width:0;overflow:hidden}
.cal-day{aspect-ratio:1;min-width:0;border-radius:var(--radius-sm);
         background:transparent;border:var(--border-w) solid transparent;
         display:flex;flex-direction:column;align-items:center;
         justify-content:center;font-size:14px;gap:3px}
/* The days before the 1st. Not `.empty` — that is the dashed empty-state
   panel, and it drew a dashed box in the corner of every month. */
.cal-day.pad{pointer-events:none}
.cal-day.past{color:var(--text-3)}
.cal-day.today{border-color:var(--primary);color:var(--primary);font-weight:680;
               background:color-mix(in srgb, var(--primary) 7%, transparent)}
.cal-day.has{font-weight:600}
.cal-day.past.has{color:var(--text-2)}
.cal-day[data-act]{cursor:pointer}
.cal-day[data-act]:hover{background:var(--surface-2)}
.cal-dots{display:flex;gap:2px;height:4px;max-width:100%;overflow:hidden;
          justify-content:center}
.cal-dots i{width:4px;height:4px;border-radius:50%}
.k-task{background:var(--c1)} .k-project{background:var(--c2)}
.k-birthday{background:var(--c4)}

/* Habit history grid */
.hgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.hgrid i{aspect-ratio:1;border-radius:4px;background:var(--surface-2)}
.hgrid i.due{background:var(--border-2)}
.hgrid i.done{background:var(--ok)}

/* Prayer: the name, then its states in one strip. */
.prow{padding:var(--s2) 0;border-bottom:var(--border-w) solid var(--border)}
.prow:last-of-type{border-bottom:0}
.prow .pn{font-size:15.5px;font-weight:600;display:flex;align-items:center;
          gap:6px;margin-bottom:var(--s1)}
/* The statuses are one segmented row of equal cells that always fits the
   width — no sideways scrolling, no clipped last button. Tapping the chosen
   one again clears it, so there is no separate ✕. */
.prow .ps{display:grid;grid-template-columns:repeat(var(--n, 4), minmax(0, 1fr));gap:4px}
@media (min-width:520px){
  .prow{display:flex;align-items:center;gap:var(--s2)}
  .prow .pn{width:96px;flex:none;margin-bottom:0}
  .prow .ps{flex:1}
}
.st{border-radius:var(--radius-sm);
    border:var(--border-w) solid var(--border-2);background:var(--surface);
    padding:4px 2px;font-size:13px;font-weight:560;cursor:pointer;min-height:44px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:var(--text-2);transition:background var(--motion),
    color var(--motion)}
.st.on{color:var(--bg);border-color:transparent;font-weight:640}
.st.jamaat.on{background:var(--ok)}
.st.on_time.on{background:color-mix(in srgb, var(--ok) 80%, var(--text))}
.st.qaza.on{background:var(--warn)}
.st.missed.on{background:var(--danger)}

/* ==================================================================
   Chrome
   ================================================================== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;
    grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
    background:var(--surface);
    border-top:var(--border-w) solid var(--border);
    padding:4px max(4px, env(safe-area-inset-left, 0px)) var(--safe-b, 0px)}
/* Nothing is drawn in the bar until the first screen has its data: an empty
   bar with a floating button over a blank page was the first thing the app
   showed, for as long as the first request took. */
nav:empty{display:none}
/* The switch at the top of Kundalik and Profil: big, thumb-sized, sticky, so
   Habits ↔ Tasks is one tap from anywhere on the page. */
.groupseg{position:sticky;top:0;z-index:5;margin:2px 0 6px;
          box-shadow:0 6px 12px -10px rgba(0,0,0,.25)}
.seg.big > *{min-height:48px;font-size:16px;font-weight:650}
/* Inside a group the switch already names the screen. */
.grouped > .head > h1, .grouped > .head > .grow > h1{display:none}
.grouped > .head{min-height:0;justify-content:flex-end}
.profile-head{display:flex;align-items:center;gap:var(--s2);margin:4px 0 12px}
.grouped > h1:first-child{display:none}
.nohead > .head, .screen-money > .head .add{display:none}
/* Qadam card */
.steps{background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius);
       padding:16px;margin:4px 0 14px;box-shadow:var(--shadow-1)}
.steps-top{display:flex;align-items:flex-start;gap:var(--s2)}
.steps-title{font-size:22px;font-weight:760}
.freeze{background:var(--surface-2);border-radius:var(--radius-pill);padding:4px 10px;font-weight:650}
.steps-level{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;
             background:var(--surface-2);border-radius:var(--radius-sm)}
.steps-level .badge{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;
                    background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb, var(--warn) 70%, transparent)}
.steps-level .ln{font-size:18px;font-weight:720}
.sbar{height:8px;border-radius:8px;background:color-mix(in srgb, var(--text) 10%, transparent);margin:6px 0 2px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:8px;background:var(--warn)}
.steps-level .total{text-align:right;padding-left:12px;border-left:var(--border-w) solid var(--border)}
.steps-level .tv{font-size:28px;font-weight:780}
.steps-sub{margin:16px 0 8px;font-weight:700}
.steps-sub.row{display:flex;align-items:center;gap:8px}
.sdots{display:flex;gap:4px}.sdots i{width:8px;height:8px;border-radius:50%;background:var(--border)}
.sdots i.on{background:var(--ok)}
.steps-path{display:flex;align-items:flex-start}
.step-node{flex:0 0 auto;width:58px;text-align:center}
.step-node .dot{position:relative;width:46px;height:46px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
                font-size:20px;background:var(--surface-2);border:2px solid var(--border)}
.step-node.now .dot{border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent)}
.step-node.past .dot{border-color:var(--ok)}
.step-node.lock .dot{opacity:.6}
.step-node .lk{position:absolute;right:-4px;bottom:-4px;font-size:12px}
.step-node .nm{font-size:11px;font-weight:650;margin-top:4px;line-height:1.15}
.step-node .rg{font-size:10.5px;color:var(--text-3)}
.step-line{flex:1;height:2px;background:var(--border);margin-top:23px;min-width:4px}
.steps-today{display:grid;grid-template-columns:repeat(auto-fit, minmax(96px, 1fr));gap:8px}
.step-chip{position:relative;display:grid;gap:2px;padding:10px;border-radius:var(--radius-sm);
           border:var(--border-w) solid var(--border)}
.step-chip .ck{position:absolute;top:8px;right:8px}
.step-chip .ci{font-size:18px}.step-chip .cn{font-size:12.5px;font-weight:650}
.step-chip .cv{font-size:12px;color:var(--text-2)}
.step-chip .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center}
.step-chip.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--on-primary)}
.steps-go{margin-top:14px}
.profile-head .pname{font-size:20px;font-weight:700}
/* The two ways to add anything, always in the same place: + for typing and
   the microphone above it for speaking. Bottom right, above the bar. */
#fab{position:fixed;right:16px;bottom:calc(var(--nav-h, 64px) + 16px);z-index:41;
     display:grid;gap:12px;justify-items:center}
#fab:empty{display:none}
#fab button{border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
            box-shadow:0 8px 20px -6px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.15)}
#fab .fab-add{width:62px;height:62px;background:var(--primary-fill);color:var(--on-primary)}
#fab .fab-mic{width:48px;height:48px;background:var(--surface);color:var(--primary);
              border:var(--border-w) solid var(--border)}
#fab button:active{transform:scale(.94)}
#fab .fab-add{background:linear-gradient(145deg, color-mix(in srgb, var(--primary-fill) 82%, var(--surface) 18%), var(--primary-fill))}
.voice-box{display:grid;justify-items:center;gap:10px;padding:8px 0 4px;text-align:center}
.voice-box .btn{width:100%}
.voice-pulse{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
             color:var(--on-primary);background:var(--danger);animation:vpulse 1.4s ease-in-out infinite}
@keyframes vpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--danger) 45%, transparent)}
                  50%{box-shadow:0 0 0 18px color-mix(in srgb, var(--danger) 0%, transparent)}}
@media (prefers-reduced-motion: reduce){ .voice-pulse{animation:none} }
.voice-time{font-size:28px;font-weight:720}
.voice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.voice-row .btn{margin:0}
.voice-card{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;

body:has(#sheet.show) #fab,
body:has(#app input:focus, #app textarea:focus) #fab{display:none}
nav button{background:0;border:0;color:var(--text-2);padding:6px 1px 8px;

@media (max-width:359px){ nav button{font-size:10.5px;letter-spacing:-.2px}

nav button.on{color:var(--primary)}
nav button .ic{display:grid;place-items:center;height:28px;width:44px;
               border-radius:var(--radius-pill);transition:background var(--motion)}
/* Money is its own place, not a fifth productivity screen: a hairline sets

nav button.apart{position:relative}
nav button.apart::before{content:"";position:absolute;left:0;top:14px;bottom:18px;

/* The on-screen keyboard: while a field on the page has focus, the bar and
   the button step aside instead of riding up over what is being typed. */
body:has(#app input:focus, #app textarea:focus) nav{visibility:hidden}

/* Every screen's "add" lives in its own header, beside its title. A floating
   button covered the last row of whatever was underneath it — the thing
   people saw first when the app opened — and did what the header already
   did. */
.head .add{background:var(--primary-fill);color:var(--on-primary);
           border-color:transparent}
.head .add:active{filter:brightness(.94)}

.privacy-strip{margin:var(--s5) auto var(--s1);text-align:center;max-width:420px;
  font-size:12.5px;line-height:1.45;color:var(--text-3);text-wrap:pretty}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
       align-items:flex-end;z-index:50}
.sheet.show{display:flex}
.sheet-inner{background:var(--surface);width:100%;max-width:640px;margin:0 auto;

.grabber{width:40px;height:5px;border-radius:3px;background:var(--border-2);

                  color:var(--primary);padding:var(--s1) 0;display:flex;

             text-decoration:underline;text-underline-offset:3px;
             padding:var(--s1) 0}

       border-radius:var(--radius);text-wrap:pretty}

      margin:var(--s6) auto}

@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ---- header: greeting, date, profile ---- */
.head{display:flex;align-items:center;gap:var(--s2);min-height:48px}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;border:0;padding:0;

.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.avatar img{border-radius:50%}

/* shared-work pieces (team screen) */

   re-rendered from that state. Nothing patches a node by id, so

/* Telegram's in-app browser reports a usable height that 100vh gets
   wrong, and the value changes as the keyboard opens. Mirror it, plus
   both safe-area insets, into custom properties. */
function syncViewport(){
  const root = document.documentElement;
  const h = tg?.viewportStableHeight || tg?.viewportHeight || window.innerHeight;
  root.style.setProperty("--vh", h + "px");
  const inset = tg?.contentSafeAreaInset || tg?.safeAreaInset;
  const outer = tg?.safeAreaInset;
  root.style.setProperty("--safe-t",
    Math.max(inset?.top ?? 0, outer?.top ?? 0) + "px");
  root.style.setProperty("--safe-b",
    `max(${Math.max(inset?.bottom ?? 0, outer?.bottom ?? 0)}px, env(safe-area-inset-bottom, 0px))`);
}
syncViewport();
tg?.onEvent?.("viewportChanged", syncViewport);
tg?.onEvent?.("safeAreaChanged", syncViewport);
tg?.onEvent?.("contentSafeAreaChanged", syncViewport);
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", () => setTimeout(syncViewport, 250));

/* ---------- themes ----------
   The picker shows each theme's three brand colours as a preview strip, so
   the swatch is the thing the user will actually see rather than a dot. Every
   theme is a complete visual system; the tokens live in the stylesheet and
   nothing here needs to know what they are. */
const THEMES = [
  {id:"ocean",    c:["#007AFF","#30B0C7","#5856D6","#FF9500","#34C759"]},
  {id:"midnight", c:["#5856D6","#32ADE6","#AF52DE","#FF9500","#34C759"]},
  {id:"aurora",   c:["#AF52DE","#5856D6","#32ADE6","#FF2D55","#00C7BE"]},
  {id:"bento",    c:["#1C1C1A","#007AFF","#00C7BE","#FF9500","#AF52DE"]},
  {id:"spatial",  c:["#30B0C7","#007AFF","#5856D6","#FF9500","#34C759"]},
];
const THEME_NAMES = {ocean:"Calm Blue", midnight:"Indigo", aurora:"Lilac",
                     bento:"Ink", spatial:"Teal"};
//: An account holding an unknown theme renders as the default and shows the
//: default ticked, rather than a picker with nothing selected.
const DEFAULT_THEME = "ocean";

/* ---------- reminders ----------
   The offsets the picker offers, and the one a task is born with. Half an
   hour is the useful default: "at the time" is a notification about something
   already starting, and an hour out is early enough to be read and forgotten.
   Kept in step with services.REMINDER_OFFSETS. */
const REMINDER_OFFSETS = [0, 10, 30, 60, 1440];
const DEFAULT_REMIND_BEFORE = 30;
const themeOf = name => THEMES.some(x => x.id === name) ? name : DEFAULT_THEME;
const themeMeta = name => THEMES.find(x => x.id === themeOf(name));

/* ---------- api ---------- */
/* Every request in the app goes through here: the initData header, JSON in and
   out, HTTP errors as thrown objects carrying `status`, and a deadline.

   The deadline matters more than it looks. Without one, a request that never
   answers — a dead tunnel, a phone that changed network mid-tap — leaves the
   app on its spinner with nothing to tap and no way back. Fifteen seconds is
   well past any real response and well short of the point where somebody
   force-closes the Mini App. A timeout throws with no `status`, which is
   exactly how `handleError` already recognises "no connection": the user gets
   the offline message and keeps whatever they had typed. */
const API_TIMEOUT_MS = 15000;

/* The key a create is sent with. `save` sets it before the request and a
   retry of the same draft reuses it, so the server answers a repeat from the
   first attempt instead of writing a second row. The first post uses it up. */
let idemKey = null;
const newKey = () => ((window.crypto?.randomUUID?.() || "")
  .replace(/-/g, "") || (Date.now().toString(36) + Math.random().toString(36).slice(2)))
  .slice(0, 32).padEnd(12, "0");

async function api(path, options = {}){
  const method = (options.method || "GET").toUpperCase();
  const extra = {};
  if(method === "POST" && idemKey){ extra["X-Idempotency-Key"] = idemKey; idemKey = null; }
  const res = await fetch(path, {
    ...options,
    signal: options.signal || requestTimeout(API_TIMEOUT_MS),
    headers:{"Content-Type":"application/json",
             "X-Telegram-Init-Data": tg?.initData || "", ...extra,
             ...(options.headers||{})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if(!res.ok){
    const err = new Error("http_" + res.status);
    err.status = res.status;
    err.retryAfter = Number(res.headers.get("Retry-After")) || 30;
    try{ err.detail = (await res.json())?.detail; }catch(_){}
    throw err;
  }
  const remaining = res.headers.get("X-Trial-Remaining");
  if(remaining !== null && state.me?.trial){
    state.me.trial.remaining = Number(remaining);
    if(state.me.trial.required && !state.me.trial.subscribed)
      state.readOnly = Number(remaining) === 0;
  }
  return res.status === 204 ? null : res.json();
}

function requestTimeout(ms){
  if(AbortSignal.timeout) return AbortSignal.timeout(ms);
  const controller = new AbortController();
  setTimeout(() => controller.abort(), ms);
  return controller.signal;
}

let toastTimer;
/* A toast may carry one action. Undo is offered wherever the action is
   reversible in one call, which is what makes a destructive tap safe to
   make with a thumb. */
function toast(msg, undoLabel, undoFn){
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>` +
    (undoFn ? `<span class="undo" id="toast-undo">${esc(undoLabel)}</span>` : "");
  el.classList.add("show");
  if(undoFn) document.getElementById("toast-undo").onclick = () => {
    el.classList.remove("show");
    undoFn();
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), undoFn ? 5000 : 2000);
}

/* A signed delta, drawn with its own arrow so the direction survives a

function deltaTag(value){

/* Local dates without pulling in a formatting library: the payload
   already carries ISO strings and the month names are in DICT. */
function isoToLabel(iso){
  if(!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${D().months[m - 1]}`;
}
function shiftISO(iso, days){
  const dt = new Date(iso + "T12:00:00Z");
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0, 10);
}
const todayISO = () => {
  try{
    const parts = new Intl.DateTimeFormat("en-CA", {timeZone:state.me?.prefs?.timezone || "Asia/Tashkent",
      year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(new Date());
    const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}`;
  }catch(_){ return state.me?.today || state.home?.date || new Date().toISOString().slice(0, 10); }
};

/* A date as three plain selects — day, month, year — instead of the native
   date input. Telegram's in-app pickers hide the year behind a tap many
   people never find, so a deadline in 2030 could not be set. Selects work
   the same on every phone. The chosen date lives in a hidden input with the
   field's id, so `val(id)` reads it like any other input. `years` is
   [first, last]; the default is this year and the next twenty. */
function dateField(id, value, years){
  const now = new Date(todayISO());
  const [vy, vm, vd] = (value || "").split("-").map(Number);
  let [y0, y1] = years || [now.getFullYear(), now.getFullYear() + 20];
  // A saved date outside the range (last year's overdue task) stays shown.
  if(vy){ y0 = Math.min(y0, vy); y1 = Math.max(y1, vy); }
  const opt = (v, label, on) => `<option value="${v}" ${on ? "selected" : ""}>${label}</option>`;
  const days = [opt("", t("date_day"), !vd)]
    .concat(Array.from({length:31}, (_, i) => opt(i + 1, i + 1, vd === i + 1)));
  const months = [opt("", t("date_month"), !vm)]
    .concat(D().months.map((m, i) => opt(i + 1, m, vm === i + 1)));
  const yrs = [opt("", t("date_year"), !vy)];
  for(let y = y0; y <= y1; y++) yrs.push(opt(y, y, vy === y));
  return `<div class="datef" data-datef="${id}">
      <select id="${id}-d" aria-label="${t("date_day")}">${days.join("")}</select>
      <select id="${id}-m" aria-label="${t("date_month")}">${months.join("")}</select>
      <select id="${id}-y" aria-label="${t("date_year")}">${yrs.join("")}</select>
      <input type="hidden" id="${id}" value="${value ? esc(value) : ""}" />
    </div>`;
}
/* One part chosen fills the others from today, and a 31st in a short month
   becomes its last day — so the hidden value is always a real date. */
function syncDateField(box){
  const id = box.dataset.datef;
  const g = k => document.getElementById(`${id}-${k}`);
  const now = new Date(todayISO());
  if(!g("d").value && !g("m").value && !g("y").value){
    document.getElementById(id).value = ""; return;
  }
  if(!g("y").value) g("y").value = String(now.getFullYear());
  if(!g("m").value) g("m").value = String(now.getMonth() + 1);
  if(!g("d").value) g("d").value = String(now.getDate());
  const y = Number(g("y").value), m = Number(g("m").value);
  const last = new Date(y, m, 0).getDate();
  if(Number(g("d").value) > last) g("d").value = String(last);
  const pad = n => String(n).padStart(2, "0");
  document.getElementById(id).value = `${y}-${pad(m)}-${pad(g("d").value)}`;
}


/* ---------- line chart (inline SVG, no libraries) ---------- */
function lineChart(series, keys){
  if(!series.length) return `<div class="empty">${t("no_data")}</div>`;
  const W = 320, H = 148, L = 18, R = 8, TOP = 12, BOT = 24;
  const stepX = series.length > 1 ? (W - L - R) / (series.length - 1) : 0;
  const y = v => H - BOT - (v / 100) * (H - TOP - BOT);
  const x = i => L + i * stepX;

  const grid = [0, 50, 100].map(v =>
    `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"
       stroke-width="1" stroke-dasharray="2 5"/>
     <text x="0" y="${y(v)+3}" font-size="8" fill="var(--text-3)">${v}</text>`).join("");

  /* A key may skip the days it has no value (`gaps`) instead of drawing
     them as zero, set its own `width`, and leave out the area (`area:false`). */
  const paths = keys.map((k, n) => {
    const idx = series.map((p, i) => i)
      .filter(i => !k.gaps || (series[i][k.field] !== null && series[i][k.field] !== undefined));
    if(!idx.length) return "";
    const pts = idx.map(i => `${x(i)},${y(series[i][k.field] ?? 0)}`).join(" ");
    const area = `${x(idx[0])},${y(0)} ${pts} ${x(idx[idx.length-1])},${y(0)}`;
    const dots = series.length <= 12
      ? idx.map(i => `<circle cx="${x(i)}" cy="${y(series[i][k.field] ?? 0)}"
          r="${k.width > 2.5 ? 3 : 2.5}" fill="${k.color}"/>`).join("") : "";
    return (k.area === false ? "" : `<polygon points="${area}" fill="${k.color}"
        opacity="${n === 0 ? .10 : .05}"/>`)
      + `<polyline points="${pts}" fill="none" stroke="${k.color}"
        stroke-width="${k.width || 2.3}" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");

  // Anchor the first and last labels inward so they are not clipped by
  // the SVG edge; everything between stays centred on its point.
  const every = Math.ceil(series.length / 6);
  const last = series.length - 1;
  const labels = series.map((p, i) => {
    if(i % every !== 0 && i !== last) return "";
    const anchor = i === 0 ? "start" : i === last ? "end" : "middle";
    return `<text x="${x(i)}" y="${H-6}" font-size="8.5" fill="var(--text-3)"
              text-anchor="${anchor}">${p.label}</text>`;
  }).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${paths}${labels}</svg>`;
}

/* ==================================================================
   Screens
   ================================================================== */
const SCREENS = {};

/* Home, top to bottom: who and when, then ONE action, then the work that
   action came out of, and only then the numbers. Everything on this screen is
   either the next action or a number about today. Editing and deleting live on
   the screens that own the data, so a mis-tap here cannot destroy anything.

   Work before numbers, and that order is deliberate. The Now card names one
   task; the question it immediately raises is "what else is there today?", and
   the answer used to be two blocks of percentages further down the scroll. A
   score is a reading *of* the day's work, so it belongs after the work it is
   measuring — somebody who opens Home to act now gets the list without
   scrolling, and somebody who opens it to check on themselves scrolls once. */
SCREENS.home = () => {
  const d = state.home;
  if(!d) return `<div class="spin"></div>`;

  /* Opening the app answers one question: what do I do right now? The
     answer is one thing — the Now card. Reporting is second: one line of
     counts, never a percentage, that opens Statistics. Planning is third:
     the rest of today's work.

       who and when   →  the one thing to do now
                      →  today in counts
                      →  the rest of today's work

     Everything else — the week goal, the countdowns, the day/week/month
     percentages, XP — lives on the screen that owns it (Tasks, Statistics).
     The month grid opens from the date in the header. */
  return headBlock(d)
       + timerBanner(d.active_timer)
       + nowBlock(d)
       + countsRow(d)
       + tasksBlock(d)
       + presetsOffer(d)
       + privacyNote();
};

/* ---------- today, in counts ----------
   "Vazifa 1/3 · Odat 2/6 · Namoz 3/5" — something a person can check against
   their own list. A percentage first thing in the morning is a grade for a
   day that has not happened yet; the formula is untouched and one tap away
   on Statistics. */
function countsRow(d){
  const c = d.counts;
  if(!c) return "";
  const parts = [];
  if(c.tasks.total) parts.push(`${t("cnt_tasks")}
    <b>${c.tasks.done}/${c.tasks.total}</b>`);
  if(c.habits.total) parts.push(`${t("cnt_habits")}
    <b>${c.habits.done}/${c.habits.total}</b>`);
  if(c.team?.total) parts.push(`${t("team")}
    <b>${c.team.done}/${c.team.total}</b>`);
  if(c.prayer.owed !== false && d.modules?.prayer !== false)
    parts.push(`${t("cnt_prayer")}
      <b>${c.prayer.excused ? "✓" : `${c.prayer.done}/${c.prayer.total}`}</b>`);
  if(d.streak) parts.push(`${icon("flame", 15)} <b>${d.streak}</b>`);
  if(!parts.length) return "";
  return `<div class="counts" data-act="nav" data-screen="stats" role="button"
      tabindex="0" aria-label="${t("stats")}">
      ${parts.map(p => `<span>${p}</span>`).join("")}
      ${icon("chevron", 15)}</div>`;
}

/* The privacy promise, once, at the foot of the first screen — not a fixed
   bar above the tab bar on all four. */
function privacyNote(){
  return `<div class="privacy-strip">${t("privacy_line")}</div>`;
}

/* The month, in a sheet, opened from the date in the header. */
function calendarSheet(){

function headBlock(d){
  const initial = (d.name || "E").charAt(0).toUpperCase();
  /* Telegram already knows the user's photo and hands it to the Mini App in
     initData, so there is nothing to upload and nothing to ask for. The
     signed-blob endpoint stays as the fallback for an avatar that was sent
     to the bot before this existed. */
  const tgPhoto = tg?.initDataUnsafe?.user?.photo_url;
  const avatar = tgPhoto
    ? `<img src="${esc(tgPhoto)}" alt="" />`
    : state.me?.has_photo
      ? `<img src="/api/avatar?token=${encodeURIComponent(state.me?.avatar_token || "")}" alt="" />`
      : esc(initial);

  let h = `
    <div class="head">
      <div class="grow">
        <h1 class="greet">${t("greet")}, ${esc(d.name)}</h1>
        <button class="datebtn" data-act="calendar-open"
                aria-label="${t("calendar")} · ${esc(d.date_label)}">
          ${icon("calendar", 15)}<span>${esc(d.date_label)}</span></button>
      </div>
      <button class="avatar" data-act="settings"
              aria-label="${t("settings")}">${avatar}
        <span class="avatar-gear" aria-hidden="true">${icon("settings", 11)}</span></button>
    </div>`;

  // The quote is one quiet line when there is one. An empty one is not an
  // underlined grey link on the first screen — it is set in Settings.
  if(d.quote) h += `<div class="t2 small wrap" data-act="quote"
            style="margin-top:var(--s2)">“${esc(d.quote)}”</div>`;

  // Returning after a break gets one offer, not a wall of red.
  const b = d.break;
  if(b && b.suggest_reset && !state.dismissedBreak){
    h += `<div class="card tight" style="margin-top:var(--s2)">
        <div class="row">
          <div class="grow"><b>${t("welcome_back")}</b>
            <div class="t2 tiny">${t("overdue_waiting", {n:b.overdue})}</div></div>
          <button class="btn sm secondary" data-act="fresh-start">
            ${t("recover")}</button>
          <button class="iconbtn sm bare" data-act="break-dismiss"
                  aria-label="${t("close")}">${icon("x", 15)}</button>
        </div></div>`;
  }
  return h;
}

/* ---------- the Now card ----------
   The single largest thing on Home, and the reason Home exists: it answers
   "what do I do at this moment?" without the user reading the screen and
   choosing. The answer is computed by the backend's fixed ladder — pinned
   mission, then anything late, then what is due today by time and priority,
   then a due habit, then prayers, then closing the day — so it changes on its
   own as the day moves, and two people with the same day get the same answer.

   It is a suggestion, not an instruction: the edit button opens the picker and
   pinning something overrides the ladder for the rest of the day. The one-line
   reason under the title is what makes that offer legible — a card that
   decides on the user's behalf owes them the sentence saying why. */
function nowBlock(d){
  const n = d.now || {kind:"clear", reason:"clear"};

  /* Everything the card needs to draw, per kind, in one place: the line to
     show, the tap target for finishing it, and whether it is a real task
     (which is the only kind that can be swapped for another). */
  const KINDS = {
    wake:    {title: t("now_wake"),    act:"wake"},
    prayer:  {title: t("now_prayer"),  act:"go-tab", data:'data-tab="prayer"'},
    journal: {title: t("now_journal"), act:"go-tab", data:'data-tab="journal"'},
    /* A habit or task done by its timer is started, not ticked, from here. */
    habit:   n.timer_minutes
               ? {title: n.title, act:"timer-open", data:'data-kind="habit"'}
               : {title: n.title, act:"habit-toggle-home"},
    task:    n.timer_minutes
               ? {title: n.title, act:"timer-open", data:'data-kind="task"'}
               : {title: n.title, act:"task-done"},
  };
  const kind = KINDS[n.kind];

  /* The pencil is "choose for today": pin one task, and it stays the answer
     for the rest of the day (at most one — a second asks to replace it). */
  const head = `<div class="row" style="gap:var(--s1)">
      <div class="grow eyebrow">${t("now")}</div>
      <button class="iconbtn sm bare" data-act="mission-pick"
              aria-label="${t("mission_change")}">${icon("edit", 17)}</button>
    </div>`;

  // Nothing left. Not an empty state — a finished one, with the one useful
  // next step offered rather than a blank card.
  if(!kind){
    return `<div class="hero" style="margin-top:var(--s3)">
        ${head}
        <div class="now-title">${n.team_remaining ? t("now_team", {n:n.team_remaining}) : t(n.empty ? "now_empty" : "now_clear")}</div>
        <div class="t2 small" style="margin-top:2px">${t(n.team_remaining ? "team_left_today" : n.empty ? "now_empty_hint" : "now_clear_hint")}</div>
        <div class="now-acts"><button class="btn secondary" data-act="${n.team_remaining ? "nav" : "task-add"}" data-screen="team">
          ${icon("plus", 17)} ${t(n.team_remaining ? "team" : "add_task")}</button></div>
      </div>`;
  }

  /* Why this one. Kept to a single short line. */
  const REASONS = {pinned:"why_pinned", overdue:"why_overdue",
                   due_today:"why_due_today", habit:"why_habit",
                   wake:"why_wake", wake_late:"why_wake_late",
                   prayer:"why_prayer", evening:"why_evening"};
  const why = REASONS[n.reason];

  const meta = [];
  if(n.due_time) meta.push(`<span class="num">${icon("clock", 14)} ${esc(n.due_time)}</span>`);
  else if(n.meta && n.kind !== "task") meta.push(`<span>${esc(n.meta)}</span>`);
  if(n.priority === "high") meta.push(`<span class="tag hot">${t("high")}</span>`);
  if(n.project) meta.push(`<span>${icon("folder", 14)} ${esc(n.project)}</span>`);

  /* One clear action, named for what it does. A timed item starts its clock;
     prayer and the journal open their screen; everything else is finished. */
  const timed = Boolean(n.timer_minutes);
  const opens = n.kind === "prayer" || n.kind === "journal";
  const label = n.kind === "wake" ? t("wake_btn") : opens ? t("now_open")
    : timed ? t("timer_start") : t("now_done");
  const glyph = timed ? "play" : opens ? "chevron" : n.kind === "wake" ? "sun" : "check";

  return `<div class="hero" style="margin-top:var(--s3)">
      ${head}
      <div class="now-title">${esc(kind.title)}</div>
      ${meta.length ? `<div class="now-meta">${meta.join("")}</div>` : ""}
      ${why ? `<div class="now-why">${t(why)}</div>` : ""}
      ${n.overdue ? `<div class="now-late" data-act="nav" data-screen="tasks"
          role="button" tabindex="0">${icon("clock", 14)}
          <span class="grow ellipsis">${t("now_also_late")}: ${esc(n.overdue.title)}</span>
          ${n.overdue.count > 1 ? `<b class="num">+${n.overdue.count - 1}</b>` : ""}</div>` : ""}
      <div class="now-acts">
        <button class="btn" data-act="${kind.act}" ${kind.data || ""}
                ${n.id ? `data-id="${n.id}"` : ""}>${icon(glyph, 17)} ${label}</button>
      </div>
    </div>`;
}

/* Today's work, grouped by the project it belongs to. */
function tasksBlock(d){
  const groups = d.tasks_today || [];
  /* Whatever the Now card is showing is already the largest thing on the
     screen; printing it again three inches lower is the same task twice. The
     backend drops the pinned ones, and the card can also be showing an
     unpinned task the ladder chose, so that one is dropped here. */
  const shownAbove = d.now?.kind === "task" ? d.now.id : (d.top3 || [])[0]?.id;
  const missionId = shownAbove;

  let h = `<h2>${t("today_tasks")}
      <span class="act" data-act="task-add">${icon("plus", 15)}
        ${t("add_task")}</span></h2>`;

  const rows = groups
    .map(g => ({...g, tasks: g.tasks.filter(x => x.id !== missionId)}))
    .filter(g => g.tasks.length);

  const byTeam = {};
  for(const x of (d.team_today || []))
    (byTeam[x.team_name || ""] ||= []).push({...x, source:"team"});
  const shared = Object.entries(byTeam).map(([name, items]) =>
    `<div class="group">${icon("users", 14)} ${esc(name)}</div>`
    + items.map(x => taskRow(x, {hideDate: true})).join("")).join("");

  if(!rows.length && shared) return h + shared;
  // Today's only task is the one on the Now card: "no tasks yet" under it
  // would contradict the card, so the heading and its + are all there is.
  if(!rows.length && d.now?.kind === "task") return h;
  if(!rows.length){
    return h + `<div class="empty">${t("no_tasks_yet")}
      <button class="btn secondary sm" data-act="task-add">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  }

  return h + rows.map(group => `
    ${group.project
      ? `<div class="group">${icon("target", 13)} ${esc(group.project)}</div>`
      : `<div class="group">${esc(t("standalone"))}</div>`}
    ${group.tasks.map(x => taskRow(x, {hideProject: true, hideDate: true}))
                 .join("")}`).join("") + shared;
}

function calendarBlock(){
  const c = state.calendar;
  if(!c) return `<div class="card"><div class="spin"></div></div>`;
  const dows = D().dow.map(x => `<div class="cal-dow">${x}</div>`).join("");
  let cells = "";
  for(let i = 0; i < c.first_weekday; i++) cells += `<div class="cal-day pad"></div>`;
  for(let day = 1; day <= c.days_in_month; day++){
    const iso = `${c.year}-${String(c.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const events = c.events[iso] || [];
    // At most three dots, so a busy day never spills into its neighbour.
    const kinds = [...new Set(events.map(e => e.kind))].slice(0, 3);
    /* A past day opens only when something happened on it, and then only to
       show what was done. Today and every day after open even when empty —
       that is where a task gets planned. */
    const past = iso < c.today;
    const opens = events.length || !past;
    cells += `<div class="cal-day num ${iso === c.today ? "today" : ""}
      ${past ? "past" : ""} ${events.length ? "has" : ""}"
      ${opens ? `data-act="day-open" data-date="${iso}" role="button" tabindex="0"` : ""}>
      <span>${day}</span>
      <span class="cal-dots">${kinds.map(k => `<i class="k-${k}"></i>`).join("")}</span></div>`;
  }
  return `<div class="card">
    <div class="cal-head">
      <button class="iconbtn sm" data-act="cal-prev"
              aria-label="‹">${icon("back", 16)}</button>
      <b>${D().months[c.month - 1]} ${c.year}</b>
      <button class="iconbtn sm" data-act="cal-next"
              aria-label="›">${icon("chevron", 16)}</button>
    </div>
    <div class="cal-grid">${dows}${cells}</div></div>`;
}

/* Direction as a glyph as well as a colour, so it survives a monochrome
   screen. Read by both the Home score block and the Statistics header. */
const TREND_ICON = {up:"↑", down:"↓", flat:""};

/* ---------- Habits / Prayer / Journal ---------- */
/* ---------- Jamoa ----------

   A report about two people, and it has to read like one. The earlier
   version stacked every number in a grid and lost the point somewhere in the
   middle of it; this reads top to bottom in the order the question is
   actually asked: who is in this, what is left today, how each of you is
   doing, and only then the periods.

   Names, never "you". "Siz 2/9" is a form field; "Ernest 2/9" beside
   "Gulyora 3/9" is two people, which is what this screen is about. */

/* Which colour a percentage is shown in. Mirrors `services.score_band`. */
function bandOf(percent){
  if(percent === null || percent === undefined) return "none";
  if(percent >= 85) return "great";
  if(percent >= 65) return "good";
  if(percent >= 40) return "fair";
  return "low";
}

/* A change, coloured and signed. Nothing at all when there is no previous
   period to compare with — a first week has no "last week", and "+100%"
   would be a flattering lie. */
function teamDelta(delta){
  if(delta === null || delta === undefined) return "";
  const tone = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
  const sign = delta > 0 ? "▲ +" : delta < 0 ? "▼ −" : "= ";
  return `<span class="delta ${tone}">${sign}${Math.abs(delta)} ${t("pts")}</span>`;
}

/* One person's line: name, bar, percentage, and how it moved. */
function memberLine(row, opts){
  const pct = row.percent === null || row.percent === undefined ? 0 : row.percent;
  const band = bandOf(row.percent);
  return `<div style="margin-top:${opts?.tight ? 8 : 12}px">
      <div class="row" style="padding:0 0 4px">
        <div class="grow ellipsis"><b>${esc(row.name)}</b></div>
        ${opts?.tight ? "" : teamDelta(row.delta)}
        <div style="width:52px;text-align:right">
          <b class="band-${band}">${
            row.percent === null || row.percent === undefined
              ? "—" : row.percent + "%"}</b></div>
      </div>
      <div class="bar"><i class="band-${band}" style="width:${pct}%"></i></div>
      ${opts?.hideCount ? "" :
        `<div class="muted sm">${row.done}/${row.total}</div>`}
    </div>`;
}

SCREENS.team = () => {
  const teams = state.team?.teams || [];
  if(!teams.length) return `
    <div class="head"><div class="grow"><h1>${t("team")}</h1></div></div>
    <div class="card" style="text-align:center;padding:28px 18px">
      <div class="state-ico">${icon("users", 26)}</div>
      <h3 style="margin:8px 0 6px">${t("team_empty_title")}</h3>
      <p class="muted" style="margin:0 0 16px">${t("team_empty")}</p>
      <button class="btn" data-act="team-new">${t("team_new")}</button>
      <div class="t3 tiny" style="margin-top:12px">${t("team_join_hint")}</div>
    </div>`;

  const team = teamCurrent();
  const board = team.board || {};
  const tab = state.teamTab || "today";
  const pick = teams.length > 1 ? `
    <div class="tabs" role="tablist">${teams.map(x => `
      <div class="tab ${x.id === team.id ? "on" : ""}" role="tab" tabindex="0"
           aria-selected="${x.id === team.id}"
           data-act="team-pick" data-id="${x.id}">${esc(x.name)}</div>`).join("")}
    </div>` : "";

  let h = `
    <div class="head">
      <div class="grow"><h1>${esc(team.name)}</h1>
        <div class="muted sm">${(team.members || []).map(m => esc(m.name)
          + (m.role === "owner" ? " 👑" : m.role === "admin" ? " ⭐" : "")).join(" · ")}</div></div>
      <button class="ghost" data-act="team-menu" data-id="${team.id}"
              aria-label="${t("settings")}">⋯</button>
      <button class="iconbtn add" data-act="team-add" data-kind="task"
              aria-label="${t("team_add_task")}">${icon("plus", 22)}</button>
    </div>
    ${pick}`;

  if(team.ownership_offer) h += `<div class="banner">
      <div class="grow">${t("owner_offer", {name: esc(team.name)})}</div>
      <button class="btn sm" data-act="team-owner-answer" data-value="1">${t("accept")}</button>
      <button class="btn sm secondary" data-act="team-owner-answer" data-value="0">${t("decline")}</button>
    </div>`;
  if(team.requests) h += `<div class="banner" data-act="team-menu" role="button" tabindex="0">
      ${icon("user", 16)} <div class="grow">${t("requests_title")} · ${team.requests}</div>${icon("chevron", 15)}</div>`;

  h += `<div class="seg" role="tablist" style="margin:12px 0">
      ${TEAM_TABS.map(([id, key]) => `<div class="${tab === id ? "on" : ""}" role="tab"
        tabindex="0" aria-selected="${tab === id}" data-act="team-tab"
        data-tab="${id}">${t(key)}</div>`).join("")}</div>`;

  if(tab === "work") return h + teamWorkTab(team, board);
  if(tab === "results") return h + teamResultsTab(team, board);
  return h + teamTodayTab(team, board);
};

/* Bugun · Ishlar · Natija — what is left today, the work itself, and how it
   went. One long scroll put the periods above the tasks and the tasks under
   three cards of numbers; three tabs keep each question on its own page. */
const TEAM_TABS = [["today", "team_tab_today"], ["work", "team_tab_work"],
                   ["results", "team_tab_results"]];

/* "5 ta ish · 10 ta tasdiq · 9 tasi qolgan" — three numbers that can be
   counted by hand, instead of a percentage of nobody knows what (#25). */
function teamUnits(units){
  if(!units || !units.items) return t("team_nothing");
  return t("team_units", {items: units.items, confirmations: units.confirmations,
                          left: units.left});
}

function teamTodayTab(team, board){
  const todayRows = board.periods?.day || [];
  const pairDone = todayRows.reduce((n, r) => n + r.done, 0);
  const pairTotal = todayRows.reduce((n, r) => n + r.total, 0);
  const pairPct = pairTotal ? Math.round(pairDone / pairTotal * 100) : null;
  const head = `<div class="card">
      <div class="row" style="padding:0 0 10px">
        <div class="grow">
          <div class="card-t" style="margin:0">${t("team_today")}</div>
          <div class="muted sm">${teamUnits(board.units)}</div>
        </div>
        <b class="band-${bandOf(pairPct)}" style="font-size:30px">${
          pairPct === null ? "—" : pairPct + "%"}</b>
      </div>
      ${todayRows.map(r => memberLine(r, {tight:true})).join("")}
    </div>`;

  // What is still open today, each with your own box when it is yours.
  const me = state.me?.telegram_id;
  const nameOf = id => esc((board.members || []).find(m => m.user_id === id)?.name || "?");
  const full = x => ((x.kind === "task" ? team.tasks : team.habits) || [])
      .find(r => r.id === x.id)
    || {...x, owed: (x.missing || []).includes(me) || (x.done_by || []).includes(me),
        done: (x.done_by || []).includes(me)};
  const open = (board.open || []).map(x => `<div class="row" style="padding:6px 0">
      ${teamBox({...full(x), mirrored: x.mirrored}, x.kind)}
      <div class="grow">${icon(x.kind === "task" ? "list" : "check", 15)} ${esc(x.title)}
        ${full(x).done ? `<div class="muted sm">${t("team_you_done")}</div>` : ""}
        ${(x.missing || []).length ? `<div class="muted sm">${t("team_waiting_on")}: ${
          (x.missing || []).map(nameOf).join(" · ")}</div>` : ""}</div>
    </div>`).join("");
  const done = (board.done || []).map(x => `
    <div class="row" style="opacity:.55;padding:4px 0">
      <span class="itile sm">${icon("check", 13)}</span>
      <div class="grow done">${esc(x.title)}</div>
    </div>`).join("");
  const work = `<div class="card">
      <div class="row" style="padding:0 0 6px">
        <div class="card-t grow" style="margin:0">${t("team_left_today")}</div>
        <span class="muted sm">${board.open_count || 0}</span>
      </div>
      ${open || `<div class="muted">${t("team_all_clear")}</div>`}
      ${done}
    </div>`;

  /* The team's own dates, when it has any. Adding one is on Tasks → Taqvim,
     with the rest of the planning; this tab is about today. */
  const cds = team.countdowns || [];
  const countdowns = cds.length
    ? sectionHead("tone-4", "hourglass", t("date_cd"),
        `<span class="act" data-act="cd-add" data-team="${team.id}">${icon("plus", 15)}
           ${t("add")}</span>`) + countdownRows(cds)
    : "";
  return head + work + countdowns;
}

function teamWorkTab(team, board){
  return `<div class="card">
      <div class="card-t">${t("team_tasks")}</div>
      ${(team.tasks || []).map(x => sharedRow(x, "task", x.title, board, team)).join("")
        || `<div class="muted">${t("team_nothing")}</div>`}
      <button class="btn secondary" data-act="team-add" data-kind="task"
              style="margin-top:10px">+ ${t("team_add_task")}</button>
    </div>
    <div class="card">
      <div class="card-t">${t("team_habits")}</div>
      ${(team.habits || []).map(x => sharedRow(x, "habit", x.name, board, team)).join("")
        || `<div class="muted">${t("team_nothing")}</div>`}
      <button class="btn secondary" data-act="team-add" data-kind="habit"
              style="margin-top:10px">+ ${t("team_add_habit")}</button>
    </div>
    ${teamProjectsBlock(team)}`;
}

function teamResultsTab(team, board){
  const periods = ["day", "week", "month"].map(key => {
    const rows = board.periods?.[key] || [];
    const gotDone = rows.reduce((n, r) => n + r.done, 0);
    const gotTotal = rows.reduce((n, r) => n + r.total, 0);
    const pct = gotTotal ? Math.round(gotDone / gotTotal * 100) : null;
    const delta = rows.map(r => r.delta).filter(d => d !== null && d !== undefined);
    const avg = delta.length
      ? Math.round(delta.reduce((a, b) => a + b, 0) / delta.length) : null;
    const label = {day: t("team_p_day"), week: t("team_p_week"),
                   month: t("team_p_month")}[key];
    return `<div class="row">
        <div class="grow">${label}</div>
        <div class="muted sm" style="width:58px;text-align:right">${gotDone}/${gotTotal}</div>
        ${teamDelta(avg)}
        <div style="width:50px;text-align:right">
          <b class="band-${bandOf(pct)}">${pct === null ? "—" : pct + "%"}</b></div>
      </div>`;
  }).join("");
  /* Week and month side by side, one row: each member's result in both. */
  const cols = ["week", "month"].map(key => {
    const rows = board.periods?.[key] || [];
    if(!rows.length) return "";
    return `<div class="card"><div class="card-t">${
      t(key === "week" ? "team_p_week" : "team_p_month")}</div>
      ${rows.map(r => memberLine(r, {tight: true})).join("")}</div>`;
  }).filter(Boolean);
  const members = cols.length ? `<div class="tcols">${cols.join("")}</div>` : "";
  const log = state.teamActivity?.[team.id];
  if(!log) loadTeamActivity(team.id);
