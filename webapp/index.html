<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ErnestOS</title>

<style>
/* ===================================================================
   Themes. Each one sets a full palette — background, surfaces, accent
   and the three habit-tier colours — so switching theme restyles the
   whole app, not just the buttons.
   =================================================================== */
:root{
  --bg:#0b1220; --bg2:#0e1729; --surface:#141f33; --raised:#1b2942;
  --border:#233350; --text:#e9eef7; --muted:#8496b3;
  --accent:#3b82f6; --accent2:#60a5fa; --accent-soft:#16294a; --on-accent:#fff;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  --tier1:#ef4444; --tier2:#f59e0b; --tier3:#22c55e;
  --r:16px; --shadow:0 8px 24px rgba(0,0,0,.28);
}
[data-theme="emerald"]{
  --bg:#071612; --bg2:#0a1f19; --surface:#0f2a22; --raised:#14372c;
  --border:#1d4a3a; --accent:#10b981; --accent2:#34d399; --accent-soft:#0b3a2c;
  --tier1:#f43f5e; --tier2:#fbbf24; --tier3:#34d399;
}
[data-theme="obsidian"]{
  --bg:#000; --bg2:#0a0a0c; --surface:#121215; --raised:#1a1a1f;
  --border:#2a2a32; --accent:#e5e7eb; --accent2:#f9fafb; --accent-soft:#232329;
  --on-accent:#000; --tier1:#f87171; --tier2:#fbbf24; --tier3:#4ade80;
}
[data-theme="rose"]{
  --bg:#180810; --bg2:#210b16; --surface:#2c101d; --raised:#3a1526;
  --border:#4d1e33; --accent:#f43f5e; --accent2:#fb7185; --accent-soft:#4a1224;
  --tier1:#fb7185; --tier2:#fbbf24; --tier3:#34d399;
}
[data-theme="pink"]{
  --bg:#17081a; --bg2:#200b24; --surface:#2b0f31; --raised:#391441;
  --border:#4d1c56; --accent:#ec4899; --accent2:#f472b6; --accent-soft:#45123f;
  --tier1:#fb7185; --tier2:#fbbf24; --tier3:#34d399;
}
[data-theme="aurora"]{
  --bg:#0b0a1f; --bg2:#120f2e; --surface:#191540; --raised:#221c55;
  --border:#2f2870; --accent:#8b5cf6; --accent2:#c084fc; --accent-soft:#2a1f5c;
  --tier1:#f472b6; --tier2:#facc15; --tier3:#22d3ee;
}
/* Light appearance for every theme */
@media (prefers-color-scheme: light){
  :root[data-appearance="auto"]{
    --bg:#f5f8fd; --bg2:#eef4fb; --surface:#fff; --raised:#f2f6fc;
    --border:#dfe7f2; --text:#101a2b; --muted:#64748b; --accent-soft:#e8f1ff;
    --shadow:0 6px 20px rgba(16,26,43,.08);
  }
}
:root[data-appearance="light"]{
  --bg:#f5f8fd; --bg2:#eef4fb; --surface:#fff; --raised:#f2f6fc;
  --border:#dfe7f2; --text:#101a2b; --muted:#64748b; --accent-soft:#e8f1ff;
  --shadow:0 6px 20px rgba(16,26,43,.08);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 340px);
  background-attachment:fixed;
  color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
#app{padding:18px 16px 10px;max-width:660px;margin:0 auto}

h1{font-size:23px;font-weight:750;letter-spacing:-.5px}
h2{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:1.1px;
   color:var(--muted);margin:24px 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}

.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
        font-weight:750;font-size:17px;color:var(--on-accent);
        background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow)}
.gear{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
      background:var(--raised);border:1px solid var(--border);font-size:17px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.quote{background:linear-gradient(135deg,var(--accent-soft),var(--surface));
       border-color:var(--accent-soft)}

.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;min-height:54px}
.item .meta{font-size:12px;color:var(--muted);margin-top:3px}
.item.tier1{border-left:3px solid var(--tier1)}
.item.tier2{border-left:3px solid var(--tier2)}
.item.tier3{border-left:3px solid var(--tier3)}

.check{width:25px;height:25px;border-radius:8px;border:2px solid var(--border);flex:none;
       display:grid;place-items:center;font-size:14px;transition:.15s}
.check.on{background:var(--ok);border-color:var(--ok);color:#04140a}
.check.lock{opacity:.45}

.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);
     border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:650;
     cursor:pointer;min-height:46px;width:100%;box-shadow:var(--shadow)}
.btn.ghost{background:var(--raised);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;min-height:40px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.icon-btn{padding:6px 9px;border-radius:9px;background:var(--raised);
          border:1px solid var(--border);font-size:13px;flex:none}

input,textarea,select{width:100%;background:var(--raised);border:1px solid var(--border);
  color:var(--text);border-radius:12px;padding:12px 13px;font:inherit;min-height:46px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;
      text-transform:uppercase;letter-spacing:.7px}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--raised);
      border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:13px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pills{display:flex;gap:7px;flex-wrap:wrap}

.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex:none}
.theme-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
           background:var(--raised);border:1px solid var(--border);margin-bottom:7px}
.theme-row.on{border-color:var(--accent)}

.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.p-high{background:var(--danger)} .p-medium{background:var(--warn)} .p-low{background:var(--ok)}

.bar{height:7px;background:var(--raised);border-radius:4px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;border-radius:4px;
          background:linear-gradient(90deg,var(--accent),var(--accent2))}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .card{text-align:center;padding:13px 8px;margin:0}
.stat .v{font-size:21px;font-weight:750}
.stat .k{font-size:11px;color:var(--muted);margin-top:2px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10px;color:var(--muted);padding:4px 0;font-weight:700}
.cal-day{aspect-ratio:1;border-radius:10px;background:var(--raised);border:1px solid transparent;
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         font-size:12px;position:relative;gap:2px}
.cal-day.empty{background:transparent}
.cal-day.today{border-color:var(--accent);font-weight:750;color:var(--accent)}
.cal-day.has{cursor:pointer}
.cal-dots{display:flex;gap:2px;height:4px}
.cal-dots i{width:4px;height:4px;border-radius:50%}
.k-task{background:var(--accent)} .k-project{background:var(--warn)}
.k-goal{background:var(--tier3)} .k-birthday{background:var(--tier1)}

nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
    background:var(--surface);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav button{background:0;border:0;color:var(--muted);padding:10px 4px 11px;font-size:10px;
           font-weight:650;cursor:pointer;display:grid;gap:3px;justify-items:center;min-height:58px}
nav button.on{color:var(--accent)}
nav .ic{font-size:19px}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;z-index:50}
.sheet.show{display:flex}
.sheet-inner{background:var(--surface);width:100%;max-width:660px;margin:0 auto;
             border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom));
             max-height:90vh;overflow-y:auto;border-top:1px solid var(--border)}
.sheet h3{font-size:17px;margin-bottom:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--raised);
       border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:12px;
       z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;font-size:14px}
.toast.show{opacity:1}

.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:r .7s linear infinite;margin:40px auto}
@keyframes r{to{transform:rotate(360deg)}}
.chart{width:100%;height:170px;display:block}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{width:10px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;
          vertical-align:middle}
</style>
</head>

const state = {
  screen:"home", tab:"habits", taskTab:"open", visionTab:"active",
  statsPeriod:"week", lang:"uz", appearance:"auto",

const t = k => (DICT[state.lang] || DICT.uz)[k] ?? k;
const esc = s => String(s ?? "").replace(/[<>&"']/g,
  c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
function setState(patch){ Object.assign(state, patch); render(); }

/* ---------- api ---------- */
async function api(path, options = {}){
  const res = await fetch(path, {
    ...options,
    headers:{"Content-Type":"application/json",
             "X-Telegram-Init-Data": tg?.initData || "", ...(options.headers||{})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if(!res.ok){
    const err = new Error("http_" + res.status);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

/* ---------- ui helpers ---------- */
let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1900);
}
const haptic = s => tg?.HapticFeedback?.impactOccurred?.(s || "light");
function openSheet(html){
  document.getElementById("sheet-body").innerHTML = html;
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){ document.getElementById("sheet").classList.remove("show"); }
document.getElementById("sheet").addEventListener("click", e => {
  if(e.target.id === "sheet") closeSheet();
});
const bar = p => `<div class="bar"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></div>`;

/* ---------- line chart (inline SVG, no libraries) ---------- */
function lineChart(series, keys){
  if(!series.length) return `<div class="empty">${t("empty")}</div>`;
  const W = 320, H = 150, PAD = 22;
  const stepX = series.length > 1 ? (W - PAD*2) / (series.length - 1) : 0;
  const y = v => H - PAD - (v / 100) * (H - PAD*2);

  const grid = [0, 50, 100].map(v =>
    `<line x1="${PAD}" y1="${y(v)}" x2="${W-PAD}" y2="${y(v)}"
       stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`).join("");

  const paths = keys.map(k => {
    const pts = series.map((p, i) => `${PAD + i*stepX},${y(p[k.field])}`);
    const dots = series.map((p, i) =>
      `<circle cx="${PAD + i*stepX}" cy="${y(p[k.field])}" r="2.5" fill="${k.color}"/>`).join("");
    return `<polyline points="${pts.join(" ")}" fill="none" stroke="${k.color}"
              stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");

  const every = Math.ceil(series.length / 6);
  const labels = series.map((p, i) => i % every === 0
    ? `<text x="${PAD + i*stepX}" y="${H-6}" font-size="9" fill="var(--muted)"
         text-anchor="middle">${p.label}</text>` : "").join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${grid}${paths}${labels}</svg>
    <div class="legend">${keys.map(k =>
      `<span><i style="background:${k.color}"></i>${k.label}</span>`).join("")}</div>`;
}

/* ---------- calendar ---------- */
function calendarBlock(){
  const c = state.calendar;
  if(!c) return `<div class="card"><div class="spin"></div></div>`;

  const dows = DICT[state.lang].dow.map(d => `<div class="cal-dow">${d}</div>`).join("");
  let cells = "";
  for(let i = 0; i < c.first_weekday; i++) cells += `<div class="cal-day empty"></div>`;

  for(let day = 1; day <= c.days_in_month; day++){
    const iso = `${c.year}-${String(c.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const events = c.events[iso] || [];
    const kinds = [...new Set(events.map(e => e.kind))].slice(0, 4);
    cells += `<div class="cal-day ${iso===c.today?"today":""} ${events.length?"has":""}"
      ${events.length?`data-act="cal-day" data-date="${iso}"`:""}>
      <span>${day}</span>
      <span class="cal-dots">${kinds.map(k=>`<i class="k-${k}"></i>`).join("")}</span></div>`;
  }

  return `<div class="card">
    <div class="cal-head">
      <div class="icon-btn" data-act="cal-prev">‹</div>
      <b>${DICT[state.lang].months[c.month-1]} ${c.year}</b>
      <div class="icon-btn" data-act="cal-next">›</div>
    </div>
    <div class="cal-grid">${dows}${cells}</div>
  </div>`;
}

  if(state.error)        app.innerHTML = `<div class="empty">${esc(state.error)}</div>`;

  else                   app.innerHTML = (SCREENS[state.screen] || SCREENS.home)();

/* ---------- loading ---------- */
async function loadScreen(screen){
  try{
    if(screen === "home"){
      const [home, calendar] = await Promise.all([api("/api/home"), api("/api/calendar")]);
      setState({home, calendar});
    } else if(screen === "habits"){
      const [habits, prayer, journal] = await Promise.all([
        api("/api/habits"), api("/api/prayers"), api("/api/journal?day=" + todayISO()),
      ]);
      setState({habits, prayer, journal: journal.entry,
                journalQuestions: journal.questions});
      if(state.tab === "stats") await loadStats(state.statsPeriod);
    } else if(screen === "tasks"){
      const [tasks, projects] = await Promise.all([api("/api/tasks?days=7"), api("/api/projects")]);
      setState({tasks, projects: projects.projects});
      if(state.taskTab === "done") setState({tasksDone:(await api("/api/tasks/done")).tasks});
    } else if(screen === "vision"){
      setState({goals: await api("/api/goals")});
      if(state.visionTab === "done") setState({goalsDone:(await api("/api/goals/done")).goals});
    }
  }catch(e){ handleError(e); }
}

async function loadStats(period){
  try{ setState({stats: await api("/api/stats?period=" + period), statsPeriod: period}); }
  catch(e){ handleError(e); }
}

const todayISO = () => state.home?.date || new Date().toISOString().slice(0,10);

function handleError(e){
  console.error("ErnestOS:", e);
  if(e.status === 403){ setState({error:t("sub_required"), loading:false}); return; }
  toast(e.status ? t("error") : t("offline"));
}

  "habit-add": () => openSheet(`
    <h3>${t("add_habit")}</h3>
    <input id="habit-name" placeholder="${t("habit_name")}" />
    <label>${t("category")}</label>
    <select id="habit-cat">
      <option value="non_negotiable">🔴 ${t("non_negotiable")}</option>
      <option value="target" selected>🟡 ${t("target")}</option>
      <option value="bonus">🟢 ${t("bonus")}</option>
    </select>
    <button class="btn" data-act="habit-save" style="margin-top:14px">${t("save")}</button>
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`),
  "habit-save": () => {
    const name = document.getElementById("habit-name").value.trim();
    if(!name) return;
    const category = document.getElementById("habit-cat").value;
    save(() => api("/api/habits", {method:"POST", body:{name, category}}), "habits");
  },
  "habit-delete": el => confirmSheet("habit-delete-go", el.dataset.id),
  "habit-delete-go": el => save(() => api(`/api/habits/${el.dataset.id}`, {method:"DELETE"}),
                                "habits", false, t("deleted")),

  /* prayer */
  prayer: el => { haptic(); save(() => api("/api/prayers", {method:"POST",
    body:{prayer:el.dataset.prayer, status:el.dataset.status}}), "habits", true); },
  excused: () => { haptic(); save(() => api("/api/prayers/excused",
    {method:"POST", body:{excused: !state.prayer?.excused}}), "habits", true); },

  /* journal */
  "journal-save": () => {
    const answers = {};
    state.journalQuestions.forEach(q => {
      answers[q.id] = document.getElementById("jq-" + q.id).value;
    });
    save(() => api("/api/journal", {method:"POST", body:{answers}}), "habits");
  },
  "journal-history": async () => {
    try{ setState({journalHistory:(await api("/api/journal")).entries}); }
    catch(e){ handleError(e); }
  },
  "journal-open": async el => {
    try{
      const r = await api("/api/journal?day=" + el.dataset.day);
      openSheet(`<h3>${el.dataset.day}</h3>` +
        state.journalQuestions.map(q =>
          `<label>${esc(q.text)}</label><div class="card">${esc(r.entry?.answers?.[q.id] || "—")}</div>`).join("")
        + `<button class="btn ghost" data-act="close" style="margin-top:12px">${t("cancel")}</button>`);
    }catch(e){ handleError(e); }
  },

  /* weekly focus */
  "focus-add": () => openSheet(`
    <h3>${t("add_focus")}</h3>
    <input id="focus-title" placeholder="${t("focus_title")}" />
    <button class="btn" data-act="focus-save" style="margin-top:10px">${t("save")}</button>
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`),
  "focus-save": async () => {
    const title = document.getElementById("focus-title").value.trim();
    if(!title) return;
    try{ await api("/api/focus", {method:"POST", body:{title}});
         closeSheet(); toast(t("saved")); await loadScreen("home"); }
    catch(e){ closeSheet(); toast(e.status === 422 ? t("full") : t("error")); }
  },
  "focus-edit": el => openSheet(`
    <h3>${t("edit")}</h3>
    <input id="focus-title" value="${esc(el.dataset.title)}" />
    <button class="btn" data-act="focus-update" data-id="${el.dataset.id}"
            style="margin-top:10px">${t("save")}</button>
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`),
  "focus-update": el => {
    const title = document.getElementById("focus-title").value.trim();
    if(!title) return;
    save(() => api(`/api/focus/${el.dataset.id}`, {method:"PATCH", body:{title}}), "home");
  },
  "focus-toggle": el => { haptic();
    save(() => api(`/api/focus/${el.dataset.id}/toggle`, {method:"POST"}), "home", true); },
  "focus-delete": el => confirmSheet("focus-delete-go", el.dataset.id),
  "focus-delete-go": el => save(() => api(`/api/focus/${el.dataset.id}`, {method:"DELETE"}),
                                "home", false, t("deleted")),

  /* tasks */
  "task-done": el => { haptic();
    save(() => api(`/api/tasks/${el.dataset.id}`, {method:"PATCH", body:{status:"done"}}),
         state.screen, true); },
  "task-reopen": el => { haptic();
    save(() => api(`/api/tasks/${el.dataset.id}`, {method:"PATCH", body:{status:"waiting"}}),
         "tasks", true); },
  "task-open": el => {
    const all = [...(state.tasks?.overdue||[]), ...(state.tasks?.upcoming||[]),
                 ...(state.tasks?.undated||[]), ...(state.home?.tasks?.today||[]),
                 ...(state.home?.tasks?.overdue||[])];
    const task = all.find(x => String(x.id) === el.dataset.id);
    if(!task) return;
    const options = state.projects.map(p =>
      `<option value="${p.id}" ${p.id===task.project_id?"selected":""}>${esc(p.name)}</option>`).join("");
    openSheet(`
      <h3>${t("edit")}</h3>
      <input id="task-title" value="${esc(task.title)}" />
      <label>${t("task_desc")}</label>
      <textarea id="task-desc" placeholder="${t("task_desc")}">${esc(task.description||"")}</textarea>
      <label>${t("deadline")}</label>
      <input type="date" id="task-deadline" value="${task.deadline||""}" />
      <label>${t("priority")}</label>
      <select id="task-priority">
        ${["high","medium","low"].map(p =>
          `<option value="${p}" ${task.priority===p?"selected":""}>${t(p)}</option>`).join("")}
      </select>
      <label>${t("project")}</label>
      <select id="task-project"><option value="">${t("standalone")}</option>${options}</select>
      <button class="btn" data-act="task-update" data-id="${task.id}"
              style="margin-top:14px">${t("save")}</button>
      <button class="btn danger" data-act="task-delete-go" data-id="${task.id}"
              style="margin-top:8px">${t("delete")}</button>
      <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`);
  },
  "task-update": el => {
    const body = {
      title: document.getElementById("task-title").value.trim(),
      description: document.getElementById("task-desc").value,
      deadline: document.getElementById("task-deadline").value || null,
      priority: document.getElementById("task-priority").value,
      project_id: Number(document.getElementById("task-project").value) || null,
    };
    if(!body.title) return;
    save(() => api(`/api/tasks/${el.dataset.id}`, {method:"PATCH", body}), state.screen);
  },
  "task-delete-go": el => save(() => api(`/api/tasks/${el.dataset.id}`, {method:"DELETE"}),
                               state.screen, false, t("deleted")),
  "task-add": () => {
    const options = state.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
    openSheet(`
      <h3>${t("add_task")}</h3>
      <input id="task-title" placeholder="${t("task_name")}" />
      <label>${t("task_desc")}</label>
      <textarea id="task-desc" placeholder="${t("task_desc")}"></textarea>
      <label>${t("deadline")}</label>
      <input type="date" id="task-deadline" />
      <label>${t("priority")}</label>
      <select id="task-priority">
        <option value="high">${t("high")}</option>
        <option value="medium" selected>${t("medium")}</option>
        <option value="low">${t("low")}</option></select>
      <label>${t("project")}</label>
      <select id="task-project"><option value="">${t("standalone")}</option>${options}</select>
      <button class="btn" data-act="task-save" style="margin-top:14px">${t("save")}</button>
      <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`);
  },
  "task-save": () => {
    const title = document.getElementById("task-title").value.trim();
    if(!title) return;
    save(() => api("/api/tasks", {method:"POST", body:{
      title,
      description: document.getElementById("task-desc").value,
      deadline: document.getElementById("task-deadline").value || null,
      priority: document.getElementById("task-priority").value,
      project_id: Number(document.getElementById("task-project").value) || null,
    }}), "tasks");
  },

  /* projects */
  "project-add": () => openSheet(`
    <h3>${t("add_project")}</h3>
    <input id="project-name" placeholder="${t("project_name")}" />
    <button class="btn" data-act="project-save" style="margin-top:10px">${t("save")}</button>
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`),
  "project-save": () => {
    const name = document.getElementById("project-name").value.trim();
    if(!name) return;
    save(() => api("/api/projects", {method:"POST", body:{name}}), "tasks");
  },
  "project-delete": el => confirmSheet("project-delete-go", el.dataset.id),
  "project-delete-go": el => save(() => api(`/api/projects/${el.dataset.id}`, {method:"DELETE"}),
                                  "tasks", false, t("deleted")),

  /* goals */
  "goal-add": () => openSheet(`
    <h3>${t("add_goal")}</h3>
    <input id="goal-title" placeholder="${t("goal_title")}" />
    <label>${t("level")}</label>
    <select id="goal-category">
      <option value="ultimate">👑 ${t("ultimate")}</option>
      <option value="milestone">🏆 ${t("milestone")}</option>
      <option value="tactical" selected>⚡ ${t("tactical")}</option></select>
    <button class="btn" data-act="goal-save" style="margin-top:14px">${t("save")}</button>
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`),
  "goal-save": () => {
    const title = document.getElementById("goal-title").value.trim();
    if(!title) return;
    save(() => api("/api/goals", {method:"POST",
      body:{title, category: document.getElementById("goal-category").value}}), "vision");
  },
  "goal-complete": el => { haptic();
    save(() => api(`/api/goals/${el.dataset.id}/complete`, {method:"POST"}), "vision", true); },
  "goal-reopen": el => { haptic();
    save(() => api(`/api/goals/${el.dataset.id}/reopen`, {method:"POST"}), "vision", true); },
  "goal-delete": el => confirmSheet("goal-delete-go", el.dataset.id),
  "goal-delete-go": el => save(() => api(`/api/goals/${el.dataset.id}`, {method:"DELETE"}),
                               "vision", false, t("deleted")),

  /* settings */
  "set-lang": el => { state.lang = el.dataset.value; settingSave({language:el.dataset.value}); },
  "set-gender": el => settingSave({gender:el.dataset.value}),
  "set-theme": el => settingSave({theme:el.dataset.value}),
  "set-appearance": el => {
    state.appearance = el.dataset.value;
    try{ localStorage.setItem("ernestos-appearance", el.dataset.value); }catch(_){}
    render(); openSheet(settingsSheet());
  },
};

function confirmSheet(action, id){
  openSheet(`<h3>${t("delete")}?</h3>
    <button class="btn danger" data-act="${action}" data-id="${id}"
            style="margin-top:12px">${t("delete")}</button>
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`);
}

async function shiftMonth(delta){
  const c = state.calendar;
  let year = c.year, month = c.month + delta;
  if(month < 1){ month = 12; year--; }
  if(month > 12){ month = 1; year++; }
  try{ setState({calendar: await api(`/api/calendar?year=${year}&month=${month}`)}); }
  catch(e){ handleError(e); }
}

async function save(request, reload, quiet, message){
  try{
    await request();
    closeSheet();
    if(!quiet) toast(message || t("saved"));
    if(reload) await loadScreen(reload);
  }catch(e){ closeSheet(); handleError(e); }
}

async function settingSave(patch){
  try{
    await api("/api/settings", {method:"POST", body:patch});
    const me = await api("/api/me");
    state.lang = me.language;
    setState({me});
    openSheet(settingsSheet());
    toast(t("saved"));
    await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

/* One delegated listener: rebuilt HTML never loses its handlers because the
   handler lives on document, not on the nodes. */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const action = A[el.dataset.act];
  if(action){ e.preventDefault(); action(el); }
});

/* ---------- boot ---------- */
(async function boot(){
  try{ state.appearance = localStorage.getItem("ernestos-appearance") || "auto"; }catch(_){}
  try{
    const me = await api("/api/me");
    state.lang = me.language || "uz";
    setState({me, loading:false});
    await loadScreen("home");
  }catch(e){
    console.error("ErnestOS boot failed:", e);
    setState({loading:false,
      error: e.status === 403 ? t("sub_required") : e.status ? t("error") : t("offline")});
  }
})();
</script>
