      ${t("close")}</button>`;
}

function headBlock(d){
  const initial = (d.name || "E").charAt(0).toUpperCase();
  /* Telegram already knows the user's photo and hands it to the Mini App in
     initData, so there is nothing to upload and nothing to ask for. The
     signed-blob endpoint stays as the fallback for an avatar that was sent
     to the bot before this existed. */
  const tgPhoto = tg?.initDataUnsafe?.user?.photo_url;
  const avatar = tgPhoto
    ? `<img src="${esc(tgPhoto)}" alt="" />`
    : state.me?.has_photo
      ? `<img src="/api/avatar?tgdata=${encodeURIComponent(tg?.initData || "")}" alt="" />`
      : esc(initial);

  let h = `
    <div class="head">
      <div class="grow">
        <h1 class="greet">${t("greet")}, ${esc(d.name)}</h1>
        <div class="t2 small row" style="margin-top:2px;gap:4px;display:inline-flex;
             cursor:pointer" data-act="calendar-open">
          ${esc(d.date_label)} ${icon("calendar", 14)}</div>
      </div>
      <button class="iconbtn" data-act="settings"
              aria-label="${t("settings")}">${icon("settings")}</button>
      <div class="avatar" aria-hidden="true">${avatar}</div>
    </div>`;

  // The quote is one quiet line, and an empty one is a link rather than an
  // empty card demanding to be filled.
  h += d.quote
    ? `<div class="t2 small wrap" data-act="quote"
            style="margin-top:var(--s2)">“${esc(d.quote)}”</div>`
    : `<div class="t3 tiny" data-act="quote"
            style="margin-top:var(--s1);text-decoration:underline">
         ${t("quote_add")}</div>`;

  // Returning after a break gets one offer, not a wall of red.
  const b = d.break;
  if(b && b.suggest_reset && !state.dismissedBreak){
    h += `<div class="card tight" style="margin-top:var(--s2)">
        <div class="row">
          <div class="grow"><b>${t("welcome_back")}</b>
            <div class="t2 tiny">${t("overdue_waiting", {n:b.overdue})}</div></div>
          <button class="btn sm secondary" data-act="fresh-start">
            ${t("recover")}</button>
          <button class="iconbtn sm bare" data-act="break-dismiss"
                  aria-label="${t("close")}">${icon("x", 15)}</button>
        </div></div>`;
  }
  return h;
}

/* ---------- the Now card ----------
   The single largest thing on Home, and the reason Home exists: it answers
   "what do I do at this moment?" without the user reading the screen and
   choosing. The answer is computed by the backend's fixed ladder — pinned
   mission, then anything late, then what is due today by time and priority,
   then a due habit, then prayers, then closing the day — so it changes on its
   own as the day moves, and two people with the same day get the same answer.

   It is a suggestion, not an instruction: the edit button opens the picker and
   pinning something overrides the ladder for the rest of the day. The one-line
   reason under the title is what makes that offer legible — a card that
   decides on the user's behalf owes them the sentence saying why. */
function nowBlock(d){
  const n = d.now || {kind:"clear", reason:"clear"};

  /* Everything the card needs to draw, per kind, in one place: the line to
     show, the tap target for finishing it, and whether it is a real task
     (which is the only kind that can be swapped for another). */
  const KINDS = {
    wake:    {title: t("now_wake"),    act:"wake"},
    prayer:  {title: t("now_prayer"),  act:"go-tab", data:'data-tab="prayer"'},
    journal: {title: t("now_journal"), act:"go-tab", data:'data-tab="journal"'},
    habit:   {title: n.title,          act:"habit-toggle-home"},
    task:    {title: n.title,          act:"task-done"},
  };
  const kind = KINDS[n.kind];

  const head = `<div class="row">
      <div class="grow eyebrow">${t("now")}</div>
      <button class="iconbtn sm bare" data-act="mission-pick"
              aria-label="${t("mission_change")}"
              style="color:inherit;opacity:.75">${icon("edit", 15)}</button>
    </div>`;

  // Nothing left. Not an empty state — a finished one, which is worth saying
  // plainly rather than showing a blank card with a plus in it.
  if(!kind){
    return `<div class="hero" style="margin-top:var(--s3)">
        ${head}
        <div style="font-size:18px;font-weight:600;margin-top:var(--s1)">
          ${t("now_clear")}</div>
        <div class="t2 small" style="margin-top:2px">${t("now_clear_hint")}</div>
      </div>`;
  }

  /* Why this one. Kept to a single short line: the value is in knowing the
     card did not pick at random, not in a paragraph of justification. */
  const REASONS = {pinned:"why_pinned", overdue:"why_overdue",
                   due_today:"why_due_today", habit:"why_habit",
                   wake:"why_wake", prayer:"why_prayer", evening:"why_evening"};
  const why = REASONS[n.reason];

  // Time and project, when the payload carries them. A high-priority task
  // says so; medium is what every task is born with and marking it would
  // mark everything.
  const meta = [];
  if(n.due_time) meta.push(`${icon("clock", 12)} ${esc(n.due_time)}`);
  else if(n.meta && n.kind !== "task") meta.push(esc(n.meta));
  if(n.priority === "high") meta.push(t("high"));
  if(n.project) meta.push(esc(n.project));

  return `<div class="hero" style="margin-top:var(--s3)">
      ${head}
      <div class="row" style="margin-top:var(--s1);align-items:flex-start">
        <div class="check" style="margin-top:2px"
             data-act="${kind.act}" ${kind.data || ""}
             ${n.id ? `data-id="${n.id}"` : ""}
             aria-label="${t("now_done")}">${icon("check", 14)}</div>
        <div class="grow">
          <div class="wrap" style="font-size:18px;font-weight:600;line-height:1.3">
            ${esc(kind.title)}</div>
          ${meta.length ? `<div class="t2 tiny row" style="margin-top:4px;gap:8px">
            ${meta.join(" · ")}</div>` : ""}
          ${why ? `<div class="t3 tiny" style="margin-top:4px">${t(why)}</div>` : ""}
        </div>
      </div></div>`;
}

/* ---------- the score block ----------
   Day, week and month on one card, at the same time, and nothing else on it.
   They used to sit behind a three-way switch, which meant the only comparison
   anybody actually wants — is today better or worse than the way I have been
   going? — required two taps and remembering the first number. Three cells
   answer it by being read.

   The three sit side by side on one line, not stacked, because that is the
   shape the comparison has: three numbers in the same units, read left to
   right. A percentage and its change against the previous window of the same
   length, and nothing else. The change is a colour *and* an arrow, so the
   direction survives a monochrome screen and a red/green colour blindness.

   What used to sit underneath — tasks, habits and prayer as three cells of
   this same card — is now three blocks of its own. Six numbers in one box is
   one object as far as the eye is concerned, and the whole point of those
   three is that they are three different things. */
function scoreBlock(d){
  const s = state.summary;
  const rows = [["day", t("period_day")], ["week", t("period_week")],
                ["month", t("period_month")]];

  /* Today comes from the Home payload, which is already loaded, so the block
     draws its most important cell immediately and fills the other two in when
     the summary arrives rather than showing three spinners. */
  const dayDelta = (d.overall.yesterday === null || d.overall.yesterday === undefined)
    ? null : d.overall.value - d.overall.yesterday;

  const line = ([id, label]) => {
    const w = s?.windows?.[id];
    const value = id === "day" ? d.overall.value : w?.overall;
    const delta = id === "day" ? dayDelta : w?.delta;
    const known = value !== undefined && value !== null;

    return `<div class="score-cell ${id === "day" ? "lead" : ""}">
        <div class="k">${label}</div>
        <div class="v num">${known ? value + "%" : "—"}${
          known ? deltaTag(delta || 0) : ""}</div>
      </div>`;
  };

  return `<div class="tinted block tone-2" style="margin-top:var(--s3)">
      <div class="bh" style="margin-bottom:var(--s2)">
        <span class="itile">${icon("chart", 17)}</span>
        <div class="grow"><div class="bt">${t("overall")}</div>
          <div class="t3 tiny">${t("overall_sub")}</div></div>
        <button class="iconbtn sm bare" data-act="overall-why"
                aria-label="${t("how_calculated")}">${icon("info", 17)}</button>
      </div>
      <div class="scores">${rows.map(line).join("")}</div>
    </div>`;
}

/* ---------- today, in three blocks ----------
   Tasks, habits and prayer: the three measurable parts of a day, each in its
   own tinted block, each opening the screen that owns it. They were three
   cells of the overall card, which made them look like a footnote to the
   percentage above them — they are not, they are the three things the
   percentage is made of, and they are also the three places a tap goes next.

   Each block carries a hue from the theme's palette rather than a shared
   grey, so the three read apart at a glance, and a bar under each so the
   ratio is visible without doing the division. */
function todayBlock(d){
  const c = d.overall.components;
  const focus = d.focus || {};
  const ratio = (done, total) => total ? Math.round(done / total * 100) : 0;
  const prayer = d.prayer.excused ? 100
    : ratio(d.prayer.performed, d.prayer.required);

  /* Four blocks, two by two. Each carries the weight it weighs in the score,
     because a screen that shows four equal-looking tiles behind an unequal
     formula is a screen that cannot be reconciled with its own headline. */
  const tile = (key, label, value, percent, act) => `
    <div class="tinted tile ${COMPONENT_TONE[key]}" ${act}>
      <div class="row" style="gap:var(--s1)">
        <span class="itile">${icon(COMPONENT_ICON[key], 17)}</span>
        <div class="grow"></div>
        <span class="wt num">${WEIGHTS[key]}%</span>
      </div>
      <div class="k ellipsis">${label}</div>
      <div class="v num">${value}</div>
      ${bar(percent)}
    </div>`;

  return `<h2>${t("today_parts")}</h2>
    <div class="tiles two">
      ${tile("tasks", t("tasks"), pct(c.tasks), c.tasks || 0,
             `data-act="nav" data-screen="tasks"`)}
      ${tile("habits", t("habits"), `${d.habits.done}/${d.habits.total}`,
             ratio(d.habits.done, d.habits.total),
             `data-act="go-tab" data-tab="habits"`)}
      ${tile("focus", t("week_focus"), `${focus.done || 0}/${focus.total || 0}`,
             ratio(focus.done, focus.total),
             `data-act="nav" data-screen="tasks"`)}
      ${tile("prayer", t("prayer"),
             d.prayer.excused ? "✓" : `${d.prayer.performed}/${d.prayer.required}`,
             prayer, `data-act="go-tab" data-tab="prayer"`)}
    </div>`;
}

/* The nominal weights, for display only. The score itself is computed on the
   server — there is no second copy of the formula here, and these numbers are
   read from the payload wherever the *applied* weight matters. */
const WEIGHTS = {tasks:40, habits:25, focus:20, prayer:15};

/* Today's work, grouped by the project it belongs to. */
function tasksBlock(d){
  const groups = d.tasks_today || [];
  /* Whatever the Now card is showing is already the largest thing on the
     screen; printing it again three inches lower is the same task twice. The
     backend drops the pinned ones, and the card can also be showing an
     unpinned task the ladder chose, so that one is dropped here. */
  const shownAbove = d.now?.kind === "task" ? d.now.id : (d.top3 || [])[0]?.id;
  const missionId = shownAbove;

  let h = `<h2>${t("today_tasks")}
      <span class="act" data-act="task-add">${icon("plus", 15)}
        ${t("add_task")}</span></h2>`;

  const rows = groups
    .map(g => ({...g, tasks: g.tasks.filter(x => x.id !== missionId)}))
    .filter(g => g.tasks.length);

  if(!rows.length){
    return h + `<div class="empty">${t("no_tasks_yet")}
      <button class="btn secondary sm" data-act="task-add">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  }

  return h + rows.map(group => `
    ${group.project
      ? `<div class="group">${icon("target", 13)} ${esc(group.project)}</div>`
      : `<div class="group">${esc(t("standalone"))}</div>`}
    ${group.tasks.map(x => taskRow(x, {hideProject: true, hideDate: true}))
                 .join("")}`).join("");
}

function calendarBlock(){
  const c = state.calendar;
  if(!c) return `<div class="card"><div class="spin"></div></div>`;
  const dows = D().dow.map(x => `<div class="cal-dow">${x}</div>`).join("");
  let cells = "";
  for(let i = 0; i < c.first_weekday; i++) cells += `<div class="cal-day empty"></div>`;
  for(let day = 1; day <= c.days_in_month; day++){
    const iso = `${c.year}-${String(c.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const events = c.events[iso] || [];
    const kinds = [...new Set(events.map(e => e.kind))].slice(0, 4);
    cells += `<div class="cal-day num ${iso === c.today ? "today" : ""}
      ${events.length ? "has" : ""}"
      ${events.length ? `data-act="day-open" data-date="${iso}"` : ""}>
      <span>${day}</span>
      <span class="cal-dots">${kinds.map(k => `<i class="k-${k}"></i>`).join("")}</span></div>`;
  }
  return `<div class="card">
    <div class="cal-head">
      <button class="iconbtn sm" data-act="cal-prev"
              aria-label="‹">${icon("back", 16)}</button>
      <b>${D().months[c.month - 1]} ${c.year}</b>
      <button class="iconbtn sm" data-act="cal-next"
              aria-label="›">${icon("chevron", 16)}</button>
    </div>
    <div class="cal-grid">${dows}${cells}</div></div>`;
}

/* Direction as a glyph as well as a colour, so it survives a monochrome
   screen. Read by both the Home score block and the Statistics header. */
const TREND_ICON = {up:"↑", down:"↓", flat:""};

/* ---------- Habits / Prayer / Journal ---------- */
SCREENS.habits = () => {
  const tabs = [["habits","habits"],["prayer","prayer"],["journal","journal"]];
  let h = `<h1>${t(state.tab)}</h1>
    <div class="seg" style="margin:12px 0 14px">
      ${tabs.map(([id, key]) => `<div class="${state.tab === id ? "on" : ""}"
        data-act="tab" data-tab="${id}">${t(key)}</div>`).join("")}
    </div>`;
  if(state.tab === "prayer") return h + prayerTab();
  if(state.tab === "journal") return h + journalTab();
  return h + habitsTab();
};

const TIERS = {non_negotiable:"t1", target:"t2", bonus:"t3"};

function habitsTab(){
  const data = state.habits;
  if(!data) return `<div class="spin"></div>`;

  if(state.reorderMode) return `<div class="t2 small"
      style="margin-bottom:10px">${t("reorder_hint")}</div>`
    + reorderList()
    + `<button class="btn" data-act="reorder-off"
         style="margin-top:14px">${t("finish")}</button>`;

  /* Today's habits and the streak, in one block at the top: the count is the
     thing being worked on and the streak is why it is worth working on, so
     they belong to each other rather than to two separate cards. */
  const due = data.habits.filter(x => x.due);
  const done = due.filter(x => x.done).length;
  const percent = due.length ? Math.round(done / due.length * 100) : 0;

  let h = `<div class="tinted block tone-5">
      <div class="bh">
        <span class="itile lg">${icon("check", 18)}</span>
        <div class="grow"><div class="bt">${t("today")}</div>
          <div class="t2 tiny">${done}/${due.length} · ${percent}%</div></div>
        ${data.streak ? `<div style="text-align:right">
          <div class="num" style="font-size:19px;font-weight:700">
            🔥 ${data.streak}</div>
          <div class="t3 tiny">${t("streak")}</div></div>` : ""}
      </div>
      <div style="margin-top:var(--s2)">${bar(percent)}</div>
    </div>`;

  // The wake-up control sits in the habit it belongs to, and it is a
  // real button rather than an instruction to go and use the chat.
  const anyDue = due.length > 0;

  /* One hue per tier, so the non-negotiable ones are visibly not the bonus
     ones — which is the entire distinction the three tiers exist to draw. */
  const TIER_TONE = {non_negotiable:"tone-1", target:"tone-5", bonus:"tone-3"};
  const TIER_ICON = {non_negotiable:"target", target:"up", bonus:"plus"};

  data.categories.forEach(cat => {
    const items = (data.grouped[cat] || []);
    if(!items.length) return;
    h += sectionHead(TIER_TONE[cat] || "tone-1", TIER_ICON[cat] || "check",
                     t(cat));
    h += items.map(x => habitRow(x, cat, data.wake)).join("");
  });

  if(!anyDue) h += `<div class="empty">${t("no_habits_today")}</div>`;

  // Editing, pausing and deleting a habit all live in the habit's own
  // sheet, one tap in. A screen-wide "delete mode" made removal as
  // prominent as ticking, and a mis-tap there costs every log the habit
  // ever had.
  h += `<div class="btns">
      <button class="btn" data-act="habit-add">
        ${icon("plus", 16)} ${t("add_habit")}</button>
      <button class="btn secondary" data-act="reorder-on">
        ${icon("drag", 16)} ${t("reorder")}</button>
    </div>`;
  return h;
}

function habitRow(x, cat, wake){
  if(x.paused){
    return `<div class="item ${TIERS[cat]} off">
        <div class="grow"><div class="ellipsis">${esc(x.name)}</div>
          <div class="meta">${t("paused")}</div></div>
        <button class="btn secondary sm" data-act="habit-resume" data-id="${x.id}">
          ${icon("play", 15)} ${t("resume")}</button></div>`;
  }

  const isWake = x.system_key === "wakeup";
  // A wake-up that has not happened yet gets the button; once it has, the
  // row shows the time it actually happened.
  const wakeBtn = isWake && wake && !wake.logged
    ? `<button class="btn sm" data-act="wake">☀️ ${t("wake_btn")}</button>` : "";
  const wakeMeta = isWake && wake && wake.logged
    ? (wake.done
        ? t("wake_done_at", {time: wake.at || wake.now})
        : t("wake_late_at", {time: wake.at || wake.now}))
    : isWake && x.target_time ? `${t("wake_target")} ${x.target_time}` : "";

  const meta = [];
  if(wakeMeta) meta.push(wakeMeta);
  else if(!x.due) meta.push(t("not_today"));
  // Each derived habit names the module it actually mirrors. Every one of
  // them used to say "from the Prayer section", so the journal habit sent
  // the reader to the wrong screen.
  else if(x.protected)
    meta.push(t(x.system_key === "journal" ? "habit_auto_journal"
                                           : "habit_auto_prayer"));
  if(x.remind_at) meta.push(`${icon("bell", 12)} ${x.remind_at}`);
  if(x.schedule !== "daily" && !isWake) meta.push(scheduleLabel(x));

  const box = !x.due
    ? `<div class="check lock" aria-hidden="true"></div>`
    : x.protected
      ? `<div class="check ${x.done ? "on" : ""} lock"
             data-act="auto-habit">${x.done ? icon("check", 14) : ""}</div>`
      : `<div class="check ${x.done ? "on" : ""}" data-act="habit-toggle"
             data-id="${x.id}">${icon("check", 14)}</div>`;

  return `<div class="item ${TIERS[cat]} ${x.due ? "" : "off"}">
      ${box}
      <div class="grow" data-act="habit-open" data-id="${x.id}">
        <div class="ellipsis">${esc(x.name)}</div>
        ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
      </div>
      ${wakeBtn || `<button class="iconbtn sm plain" data-act="habit-open"
          data-id="${x.id}" aria-label="${t("edit")}">${icon("chevron", 16)}</button>`}
    </div>`;
}

function scheduleLabel(x){
  if(x.schedule === "weekdays") return t("weekdays_only");
  if(x.schedule === "daily") return t("every_day");
  return (x.days || []).map(d => D().dow[d]).join(" ");
}

/* Reordering shows one flat list, not the three tiers: dragging between
   tiers would silently change a habit's category. The Up/Down buttons
   are not a fallback for the drag — they are the accessible way to do
   it, and they work with one thumb. */
function reorderList(){
  const items = state.habits?.habits || [];
  return items.map((x, i) => `
    <div class="item" data-drag-id="${x.id}" data-index="${i}">
      <div class="handle" aria-hidden="true"
           style="cursor:grab;touch-action:none;color:var(--text-3)">
        ${icon("drag", 18)}</div>
      <div class="grow ellipsis">${esc(x.name)}</div>
      <button class="iconbtn sm" data-act="habit-up" data-index="${i}"
              aria-label="${t("move_up")}" ${i === 0 ? "disabled" : ""}
              >${icon("up", 15)}</button>
      <button class="iconbtn sm" data-act="habit-down" data-index="${i}"
              aria-label="${t("move_down")}"
              ${i === items.length - 1 ? "disabled" : ""}>${icon("down", 15)}</button>
    </div>`).join("");
}

/* ---------- prayer ----------
   Five compact rows, not five decorated cards. Entering five prayers is
   a five-tap job and the UI should not make it feel like a form. */
function prayerTab(){
  const p = state.prayer;
  if(!p) return `<div class="spin"></div>`;

  // Gender is only asked here, only once, and only because the set of
  // statuses genuinely differs. The reason is on screen with the
  // question rather than buried in Settings.
  if(!state.me?.gender){
    return `<div class="card">
        <b>${t("ask_gender")}</b>
        <div class="t2 small" style="margin-top:4px">${t("ask_gender_why")}</div>
        <div class="btns">
          <button class="btn secondary" data-act="set-gender" data-value="male">
            ${t("male")}</button>
          <button class="btn secondary" data-act="set-gender" data-value="female">
            ${t("female")}</button>
        </div></div>`;
  }

  const ICON = {bomdod:"🌅", peshin:"☀️", asr:"🌤", shom:"🌆", xufton:"🌙"};
  const female = state.me?.gender === "female";
  let h = "";

  if(female){
    h += `<div class="item" data-act="excused" style="min-height:46px">
        <div class="check ${p.excused ? "on" : ""}">${icon("check", 14)}</div>
        <div class="grow">🌸 ${t("excused")}</div></div>`;
  }

  h += `<div class="card">`;
  ["bomdod","peshin","asr","shom","xufton"].forEach(name => {
    const cur = p.prayers[name];
    h += `<div class="prow">
        <div class="pn"><span>${ICON[name]}</span>
          <span class="ellipsis">${t(name)}</span></div>
        <div class="ps">${p.statuses.map(st =>
          `<div class="st ${st} ${cur === st ? "on" : ""}" data-act="prayer"
            data-prayer="${name}" data-status="${st}">${t(st)}</div>`).join("")}
          ${cur ? `<div class="st" data-act="prayer-clear" data-prayer="${name}"
            aria-label="${t("prayer_clear")}">${icon("x", 13)}</div>` : ""}
        </div></div>`;
  });
  h += `</div>`;

  /* Two numbers, never merged: how many were prayed, and how well they were
     prayed. Each in a block of its own — they are measured differently and
     merging them into one figure is how a five-out-of-five day and a
     five-late day end up looking the same. The bar tracks the first, because
     that is the one the `5x namoz` habit turns on. */
  const performed = Math.round(p.performed / p.required * 100);
  h += `<div class="tiles" style="margin-top:var(--s2)">
      <div class="tinted tile tone-3" style="grid-column:span 2">
        <span class="itile">${icon("moon", 17)}</span>
        <div class="k ellipsis">${t("performed")}</div>
        <div class="v num">${p.performed} / ${p.required}
          ${p.complete ? `<span class="delta up">✓</span>` : ""}</div>
        ${bar(performed)}
      </div>
      <div class="tinted tile tone-2">
        <span class="itile">${icon("chart", 17)}</span>
        <div class="k ellipsis">${t("score")}</div>
        <div class="v num">${p.score}/${p.max}</div>
      </div>
    </div>
    <div class="t2 small" style="margin-top:var(--s2)">
      ${p.complete ? `✓ ${t("full_day")}`
        : t("performed_of", {done:p.performed, total:p.required})}</div>`;
  return h;
}

/* ---------- journal ----------
   Not homework. Whatever is written is saved, the count is stated
   plainly, and nothing on this screen calls an unfinished entry a
   failure. Drafts survive Telegram being closed mid-sentence. */
function journalTab(){
  const entry = state.journal, questions = state.journalQuestions;
  if(!questions.length) return `<div class="spin"></div>`;
  const answers = entry?.answers || {};
  const draft = loadDraft();
  const answered = questions.filter(q =>
    String(draft[q.id] ?? answers[q.id] ?? "").trim()).length;

  let h = `<div class="row" style="margin-bottom:12px">
      <div class="grow small ${answered === questions.length ? "" : "t2"}">
        ${answered === questions.length ? `✓ ${t("journal_complete")}`
          : t("journal_progress", {done:answered, total:questions.length})}</div>
      <div class="t3 tiny" id="jsave"></div>
    </div>`;

  h += `<div class="t3 tiny" style="margin-bottom:10px">${t("journal_hint")}</div>`;

  questions.forEach((q, i) => {
    const value = draft[q.id] ?? answers[q.id] ?? "";
    h += `<label>${i + 1}. ${esc(q.text)}</label>
      <textarea id="jq-${q.id}" data-journal="${q.id}"
        style="min-height:72px">${esc(value)}</textarea>`;
  });

  // Mood is an optional one-tap check-in, not a mood diary. ErnestOS is
  // not a mental-health app and must not pretend to be one.
  const moods = [["awful","😞"],["low","😕"],["ok","😐"],["good","🙂"],["great","😄"]];
  h += `<label>${t("mood_q")} <span class="t3">(${t("optional")})</span></label>
    <div class="chips">${moods.map(([id, face]) =>
      `<div class="chip ${entry?.mood === id ? "on" : ""}" data-act="mood"
        data-value="${id}" aria-label="${t("mood_" + id)}"
        >${face}</div>`).join("")}</div>`;

  h += `<div class="btns">
      <button class="btn" data-act="journal-save">${t("save")}</button>
      <button class="btn secondary" data-act="journal-history">
        ${icon("book", 16)} ${t("journal_history")}</button></div>`;

  if(state.journalHistory){
    h += `<h2>${t("journal_history")}</h2>`;
    h += state.journalHistory.length ? state.journalHistory.map(e => `
      <div class="item" data-act="journal-open" data-day="${e.day}">
        <div class="grow"><div class="num small">${isoToLabel(e.day)}</div>
          <div class="meta">${esc(e.preview) || "—"}</div></div>
        <div class="t3 tiny">${e.complete ? "✓"
          : `${e.answered}/${e.total}`}</div>
      </div>`).join("") : `<div class="empty">${t("empty")}</div>`;
  }
  return h;
}

/* ---------- journal drafts ----------
   Telegram can be closed by a call, a swipe or the OS at any moment. A
   long entry lost to that is the fastest way to teach someone never to
   write a long entry again, so every keystroke goes to localStorage and
   the backend gets a debounced save. */
const draftKey = () => `ernestos-journal-${todayISO()}`;

function loadDraft(){
  try{ return JSON.parse(localStorage.getItem(draftKey()) || "{}"); }
  catch(_){ return {}; }
}
function saveDraft(id, value){
  try{
    const draft = loadDraft();
    draft[id] = value;
    localStorage.setItem(draftKey(), JSON.stringify(draft));
  }catch(_){}
}
function clearDraft(){
  try{ localStorage.removeItem(draftKey()); }catch(_){}
}

let journalTimer;
function onJournalInput(el){
  saveDraft(el.dataset.journal, el.value);
  const note = document.getElementById("jsave");
  if(note) note.textContent = t("autosaved");
  clearTimeout(journalTimer);
  // Debounced so a paragraph is one request, not one per keystroke.
  journalTimer = setTimeout(async () => {
    try{
      const body = {answers:{[el.dataset.journal]: el.value}};
      const r = await api("/api/journal", {method:"POST", body});
      if(note) note.textContent = "✓";
      state.journal = {...(state.journal || {}), answered:r.answered,
                       complete:r.complete,
                       answers:{...(state.journal?.answers || {}),
                                [el.dataset.journal]: el.value}};
    }catch(_){
      // The draft is already on disk, so a failed save is recoverable.
      if(note) note.textContent = "…";
    }
  }, 900);
}
document.addEventListener("input", e => {
  const el = e.target.closest("[data-journal]");
  if(el) onJournalInput(el);
});

/* ---------- Tasks ---------- */
/* Tasks, in four views of the same data rather than four lists.

     Asosiy / Main     what actually matters right now — the week's focus, the
                       tasks pinned to today, anything late, today's work, and
                       the month underneath it
     Ochiq / Open      the inbox: every open task, searchable and filterable
     Loyihalar/Projects each project's state — how far it is, how much is left
     Bajarilgan/Done   the archive

   The calendar sits at the foot of Main rather than behind a header button.
   It is the last thing on the screen because it answers the last question a
   planner asks — what is coming after today — and putting it there means the
   whole plan is one scroll instead of a screen plus a sheet. */
SCREENS.tasks = () => {
  const tabs = [["main", t("main_tab")], ["open", t("open_tab")],
                ["projects", t("projects")], ["done", t("done_tab")]];

  let h = `<div class="head">
      <h1 class="grow">${t("tasks")}</h1>
      <button class="iconbtn" data-act="task-add"
              aria-label="${t("add_task")}">${icon("plus")}</button>
    </div>
    <div class="seg" style="margin:12px 0 12px">
      ${tabs.map(([id, label]) => `<div class="${state.taskTab === id ? "on" : ""}"
        data-act="task-tab" data-tab="${id}">${label}</div>`).join("")}
    </div>`;

  if(state.taskTab === "done") return h + doneTab();
  if(state.taskTab === "open") return h + openTab();
  if(state.taskTab === "projects") return h + projectsTab();
  return h + mainTab();
};

/* A section heading that carries a hue, so the screen reads as a few
   labelled groups rather than one uninterrupted scroll. */
function sectionHead(tone, ic, label, action){
  return `<div class="sechead ${tone}">
      <span class="itile">${icon(ic, 16)}</span>
      <div class="lbl">${label}</div>
      ${action || ""}</div>`;
}

/* The first thing the Tasks screen shows, and deliberately not the whole
   list: the week's one goal, then everything today actually asks for, then
   the month. The complete inventory is one tab across for the moment when
   the inventory is the question. */
function mainTab(){
  const d = state.tasks;
  let h = weekFocusBlock();
  if(!d) return h + `<div class="spin"></div>`;

  const all = [...d.overdue, ...d.upcoming, ...d.undated, ...(d.later || [])];
  const today = todayISO();
  const pinned = all.filter(x => x.top3);
  const seen = new Set(pinned.map(x => x.id));
  const late = all.filter(x => x.overdue && !seen.has(x.id));
  late.forEach(x => seen.add(x.id));
  const now = all.filter(x => x.deadline === today && !seen.has(x.id));

  const section = (tone, ic, label, rows, opts) => rows.length
    ? sectionHead(tone, ic, label) + rows.map(x => taskRow(x, opts)).join("") : "";

  /* One hue per section, and the same hue for the same idea everywhere in the
     app: tasks are the first tone on Home and they are the first tone here. */
  const body = section("tone-5", "target", t("pinned_tasks"), pinned)
    + section("tone-4", "clock", t("overdue"), late)
    + section("tone-1", "list", t("due_today"), now, {hideDate: true});

  h += body || `<div class="empty">${t("nothing_today")}
      <button class="btn secondary sm" data-act="task-add"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;

  // The month, last: what is coming after today, once today has been read.
  h += sectionHead("tone-2", "calendar", t("calendar")) + calendarBlock();
  return h;
}

function searchBox(id, value, placeholder, action){
  return `<div class="row" style="margin:var(--s4) 0 var(--s2)">
      <div class="grow" style="position:relative">
        <input id="${id}" value="${esc(value)}" placeholder="${placeholder}"
               data-search="${action}" style="padding-left:38px" />
        <span style="position:absolute;left:12px;top:13px;color:var(--text-3)"
              >${icon("search", 17)}</span>
      </div>
      ${value ? `<button class="iconbtn" data-act="${action}-clear"
        aria-label="${t("clear")}">${icon("x", 16)}</button>` : ""}
    </div>`;
}

/* The week's focus lives here rather than on Home: it is a planning decision,
   and this is the planning screen. Home stays about today. */
function weekFocusBlock(){
  const focus = state.focus;
  if(!focus) return "";
  const primary = focus.primary;

  let h = sectionHead("tone-3", "target", t("week_focus"),
    focus.slots_free > 0 && primary
      ? `<span class="act" data-act="focus-add" data-slot="supporting">
           ${icon("plus", 14)} ${t("add_supporting")}</span>` : "");

  if(!primary){
    // One row, not a panel: the block printed "Add a main goal" as a line of
    // text and again on the button under it, and spent a third of the screen
    // on a section the user has not started. Unset, it is an invitation the
    // size of one line.
    return h + `<div class="item pressable" data-act="focus-add"
                     data-slot="primary" style="min-height:48px">
        ${icon("target", 17)}
        <div class="grow t2">${t("add_mission")}</div>
        ${icon("plus", 16)}</div>`;
  }

  h += `<div class="tinted block tone-3">
      <div class="row">
        <div class="check ${primary.done ? "on" : ""}" data-act="focus-toggle"
             data-id="${primary.id}">${icon("check", 14)}</div>
        <div class="grow" data-act="focus-open" data-id="${primary.id}"
             data-title="${esc(primary.title)}" data-priority="${primary.priority}"
             data-done="${primary.done ? 1 : 0}">
          <div class="eyebrow">${t("mission_main")}</div>
          <div class="wrap ${primary.done ? "strike" : ""}"
               style="font-size:16px;font-weight:600;margin-top:2px">
            ${esc(primary.title)}</div>
        </div>
        ${icon("chevron", 16)}
      </div></div>`;

  const extra = focus.supporting || [];
  if(extra.length){
    h += extra.map(row => `
      <div class="item" style="min-height:44px;margin-top:6px">
        <div class="check ${row.done ? "on" : ""}" style="width:21px;height:21px"
             data-act="focus-toggle" data-id="${row.id}"
             >${row.done ? icon("check", 12) : ""}</div>
        <div class="grow small wrap ${row.done ? "strike" : ""}"
             data-act="focus-open" data-id="${row.id}"
             data-title="${esc(row.title)}" data-priority="${row.priority}"
             data-done="${row.done ? 1 : 0}">${esc(row.title)}</div>
      </div>`).join("");
  }
  return h;
}

/* The inbox: every open task there is, in one place.
   Main answers "what now"; this one answers "what is there", so nothing is
   held back here — late, dated, undated and later, all of it, with a search
   box and three filters over the top. */
function openTab(){
  const d = state.tasks;
  const total = d ? [d.overdue, d.upcoming, d.undated, d.later || []]
    .reduce((n, rows) => n + rows.length, 0) : null;

  let h = `<div class="tinted block tone-2">
      <div class="bh">
        <span class="itile lg">${icon("inbox", 18)}</span>
        <div class="grow"><div class="bt">${t("inbox_zone")}</div>
          <div class="t2 tiny">${t("inbox_hint")}</div></div>
        <div class="num" style="font-size:22px;font-weight:700"
             >${total === null ? "—" : total}</div>
      </div></div>`;

  h += searchBox("task-q", state.taskQuery, t("search_tasks"), "task-search");

  /* Filters as chips rather than a menu: one tap to narrow, one to clear, and
     the active one visible without opening anything.

     Three, not seven. The list below is already grouped by horizon under its
     own headings — "this week" and "this month" were a second, competing way
     to say what the headings say, and a row of chips that scrolls sideways is
     a row where the last two are never found. High and low went with them:
     priority is visible on the row itself, and the two questions worth asking
     of a task list are "what is late" and "what has no date at all". */
  const filters = [["", t("all")], ["overdue", t("overdue")],
                   ["undated", t("no_date")]];
  h += `<div class="chips" style="margin-bottom:var(--s2)">
      ${filters.map(([id, label]) => `<div class="chip sm
        ${state.taskFilter === id ? "on" : ""}" data-act="task-filter"
        data-value="${id}">${label}</div>`).join("")}</div>`;

  if(!d) return h + `<div class="spin"></div>`;

  const f = state.taskFilter;

  /* One predicate, applied to every row, instead of a rule per section: a
     filter that behaves differently depending on which heading a task
     happens to sit under is a filter nobody can predict. */
  const keep = row => {
    if(!f) return true;
    if(f === "overdue") return row.overdue;
    if(f === "undated") return !row.deadline;
    return true;
  };

  const section = (tone, ic, label, rows) => {
    const items = (rows || []).filter(keep);
    return items.length
      ? sectionHead(tone, ic, `${label} · ${items.length}`)
        + items.map(taskRow).join("")
      : "";
  };

  let body = "";
  body += section("tone-4", "clock", t("overdue"), d.overdue);
  body += section("tone-1", "calendar", t("upcoming"), d.upcoming);
  body += section("tone-2", "inbox", t("no_date"), d.undated);
  body += section("tone-3", "list", t("later"), d.later || []);

  if(!body){
    h += (state.taskQuery || state.taskFilter)
      ? `<div class="empty">${t("no_results")}</div>`
      : `<div class="empty">${t("no_tasks_yet")}
          <button class="btn secondary sm" data-act="task-add"
                  style="margin:12px auto 0;display:flex">
            ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else h += body;

  return h;
}

function doneTab(){
  const g = state.tasksDone;
  let h = searchBox("done-q", state.doneQuery, t("search"), "done-search");
  if(!g) return h + `<div class="spin"></div>`;

  const section = (tone, label, rows) => rows.length
    ? sectionHead(tone, "check", `${label} · ${rows.length}`)
      + rows.map(doneRow).join("") : "";

  const body = section("tone-5", t("done_today"), g.today)
    + section("tone-2", t("done_week"), g.week)
    + section("tone-3", t("done_earlier"), g.earlier);

  return h + (body || `<div class="empty">${
    state.doneQuery ? t("no_results") : t("empty")}</div>`);
}

function doneRow(task){
  return `<div class="item" style="min-height:46px">
      <div class="check on" data-act="task-reopen" data-id="${task.id}"
           aria-label="${t("reopen")}">${icon("check", 14)}</div>
      <div class="grow"><div class="ellipsis strike">${esc(task.title)}</div>
        <div class="meta">${esc(task.project || t("standalone"))}
          ${task.recurrence ? `· ${icon("repeat", 12)}` : ""}</div></div>
    </div>`;
}

/* An overdue task gets four ways out instead of a red badge. Nothing on
   this row calls the user late; the actions are what a person actually
   needs at that moment. */
function taskRow(task, opts){
  const meta = [];
  // Under a project heading the name is already on screen; repeating it in
  // every row is noise that pushes the useful details off the line.
  if(task.project && !opts?.hideProject) meta.push(esc(task.project));
  // Same reasoning for the date under a heading that already says "today":
  // six rows each reading "13 August" beneath "Today's tasks" is a second
  // line of type per row that tells the reader nothing.
  if(task.deadline && !opts?.hideDate)
    meta.push(`<span class="num">${isoToLabel(task.deadline)}</span>`);
  if(task.due_time) meta.push(`<span class="num">${icon("clock", 12)} ${task.due_time}</span>`);
  if(task.recurrence) meta.push(icon("repeat", 12));
  if(task.remind_before !== null && task.remind_before !== undefined)
    meta.push(icon("bell", 12));

  /* Three, so they sit on one line. Four wrapped onto a second row and made
     every late task a 300px block; "this week" is the one a person reaches
     for least and it is still in the task's own sheet. */
  const quick = task.overdue ? `
      <div class="quick">
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="today">${t("when_today")}</div>
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="tomorrow">${t("when_tomorrow")}</div>
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="none">${t("when_none")}</div>
      </div>` : "";

  return `<div class="trow pri-${task.priority}">
      <div class="check" data-act="task-done" data-id="${task.id}"
           aria-label="${t("now_done")}">${icon("check", 14)}</div>
      <div class="grow">
        <div class="tt wrap" data-act="task-open" data-id="${task.id}">
          ${esc(task.title)}</div>
        ${meta.length ? `<div class="td">${meta.join(" · ")}</div>` : ""}
        ${quick}
      </div>
      <button class="iconbtn sm plain" data-act="task-top3" data-id="${task.id}"
              aria-label="${task.top3 ? t("top3_unpick") : t("top3_pick")}"
              >${task.top3 ? "★" : "☆"}</button>
    </div>`;
}

/* ---------- Projects ----------
   Its own tab, because a project is a different question from a task: not
   "what do I do next" but "where has this got to". It used to be a strip of
   name-and-percentage rows at the foot of the main list, which said how far
   each one was and nothing about what that meant — a project at 60% with two
   tasks left and one due Friday is a different object from a project at 60%
   with fourteen left, and the row drew them identically.

   The tab opens on the portfolio in one line — how many are running, how much
   work is still open across all of them, where they average — and then gives
   each project a block of its own carrying its progress, what is left, its
   deadline and its state. */
function projectsTab(){
  const list = state.projects || [];

  let h = sectionHead("tone-2", "folder", t("projects"),
    `<span class="act" data-act="project-add">${icon("plus", 14)}
       ${t("add_project")}</span>`);

  if(!list.length)
    return h + `<div class="empty">${t("no_projects")}
      <button class="btn secondary sm" data-act="project-add"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_project")}</button></div>`;

  const live = list.filter(p => p.status !== "done" && !p.archived);
  const open = list.reduce((n, p) => n + p.tasks_open, 0);
  const average = list.length
    ? Math.round(list.reduce((n, p) => n + p.progress, 0) / list.length) : 0;

  h = `<div class="tiles">
      <div class="tinted tile tone-2">
        <span class="itile">${icon("folder", 17)}</span>
        <div class="k ellipsis">${t("pr_active")}</div>
        <div class="v num">${live.length}</div></div>
      <div class="tinted tile tone-4">
        <span class="itile">${icon("list", 17)}</span>
        <div class="k ellipsis">${t("pr_open_tasks")}</div>
        <div class="v num">${open}</div></div>
      <div class="tinted tile tone-5">
        <span class="itile">${icon("chart", 17)}</span>
        <div class="k ellipsis">${t("pr_average")}</div>
        <div class="v num">${average}%</div>
        ${bar(average)}</div>
    </div>` + h;

  /* One hue per project, cycling the theme's palette, so a list of five reads
     as five things. The tone follows the position in the list rather than the
     id, which keeps it stable while the screen is open and never lands two
     neighbours on the same colour. */
  const TONES = ["tone-1", "tone-3", "tone-5", "tone-4", "tone-2"];

  return h + list.map((p, i) => {
    const done = p.status === "done";
    const state_tag = p.archived ? t("st_archived")
      : done ? t("st_done") : t("st_active");

    // What is actually left, in words. "60%" is a measurement; "4 ta qoldi"
    // is the thing somebody opens this screen to find out.
    const facts = [];
    facts.push(p.tasks_open
      ? t("pr_left", {n: p.tasks_open})
      : p.tasks_total ? t("pr_all_done") : t("pr_no_tasks"));
    if(p.deadline) facts.push(`${icon("calendar", 12)} ${isoToLabel(p.deadline)}`);

    return `<div class="tinted block ${TONES[i % TONES.length]}
                 ${done || p.archived ? "off" : ""}"
                 data-act="project-open" data-id="${p.id}">
        <div class="bh">
          <span class="itile lg">${icon("folder", 18)}</span>
          <div class="grow" style="min-width:0">
            <div class="bt ellipsis">${esc(p.name)}</div>
            <div class="t2 tiny row" style="gap:6px;margin-top:2px">
              ${facts.join(" · ")}</div>
          </div>
          <div style="text-align:right">
            <div class="num" style="font-size:19px;font-weight:700"
                 >${p.progress}%</div>
            <div class="t3 tiny num">${p.tasks_done}/${p.tasks_total}</div>
          </div>
          ${icon("chevron", 15)}
        </div>
        <div style="margin-top:var(--s2)">${bar(p.progress)}</div>
        ${done || p.archived
          ? `<div class="tag" style="margin-top:var(--s2)">${state_tag}</div>` : ""}
      </div>`;
  }).join("");
}

/* ---------- one project and the work inside it ---------- */
SCREENS.project = () => {
  const d = state.project;
  if(!d) return `<div class="spin"></div>`;
  const p = d.project;

  let h = `<div class="head">
      <button class="iconbtn" data-act="nav" data-screen="tasks"
              aria-label="${t("tasks")}">${icon("back")}</button>
      <h1 class="grow">${esc(p.name)}</h1>
      <button class="iconbtn" data-act="project-edit" data-id="${p.id}"
              aria-label="${t("edit")}">${icon("edit")}</button>
    </div>`;

  if(p.description)
    h += `<div class="t2 small wrap" style="margin-top:8px">${esc(p.description)}</div>`;

  // Progress in words as well as a percentage: "4 / 7" alone makes the
  // reader do the arithmetic.
  h += `<div class="card" style="margin-top:12px">
      <div class="row">
        <div class="grow">
          <div style="font-size:24px;font-weight:750" class="num">${p.progress}%</div>
          <div class="t2 small">${t("of_tasks", {done:p.tasks_done,
            total:p.tasks_total})}</div>
        </div>
        <div style="text-align:right">
          ${p.deadline ? `<div class="small num">${icon("calendar", 13)}
            ${isoToLabel(p.deadline)}</div>` : ""}
          <div class="tag" style="margin-top:5px">${
            p.archived ? t("st_archived")
              : p.status === "done" ? t("st_done") : t("st_active")}</div>
        </div>
      </div>${bar(p.progress)}</div>`;

  h += `<h2>${t("project_tasks")}
      <span class="act" data-act="task-add" data-project="${p.id}">
        ${icon("plus", 14)} ${t("add_task")}</span></h2>`;

  if(!d.tasks.length){
    h += `<div class="empty">${t("no_tasks_yet")}
      <button class="btn secondary sm" data-act="task-add" data-project="${p.id}"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else {
    const open = d.tasks.filter(x => x.status !== "done");
    const done = d.tasks.filter(x => x.status === "done");
    if(open.length) h += open.map(taskRow).join("");
    if(done.length){
      h += `<div class="group">${t("completed")} · ${done.length}</div>`;
      h += done.map(doneRow).join("");
    }
  }

  h += `<div class="btns">
      ${p.status === "done"
        ? `<button class="btn secondary" data-act="project-status" data-id="${p.id}"
             data-value="active">${t("mark_active")}</button>`
        : `<button class="btn secondary" data-act="project-status" data-id="${p.id}"
             data-value="done">${icon("check", 15)} ${t("mark_done")}</button>`}
      <button class="btn secondary" data-act="project-archive" data-id="${p.id}"
              data-value="${p.archived ? 0 : 1}">
        ${p.archived ? t("unarchive") : t("archive")}</button>
    </div>
    <button class="btn danger" data-act="project-delete" data-id="${p.id}"
            style="margin-top:8px">${icon("trash", 15)} ${t("delete")}</button>`;
  return h;
};

/* ---------- Statistics ----------
   Its own screen, loaded only when opened: Home never pays for chart
   history it does not show. Every number comes from the backend, from
   the same functions Home reads, so the two cannot disagree. */
SCREENS.stats = () => {
  const st = state.stats;
  if(!st) return `<h1>${t("stats")}</h1><div class="spin"></div>`;
  const today = st.today;

  /* Today against yesterday, as a number rather than as an arrow. The header
     used to draw a single ↑ next to the percentage, which said a direction and
     withheld the size — and the size is the whole question. Yesterday's own
     score is printed underneath, because "+12%" is only meaningful next to
     what it moved from. */
  const yesterday = today.yesterday;
  const known = yesterday !== null && yesterday !== undefined;
  const change = known ? today.overall - yesterday : null;
  const dir = !known || change === 0 ? "flat" : change > 0 ? "up" : "down";

  let h = `<h1>${t("stats")}</h1>
    <div class="hero" style="margin-top:14px" data-act="overall-why">
      <div class="row">
        <div class="grow eyebrow">${t("overall")} · ${t("today")}</div>
        <button class="iconbtn sm bare" style="color:inherit;opacity:.8"
                aria-label="${t("how_calculated")}">${icon("info", 17)}</button>
      </div>
      <div class="num" style="font-size:42px;font-weight:760;
           letter-spacing:-1.5px;line-height:1.02;margin-top:2px">
        ${today.overall}%</div>
      <div class="small wrap" style="margin-top:var(--s1)">
        ${known
          ? `<b>${TREND_ICON[dir] || ""}${change > 0 ? "+" : ""}${change}%</b>
             ${t("vs_yesterday")} <span class="t2">(${yesterday}%)</span>`
          : t("vs_yesterday_none")}</div>
      <div style="margin-top:var(--s2)">${bar(today.overall)}</div>
    </div>`;

  /* The three parts of today, each its own block in its own hue — the same
     three, in the same three colours, as on Home, so the two screens teach one
     vocabulary instead of two. Each carries the period's change underneath,
     which is the number this screen exists for. */
  const tile = (key, label, value, percent, delta) => `
    <div class="tinted tile ${COMPONENT_TONE[key]}">
      <div class="row" style="gap:var(--s1)">
        <span class="itile">${icon(COMPONENT_ICON[key], 17)}</span>
        <div class="grow"></div>
        <span class="wt num">${WEIGHTS[key]}%</span>
      </div>
      <div class="k ellipsis">${label}</div>
      <div class="v num">${value}</div>
      <div class="sub num">${deltaTag(delta)}</div>
      ${bar(percent)}
    </div>`;

  h += `<div class="tiles two" style="margin-top:var(--s2)">
      ${tile("tasks", t("tasks"), pct(today.tasks),
             today.tasks || 0, st.deltas.tasks)}
      ${tile("habits", t("habits"), pct(today.habits),
             today.habits || 0, st.deltas.habits)}
      ${tile("focus", t("week_focus"), pct(today.focus),
             today.focus || 0, st.deltas.focus)}
      ${tile("prayer", t("prayer"),
             `${today.prayer_performed}/${today.prayer_required}`,
             today.prayer || 0, st.deltas.prayer)}
    </div>
    <div class="item" style="margin-top:var(--s1)">
      <span class="itile tone-4">${icon("flame", 17)}</span>
      <div class="grow">${t("streak")}</div>
      <div class="num" style="font-weight:660">${today.streak}</div>
    </div>`;

  h += `<div class="seg" style="margin:16px 0 12px">
      ${["week","month","year"].map(p => `<div class="${st.period === p ? "on" : ""}"
        data-act="stats-period" data-period="${p}">${t(p)}</div>`).join("")}</div>`;

  // The series are togglable, because four lines at once is a mess and
  // which two matter is the user's call, not ours.
  // Four series, four of the theme's five brand colours. The palette comes
  // from the theme rather than being fixed here, so a chart never clashes
  // with the screen it sits on.
  const SERIES = [
    {field:"overall", color:"var(--c1)", label:t("overall")},
    {field:"tasks",   color:"var(--c2)", label:t("tasks")},
    {field:"habits",  color:"var(--c3)", label:t("habits")},
    {field:"focus",   color:"var(--c5)", label:t("week_focus")},
    {field:"prayer",  color:"var(--c4)", label:t("prayer")},
  ];
  const active = SERIES.filter(k => state.statsSeries[k.field]);
  h += `<div class="card">
      ${lineChart(st.series, active.length ? active : [SERIES[0]])}
      <div class="legend">${SERIES.map(k =>
        `<span class="${state.statsSeries[k.field] ? "" : "off"}"
          data-act="series-toggle" data-field="${k.field}">
          <i style="background:${k.color}"></i>${k.label}</span>`).join("")}</div>
    </div>`;

  /* The period's averages, on one divided line rather than as four more
     boxed cells. The four cells that used to sit here carried the *same*
     four deltas as the four at the top of the screen, so half of the block
     was a second printing of numbers already read. */
  h += `<h2>${t("average")}</h2>
    <div class="card"><div class="trio" style="grid-template-columns:repeat(5,1fr)">
      <div><div class="k">${t("overall")}</div>
        <div class="v num">${pct(st.averages.overall)}</div></div>
      <div><div class="k">${t("tasks")}</div>
        <div class="v num">${pct(st.averages.tasks)}</div></div>
      <div><div class="k">${t("habits")}</div>
        <div class="v num">${pct(st.averages.habits)}</div></div>
      <div><div class="k">${t("focus")}</div>
        <div class="v num">${pct(st.averages.focus)}</div></div>
      <div><div class="k">${t("prayer")}</div>
        <div class="v num">${pct(st.averages.prayer)}</div></div>
    </div></div>`;

  if(st.best_day){
    h += `<div class="card" style="margin-top:12px"><div class="row">
        <div class="grow"><div class="eyebrow">${t("best_day")}</div>
          <div style="font-weight:680;margin-top:2px">${isoToLabel(st.best_day.day)}</div>
        </div>
        <div class="num" style="font-size:20px;font-weight:740"
          >${st.best_day.overall}%</div></div></div>`;
  }

  /* Prayer is still five separate facts rather than one opaque score, but
     six more cells at the foot of a screen that already carries eleven
     numbers is where a page stops being read. It is one row that opens
     them. */
  h += `<div class="item pressable" style="margin-top:var(--s3)"
             data-act="prayer-detail">
      ${icon("moon", 17)}<div class="grow">${t("prayer_detail")}</div>
      ${icon("chevron", 15)}</div>`;

  h += `<div class="btns">
      <button class="btn secondary" data-act="stats-download">
        ${icon("download", 16)} ${t("download")}</button></div>`;
  return h;
};

/* The task form. First view is one field and four chips, because that
   covers almost every task anyone ever writes. Dates, times, reminders,
   repeats, projects and descriptions exist, and they are one tap down
   rather than seven fields to scroll past.

   `state.form` holds the in-progress choices so a chip can re-render the
   sheet without losing what was typed. */
state.form = {};

function taskSheet(task, presetProject){
  const editing = Boolean(task?.id);
  const f = state.form;
  const projects = state.projects || [];
  const options = projects.map(p =>
    `<option value="${p.id}" ${String(p.id) === String(f.project_id) ? "selected" : ""}
      >${esc(p.name)}</option>`).join("");

  const chips = [["today", t("when_today")], ["tomorrow", t("when_tomorrow")],
                 ["week", t("when_week")], ["none", t("when_none")]];

  return `
    <h3>${icon("list", 18)} ${editing ? t("edit") : t("add_task")}</h3>
    <input id="task-title" placeholder="${t("task_name")}"
           value="${esc(f.title || "")}" />

    <div class="chips" style="margin-top:10px">
      ${chips.map(([id, label]) => `<div class="chip sm
        ${f.when === id ? "on" : ""}" data-act="task-when"
        data-value="${id}">${label}</div>`).join("")}
      <div class="chip sm ${f.when === "pick" ? "on" : ""}"
           data-act="task-when" data-value="pick">
        ${icon("calendar", 14)} ${f.when === "pick" && f.deadline
          ? isoToLabel(f.deadline) : t("when_pick")}</div>
    </div>

    ${f.when === "pick" ? `<label>${t("deadline")}</label>
      <input type="date" id="task-deadline" value="${f.deadline || ""}"
             data-form="deadline" />` : ""}

    <details ${f.open ? "open" : ""}>
      <summary>${icon("chevron", 15)}<span class="chev"></span>
        ${t("more_options")}</summary>

      <label>${t("due_time")} <span class="t3">(${t("optional")})</span></label>
      <input type="time" id="task-time" value="${f.due_time || ""}" />

      <label>${t("reminder")}</label>
      <select id="task-remind">
        <option value="" ${f.remind_before === null || f.remind_before === undefined
          ? "selected" : ""}>${t("remind_none")}</option>
        ${REMINDER_OFFSETS.map(m =>
          `<option value="${m}" ${String(f.remind_before) === String(m)
            ? "selected" : ""}>${t("remind_" + m)}</option>`).join("")}
      </select>

      <label>${t("repeat")}</label>
      <select id="task-repeat">
        <option value="">${t("repeat_none")}</option>
        ${["daily","weekdays","weekly","monthly"].map(r =>
          `<option value="${r}" ${f.recurrence === r ? "selected" : ""}
            >${t("repeat_" + r)}</option>`).join("")}
      </select>

      <label>${t("priority")}</label>
      <div class="chips">${["high","medium","low"].map(p =>
        `<div class="chip sm ${(f.priority || "medium") === p ? "on" : ""}"
          data-act="task-priority" data-value="${p}">
          <span class="dot p-${p}"></span>${t(p)}</div>`).join("")}</div>

      <label>${t("project")}</label>
      <select id="task-project">
        <option value="">${t("standalone")}</option>${options}</select>

      <label>${t("task_desc")}</label>
      <textarea id="task-desc">${esc(f.description || "")}</textarea>
    </details>

    <button class="btn" style="margin-top:16px"
      ${editing ? `data-act="task-update" data-id="${task.id}"`
                : `data-act="task-save"${presetProject ? ` data-project="${presetProject}"` : ""}`}
      >${t("save")}</button>
    ${editing ? `<button class="btn danger" data-act="task-delete-go"
      data-id="${task.id}" style="margin-top:8px">
      ${icon("trash", 15)} ${t("delete")}</button>` : ""}
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`;
}

/* Reads the sheet's current inputs into state.form, so re-rendering for
   a chip tap never loses typed text. */
function readTaskForm(){
  const f = state.form;
  const get = id => document.getElementById(id);
  if(get("task-title")) f.title = get("task-title").value;
  if(get("task-deadline")) f.deadline = get("task-deadline").value || null;
  if(get("task-time")) f.due_time = get("task-time").value || null;
  if(get("task-desc")) f.description = get("task-desc").value;
  if(get("task-project")) f.project_id = get("task-project").value || null;
  if(get("task-remind")){
    const v = get("task-remind").value;
    f.remind_before = v === "" ? null : Number(v);
  }
  if(get("task-repeat")) f.recurrence = get("task-repeat").value || "";
  const details = document.querySelector(".sheet details");
  if(details) f.open = details.open;
  return f;
}

/* Turns the chip choice into an actual date. `pick` keeps whatever the
   date input holds. */
function formDeadline(){
  const f = state.form;
  const today = todayISO();
  if(f.when === "today") return today;
  if(f.when === "tomorrow") return shiftISO(today, 1);
  if(f.when === "week") return shiftISO(today, 7);
  if(f.when === "none") return null;
  if(f.when === "pick") return f.deadline || null;
  return f.deadline ?? null;
}

function taskBody(){
  const f = readTaskForm();
  return {
    title: (f.title || "").trim(),
    description: f.description || "",
    deadline: formDeadline(),
    due_time: f.due_time || null,
    remind_before: f.remind_before ?? null,
    recurrence: f.recurrence || "",
    priority: f.priority || "medium",
    project_id: f.project_id ? Number(f.project_id) : null,
  };
}

    ${h.system_key === "wakeup" ? `<label>${t("wake_at")}</label>

    <label>${t("reminder")} <span class="t3">(${t("optional")})</span></label>
    <div class="field">

      <div class="metric wide"><div class="k">${t("last7")} · ${t("last30")}</div>

    ${h.protected ? "" : `
      <div class="btns">

/* ---------- top-3 picker ----------
   Chooses from the tasks that already exist rather than creating a
   parallel list. Picking one also dates it for today, which is what the
   user meant. */
function pickTaskSheet(){
  const d = state.tasks;
  const current = (state.home?.top3 || [])[0];
  const pool = d
    ? [...d.overdue, ...d.upcoming, ...d.undated, ...(d.later || [])]
        .filter(x => x.status !== "done").slice(0, 40)
    : [];

  return `<h3>${icon("target", 18)} ${t("pick_task")}</h3>
    ${current ? `<button class="btn secondary" data-act="mission-clear"
      data-id="${current.id}" style="margin-top:var(--s2)">
      ${icon("x", 15)} ${t("mission_change")}</button>` : ""}

    ${pool.length ? pool.map(x => `
      <div class="item pressable" data-act="mission-set" data-id="${x.id}">
        <div class="grow"><div class="ellipsis">${esc(x.title)}</div>
          <div class="meta">${x.deadline ? isoToLabel(x.deadline) : t("no_date")}
            ${x.project ? `· ${esc(x.project)}` : ""}</div></div>
        ${current && current.id === x.id ? icon("check", 16) : icon("chevron", 15)}

      : `<div class="empty">${t("no_tasks_yet")}

    </div>
    <button class="btn secondary" data-act="close" style="margin-top:var(--s3)">
      ${t("close")}</button>`;
}

/* ---------- overall explanation ----------
   The formula, spelled out, with the same numbers that produced it. A
   score the user cannot check is a score they stop believing. */
/* The arithmetic behind the headline, from the same payload that produced it.

   The weight column is the one that has to be shown: a number built from four
   unequal parts is not checkable without it, and the weight a part *actually*
   carried today is not the weight on the tin — a user with no prayer module
   sees 47/29/24, because the missing 15 was split across the rest in
   proportion. Printing the nominal figures to that user would be a lie about
   their own score. */
function overallSheet(x){
  const weights = x.weights || {};
  const nominal = x.nominal_weights || {};
  const shifted = x.counted.length < Object.keys(nominal).length;

  return `<h3>${icon("info", 18)} ${t("how_calculated")}</h3>
    <div class="hint">${t("overall_rule")}<br>${t("overall_absent")}</div>
    <div class="tinted block tone-2" style="margin-top:var(--s2)">
      <div class="bh">
        <span class="itile lg">${icon("chart", 18)}</span>
        <div class="grow"><div class="bt">${t("overall")}</div>
          <div class="t2 tiny">${t("weighted_note")}</div></div>
        <div class="num" style="font-size:24px;font-weight:750">${x.value}%</div>
      </div>
    </div>
    ${x.parts.map(p => {
      const absent = p.percent === null;
      const share = weights[p.key];
      return `<div class="item" style="min-height:48px">
        <span class="itile ${COMPONENT_TONE[p.key] || "tone-1"}"
              >${icon(COMPONENT_ICON[p.key] || "list", 16)}</span>
        <div class="grow"><div>${t(p.key)}</div>
          <div class="meta">${absent ? t("not_counted") : `${p.done} / ${p.total}`}
            ${share !== undefined ? `· ${t("weight")} ${share}%` : ""}</div></div>
        <div class="num ${absent ? "t3" : ""}"
             style="font-weight:640">${pct(p.percent)}</div>
      </div>`;
    }).join("")}
    ${shifted ? `<div class="t3 tiny" style="margin-top:var(--s2)">
      ${t("weight_shift")}</div>` : ""}
    <div class="t3 tiny" style="margin-top:var(--s1)">
      ${t("priority_note")}</div>
    <button class="btn secondary" data-act="close" style="margin-top:14px">
      ${t("close")}</button>`;
}

/* One hue and one glyph per component, everywhere in the app: the tile on
   Home, the block on Statistics and the row in this sheet are the same three
   — now four — things, and they teach one vocabulary by never changing. */
const COMPONENT_TONE = {tasks:"tone-1", habits:"tone-5", focus:"tone-3",
                        prayer:"tone-2"};
const COMPONENT_ICON = {tasks:"list", habits:"check", focus:"target",
                        prayer:"moon"};

/* Every zone the platform knows, not a shortlist of twelve.

   The server sends the common ones first and the rest of the IANA database
   after them, so the two are split into groups here rather than run together:
   a flat list of five hundred opens on Africa/Abidjan, and the person who
   needed Asia/Tashkent has to scroll past four continents to reach a zone that
   was one tap away before. The region prefix is dropped from the label inside
   each group — the group heading already says it — which is what keeps the
   city readable on a 375px phone.

   A stored zone the server no longer offers is still listed, selected, rather
   than silently reset to somebody else's city. */
function timezonePicker(zones, current){
  const common = zones.slice(0, TZ_COMMON_COUNT);
  const rest = zones.slice(TZ_COMMON_COUNT);
  const option = z =>
    `<option value="${esc(z)}" ${current === z ? "selected" : ""}>${esc(z)}</option>`;

  const byRegion = {};
  rest.forEach(z => {
    const region = z.includes("/") ? z.split("/")[0] : "UTC";
    (byRegion[region] = byRegion[region] || []).push(z);
  });

  return `<select id="tz-select" data-act="set-tz">
      ${zones.includes(current) ? ""
        : `<option value="${esc(current)}" selected>${esc(current)}</option>`}
      <optgroup label="${t("tz_common")}">${common.map(option).join("")}</optgroup>
      ${Object.keys(byRegion).sort().map(region => `
        <optgroup label="${esc(region.split("_").join(" "))}">
          ${byRegion[region].map(z => `<option value="${esc(z)}"
            ${current === z ? "selected" : ""}
            >${esc(z.split("/").slice(1).join(" / ").split("_").join(" "))}</option>`
          ).join("")}
        </optgroup>`).join("")}
    </select>`;
}

const NAV = [

  {id:"habits", icon:"check",    key:"habits"},
  {id:"tasks",  icon:"list",     key:"tasks"},
  {id:"stats",  icon:"chart",    key:"stats"},

const NAV_OF = {project:"tasks"};

/* The blocked screen. A full screen with a way out, not a 403 string:
   join, check, and the session continues from where it was. */
function blockedScreen(){
  const b = state.blocked || {};
  return `<div style="padding:40px 0 0;text-align:center">

        ${b.channel ? `<button class="btn" data-act="sub-join"
          data-url="${esc(b.channel)}">${icon("globe", 16)} ${t("sub_join")}</button>` : ""}

/* An error is never a dead end: every failure screen carries the action
   that could fix it. */
function errorScreen(){
  return `<div style="padding:40px 0 0;text-align:center">
      <div style="font-size:30px">⚠️</div>
      <h1 style="margin-top:12px">${esc(state.error)}</h1>
      <div style="margin-top:20px;text-align:left">
        <button class="btn" data-act="reload">${t("retry")}</button>
        <button class="btn secondary" data-act="nav" data-screen="home"
                style="margin-top:8px">${t("go_home")}</button>
      </div></div>`;
}

/* Light or dark, resolved once. `auto` follows Telegram's own colour scheme
   when it reports one and the operating system otherwise, so the app matches
   the chat it opened from. */
function resolveMode(){
  if(state.appearance === "light" || state.appearance === "dark")
    return state.appearance;
  if(tg?.colorScheme === "light" || tg?.colorScheme === "dark")
    return tg.colorScheme;
  return window.matchMedia("(prefers-color-scheme: light)").matches
    ? "light" : "dark";
}

function render(){
  const root = document.documentElement;
  /* Two attributes drive the entire visual system: which identity, and which
     mode. Every theme defines both, so no combination inherits another's
     surfaces. */
  root.dataset.theme = themeOf(state.me?.theme);
  root.dataset.mode = resolveMode();

  const app = document.getElementById("app");
  if(state.blocked)      app.innerHTML = blockedScreen();
  else if(state.error)   app.innerHTML = errorScreen();
  else if(state.loading) app.innerHTML = `<div class="spin"></div>`;
  else                   app.innerHTML = (SCREENS[state.screen] || SCREENS.home)();

  const chromeOff = Boolean(state.blocked || state.error || state.loading);
  document.getElementById("fab").style.display = chromeOff ? "none" : "grid";
  document.getElementById("fab").innerHTML = icon("plus", 24);
  document.getElementById("nav").style.display = chromeOff ? "none" : "grid";

  const active = NAV_OF[state.screen] || state.screen;
  document.getElementById("nav").innerHTML = NAV.map(n => `
    <button data-act="nav" data-screen="${n.id}" class="${active === n.id ? "on" : ""}"
            aria-current="${active === n.id ? "page" : "false"}">
      <span class="ic">${icon(n.icon, 21)}</span><span>${t(n.key)}</span></button>`).join("");

  syncShell();
  syncBackButton();
}

/* The navigation is the only fixed thing left at the bottom, and its height
   still changes with the language, the font size and the safe area. Measure
   the real node rather than guessing a padding that is wrong on one phone. */
function syncShell(){
  const nav = document.getElementById("nav");
  const root = document.documentElement;
  const navH = nav.offsetHeight || 60;
  root.style.setProperty("--nav-h", navH + "px");
  root.style.setProperty("--shell-b", navH + "px");
}

/* ==================================================================
   Loading
   ================================================================== */
async function loadScreen(screen){
  try{
    if(screen === "home"){
      /* Two requests, in parallel. The month grid still moved into a sheet and
         is still fetched when that sheet opens; the summary is here because
         the score block now shows the week and the month next to today rather
         than behind a switch, so "on demand" would mean every single time. */
      const [home, summary] = await Promise.all([
        api("/api/home"), api("/api/summary"),
      ]);
      setState({home, summary});
    } else if(screen === "habits"){
      const [habits, prayer, journal] = await Promise.all([
        api("/api/habits"), api("/api/prayers"),
        api("/api/journal?day=" + todayISO()),
      ]);
      setState({habits, prayer, journal: journal.entry,
                journalQuestions: journal.questions});
    } else if(screen === "tasks"){
      const query = state.taskQuery ? "&q=" + encodeURIComponent(state.taskQuery) : "";
      /* The month is part of this screen now rather than a sheet opened from
         it, so it is fetched with the rest — but only once: moving between the
         tabs must not re-request a grid that is already drawn, and paging to
         another month must not be undone by the next tab tap. */
      const [tasks, projects, focus, calendar] = await Promise.all([
        api("/api/tasks?days=365" + query), api("/api/projects"),
        api("/api/focus"),
        state.calendar ? Promise.resolve(state.calendar) : api("/api/calendar"),
      ]);
      setState({tasks, projects: projects.projects, focus: focus.week, calendar});
      if(state.taskTab === "done"){
        const q = state.doneQuery ? "?q=" + encodeURIComponent(state.doneQuery) : "";
        setState({tasksDone: (await api("/api/tasks/done" + q)).groups});
      }
    } else if(screen === "stats"){
      await loadStats(state.statsPeriod);
    } else if(screen === "project"){
      const id = state.project?.project?.id;
      if(id) setState({project: await api(`/api/projects/${id}/tasks`)});
    }
  }catch(e){ handleError(e); }
}

/* Re-reads the habit list without touching the rest of the screen. Used after
   anything that changes a *derived* habit, so two tabs can never disagree
   about whether the same day is done. */
async function refreshHabits(){
  try{ state.habits = await api("/api/habits"); }
  catch(_){ /* the visible data stays as it was; the next load corrects it */ }
}

async function loadStats(period){
  try{ setState({stats: await api("/api/stats?period=" + period),
                 statsPeriod: period}); }
  catch(e){ handleError(e); }
}

function goto(screen, patch){
  haptic();
  setState({screen, reorderMode:false, ...(patch || {})});
  loadScreen(screen);
}

//: Whatever the user typed before a failed save, so a retry does not
//: start from a blank field.
let lastDraft = null;

function handleError(e, draft){
  console.error("ErnestOS:", e);
  if(e.status === 403){
    // Not an error screen — the subscription flow, with a way through it.
    setState({blocked:{channel:state.blocked?.channel}, loading:false});
    checkSubscription(true);
    return;
  }
  if(e.status === 409 && e.detail === "top3_full"){ toast(t("top3_full")); return; }
  if(draft){
    lastDraft = draft;
    openSheet(`
      <h3>${e.status ? t("error") : t("offline")}</h3>
      <div class="hint">${t("draft_kept")}</div>
      <div class="card" style="margin-top:10px">${esc(
        Object.values(draft.body || {}).filter(v => typeof v === "string").join(" · ")
      )}</div>
      <button class="btn" data-act="retry-draft" style="margin-top:14px">
        ${t("retry")}</button>
      <button class="btn secondary" data-act="close" style="margin-top:8px">
        ${t("cancel")}</button>`);
    return;
  }
  toast(e.status ? t("error") : t("offline"));
}

/* Re-checks membership against Telegram. Called from the blocked screen,
   so joining the channel and tapping check continues the session instead
   of restarting the app. */
async function checkSubscription(quiet){
  try{
    const r = await api("/api/subscription");
    if(r.subscribed){
      setState({blocked:null, error:null, loading:true});
      const me = await api("/api/me");
      state.lang = me.language || state.lang;
      setState({me, loading:false, screen:"home"});
      await loadScreen("home");
      return true;
    }
    setState({blocked:{channel:r.channel,
      note: quiet ? "" : r.state === "unknown" ? t("sub_unknown") : t("sub_still")}});
  }catch(e){
    setState({blocked:{channel:state.blocked?.channel, note:t("sub_unknown")}});
  }
  return false;
}

/* ==================================================================
   Actions
   ================================================================== */
async function save(request, reload, quiet, message, draft){
  try{
    await request();
    lastDraft = null;
    closeSheet();
    if(!quiet) toast(message || t("saved"));
    // A caller that updated `state` itself and passed no reload target still
    // needs the screen redrawn, or the write lands in the data and not on the
    // screen.
    if(reload) await loadScreen(reload);
    else render();
  }catch(e){
    closeSheet();
    handleError(e, draft && {...draft, request, reload});
  }
}

/* An optimistic tick: the row changes now, the request follows, and a
   failure puts it back. Waiting 300ms for a checkbox is what makes an
   app feel like a web page. */
function optimistic(mutate, request, reload){
  const snapshot = JSON.stringify({home:state.home, habits:state.habits,
                                   tasks:state.tasks, project:state.project});
  mutate();
  render();
  request().then(() => { if(reload) loadScreen(reload); })
    .catch(e => {
      const back = JSON.parse(snapshot);
      setState(back);
      handleError(e);
    });
}
