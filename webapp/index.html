        `<div class="${kind === k ? "on" : ""}" role="tab" tabindex="0"
          aria-selected="${kind === k}" data-act="tc-kind" data-value="${k}">${t(key)}</div>`)
        .join("")}</div>`;
  let body;
  if(!r) body = `<div class="spin"></div>`;
  else if(!(r.items || []).length) body = `<div class="empty">${t("tc_empty")}</div>`;
  else body = r.items.map(x => `
    <div class="item pressable" data-act="timer-open" data-kind="${x.kind}" data-id="${x.id}"
         role="button" tabindex="0" style="min-height:50px">
      <span class="itile">${icon("clock", 16)}</span>
      <div class="grow"><div class="ellipsis">${esc(x.title)}</div>
        <div class="meta">${x.team_name ? `${icon("users", 14)} ${esc(x.team_name)}` : t("src_personal")}${
          x.timer_minutes || x.timer ? " · " + timerMeta(x) : ""}</div></div>
      ${icon("chevron", 15)}</div>`).join("");
  return `<h3>${icon("clock", 16)} ${t("time_cd")}</h3>
    ${r?.active ? timerBanner(r.active) : ""}
    ${seg}
    <div class="t3 tiny" style="margin-bottom:8px">${t("tc_hint")}</div>
    ${body}
    <button class="btn secondary" data-act="close" style="margin-top:12px">${t("close")}</button>`;
}

/* ---------- Tasks ---------- */
/* Tasks, in four views of the same data rather than four lists.

     Asosiy / Main     what actually matters right now — the week's focus, the
                       tasks pinned to today, anything late, today's work, and
                       the month underneath it
     Ochiq / Open      the inbox: every open task, searchable and filterable
     Loyihalar/Projects each project's state — how far it is, how much is left
     Bajarilgan/Done   the archive

   The calendar sits at the foot of Main rather than behind a header button.
   It is the last thing on the screen because it answers the last question a
   planner asks — what is coming after today — and putting it there means the
   whole plan is one scroll instead of a screen plus a sheet. */
SCREENS.tasks = () => {
  /* Bugun · Reja · Taqvim (#18). The plan holds the inbox, the projects and
     the archive as three chips under one tab; the calendar and both
     countdowns are a tab of their own rather than the foot of Today. */
  const tabs = [["main", t("tab_today")], ["open", t("tab_plan")],
                ["calendar", t("tab_calendar")]];
  const PLAN = ["open", "projects", "done"];
  const active = PLAN.includes(state.taskTab) ? "open" : state.taskTab;

  let h = `<div class="head">
      <h1 class="grow">${t("tasks")}</h1>
      <button class="iconbtn add" data-act="${state.taskTab === "projects" ? "project-add" : "task-add"}"
              aria-label="${state.taskTab === "projects" ? t("add_project") : t("add_task")}"
              >${icon("plus", 22)}</button>
    </div>
    <div class="seg" role="tablist" style="margin:12px 0 12px">
      ${tabs.map(([id, label]) => `<div class="${active === id ? "on" : ""}" role="tab"
        tabindex="0" aria-selected="${active === id}"
        data-act="task-tab" data-tab="${id}">${label}</div>`).join("")}
    </div>`;

  if(PLAN.includes(state.taskTab)){
    h += `<div class="chips" style="margin-bottom:10px">${[["open", t("open_tab")],
      ["projects", t("projects")], ["done", t("done_tab")]].map(([id, label]) =>
      `<div class="chip sm ${state.taskTab === id ? "on" : ""}" role="tab" tabindex="0"
        aria-selected="${state.taskTab === id}" data-act="task-tab"
        data-tab="${id}">${label}</div>`).join("")}</div>`;
    if(state.taskTab === "done") return h + doneTab();
    if(state.taskTab === "projects") return h + projectsTab();
    return h + openTab();
  }
  if(state.taskTab === "calendar") return h + calendarTab();
  return h + mainTab();
};

/* Taqvim: the dates being counted down to, then the month. The date
   countdown lives here — in the planning screen — and nowhere in the chat;
   the clock on a habit or a task is one button under it. */
function calendarTab(){
  return countdownBlock(state.countdowns)
    + sectionHead("tone-2", "calendar", t("calendar")) + calendarBlock()
    + `<button class="btn secondary" data-act="tc-open" style="margin-top:var(--s3)">
        ${icon("clock", 16)} ${t("time_cd")}</button>`;
}

/* A section heading that carries a hue, so the screen reads as a few
   labelled groups rather than one uninterrupted scroll. */
function sectionHead(tone, ic, label, action){
  return `<div class="sechead ${tone}">
      <span class="itile">${icon(ic, 16)}</span>
      <div class="lbl">${label}</div>
      ${action || ""}</div>`;
}

/* The first thing the Tasks screen shows, and deliberately not the whole
   list: the week's one goal, then everything today actually asks for, then
   the month. The complete inventory is one tab across for the moment when
   the inventory is the question. */
function mainTab(){
  const d = state.tasks;
  /* Order: what is late, then today, then the week goal. The goal used to
     sit on top and push an overdue task below the fold — the one thing on
     this screen that most needs seeing first. */
  let h = timerBanner(d?.active_timer);
  if(!d) return h + weekFocusBlock() + `<div class="spin"></div>`;

  const today = todayISO();
  /* Shared tasks are in the day's own lists, not a block below them: they
     are owed today and they score today, so a reader looking at "due today"
     has to be looking at all of it. Marked, not separated — `taskRow` says
     which team each one came from. Personal tasks carry an `overdue` flag
     from the API; shared ones are compared here, since the shared block is
     built from a flat list. */
  const sharedAll = (d.team_tasks || []).map(x => ({
    ...x, source: "team",
    overdue: Boolean(x.deadline && x.deadline < today && !x.done),
  }));
  const all = [...d.overdue, ...d.upcoming, ...d.undated, ...(d.later || []),
               ...sharedAll];
  /* No "Pinned" section: the task chosen for today is the Now card on Home,
     and here it sits in its own place in the list with its star lit. A
     section of its own printed the same task twice. */
  const key = x => x.id + ":" + (x.source || "personal");
  const late = all.filter(x => x.overdue);
  const seen = new Set(late.map(key));
  const now = all.filter(x => x.deadline === today && !seen.has(key(x)));

  const section = (tone, ic, label, rows, opts) => rows.length
    ? sectionHead(tone, ic, label) + rows.map(x => taskRow(x, opts)).join("") : "";

  /* One hue per section, and the same hue for the same idea everywhere in the
     app: tasks are the first tone on Home and they are the first tone here. */
  const body = section("tone-4", "clock", t("overdue"), late)
    + section("tone-1", "list", t("due_today"), now, {hideDate: true});

  h += body || `<div class="empty">${t("nothing_today")}
      <button class="btn secondary sm" data-act="task-add"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;

  // The dates, the month and both countdowns are the Taqvim tab.
  return h + taskPageFooter() + weekFocusBlock();
}

function searchBox(id, value, placeholder, action){
  return `<div class="row" style="margin:var(--s4) 0 var(--s2)">
      <div class="grow" style="position:relative">
        <input id="${id}" value="${esc(value)}" placeholder="${placeholder}"
               data-search="${action}" style="padding-left:38px" />
        <span style="position:absolute;left:12px;top:13px;color:var(--text-3)"
              >${icon("search", 17)}</span>
      </div>
      ${value ? `<button class="iconbtn" data-act="${action}-clear"
        aria-label="${t("clear")}">${icon("x", 16)}</button>` : ""}
    </div>`;
}

/* The week's focus lives here rather than on Home: it is a planning decision,
   and this is the planning screen. Home stays about today. */
function weekFocusBlock(){
  const focus = state.focus;
  if(!focus) return "";
  const primary = focus.primary;

  let h = sectionHead("tone-3", "target", t("week_focus"),
    focus.slots_free > 0 && primary
      ? `<span class="act" data-act="focus-add" data-slot="supporting">
           ${icon("plus", 14)} ${t("add_supporting")}</span>` : "");

  /* The weekly review lives next to the goals it feeds; from Friday on it is
     pointed out (audit #16). */
  const weekEnd = new Date().getDay() >= 5 || new Date().getDay() === 0;
  const reviewRow = `<div class="item pressable" data-act="review-open" style="min-height:44px;margin-top:6px">
      ${icon("chart", 16)}<div class="grow small">${t("review")}${weekEnd
        ? ` <span class="tag ok">${t("review_due")}</span>` : ""}</div>${icon("chevron", 15)}</div>`;

  if(!primary){
    // One row, not a panel: the block printed "Add a main goal" as a line of
    // text and again on the button under it, and spent a third of the screen
    // on a section the user has not started. Unset, it is an invitation the
    // size of one line.
    return h + `<div class="item pressable" data-act="focus-add"
                     data-slot="primary" style="min-height:48px">
        ${icon("target", 17)}
        <div class="grow t2">${t("add_mission")}</div>
        ${icon("plus", 16)}</div>` + reviewRow;
  }

  h += `<div class="tinted block tone-3">
      <div class="row">
        <div class="check ${primary.done ? "on" : ""}" data-act="focus-toggle"
             data-id="${primary.id}">${icon("check", 14)}</div>
        <div class="grow" data-act="focus-open" data-id="${primary.id}"
             data-title="${esc(primary.title)}" data-priority="${primary.priority}"
             data-done="${primary.done ? 1 : 0}">
          <div class="eyebrow">${t("mission_main")}</div>
          <div class="wrap ${primary.done ? "strike" : ""}"
               style="font-size:16px;font-weight:600;margin-top:2px">
            ${esc(primary.title)}</div>
          ${primary.carries >= 2 && !primary.done
            ? `<div class="t2 tiny">${t("focus_carried_n", {n: primary.carries})}</div>` : ""}
        </div>
        ${icon("chevron", 16)}
      </div></div>`;

  const extra = focus.supporting || [];
  if(extra.length){
    h += extra.map(row => `
      <div class="item" style="min-height:44px;margin-top:6px">
        <div class="check ${row.done ? "on" : ""}" style="width:21px;height:21px"
             data-act="focus-toggle" data-id="${row.id}"
             >${row.done ? icon("check", 12) : ""}</div>
        <div class="grow small wrap ${row.done ? "strike" : ""}"
             data-act="focus-open" data-id="${row.id}"
             data-title="${esc(row.title)}" data-priority="${row.priority}"
             data-done="${row.done ? 1 : 0}">${esc(row.title)}${row.carries >= 2 && !row.done
               ? `<div class="t2 tiny">${t("focus_carried_n", {n: row.carries})}</div>` : ""}</div>
      </div>`).join("");
  }
  // Goals moved on from this week stay visible as what they were.
  for(const row of (focus.carried || []))
    h += `<div class="item" style="min-height:40px;margin-top:6px;opacity:.7">
        ${icon("chevron", 14)}<div class="grow small wrap">${esc(row.title)}
          <div class="t3 tiny">${t("focus_moved")}</div></div></div>`;
  return h + reviewRow;
}

/* The inbox: every open task there is, in one place.
   Main answers "what now"; this one answers "what is there", so nothing is
   held back here — late, dated, undated and later, all of it, with a search
   box and three filters over the top. */
function openTab(){
  const d = state.tasks;
  const total = d ? d.total : null;

  let h = `<div class="tinted block tone-2">
      <div class="bh">
        <span class="itile lg">${icon("inbox", 18)}</span>
        <div class="grow"><div class="bt">${t("inbox_zone")}</div>
          <div class="t2 tiny">${t("inbox_hint")}</div></div>
        <div class="num" style="font-size:22px;font-weight:700"
             >${total === null ? "—" : total}</div>
      </div></div>`;

  h += searchBox("task-q", state.taskQuery, t("search_tasks"), "task-search");

  /* Filters as chips rather than a menu: one tap to narrow, one to clear, and
     the active one visible without opening anything.

     Three, not seven. The list below is already grouped by horizon under its
     own headings — "this week" and "this month" were a second, competing way
     to say what the headings say, and a row of chips that scrolls sideways is
     a row where the last two are never found. High and low went with them:
     priority is visible on the row itself, and the two questions worth asking
     of a task list are "what is late" and "what has no date at all". */
  const filters = [["", t("all")], ["overdue", t("overdue")],
                   ["undated", t("no_date")]];
  h += `<div class="chips" style="margin-bottom:var(--s2)">
      ${filters.map(([id, label]) => `<div class="chip sm
        ${state.taskFilter === id ? "on" : ""}" data-act="task-filter"
        data-value="${id}">${label}</div>`).join("")}</div>`;

  if(!d) return h + `<div class="spin"></div>`;

  const f = state.taskFilter;

  /* One predicate, applied to every row, instead of a rule per section: a
     filter that behaves differently depending on which heading a task
     happens to sit under is a filter nobody can predict. */
  const keep = row => {
    if(!f) return true;
    if(f === "overdue") return row.overdue;
    if(f === "undated") return !row.deadline;
    return true;
  };

  const section = (tone, ic, label, rows) => {
    const items = (rows || []).filter(keep);
    return items.length
      ? sectionHead(tone, ic, `${label} · ${items.length}`)
        + items.map(taskRow).join("")
      : "";
  };

  let body = "";
  body += section("tone-4", "clock", t("overdue"), d.overdue);
  body += section("tone-1", "calendar", t("upcoming"), d.upcoming);
  body += section("tone-2", "inbox", t("no_date"), d.undated);
  body += section("tone-3", "list", t("later"), d.later || []);

  if(!body){
    h += (state.taskQuery || state.taskFilter)
      ? `<div class="empty">${t("no_results")}</div>`
      : `<div class="empty">${t("no_tasks_yet")}
          <button class="btn secondary sm" data-act="task-add"
                  style="margin:12px auto 0;display:flex">
            ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else h += body;

  return h + taskPageFooter() + ((d.teams || []).length ? `<button class="btn secondary" data-act="nav" data-screen="team">${t("team_tasks")} →</button>` : "");
}

function doneTab(){
  const g = state.tasksDone;
  let h = searchBox("done-q", state.doneQuery, t("search"), "done-search");
  if(!g) return h + `<div class="spin"></div>`;

  const section = (tone, label, rows) => rows.length
    ? sectionHead(tone, "check", `${label} · ${rows.length}`)
      + rows.map(doneRow).join("") : "";

  const body = section("tone-5", t("done_today"), g.today)
    + section("tone-2", t("done_week"), g.week)
    + section("tone-3", t("done_earlier"), g.earlier);

  return h + (body || `<div class="empty">${
    state.doneQuery ? t("no_results") : t("empty")}</div>`) + taskPageFooter();
}

function taskPageFooter(){
  const d = state.tasks;
  if(!d) return "";
  const n = [d.overdue, d.upcoming, d.undated, d.later].reduce((n, rows) => n + (rows?.length || 0), 0);
  // "12 / 80 shown" matters only when part of the list is still on the server.
  if(!d.next_cursor) return "";
  return `<div class="hint" style="margin:14px 0">${t("src_personal")} · ${t("loaded_tasks", {n, total:d.total ?? n})}</div>`
    + `<button class="btn secondary" data-act="tasks-more">${t("load_more")}</button>`;
}
let taskLoadSeq = 0;
function taskPageURL(cursor){
  const q = new URLSearchParams({limit:"50"});
  if(state.taskTab === "done") { q.set("done", "true"); q.set("q", state.doneQuery); }
  else { q.set("q", state.taskQuery); q.set("bucket", state.taskTab === "main" ? "today" : state.taskFilter); }
  if(cursor) q.set("cursor", cursor);
  return "/api/tasks/page?" + q;
}
async function moreTasks(){
  const cursor = state.tasks?.next_cursor, seq = taskLoadSeq;
  if(!cursor || state.tasksPaging) return;
  state.tasksPaging = true;
  try{
    const next = await api(taskPageURL(cursor));
    if(seq !== taskLoadSeq) return;
    for(const key of ["overdue", "upcoming", "undated", "later"])
      next[key] = [...(state.tasks[key] || []), ...(next[key] || [])];
    for(const key of ["today", "week", "earlier"])
      next.groups[key] = [...(state.tasksDone?.[key] || []), ...(next.groups[key] || [])];
    setState({tasks:next, tasksDone:next.groups});
  }finally{ state.tasksPaging = false; }
}

function doneRow(task){
  return `<div class="item" style="min-height:46px">
      <div class="check on" data-act="task-reopen" data-id="${task.id}"
           aria-label="${t("reopen")}">${icon("check", 14)}</div>
      <div class="grow"><div class="ellipsis strike">${esc(task.title)}</div>
        <div class="meta">${esc(task.project || t("standalone"))}
          ${task.recurrence ? `· ${icon("repeat", 12)}` : ""}</div></div>
    </div>`;
}

/* An overdue task gets four ways out instead of a red badge. Nothing on
   this row calls the user late; the actions are what a person actually
   needs at that moment. */
function taskRow(task, opts){
  const shared = task.source === "team";
  const meta = [];
  // Where it lives, on every row. See `habitRow` for why both kinds are
  // labelled rather than only the shared one.
  meta.push(shared ? `${icon("users", 14)} ${esc(task.team_name || "")}` : t("src_personal"));
  // Under a project heading the name is already on screen; repeating it in
  // every row is noise that pushes the useful details off the line.
  // Urgency is written, not only painted: the edge colour repeats the word.
  if(task.priority === "high" && task.status !== "done")
    meta.unshift(`<span class="tag hot">${t("high")}</span>`);
  if(task.blocked && task.status !== "done")
    meta.unshift(`<span class="tag">⏳ ${t(task.recheck ? "block_recheck" : "block_" + task.blocked)}</span>`);
  if(task.project && !opts?.hideProject) meta.push(esc(task.project));
  // Same reasoning for the date under a heading that already says "today":
  // six rows each reading "13 August" beneath "Today's tasks" is a second
  // line of type per row that tells the reader nothing.
  if(task.deadline && !opts?.hideDate)
    meta.push(`<span class="num">${isoToLabel(task.deadline)}</span>`);
  if(task.due_time) meta.push(`<span class="num">${icon("clock", 12)} ${task.due_time}</span>`);
  if(task.recurrence) meta.push(icon("repeat", 12));
  if(task.remind_before !== null && task.remind_before !== undefined)
    meta.push(icon("bell", 12));
  const timed = Boolean(task.timer_minutes) && task.status !== "done"
    && !(shared && task.done);
  if(timed) meta.push(timerMeta(task));
  if(shared && task.completion && task.completion !== "all")
    meta.push(t("completion_" + task.completion));
  if(shared && task.owed === false) meta.push(t("not_assigned"));

  /* Three, so they sit on one line. Four wrapped onto a second row and made
     every late task a 300px block; "this week" is the one a person reaches
     for least and it is still in the task's own sheet. */
  const quick = task.overdue ? `
      <div class="quick">
        <span class="qlbl">${t("reschedule")}:</span>
        <div class="chip sm" data-act="task-reschedule" data-id="${task.id}"
             data-source="${shared ? "team" : "personal"}"
             data-when="today" role="button" tabindex="0">${t("when_today")}</div>
        <div class="chip sm" data-act="task-reschedule" data-id="${task.id}"
             data-source="${shared ? "team" : "personal"}"
             data-when="tomorrow" role="button" tabindex="0">${t("when_tomorrow")}</div>
        <div class="chip sm" data-act="task-reschedule" data-id="${task.id}"
             data-source="${shared ? "team" : "personal"}"
             data-when="none" role="button" tabindex="0">${t("when_none")}</div>
      </div>` : "";

  return `<div class="trow pri-${task.priority}">
      ${shared ? teamBox(task, "task")
        : `<div class="check ${timed ? "timed" : ""}"
           ${timed ? `data-act="timer-open" data-kind="task"` : `data-act="task-done"`}
           data-id="${task.id}" role="${timed ? "button" : "checkbox"}" tabindex="0"
           aria-checked="false"
           aria-label="${t(timed ? "timer" : "now_done")} · ${esc(task.title)}">${
             icon(timed ? "clock" : "check", 14)}</div>`}
      <div class="grow">
        <div class="tt wrap"
             data-act="${shared ? "team-task-open" : "task-open"}"
             data-id="${task.id}">${esc(task.title)}</div>
        ${meta.length ? `<div class="td">${meta.join(" · ")}</div>` : ""}
        ${shared ? "" : quick}
      </div>
      ${shared
        ? `<button class="iconbtn sm plain" data-act="team-task-open"
                   data-id="${task.id}"
                   aria-label="${t("edit")}">${icon("chevron", 16)}</button>`
        : `<button class="iconbtn sm plain ${task.top3 ? "on" : ""}" aria-pressed="${task.top3 ? "true" : "false"}" data-act="task-top3" data-id="${task.id}"
              aria-label="${task.top3 ? t("top3_unpick") : t("top3_pick")}"
              >${icon("star", 18)}</button>`}
    </div>`;
}

/* ---------- Projects ----------
   Its own tab, because a project is a different question from a task: not
   "what do I do next" but "where has this got to". It used to be a strip of
   name-and-percentage rows at the foot of the main list, which said how far
   each one was and nothing about what that meant — a project at 60% with two
   tasks left and one due Friday is a different object from a project at 60%
   with fourteen left, and the row drew them identically.

   The tab opens on the portfolio in one line — how many are running, how much
   work is still open across all of them, where they average — and then gives
   each project a block of its own carrying its progress, what is left, its
   deadline and its state. */
function projectsTab(){
  const list = state.projects || [];
  /* Shared shelves belong on this screen too — it is where somebody comes to
     ask "where has this got to", and half the answer living on another tab
     is how a project gets forgotten. Under their own heading with the team's
     name, because filing is exactly the place the distinction matters. */
  const shared = (state.teams || []).map(team => ({
    team,
    projects: ((state.team?.teams || []).find(x => x.id === team.id)
               ?.projects) || [],
  })).filter(x => x.projects.length);

  const sharedBlock = shared.map(({team, projects}) =>
    sectionHead("tone-3", "users", esc(team.name))
    + projects.map((p, i) => projectBlock({...p, team_name: team.name}, i + 1)).join("")).join("");

  let h = sectionHead("tone-2", "folder", t("projects"),
    `<span class="act" data-act="project-add">${icon("plus", 14)}
       ${t("add_project")}</span>`);

  if(!list.length)
    return h + `<div class="empty">${t("no_projects")}
      <button class="btn secondary sm" data-act="project-add"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_project")}</button></div>`
      + sharedBlock;

  const live = list.filter(p => p.status !== "done" && !p.archived);
  const open = list.reduce((n, p) => n + p.tasks_open, 0);
  const average = list.length
    ? Math.round(list.reduce((n, p) => n + p.progress, 0) / list.length) : 0;

  h = `<div class="tiles">
      <div class="tinted tile tone-2">
        <span class="itile">${icon("folder", 17)}</span>
        <div class="k ellipsis">${t("pr_active")}</div>
        <div class="v num">${live.length}</div></div>
      <div class="tinted tile tone-4">
        <span class="itile">${icon("list", 17)}</span>
        <div class="k ellipsis">${t("pr_open_tasks")}</div>
        <div class="v num">${open}</div></div>
      <div class="tinted tile tone-5">
        <span class="itile">${icon("chart", 17)}</span>
        <div class="k ellipsis">${t("pr_average")}</div>
        <div class="v num">${average}%</div>
        ${bar(average)}</div>
    </div>` + h;

  return h + list.map((p, i) => projectBlock(p, i)).join("") + sharedBlock;
}

/* One project card — personal or a team's, the same card. One hue per
   project, cycling the theme's palette by position, so a list of five reads
   as five things and no two neighbours share a colour. A team's project
   says whose it is on the card and opens the same project screen. */
const PROJECT_TONES = ["tone-1", "tone-3", "tone-5", "tone-4", "tone-2"];
function projectBlock(p, i){
  const team = p.source === "team";
  const progress = p.progress ?? p.percent ?? 0;
  const left = p.tasks_open ?? Math.max(0, (p.tasks_total || 0) - (p.tasks_done || 0));
  const done = p.status === "done";
  const state_tag = p.archived ? t("st_archived")
    : done ? t("st_done") : t("st_active");
  // What is actually left, in words: "4 ta qoldi" is what somebody opens
  // this screen to find out; "60%" is only the measurement.
  const facts = [];
  if(team && p.team_name) facts.push(`${icon("users", 12)} ${esc(p.team_name)}`);
  facts.push(left ? t("pr_left", {n: left})
    : p.tasks_total ? t("pr_all_done") : t("pr_no_tasks"));
  if(p.deadline) facts.push(`${icon("calendar", 12)} ${isoToLabel(p.deadline)}`);
  return `<div class="tinted block ${PROJECT_TONES[i % PROJECT_TONES.length]}
               ${done || p.archived ? "off" : ""}"
               data-act="${team ? "team-project-open" : "project-open"}" data-id="${p.id}">
      <div class="bh">
        <span class="itile lg">${icon("folder", 18)}</span>
        <div class="grow" style="min-width:0">
          <div class="bt ellipsis">${esc(p.name)}</div>
          <div class="t2 tiny row" style="gap:6px;margin-top:2px;flex-wrap:wrap">
            ${facts.join(" · ")}</div>
        </div>
        <div style="text-align:right">
          <div class="num" style="font-size:19px;font-weight:700">${progress}%</div>
          <div class="t3 tiny num">${p.tasks_done || 0}/${p.tasks_total || 0}</div>
        </div>
        ${icon("chevron", 15)}
      </div>
      <div style="margin-top:var(--s2)">${bar(progress)}</div>
      ${done || p.archived
        ? `<div class="tag" style="margin-top:var(--s2)">${state_tag}</div>` : ""}
    </div>`;
}

/* ---------- one project and the work inside it ---------- */
SCREENS.project = () => {
  const d = state.project;
  if(!d) return `<div class="spin"></div>`;
  const p = d.project;
  /* A team's project is the same screen: same card, same list, same "+".
     The only differences are where a new task goes (into the team, so it is
     a shared task from the start) and who the tick belongs to. */
  const team = p.source === "team";
  const addAttrs = `data-act="task-add" data-project="${p.id}"`
    + (team ? ` data-dest="team:${p.team_id}"` : ` data-dest="personal"`);

  let h = `<div class="head">
      <button class="iconbtn" data-act="nav" data-screen="${state.projectBack || "tasks"}"
              aria-label="${t("back")}">${icon("back")}</button>
      <h1 class="grow">${esc(p.name)}</h1>
      <button class="iconbtn" data-act="project-edit" data-id="${p.id}"
              aria-label="${t("edit")}">${icon("edit")}</button>
      <button class="iconbtn add" ${addAttrs}
              aria-label="${t("add_task")}">${icon("plus", 22)}</button>
    </div>
    <div class="t2 tiny" style="margin-top:4px">${team
      ? `${icon("users", 13)} ${esc(p.team_name || "")}` : t("src_personal")}</div>`;

  if(p.description)
    h += `<div class="t2 small wrap" style="margin-top:8px">${esc(p.description)}</div>`;

  // Progress in words as well as a percentage: "4 / 7" alone makes the
  // reader do the arithmetic.
  h += `<div class="card" style="margin-top:12px">
      <div class="row">
        <div class="grow">
          <div style="font-size:24px;font-weight:750" class="num">${p.progress}%
            <span class="t3 tiny" style="font-weight:400">${t("pr_pct_tasks")}</span></div>
          <div class="t2 small">${t("of_tasks", {done:p.tasks_done,
            total:p.tasks_total})}</div>
        </div>
        <div style="text-align:right">
          ${p.deadline ? `<div class="small num">${icon("calendar", 13)}
            ${isoToLabel(p.deadline)}</div>` : ""}
          <div class="tag" style="margin-top:5px">${
            p.archived ? t("st_archived")
              : p.status === "done" ? t("st_done") : t("st_active")}</div>
        </div>
      </div>${bar(p.progress)}</div>`;

  h += `<h2>${t("project_tasks")}</h2>`;

  const isDone = x => team ? x.done : x.status === "done";
  if(!d.tasks.length){
    h += `<div class="empty">${t("no_tasks_yet")}
      <button class="btn secondary sm" ${addAttrs}
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else {
    const open = d.tasks.filter(x => !isDone(x));
    const done = d.tasks.filter(isDone);
    if(open.length) h += open.map(x => taskRow(x, {hideProject: true})).join("");
    if(done.length){
      h += `<div class="group">${t("completed")} · ${done.length}</div>`;
      h += done.map(x => team ? taskRow(x, {hideProject: true}) : doneRow(x)).join("");
    }
  }

  h += `<div class="btns">
      ${p.status === "done"
        ? `<button class="btn secondary" data-act="project-status" data-id="${p.id}"
             data-value="active">${t("mark_active")}</button>`
        : `<button class="btn secondary" data-act="project-status" data-id="${p.id}"
             data-value="done">${icon("check", 15)} ${t("mark_done")}</button>`}
      ${team ? "" : `<button class="btn secondary" data-act="project-archive" data-id="${p.id}"
              data-value="${p.archived ? 0 : 1}">
        ${p.archived ? t("unarchive") : t("archive")}</button>`}
    </div>
    <button class="btn danger" data-act="project-delete" data-id="${p.id}"
            style="margin-top:8px">${icon("trash", 15)} ${t("delete")}</button>`;
  return h;
};

/* ---------- Money ----------
   Its own place, deliberately apart from the productivity screens: nothing
   here feeds a score, a streak, XP or a report, and nothing on those screens
   reads from here. What came in, what went out, each category against its
   monthly limit, and the entries themselves. Adding is one line of text —
   "Tushlik 45 ming" — typed, or spoken where the phone allows it. */
const MONEY_TONE = {food:"var(--danger)", transport:"var(--warn)", home:"var(--c1)",
  health:"var(--ok)", fun:"var(--c3)", business:"var(--c2)", other:"var(--text-3)",
  salary:"var(--ok)", sales:"var(--c2)", other_in:"var(--c5)"};
/* "2 mln" → 2000000, "500 ming" → 500000, "1 500 000" → 1500000, "" or "0"
   → 0 (no limit); anything unreadable → null. */
function parseMoneyInput(text){
  const raw = String(text || "").toLowerCase().replace(/\s+/g, " ").trim();
  if(!raw) return 0;
  const m = raw.replace(/(\d)[ \u00a0](?=\d{3}\b)/g, "$1")
    .match(/^(\d+(?:[.,]\d+)?)\s*(mlrd|млрд|mln|million|млн|ming|тыс\S*|k|к)?\.?$/);
  if(!m) return null;
  const unit = m[2] || "";
  const factor = /^(mlrd|млрд)/.test(unit) ? 1e9 : /^(mln|million|млн)/.test(unit) ? 1e6
    : unit ? 1e3 : 1;
  const n = Math.round(Number(m[1].replace(",", ".")) * factor);
  return Number.isFinite(n) && n >= 0 ? n : null;
}
const moneyNum = n => String(Math.round(Math.abs(n || 0)))
  .replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const moneyFmt = n => moneyNum(n) + " " + t("money_unit");
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

async function loadMoney(month){
  try{
    setState({money: await api("/api/money" + (month ? "?month=" + month : ""))});
  }catch(e){ setState({screenError:errorMessage(e)}); handleError(e); }
}

/* Where each category's money went this month, as one ring. */
function moneyDonut(cats, total){
  const R = 42, C = 2 * Math.PI * R;
  let offset = 0;
  const arcs = cats.map(c => {
    const len = c.spent / total * C;
    const arc = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${MONEY_TONE[c.id]}"
      stroke-width="18" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 60 60)"/>`;
    offset += len;
    return arc;
  }).join("");
  return `<div class="donut">
      <svg width="120" height="120" viewBox="0 0 120 120" role="img"
           aria-label="${t("money_spend_split")}">
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surface-2)"
                stroke-width="18"/>${arcs}</svg>
      <div class="lg">${cats.map(c => `<div class="ellipsis">
          <i style="background:${MONEY_TONE[c.id]}"></i>${t("mcat_" + c.id)}
          <span class="t2 num"> · ${Math.round(c.spent / total * 100)}%</span></div>`).join("")}
      </div></div>`;
}

function moneyRow(e, icons){
  const income = e.kind === "income";
  const label = e.note || t("mcat_" + e.category);
  return `<div class="item mrow">
      <span class="itile" style="font-size:17px">${icons[e.category] || "•"}</span>
      <div class="grow"><div class="ellipsis">${esc(label)}</div>
        <div class="meta">${t("mcat_" + e.category)} · <span class="num">${isoToLabel(e.day)}</span>
          ${e.source === "voice" ? icon("mic", 12) : ""}</div></div>
      <div class="amount ${income ? "pos" : "neg"}">${income ? "+" : "−"}${moneyNum(e.amount)}</div>
      <button class="iconbtn sm bare" data-act="money-del" data-id="${e.id}"
              aria-label="${t("delete")}">${icon("x", 15)}</button>
    </div>`;
}

/* Money, top to bottom: what you have, one line to add, then one of three
   views — the month's entries, where it went, and who owes whom. */
SCREENS.money = () => {
  const m = state.money;
  const tab = state.moneyTab || "entries";
  let h = `<div class="head"><h1 class="grow">${t("nav_money")}</h1>
      <button class="iconbtn add" data-act="${tab === "debts" ? "debt-add" : "money-add"}"
              aria-label="${t(tab === "debts" ? "debt_add" : "money_add")}">${icon("plus", 22)}</button></div>`;
  if(!m) return h + `<div class="spin"></div>`;
  const debts = m.debts || {open:[], settled:[], owed_to_me:0, i_owe:0, overdue:0};

  h += `<div class="mnav">
      <button class="iconbtn sm" data-act="money-month" data-delta="-1"
              aria-label="‹">${icon("back", 16)}</button>
      <b>${D().months[m.month_no - 1]} ${m.year}</b>
      <button class="iconbtn sm" data-act="money-month" data-delta="1" aria-label="›"
              ${m.is_current ? "disabled" : ""}>${icon("chevron", 16)}</button></div>`;

  h += `<div class="mhero">
      <div class="k">${icon("wallet", 15)} ${t("money_balance")}</div>
      <div class="v num ${m.balance < 0 ? "neg" : ""}">${m.balance < 0 ? "−" : ""}${moneyFmt(m.balance)}</div>
      <div class="mflow num">
        <span class="pos">↑ +${moneyNum(m.income)}</span>
        <span class="neg">↓ −${moneyNum(m.expense)}</span>
        <span class="t3">${t("money_this_month")}</span></div>
      ${debts.open.length ? `<div class="mdebt" data-act="money-tab" data-value="debts" role="button" tabindex="0">
        🤝 ${t("money_tab_debts")}: <span class="pos num">+${moneyNum(debts.owed_to_me)}</span>
        · <span class="neg num">−${moneyNum(debts.i_owe)}</span>
        ${debts.overdue ? `<span class="neg"> · ${t("debt_overdue_n", {n: debts.overdue})}</span>` : ""}</div>` : ""}
    </div>`;

  if(m.is_current) h += `<div class="mquick">
      <input id="money-text" placeholder="${t("money_quick_ph")}" maxlength="300"
             enterkeyhint="done" data-search="money-text-save" />
      ${SpeechRec || moneyVoiceViaAgent() ? `<button class="mic ${state.listening ? "on" : ""}" data-act="money-voice"
          aria-label="${t("money_voice")}">${icon("mic", 20)}</button>` : ""}
    </div>
    <div class="mkind">
      <button class="btn secondary neg" data-act="money-text-save" data-kind="expense">
        − ${t("money_expense")}</button>
      <button class="btn secondary pos" data-act="money-text-save" data-kind="income">
        + ${t("money_income")}</button>
    </div>`;

  h += `<div class="seg mtabs">${[["entries", t("money_tab_entries")], ["cats", t("money_tab_cats")],
      ["debts", t("money_tab_debts") + (debts.open.length ? ` · ${debts.open.length}` : "")]]
      .map(([id, label]) => `<div class="${tab === id ? "on" : ""}" data-act="money-tab"
        data-value="${id}">${label}</div>`).join("")}</div>`;

  if(tab === "cats") return h + moneyCats(m);
  if(tab === "debts") return h + debtsView(debts);

  h += m.entries.length ? m.entries.map(e => moneyRow(e, m.icons)).join("")
    : `<div class="empty">${t("money_empty")}</div>`;
  if(m.count > m.entries.length) h += `<div class="hint">${t("record_limit", {n:m.entries.length})}</div>
    <button class="btn secondary" data-act="set-account">${t("account")}</button>`;
  return h;
};

/* Where the month's money went, and each category against its limit. */
function moneyCats(m){
  const spent = m.categories.filter(c => c.spent > 0);
  let h = spent.length ? `<div class="card">${moneyDonut(spent, m.expense)}</div>` : "";
  h += `<div class="t3 tiny" style="margin:var(--s2) 0 var(--s1)">${t("money_limit_tap")}</div>`;
  h += `<div class="card">${m.categories.map(c => {
      const pct = c.limit ? Math.min(100, c.spent / c.limit * 100) : 0;
      return `<div class="mcat" data-act="money-budget" data-cat="${c.id}"
          data-limit="${c.limit}" role="button" tabindex="0">
        <div class="row"><span>${c.icon}</span>
          <div class="grow ellipsis">${t("mcat_" + c.id)}</div>
          <span class="amt ${c.over ? "over" : ""}">${moneyFmt(c.spent)}${
            c.limit ? ` / ${moneyFmt(c.limit)}` : ` · ${t("money_no_limit")}`}</span>
          <span class="medit" aria-hidden="true">${icon("edit", 15)}</span></div>
        ${c.limit ? `<div class="mbar"><span style="width:${pct}%;background:${
            c.over ? "var(--danger)" : MONEY_TONE[c.id]}"></span></div>` : ""}
        ${c.over ? `<div class="tiny" style="color:var(--danger);margin-top:4px">
            ${t("money_over", {n: moneyFmt(c.spent - c.limit)})}</div>` : ""}
      </div>`;}).join("")}</div>`;
  return h;
}

/* ---------- Debts ----------
   Who owes you and whom you owe, apart from the balance: lending is not
   spending. One tap closes a debt; part of it can come back too. */
function debtsView(d){
  let h = `<div class="mtiles">
      <div class="mtile"><div class="k">↙ ${t("debt_owed_to_me")}</div>
        <div class="v pos">${moneyFmt(d.owed_to_me)}</div></div>
      <div class="mtile"><div class="k">↗ ${t("debt_i_owe")}</div>
        <div class="v neg">${moneyFmt(d.i_owe)}</div></div>
    </div>
    <div style="height:var(--s2)"></div>`;
  if(!d.open.length) h += `<div class="empty">${t("debt_empty")}
      <button class="btn secondary sm" data-act="debt-add" style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("debt_add")}</button></div>`;
  h += d.open.map(debtRow).join("");
  if(d.settled.length) h += `<details style="margin-top:var(--s2)">
      <summary>${icon("chevron", 15)} ${t("debt_settled")} · ${d.settled.length}</summary>
      ${d.settled.map(debtRow).join("")}</details>`;
  if((d.archived || []).length) h += `<details style="margin-top:var(--s2)">
      <summary>${icon("chevron", 15)} ${t("debt_archived")} · ${d.archived.length}</summary>
      ${d.archived.map(debtRow).join("")}</details>`;
  return h;
}
function debtRow(x){
  const lent = x.direction === "lent";
  const meta = [t(lent ? "debt_lent_meta" : "debt_borrowed_meta"),
    x.due ? (x.overdue ? `<span class="neg">${t("debt_overdue")} · ${isoToLabel(x.due)}</span>`
                       : t("debt_until", {d: isoToLabel(x.due)})) : "",
    x.note ? esc(x.note) : ""].filter(Boolean).join(" · ");
  const done = x.settled || x.archived;
  return `<div class="item drow ${done ? "settled" : ""}" data-act="debt-open" data-id="${x.id}">
      ${done ? `<span class="check ${x.settled ? "on" : ""}" aria-hidden="true">${x.settled ? icon("check", 14) : ""}</span>`
        : `<button class="check" data-act="debt-settle" data-id="${x.id}"
           aria-label="${t("debt_returned")}" title="${t("debt_returned")}"></button>`}
      <div class="grow"><div class="ellipsis"><b>${esc(x.person)}</b></div>

let recognition = null;
/* The phone app's WebView, like Telegram's on Android, has no browser speech
   recognition. There the mic goes to the voice agent, which hears on the
   server and understands money too ("Tushlik 45 ming"), always with a card
   to confirm. */
const moneyVoiceViaAgent = () => (IS_APP || !SpeechRec) && Boolean(state.me?.agent?.available);
function moneyVoice(){
  if(moneyVoiceViaAgent()) return A["voice-start"]();
  if(!SpeechRec) return toast(t("money_voice_none"));
  if(state.listening){ try{ recognition?.stop(); }catch(_){} return; }
  recognition = new SpeechRec();
  recognition.lang = {uz:"uz-UZ", en:"en-US", ru:"ru-RU"}[state.lang] || "uz-UZ";
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  let heard = "";
  recognition.onresult = ev => {
    let text = "";
    for(const r of ev.results) text += r[0].transcript;
    heard = text;
    const input = document.getElementById("money-text");
    if(input) input.value = text;
  };
  recognition.onerror = ev => {
    state.listening = false; render();
    toast(ev.error === "not-allowed" ? t("money_voice_denied") : t("money_voice_fail"));
  };
  recognition.onend = () => {
    state.listening = false;
    render();
    if(heard.trim()) moneyText(heard.trim(), "voice");
  };
  try{ recognition.start(); state.listening = true; render(); }
  catch(_){ toast(t("money_voice_fail")); }
}

/* ---------- Voice: tap the mic, speak, tap stop → a card to confirm ----------
   The same agent as the bot: the server hears, understands and proposes; the
   app shows the card; nothing is written until ✅. Where the WebView cannot
   record, the mic opens the bot chat instead, which always can. */
const voice = {rec:null, stream:null, chunks:[], mime:"", timer:null, started:0, cancelled:false, draft:null,
               target:"agent"};
const VOICE_MAX_S = 119;
function voiceSupported(){
  return !!(navigator.mediaDevices?.getUserMedia && typeof MediaRecorder !== "undefined");
}
function voiceStopTracks(){
  try{ voice.stream?.getTracks().forEach(tr => tr.stop()); }catch(_){}
  voice.stream = null; clearInterval(voice.timer); voice.timer = null;
}
/* Two different wishes: "stop and analyse" (voice-stop) and "never mind"
   (this). Abandoning cancels the recorder and the timer, releases the mic,
   and makes any answer still on its way land nowhere: `voice.session` moves
   on, and voiceSend only shows a result for the session that asked. */
function voiceAbandon(){
  voice.session = (voice.session || 0) + 1;
  voice.cancelled = true;
  try{ if(voice.rec && voice.rec.state !== "inactive") voice.rec.stop(); }catch(_){}
  voice.rec = null;
  voice.chunks = [];
  voiceStopTracks();
}
function voiceRecordingSheet(){
  return `<div class="voice-box">
      <div class="voice-pulse">${icon("mic", 34)}</div>
      <div class="voice-time num" id="voice-time">0:00</div>
      <div class="t2 small">${t("voice_listening")}</div>
      <button class="btn voice-stop" data-act="voice-stop">■ ${t("voice_stop")}</button>
      <button class="btn secondary" data-act="voice-cancel" style="margin-top:8px">${t("cancel")}</button>
    </div>`;
}
function voiceBusySheet(){
  return `<div class="voice-box"><div class="spin"></div>
      <div class="t2 small" style="margin-top:10px">${t("voice_thinking")}</div></div>`;
}
/* One field of the proposal fixed by hand — the hour, the date, the name —
   without asking the AI again; and a box to answer its question in words
   (audit #29). */
const VOICE_FIELD_INPUT = {deadline:"date", day:"date", due_time:"time", remind_at:"time", amount:"number"};
function voiceEditFields(d){
  if(d.status !== "ready" || !(d.editable || []).length) return "";
  return `<details class="voice-edit" style="margin:8px 0">
      <summary>✏️ ${t("voice_edit")}</summary>
      ${d.editable.map(item => Object.entries(item.fields).map(([field, value]) => {
        const id = `ve-${item.index}-${field}`;
        const input = field === "priority"
          ? `<select id="${id}" data-orig="${esc(value || "")}">${["low", "medium", "high"].map(p =>
              `<option value="${p}" ${p === value ? "selected" : ""}>${t(p)}</option>`).join("")}</select>`
          : `<input id="${id}" type="${VOICE_FIELD_INPUT[field] || "text"}" value="${esc(value ?? "")}"
               data-orig="${esc(value ?? "")}" />`;
        return `<label>${t("ve_" + field)}</label>${input}`;
      }).join("")).join("")}
      <button class="btn secondary" data-act="voice-edit-save" style="margin-top:10px">${t("save")}</button>
    </details>`;
}
function voiceCardSheet(d){
  const body = d.message ? esc(d.message) : (d.preview || "").replace(/\n/g, "<br>");
  const ready = d.status === "ready";
  const answer = d.status === "needs_input" && d.id ? `
    <textarea id="voice-answer" style="min-height:64px;margin-top:8px" placeholder="${t("voice_answer_ph")}"></textarea>
    <button class="btn" data-act="voice-answer" style="margin-top:8px">${t("voice_send")}</button>` : "";
  return `<div class="voice-card">${body}</div>${voiceEditFields(d)}${answer}
    ${ready ? `<button class="btn" data-act="voice-confirm">✅ ${t("voice_confirm")}</button>` : ""}
    ${d.status === "failed" && keptVoice() ? `<button class="btn" data-act="voice-resend">↻ ${t("voice_resend")}</button>` : ""}
    <div class="voice-row">
      <button class="btn secondary" data-act="voice-retry">🔄 ${t("voice_retry")}</button>
      <button class="btn secondary" data-act="voice-dismiss">✖ ${t("cancel")}</button>
    </div>`;
}
/* The recording is kept (in memory only, for at most ten minutes) until the
   server has answered, so a dropped connection is "send it again", not
   "say it all again" (audit #28). The same request key goes with a resend,
   so a first attempt that did reach the server is not done twice. */
const VOICE_KEEP_MS = 10 * 60 * 1000;
function keptVoice(){
  const k = voice.kept;
  if(k && Date.now() - k.at > VOICE_KEEP_MS) voice.kept = null;
  return voice.kept;
}
async function voiceSend(resend){
  const kept = resend ? keptVoice() : null;
  if(resend && !kept) return A["voice-start"]();
  if(!kept) voice.kept = {blob: new Blob(voice.chunks, {type: voice.mime}), mime: voice.mime,
                          target: voice.target, key: newKey(), at: Date.now()};
  const {blob, mime, target, key} = voice.kept;
  voice.chunks = [];
  const session = voice.session;
  openSheet(voiceBusySheet(), "voice");
  // An answer for a sheet the person has since closed shows nowhere.
  const stillHere = () => session === voice.session && state.sheetView === "voice";
  const journal = target === "journal";
  try{
    const res = await fetch(journal ? "/api/agent/journal/audio" : "/api/agent/audio", {method:"POST", body:blob,
      signal: requestTimeout(150000),
      headers:{"Content-Type": mime.split(";")[0] || "audio/webm",
               "X-Telegram-Init-Data": tg?.initData || "", "X-Agent-Request-Key": key}});
    if(!res.ok){
      const err = new Error("http_" + res.status); err.status = res.status;
      try{ err.body = await res.json(); err.detail = err.body?.detail; }catch(_){}
      throw err;
    }
    voice.kept = null;
    const answer = await res.json();
    if(!stillHere()) return;
    if(journal) return journalFilled(answer);
    voice.draft = answer;
    openSheet(voiceCardSheet(voice.draft), "voice");
    notify(voice.draft.status === "ready" ? "success" : "warning");
  }catch(e){
    if(!stillHere()) return;
    voice.draft = null;
    // A refusal the same audio cannot fix (too long, no consent) drops it.
    if(e.status === 413 || e.detail === "consent_required") voice.kept = null;
    openSheet(voiceCardSheet({status:"failed", message: e.detail === "consent_required"
      ? t("voice_consent_needed") : e.status === 413 ? t("voice_too_long") : t("voice_failed")}), "voice");
  }
}

/* One parser for both places: the server reads date and time out of the
   line, and a shared task is saved with exactly what a private one would
   get (audit #23). A bare time that has already passed today is asked
   about rather than guessed (audit #49). */
async function quickTask(title, dest, deadline){
  let got = null;
  if(dest.team){
    /* Parse first (writes nothing, costs nothing), then create inside save()
       so the create — not the parse — carries the idempotency key. */
    try{ got = await api("/api/quick/parse", {method:"POST", body:{title}}); }
    catch(e){ return handleError(e); }
    if(deadline) got = {...got, ask: null, deadline};
    if(got.ask === "past_time") return askQuickDay(got, title);
    const body = {title: got.title || title, deadline: got.deadline || todayISO(),
                  due_time: got.due_time || null};
    return save(() => api(`/api/teams/${dest.id}/tasks`, {method:"POST", body}),
                state.screen, false, quickSaved(got), {body});
  }
  save(async () => { got = await api("/api/quick", {method:"POST", body:{title, deadline: deadline || null}}); },
       state.screen, true, undefined, {body:{title}}).then(() => {
    if(got?.money) return moneyText(title, "manual");
    if(got?.ask === "past_time") return askQuickDay(got, title);
    if(got?.id) toast(quickSaved(got));
  });
}
function askQuickDay(got, title){
  const [today, tomorrow] = got.options || [];
  openSheet(`<h3>${t("quick_past_q", {time: esc(got.due_time || "")})}</h3>
    <div class="t2 small">${esc(got.title)}</div>
    <div class="btns" style="margin-top:var(--s3)">
      <button class="btn secondary" data-act="quick-day" data-value="${today}" data-title="${esc(title)}">
        ${t("today")} ${esc(got.due_time || "")}</button>
      <button class="btn" data-act="quick-day" data-value="${tomorrow}" data-title="${esc(title)}">
        ${t("tomorrow")} ${esc(got.due_time || "")}</button></div>`);
}

/* What quick add understood, said back: "Saved: hisobot · Tomorrow 10:00". */
function quickSaved(r){
  const today = todayISO();

  const tomorrow = next.toISOString().slice(0, 10);
  const day = !r.deadline ? "" : r.deadline === today ? t("today")
    : r.deadline === tomorrow ? t("tomorrow") : r.deadline.split("-").reverse().join(".");

/* ---------- Statistics ----------

SCREENS.stats = () => {
  const st = state.stats;

     withheld the size — and the size is the whole question. Yesterday's own
     score is printed underneath, because "+12%" is only meaningful next to
     what it moved from. */
  const yesterday = today.yesterday;
  const known = yesterday !== null && yesterday !== undefined;
  const change = known ? today.overall - yesterday : null;
  const dir = !known || change === 0 ? "flat" : change > 0 ? "up" : "down";

        ${known
          ? `<b>${TREND_ICON[dir] || ""}${change > 0 ? "+" : ""}${change} ${t("pts")}</b>
             ${t("vs_yesterday")} <span class="t2">(${yesterday}%)</span>`

      ${today.main ? `<div class="small" style="margin-top:var(--s2)">

    </div>`;

  /* The three parts of today, each its own block in its own hue — the same
     three, in the same three colours, as on Home, so the two screens teach one

  /* A percentage never stands alone: under it, the counts it came from

  const sum = state.summary?.today || {};
  const tile = (key, label, value, percent, delta, count) => `

  // The series are togglable, because four lines at once is a mess and
