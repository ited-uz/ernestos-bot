function teamTodayTab(team, board){
  const todayRows = board.periods?.day || [];
  const pairDone = todayRows.reduce((n, r) => n + r.done, 0);
  const pairTotal = todayRows.reduce((n, r) => n + r.total, 0);
  const pairPct = pairTotal ? Math.round(pairDone / pairTotal * 100) : null;
  const head = `<div class="card">
      <div class="row" style="padding:0 0 10px">
        <div class="grow">
          <div class="card-t" style="margin:0">${t("team_today")}</div>
          <div class="muted sm">${teamUnits(board.units)}</div>
        </div>
        <b class="band-${bandOf(pairPct)}" style="font-size:30px">${
          pairPct === null ? "—" : pairPct + "%"}</b>
      </div>
      ${todayRows.map(r => memberLine(r, {tight:true})).join("")}
    </div>`;

  // What is still open today, each with your own box when it is yours.
  const me = state.me?.telegram_id;
  const nameOf = id => esc((board.members || []).find(m => m.user_id === id)?.name || "?");
  const full = x => ((x.kind === "task" ? team.tasks : team.habits) || [])
      .find(r => r.id === x.id)
    || {...x, owed: (x.missing || []).includes(me) || (x.done_by || []).includes(me),
        done: (x.done_by || []).includes(me)};
  const open = (board.open || []).map(x => `<div class="row" style="padding:6px 0">
      ${teamBox({...full(x), mirrored: x.mirrored}, x.kind)}
      <div class="grow">${icon(x.kind === "task" ? "list" : "check", 15)} ${esc(x.title)}
        <div class="muted sm">${(x.missing || []).map(nameOf).join(" · ")}</div></div>
    </div>`).join("");
  const done = (board.done || []).map(x => `
    <div class="row" style="opacity:.55;padding:4px 0">
      <span class="itile sm">${icon("check", 13)}</span>
      <div class="grow done">${esc(x.title)}</div>
    </div>`).join("");
  const work = `<div class="card">
      <div class="row" style="padding:0 0 6px">
        <div class="card-t grow" style="margin:0">${t("team_left_today")}</div>
        <span class="muted sm">${board.open_count || 0}</span>
      </div>
      ${open || `<div class="muted">${t("team_all_clear")}</div>`}
      ${done}
    </div>`;

  const cds = team.countdowns || [];
  const countdowns = `<h2>${icon("calendar", 16)} ${t("date_cd")}
      <span class="act" data-act="cd-add" data-team="${team.id}">${icon("plus", 15)}
        ${t("add")}</span></h2>
    ${cds.length ? countdownRows(cds) : `<div class="empty">${t("countdown_empty")}</div>`}
    <div class="hub">
      <button class="btn secondary" data-act="tc-open">${icon("clock", 16)} ${t("time_cd")}</button>
      <button class="btn secondary" data-act="dc-open">${icon("calendar", 16)} ${t("date_cd")}</button>
    </div>`;
  return head + work + countdowns;
}

function teamWorkTab(team, board){
  return `<div class="card">
      <div class="card-t">${t("team_tasks")}</div>
      ${(team.tasks || []).map(x => sharedRow(x, "task", x.title, board, team)).join("")
        || `<div class="muted">${t("team_nothing")}</div>`}
      <button class="btn secondary" data-act="team-add" data-kind="task"
              style="margin-top:10px">+ ${t("team_add_task")}</button>
    </div>
    <div class="card">
      <div class="card-t">${t("team_habits")}</div>
      ${(team.habits || []).map(x => sharedRow(x, "habit", x.name, board, team)).join("")
        || `<div class="muted">${t("team_nothing")}</div>`}
      <button class="btn secondary" data-act="team-add" data-kind="habit"
              style="margin-top:10px">+ ${t("team_add_habit")}</button>
    </div>
    ${teamProjectsBlock(team)}`;
}

function teamResultsTab(team, board){
  const periods = ["day", "week", "month"].map(key => {
    const rows = board.periods?.[key] || [];
    const gotDone = rows.reduce((n, r) => n + r.done, 0);
    const gotTotal = rows.reduce((n, r) => n + r.total, 0);
    const pct = gotTotal ? Math.round(gotDone / gotTotal * 100) : null;
    const delta = rows.map(r => r.delta).filter(d => d !== null && d !== undefined);
    const avg = delta.length
      ? Math.round(delta.reduce((a, b) => a + b, 0) / delta.length) : null;
    const label = {day: t("team_p_day"), week: t("team_p_week"),
                   month: t("team_p_month")}[key];
    return `<div class="row">
        <div class="grow">${label}</div>
        <div class="muted sm" style="width:58px;text-align:right">${gotDone}/${gotTotal}</div>
        ${teamDelta(avg)}
        <div style="width:50px;text-align:right">
          <b class="band-${bandOf(pct)}">${pct === null ? "—" : pct + "%"}</b></div>
      </div>`;
  }).join("");
  const members = ["week", "month"].map(key => {
    const rows = board.periods?.[key] || [];
    if(!rows.length) return "";
    return `<div class="card"><div class="card-t">${
      t(key === "week" ? "team_p_week" : "team_p_month")}</div>
      ${rows.map(r => memberLine(r)).join("")}</div>`;
  }).join("");
  const log = state.teamActivity?.[team.id];
  if(!log) loadTeamActivity(team.id);
  const activity = `<h2>${t("activity")}</h2>` + (log
    ? (log.length ? `<div class="card">${log.map(activityRow).join("")}</div>`
                  : `<div class="empty">${t("empty")}</div>`)
    : `<div class="card"><div class="spin"></div></div>`);
  return `<div class="card"><div class="card-t">${t("team_results")}</div>
      <div class="muted sm" style="margin-bottom:6px">${teamUnits(board.units)}</div>
      ${periods}</div>` + members + activity;
}

async function loadTeamActivity(teamId){
  state.teamActivity ||= {};
  if(state.teamActivityLoading === teamId) return;
  state.teamActivityLoading = teamId;
  try{
    state.teamActivity[teamId] = (await api(`/api/teams/${teamId}/activity`)).activity || [];
  }catch(_){ state.teamActivity[teamId] = []; }
  state.teamActivityLoading = null;
  if(state.screen === "team") render();
}

function shortMoment(iso){
  if(!iso) return "";
  const d = new Date(/[zZ]|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + "Z");
  if(isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return `${d.getDate()} ${D().months[d.getMonth()]} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* Who changed what, and — for anything taken off the list — a way back (#26). */
function activityRow(a){
  const key = `act_${a.action}`;
  const verb = t(key);
  return `<div class="row" style="padding:6px 0">
      <div class="grow"><b>${esc(a.who)}</b> ${esc(verb === key ? a.action : verb)}
        ${a.subject ? `<span class="muted">· ${esc(a.subject)}</span>` : ""}
        <div class="muted sm">${shortMoment(a.at)}</div></div>
      ${a.restorable ? `<button class="btn sm secondary" data-act="team-restore"
          data-kind="${a.kind}" data-id="${a.item_id}">${t("restore")}</button>` : ""}
    </div>`;
}

/* One shared item: your own box on the left — the only tick you can move —
   and everybody else's state named on the right. */
/* The team's shelves. Same object a personal project is, so the row reads
   the same way — name, progress, a coloured bar. */
function teamProjectsBlock(team){
  const projects = team?.projects || [];
  return `<div class="card">
      <div class="card-t">${t("projects")}</div>
      ${projects.map(p => `
        <div class="row" data-act="team-project-open" data-id="${p.id}">
          <div class="grow"><b>${esc(p.name)}</b>
            <div class="muted sm">${p.tasks_done}/${p.tasks_total}</div>
            <div class="bar" style="margin-top:4px">
              <i class="band-${bandOf(p.percent)}" style="width:${p.percent}%"></i></div>
          </div>
          <div style="width:48px;text-align:right">
            <b class="band-${bandOf(p.percent)}">${p.percent}%</b></div>
        </div>`).join("") || `<div class="muted">${t("team_no_projects")}</div>`}
      <button class="btn secondary" data-act="team-project-new"
              style="margin-top:10px">+ ${t("team_add_project")}</button>
    </div>`;
}

/* The box beside a shared item, which is only ever the reader's own share.
   A mirrored ritual is read from the member's own habit and cannot be ticked
   here; a task named for other people has no box for you; a timed item
   starts its clock instead. Green only when *your* share is done (#17). */
function teamBox(x, kind){
  const label = x.title || x.name || "";
  if(x.mirrored)
    return `<div class="check lock ${x.done ? "on" : ""}" data-act="mirrored-note"
      role="img" tabindex="0" aria-label="${esc(t("habit_mirrored"))}">${
        x.done ? icon("check", 14) : ""}</div>`;
  if(x.owed === false || (kind === "habit" && x.due === false))
    return `<div class="check lock" aria-hidden="true"></div>`;
  if(x.timer_minutes && !x.done)
    return `<div class="check timed" data-act="timer-open"
      data-kind="${kind === "task" ? "ttask" : "thabit"}" data-id="${x.id}"
      role="button" tabindex="0" aria-label="${t("timer")} · ${esc(label)}">${
        icon("clock", 14)}</div>`;
  return checkBox(x.done, `data-act="team-toggle" data-kind="${kind}" data-id="${x.id}"`, label);
}

/* A checkbox a screen reader and a keyboard can use as one (#20). */
function checkBox(on, attrs, label){
  return `<div class="check ${on ? "on" : ""}" ${attrs} role="checkbox" tabindex="0"
      aria-checked="${on ? "true" : "false"}"
      aria-label="${esc(label || t("now_done"))}">${icon("check", 14)}</div>`;
}

function teamItemMeta(x, kind){
  const meta = [];
  if(kind === "task"){
    if(x.completion && x.completion !== "all")
      meta.push(t(`completion_${x.completion}`)
        + (x.completion === "assignees" && (x.assignee_names || []).length
            ? ` · ${x.assignee_names.map(esc).join(", ")}` : ""));
    if(x.deadline) meta.push(`<span class="num">${isoToLabel(x.deadline)}</span>`);
    if(x.owed === false) meta.push(t("not_assigned"));
  }
  if(x.mirrored) meta.push(icon("shield", 12));
  if(x.timer_minutes) meta.push(timerMeta(x));
  if(x.countdown && x.countdown.days_left >= 0) meta.push(`⏳ ${cdLeft(x.countdown)}`);
  return meta;
}

function sharedRow(x, kind, label, board, team){
  const me = state.me?.telegram_id;
  const others = (board?.members || []).filter(m => m.user_id !== me);
  const marks = others.map(m => {
    const got = (x.done_by || []).includes(m.user_id);
    return `<span class="${got ? "band-great" : "muted"}" style="font-size:12px">${
      got ? "✓" : "○"} ${esc(m.name)}</span>`;
  }).join(" ");
  const meta = teamItemMeta(x, kind);
  const canRemove = !x.protected && !x.mirrored
    && (x.created_by === me || team?.permissions?.manage_items);
  return `<div class="row" style="padding:6px 0">
      ${teamBox(x, kind)}
      <div class="grow" data-act="${kind === "task" ? "team-task-open" : "team-habit-open"}"
           data-id="${x.id}" role="button" tabindex="0">
        <div class="${x.done ? "done" : ""}">${esc(label)}</div>
        ${meta.length ? `<div class="muted sm">${meta.join(" · ")}</div>` : ""}
        ${marks ? `<div class="muted sm">${marks}</div>` : ""}
      </div>
      ${canRemove ? `<button class="ghost" data-act="team-remove" data-kind="${kind}"
          data-id="${x.id}" aria-label="${t("delete")}">✕</button>` : ""}
    </div>`;
}

SCREENS.habits = () => {
  /* Only the modules somebody chose have a tab (#22). */
  const mods = state.me?.modules || state.home?.modules || {};
  const tabs = [["habits","habits"],
                ...(mods.prayer === false ? [] : [["prayer","prayer"]]),
                ...(mods.journal === false ? [] : [["journal","journal"]])];
  if(!tabs.some(([id]) => id === state.tab)) state.tab = "habits";
  let h = `<h1>${t(state.tab)}</h1>
    <div class="seg" style="margin:12px 0 14px">
      ${tabs.map(([id, key]) => `<div class="${state.tab === id ? "on" : ""}"
        data-act="tab" data-tab="${id}">${t(key)}</div>`).join("")}
    </div>`;
  if(state.tab === "prayer") return h + prayerTab();
  if(state.tab === "journal") return h + journalTab();
  // Shared habits are inside the tier groups now, not appended underneath.
  return h + habitsTab();
};

const TIERS = {non_negotiable:"t1", target:"t2", bonus:"t3"};

function habitsTab(){
  const data = state.habits;
  if(!data) return `<div class="spin"></div>`;

  if(state.reorderMode) return `<div class="t2 small"
      style="margin-bottom:10px">${t("reorder_hint")}</div>`
    + reorderList()
    + `<button class="btn" data-act="reorder-off"
         style="margin-top:14px">${t("finish")}</button>`;

  /* Today's habits and the streak, in one block at the top: the count is the
     thing being worked on and the streak is why it is worth working on, so
     they belong to each other rather than to two separate cards. */
  /* Every habit owed today, personal and shared, because that is what the
     percentage underneath is built from. Counting only the private ones made
     the card disagree with the score on Home. */
  const everything = Object.values(data.grouped || {}).flat();
  const due = (everything.length ? everything : data.habits).filter(x => x.due);
  const done = due.filter(x => x.done).length;
  /* Two different questions, and the card answers both rather than picking
     one. "4/6" is how many habits are ticked — a count, and the only honest
     way to describe a list. The percentage is what those ticks are worth once
     the tiers are weighted, which is the number the overall score on Home is
     built from. They disagree on purpose: four bonus habits out of six is not
     67% of a day. The weighted figure comes from the API so there is only ever
     one copy of the formula. */
  const tiers = data.tiers || {};
  const live = Object.values(tiers).reduce(
    (n, x) => n + (x.due ? x.weight : 0), 0);
  const percent = live
    ? Math.round(Object.values(tiers).reduce(
        (n, x) => n + (x.due ? x.weight * x.done / x.due : 0), 0) / live * 100)
    : (due.length ? Math.round(done / due.length * 100) : 0);

  let h = timerBanner(data.active_timer) + `<div class="tinted block tone-5">
      <div class="bh">
        <span class="itile lg">${icon("check", 18)}</span>
        <div class="grow"><div class="bt">${t("today")}</div>
          <div class="t2 tiny">${done}/${due.length} · ${percent}%</div></div>
        ${data.streak ? `<div style="text-align:right">
          <div class="num" style="font-size:19px;font-weight:700">
            ${icon("flame", 17)} ${data.streak}</div>
          <div class="t3 tiny">${t("streak")}</div></div>` : ""}
      </div>
      <div style="margin-top:var(--s2)">${bar(percent)}</div>
    </div>`;

  // The wake-up control sits in the habit it belongs to, and it is a
  // real button rather than an instruction to go and use the chat.
  const anyDue = due.length > 0;

  /* One hue per tier, so the non-negotiable ones are visibly not the bonus
     ones — which is the entire distinction the three tiers exist to draw. */
  const TIER_TONE = {non_negotiable:"tone-1", target:"tone-5", bonus:"tone-3"};
  const TIER_ICON = {non_negotiable:"target", target:"up", bonus:"plus"};

  /* Each tier says what it is worth. The three tiers used to be labels only —
     a heading that claimed one group mattered more, over a score that counted
     every habit the same — so the badge is not decoration, it is the screen
     finally agreeing with its own arithmetic. The number is the *applied*
     weight from the API, renormalised over the tiers that actually have a
     habit due today, so three non-negotiable habits and nothing else reads
     100% rather than a permanently unreachable 50%. */
  data.categories.forEach(cat => {
    const items = (data.grouped[cat] || []);
    if(!items.length) return;
    const tier = data.tiers?.[cat];
    const badge = tier && tier.due
      ? `<span class="wt num">${tier.done}/${tier.due} · ${tier.applied}%</span>`
      : "";
    h += sectionHead(TIER_TONE[cat] || "tone-1", TIER_ICON[cat] || "check",
                     t(cat), badge);
    h += items.map(x => habitRow(x, cat, data.wake)).join("");
  });

  if(!anyDue) h += `<div class="empty">${t("no_habits_today")}</div>`;

  // Editing, pausing and deleting a habit all live in the habit's own
  // sheet, one tap in. A screen-wide "delete mode" made removal as
  // prominent as ticking, and a mis-tap there costs every log the habit
  // ever had.
  h += `<div class="btns">
      <button class="btn" data-act="habit-add">
        ${icon("plus", 16)} ${t("add_habit")}</button>
      <button class="btn secondary" data-act="reorder-on">
        ${icon("drag", 16)} ${t("reorder")}</button>
    </div>`;
  return h;
}

function habitRow(x, cat, wake){
  if(x.paused){
    return `<div class="item ${TIERS[cat]} off">
        <div class="grow"><div class="ellipsis">${esc(x.name)}</div>
          <div class="meta">${t("paused")}</div></div>
        <button class="btn secondary sm" data-act="habit-resume" data-id="${x.id}">
          ${icon("play", 15)} ${t("resume")}</button></div>`;
  }

  // Only the personal wake-up owns the "Turdim" button: it writes the
  // workspace's wake log, and offering it on a shared row would tick the
  // wrong thing.
  const isWake = x.system_key === "wakeup" && x.source !== "team";
  // A wake-up that has not happened yet gets the button; once it has, the
  // row shows the time it actually happened.
  const wakeBtn = isWake && wake && !wake.logged
    ? `<button class="btn sm" data-act="wake">${icon("sun", 16)} ${t("wake_btn")}</button>
       <button class="iconbtn sm" data-act="wake-at"
               aria-label="${t("wake_enter")}">${icon("clock", 15)}</button>` : "";
  const wakeMeta = isWake && wake && wake.logged
    ? (wake.done
        ? t("wake_done_at", {time: wake.at || wake.now})
        : t("wake_late_at", {time: wake.at || wake.now}))
    : isWake && x.target_time ? `${t("wake_target")} ${x.target_time}` : "";

  const meta = [];
  /* Where this habit lives, on every row rather than only the shared ones.
     Labelling just one kind makes the other look like the default and the
     shared one like an exception, which is the opposite of the point: they
     are the same kind of commitment and they score the same. */
  meta.push(x.source === "team" ? `${icon("users", 14)} ${esc(x.team_name || "")}`
                                : t("src_personal"));
  if(wakeMeta) meta.push(wakeMeta);
  else if(!x.due) meta.push(t("not_today"));
  // Each derived habit names the module it actually mirrors. Every one of
  // them used to say "from the Prayer section", so the journal habit sent
  // the reader to the wrong screen.
  // `protected` means two different things. On a personal habit it means
  // "derived" — the prayer and journal modules tick it, so the row explains
  // where it comes from and its box is locked. On a shared one it only means
  // "cannot be deleted": both members tick it by hand, like any other.
  else if(x.protected && x.source !== "team")
    meta.push(t(x.system_key === "journal" ? "habit_auto_journal"
                                           : "habit_auto_prayer"));
  if(x.remind_at) meta.push(`${icon("bell", 12)} ${x.remind_at}`);
  if(x.schedule !== "daily" && !isWake) meta.push(scheduleLabel(x));
  const shared = x.source === "team";
  const timed = !x.protected && !x.mirrored && Boolean(x.timer_minutes);
  if(timed) meta.push(timerMeta(x));

  /* A shared habit's box is the reader's own share — a mirrored ritual is
     read from their personal habit and never ticked twice. */
  const box = shared ? teamBox(x, "habit")
    : !x.due
      ? `<div class="check lock" aria-hidden="true"></div>`
    /* Done by its timer: the box starts the clock instead of ticking. Once
       the timer has done its part the box is an ordinary one again. */
    : timed && !x.done
      ? `<div class="check timed" data-act="timer-open" data-kind="habit"
             data-id="${x.id}" role="button" tabindex="0"
             aria-label="${t("timer")} · ${esc(x.name)}">${icon("clock", 14)}</div>`
    : x.protected
      ? `<div class="check ${x.done ? "on" : ""} lock" data-act="auto-habit"
             role="img" tabindex="0" aria-label="${esc(t("auto_habit"))}">${
               x.done ? icon("check", 14) : ""}</div>`
      : checkBox(x.done, `data-act="habit-toggle" data-id="${x.id}"`, x.name);

  // A shared habit opens its own sheet, exactly as a private one does.
  // Sending the reader to the Team tab instead answered a question they had
  // not asked and lost the one they had: how is this habit going.
  const open = shared ? `data-act="team-habit-open" data-id="${x.id}"`
                      : `data-act="habit-open" data-id="${x.id}"`;
  return `<div class="item ${TIERS[cat]} ${x.due ? "" : "off"}">
      ${box}
      <div class="grow" ${open}>
        <div class="ellipsis">${esc(x.name)}</div>
        ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
      </div>
      ${wakeBtn || `<button class="iconbtn sm plain" ${open}
          aria-label="${t("edit")}">${icon("chevron", 16)}</button>`}
    </div>`;
}

function scheduleLabel(x){
  if(x.schedule === "weekdays") return t("weekdays_only");
  if(x.schedule === "daily") return t("every_day");
  return (x.days || []).map(d => D().dow[d]).join(" ");
}

/* Reordering shows one flat list, not the three tiers: dragging between
   tiers would silently change a habit's category. The Up/Down buttons
   are not a fallback for the drag — they are the accessible way to do
   it, and they work with one thumb. */
function reorderList(){
  const items = state.habits?.habits || [];
  return items.map((x, i) => `
    <div class="item" data-drag-id="${x.id}" data-index="${i}">
      <div class="handle" aria-hidden="true"
           style="cursor:grab;touch-action:none;color:var(--text-3)">
        ${icon("drag", 18)}</div>
      <div class="grow ellipsis">${esc(x.name)}</div>
      <button class="iconbtn sm" data-act="habit-up" data-index="${i}"
              aria-label="${t("move_up")}" ${i === 0 ? "disabled" : ""}
              >${icon("up", 15)}</button>
      <button class="iconbtn sm" data-act="habit-down" data-index="${i}"
              aria-label="${t("move_down")}"
              ${i === items.length - 1 ? "disabled" : ""}>${icon("down", 15)}</button>
    </div>`).join("");
}

/* ---------- prayer ----------
   Five compact rows, not five decorated cards. Entering five prayers is
   a five-tap job and the UI should not make it feel like a form. */
function prayerTab(){
  const p = state.prayer;
  if(!p) return `<div class="spin"></div>`;

  // Gender is only asked here, only once, and only because the set of
  // statuses genuinely differs. The reason is on screen with the
  // question rather than buried in Settings.
  if(!state.me?.gender){
    return `<div class="card">
        <b>${t("ask_gender")}</b>
        <div class="t2 small" style="margin-top:4px">${t("ask_gender_why")}</div>
        <div class="btns">
          <button class="btn secondary" data-act="set-gender" data-value="male">
            ${t("male")}</button>
          <button class="btn secondary" data-act="set-gender" data-value="female">
            ${t("female")}</button>
        </div></div>`;
  }

  const ICON = {bomdod:"🌅", peshin:"☀️", asr:"🌤", shom:"🌆", xufton:"🌙"};
  const female = state.me?.gender === "female";
  let h = "";

  if(female){
    h += `<div class="item" data-act="excused" style="min-height:46px">
        <div class="check ${p.excused ? "on" : ""}">${icon("check", 14)}</div>
        <div class="grow">${t("excused")}</div></div>`;
  }

  /* One quiet line, above the five rows rather than under them, because it is
     only worth anything if it is read *before* the tapping starts. Deliberately
     small, grey and unpunctuated by an icon: this screen records something
     between the user and their own conscience, and nothing here is checked,
     shared or reported. A loud banner would read as the app doubting them,
     which is the opposite of the point. */
  h += `<div class="t3 tiny wrap" style="margin:var(--s2) 0 var(--s1)">
      ${t("prayer_honesty")}</div>`;

  h += `<div class="card">`;
  ["bomdod","peshin","asr","shom","xufton"].forEach(name => {
    const cur = p.prayers[name];
    h += `<div class="prow">
        <div class="pn"><span class="ellipsis">${t(name)}</span></div>
        <div class="ps">${p.statuses.map(st =>
          `<div class="st ${st} ${cur === st ? "on" : ""}" data-act="prayer"
            data-prayer="${name}" data-status="${st}">${t(st)}</div>`).join("")}
          ${cur ? `<div class="st" data-act="prayer-clear" data-prayer="${name}"
            aria-label="${t("prayer_clear")}">${icon("x", 13)}</div>` : ""}
        </div></div>`;
  });
  h += `</div>`;

  /* Two numbers, never merged: how many were prayed, and how well they were
     prayed. Each in a block of its own — they are measured differently and
     merging them into one figure is how a five-out-of-five day and a
     five-late day end up looking the same. The bar tracks the first, because
     that is the one the `5x namoz` habit turns on. */
  const performed = Math.round(p.performed / p.required * 100);
  h += `<div class="tiles" style="margin-top:var(--s2)">
      <div class="tinted tile tone-3" style="grid-column:span 2">
        <span class="itile">${icon("moon", 17)}</span>
        <div class="k ellipsis">${t("performed")}</div>
        <div class="v num">${p.performed} / ${p.required}
          ${p.complete ? `<span class="delta up">✓</span>` : ""}</div>
        ${bar(performed)}
      </div>
      <div class="tinted tile tone-2">
        <span class="itile">${icon("chart", 17)}</span>
        <div class="k ellipsis">${t("score")}</div>
        <div class="v num">${p.score}/${p.max}</div>
      </div>
    </div>
    <div class="t2 small" style="margin-top:var(--s2)">
      ${p.complete ? `✓ ${t("full_day")}`
        : t("performed_of", {done:p.performed, total:p.required})}</div>`;
  return h;
}

/* ---------- journal ----------
   Not homework. Whatever is written is saved, the count is stated
   plainly, and nothing on this screen calls an unfinished entry a
   failure. Drafts survive Telegram being closed mid-sentence. */
function journalTab(){
  const entry = state.journal, questions = state.journalQuestions;
  if(!questions.length) return `<div class="spin"></div>`;
  const answers = entry?.answers || {};
  const draft = loadDraft();
  const answered = questions.filter(q =>
    String(draft[q.id] ?? answers[q.id] ?? "").trim()).length;

  let h = `<div class="row" style="margin-bottom:12px">
      <div class="grow small ${answered === questions.length ? "" : "t2"}" id="jcount"
           aria-live="polite">
        ${answered === questions.length ? `✓ ${t("journal_complete")}`
          : t("journal_progress", {done:answered, total:questions.length})}</div>
      <div class="t3 tiny" id="jsave"></div>
    </div>`;

  h += `<div class="t3 tiny" style="margin-bottom:10px">${t("journal_hint")}</div>`;

  questions.forEach((q, i) => {
    const value = draft[q.id] ?? answers[q.id] ?? "";
    h += `<label>${i + 1}. ${esc(q.text)}</label>
      <textarea id="jq-${q.id}" data-journal="${q.id}"
        style="min-height:72px">${esc(value)}</textarea>`;
  });

  // Mood is an optional one-tap check-in, not a mood diary. ErnestOS is
  // not a mental-health app and must not pretend to be one.
  const moods = [["awful","😞"],["low","😕"],["ok","😐"],["good","🙂"],["great","😄"]];
  h += `<label>${t("mood_q")} <span class="t3">(${t("optional")})</span></label>
    <div class="chips">${moods.map(([id, face]) =>
      `<div class="chip ${entry?.mood === id ? "on" : ""}" data-act="mood"
        data-value="${id}" aria-label="${t("mood_" + id)}"
        >${face}</div>`).join("")}</div>`;

  h += `<div class="btns">
      <button class="btn" data-act="journal-save">${t("save")}</button>
      <button class="btn secondary" data-act="journal-history">
        ${icon("book", 16)} ${t("journal_history")}</button></div>`;

  if(state.journalHistory){
    h += `<h2>${t("journal_history")}</h2>`;
    h += state.journalHistory.length ? state.journalHistory.map(e => `
      <div class="item" data-act="journal-open" data-day="${e.day}">
        <div class="grow"><div class="num small">${isoToLabel(e.day)}</div>
          <div class="meta">${esc(e.preview) || "—"}</div></div>
        <div class="t3 tiny">${e.complete ? "✓"
          : `${e.answered}/${e.total}`}</div>
      </div>`).join("") : `<div class="empty">${t("empty")}</div>`;
  }
  return h;
}

/* ---------- journal drafts ----------
   Telegram can be closed by a call, a swipe or the OS at any moment. A
   long entry lost to that is the fastest way to teach someone never to
   write a long entry again, so every keystroke goes to localStorage and
   the backend gets a debounced save. */
/* Per account as well as per day: two people sharing a phone must never be
   handed each other's unsent entry. */
const draftKey = () =>
  `ernestos-journal-${state.me?.telegram_id || "anon"}-${todayISO()}`;

function loadDraft(){
  try{ return JSON.parse(localStorage.getItem(draftKey()) || "{}"); }
  catch(_){ return {}; }
}
function saveDraft(id, value){
  try{
    const draft = loadDraft();
    draft[id] = value;
    localStorage.setItem(draftKey(), JSON.stringify(draft));
  }catch(_){}
}
function clearDraft(){
  try{ localStorage.removeItem(draftKey()); }catch(_){}
}

/* Autosave. Every changed answer waits in `journalPending` until typing
   pauses, and all of them go in one request — one timer for all fields used
   to drop the first field's save when the second was typed within a second.
   Requests run one after another, so an older answer can never land after a
   newer one. */
let journalTimer, journalPending = {}, journalChain = Promise.resolve(), journalSeq = 0;

function updateJournalCounter(){
  const qs = state.journalQuestions || [];
  const done = qs.filter(q =>
    (document.getElementById("jq-" + q.id)?.value || "").trim()).length;
  const el = document.getElementById("jcount");
  if(el) el.textContent = done === qs.length && qs.length
    ? `✓ ${t("journal_complete")}` : t("journal_progress", {done, total: qs.length});
}

function onJournalInput(el){
  saveDraft(el.dataset.journal, el.value);
  journalPending[el.dataset.journal] = el.value;
  updateJournalCounter();
  const note = document.getElementById("jsave");
  if(note) note.textContent = t("autosaved");
  clearTimeout(journalTimer);
  journalTimer = setTimeout(flushJournal, 900);
}

function flushJournal(){
  clearTimeout(journalTimer);
  const answers = journalPending;
  journalPending = {};
  if(!Object.keys(answers).length) return journalChain;
  const seq = ++journalSeq;
  journalChain = journalChain.then(async () => {
    const note = document.getElementById("jsave");
    try{
      const r = await api("/api/journal", {method:"POST", body:{answers}});
      state.journal = {...(state.journal || {}), answered:r.answered,
                       complete:r.complete,
                       answers:{...(state.journal?.answers || {}), ...answers}};
      if(seq === journalSeq && note) note.textContent = "✓";
    }catch(_){
      // The draft is on disk; the answers wait for the next pause or Save.
      journalPending = {...answers, ...journalPending};
      if(note) note.textContent = "…";
    }
  });
  return journalChain;
}
document.addEventListener("visibilitychange", () => { if(document.hidden) flushJournal(); });
document.addEventListener("input", e => {
  const el = e.target.closest("[data-journal]");
  if(el) onJournalInput(el);
});

/* ---------- timers ----------
   A habit or a task can be done by the clock instead of the box: "5h deep
   flow" is finished by five hours running out, not by a tap. The length is
   read from the name unless one was set, can be set on anything, and can be
   switched off on anything. The server owns the clock — this file only draws
   it, counting down from `remaining_sec` as measured when the payload
   arrived, so a phone whose clock is wrong still shows the right time. */
const TIMER_PRESETS = [15, 25, 30, 45, 60, 90, 120, 180, 240, 300];

function fmtMinutes(m){
  m = Math.round(m || 0);
  const h = Math.floor(m / 60), r = m % 60;
  if(h && r) return t("dur_hm", {h, m: r});
  return h ? t("dur_h", {h}) : t("dur_m", {m: r});
}

/* H:MM:SS, or MM:SS under an hour. */
function fmtClock(sec){
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}

/* Every run drawn on screen, by id, so the ticker can find it again. */
const LIVE_RUNS = new Map();

/* Seconds left on a run right now. The first time a run object is drawn it
   is stamped with the moment it was received; it is replaced by a fresh one
   on the next load, so the stamp never goes stale. */
function leftOf(run){
  if(!run._at) run._at = Date.now();
  if(run.status !== "running") return run.remaining_sec;
  return Math.max(0, run.remaining_sec - (Date.now() - run._at) / 1000);
}
function runPercent(run){
  return run.duration_sec
    ? Math.round((run.duration_sec - leftOf(run)) / run.duration_sec * 100) : 0;
}
function liveClock(run){
  LIVE_RUNS.set(run.id, run);
  return `<span class="num-live" data-run-clock="${run.id}">${fmtClock(leftOf(run))}</span>`;
}
function liveBar(run){
  LIVE_RUNS.set(run.id, run);
  return `<div class="bar accent"><span data-run-bar="${run.id}"
    style="width:${runPercent(run)}%"></span></div>`;
}

/* The short timer note on a row. */
function timerMeta(x){
  const run = x.timer;
  if(run && run.status === "running") return `${icon("play", 12)} ${liveClock(run)}`;
  if(run && run.status === "paused") return `${icon("pause", 12)} ${fmtClock(run.remaining_sec)}`;
  return x.timer_minutes ? `${icon("clock", 12)} ${fmtMinutes(x.timer_minutes)}` : "";
}

/* One ticker for the whole app: redraws every live clock once a second, and
   when one reaches zero asks the server what happened — which finishes the
   run, ticks the item and returns the new state. */
let timerExpiring = false;
setInterval(() => {
  let expired = false;
  for(const el of document.querySelectorAll("[data-run-clock]")){
    const run = LIVE_RUNS.get(Number(el.dataset.runClock));
    if(!run) continue;
    const left = leftOf(run);
    el.textContent = fmtClock(left);
    if(run.status === "running" && left <= 0) expired = true;
  }
  for(const el of document.querySelectorAll("[data-run-bar]")){
    const run = LIVE_RUNS.get(Number(el.dataset.runBar));
    if(run) el.style.width = runPercent(run) + "%";
  }
  if(expired && !timerExpiring){
    timerExpiring = true;
    setTimeout(async () => {
      try{
        const info = state.timerInfo;
        if(info && sheetOpen()){
          const fresh = await api(`/api/timers/${info.kind}/${info.id}`);
          state.timerInfo = fresh;
          openSheet(timerSheet(fresh));
          if(fresh.done){ notify("success"); toast(t("timer_finished")); }
        }
        await loadScreen(state.screen);
      }catch(_){ /* the next tick or load corrects it */ }
      timerExpiring = false;
    }, 1200);
  }
}, 1000);

/* The timer counting right now, on every screen that has room for it. */
function timerBanner(run){
  if(!run || (run.status !== "running" && run.status !== "paused")) return "";
  return `<div class="tinted block tone-3" data-act="timer-open"
       data-kind="${run.kind}" data-id="${run.item_id}"
       style="margin:var(--s3) 0;cursor:pointer">
      <div class="bh">
        <span class="itile lg">${icon(run.status === "running" ? "play" : "pause", 18)}</span>
        <div class="grow"><div class="bt ellipsis">${esc(run.title)}</div>
          <div class="t2 tiny">${t(run.status === "running"
            ? "timer_running_lbl" : "timer_paused_lbl")}</div></div>
        <div class="num" style="font-size:22px;font-weight:700">${
          run.status === "running" ? liveClock(run) : fmtClock(run.remaining_sec)}</div>
      </div>
      <div style="margin-top:var(--s2)">${liveBar(run)}</div>
    </div>`;
}

function timerSheet(info){
  const run = info.run;
  const counting = run && (run.status === "running" || run.status === "paused");
  const minutes = info.timer_minutes;
  const kind = info.kind;

  let body;
  if(info.done && !counting){
    body = `<div class="clock-big">✓</div>
      <div class="hint" style="text-align:center">${t(kind === "habit" || kind === "thabit"
        ? "timer_done_today" : "timer_done")}</div>`;
  } else if(!minutes){
    body = `<div class="hint">${t("timer_off_hint")}</div>`;
  } else if(counting){
    const running = run.status === "running";
    body = `<div class="clock-big">${running ? liveClock(run)
                                            : fmtClock(run.remaining_sec)}</div>
      ${liveBar(run)}
      <div class="t2 small" style="text-align:center;margin-top:var(--s2)">
        ${running && run.ends_at ? t("timer_ends_at", {time: run.ends_at})
                                 : t("timer_paused_lbl")}
        · ${fmtMinutes(minutes)}</div>
      <div class="btns" style="margin-top:var(--s3)">
        <button class="btn" data-act="timer-run" data-verb="${running ? "pause" : "resume"}"
                data-id="${run.id}">${icon(running ? "pause" : "play", 16)}
          ${t(running ? "timer_pause" : "timer_resume")}</button>
        <button class="btn secondary" data-act="timer-run" data-verb="stop"
                data-id="${run.id}">${icon("x", 16)} ${t("timer_stop")}</button>
      </div>`;
  } else {
    body = `<div class="clock-big">${fmtClock(minutes * 60)}</div>
      <div class="hint" style="text-align:center">${t(kind === "habit" || kind === "thabit"
        ? "timer_rule_habit" : "timer_rule_task")}</div>
      <button class="btn" data-act="timer-start" data-kind="${kind}" data-id="${info.id}"
              style="margin-top:var(--s3)">${icon("play", 16)} ${t("timer_start")}</button>`;
  }

  /* The length: presets as one tap, a typed number, from-the-name, off. Not
     offered while the clock is counting — change it after, not mid-run. */
  const current = info.timer_mode === "off" || !minutes ? "off"
    : info.timer_mode === "auto" ? "auto" : String(minutes);
  const chip = (value, label) => `<div class="chip sm ${current === value ? "on" : ""}"
      data-act="timer-len" data-kind="${kind}" data-id="${info.id}"
      data-value="${value}">${label}</div>`;
  /* On a shared item the length is the team's setting — its creator, an
     admin or the owner changes it; everybody runs their own clock. */
  const chooser = info.protected || counting || info.can_set === false ? "" : `
    <label>${icon("clock", 13)} ${t("timer_len")}</label>
    <div class="chips">
      ${chip("off", t("timer_off"))}
      ${info.parsed_minutes ? chip("auto", `${fmtMinutes(info.parsed_minutes)} · ${t("timer_auto")}`) : ""}
      ${(info.presets || TIMER_PRESETS).map(m => chip(String(m), fmtMinutes(m))).join("")}
    </div>
    <div class="row" style="margin-top:var(--s2);gap:var(--s2)">
      <input id="timer-min" type="number" min="1" max="1440" inputmode="numeric"
             placeholder="${t("timer_custom_ph")}" style="flex:1" />
      <button class="btn sm secondary" data-act="timer-custom" data-kind="${kind}"
              data-id="${info.id}" style="min-width:96px">${t("save")}</button>
    </div>`;

  // With the timer off it is an ordinary item again.
  const tick = !minutes && !info.done && !info.protected
    ? `<button class="btn secondary" data-act="timer-tick" data-kind="${kind}"
         data-id="${info.id}" style="margin-top:var(--s2)">${icon("check", 15)}
         ${t("now_done")}</button>` : "";

  return `<h3>${icon("clock", 18)} ${esc(info.title)}</h3>
    ${info.team_id ? `<div class="t3 tiny">${t("timer_team_own")}</div>` : ""}
    ${body}${chooser}${tick}
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("close")}</button>`;
}

/* The timer line inside a habit's or task's own sheet. */
function timerSetting(kind, x){
  const label = x.timer_minutes
    ? fmtMinutes(x.timer_minutes) + (x.timer_mode === "auto" ? ` · ${t("timer_auto")}` : "")
    : t("timer_off");
  return `<label>${icon("clock", 13)} ${t("timer")}</label>
    <div class="row" style="gap:var(--s2)">
      <div class="grow t2 small">${label}</div>
      <button class="btn sm secondary" data-act="timer-open" data-kind="${kind}"
              data-id="${x.id}" style="min-width:96px">${t("timer_setup")}</button>
    </div>`;
}

/* A timer choice on an add sheet: from the name (the default), off, or a
   length. `null` means "read it from the name". */
function timerPicker(id, value){
  const current = value === undefined || value === null ? "" : String(value);
  return `<label>${icon("clock", 13)} ${t("timer")}</label>
    <select id="${id}">
      <option value="" ${current === "" ? "selected" : ""}>${t("timer_from_name")}</option>
      <option value="0" ${current === "0" ? "selected" : ""}>${t("timer_off")}</option>
      ${TIMER_PRESETS.map(m => `<option value="${m}" ${current === String(m)
        ? "selected" : ""}>${fmtMinutes(m)}</option>`).join("")}
    </select>`;
}
function pickedTimer(id){
  const v = document.getElementById(id)?.value ?? "";
  return v === "" ? null : Number(v);
}

async function openTimer(kind, id){
  try{
    const info = await api(`/api/timers/${kind}/${id}`);
    state.timerInfo = info;
    openSheet(timerSheet(info));
    /* Reading the timer can itself finish it — a run that ran out while the
       app was closed — so the screen behind catches up too. */
    loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

/* After any change: redraw the sheet from the server's answer, then the
   screen behind it, which shows the same clock. */
async function timerChanged(info){
  state.timerInfo = info;
  openSheet(timerSheet(info));
  await loadScreen(state.screen);
}

/* ---------- countdowns ----------
   Dates being counted down to — an exam, a trip, a launch. The bot reads them
   out every morning and evening; here they sit under the day's work. */
function cdLeft(x){
  if(x.days_left < 0) return t("cd_passed");
  if(x.days_left === 0) return t("cd_today");
  if(x.days_left === 1) return t("cd_tomorrow");
  return t("cd_days_left", {n: x.days_left});
}

const CD_ICON = {general:icon("calendar", 16), task:icon("list", 16), habit:icon("check", 16)};

function countdownRows(list){
  return list.map(x => `<div class="item" style="min-height:48px"
       data-act="cd-open" data-id="${x.id}" data-title="${esc(x.title)}"
       role="button" tabindex="0">
      <span class="itile">${CD_ICON[x.scope] || icon("hourglass", 16)}</span>
      <div class="grow"><div class="ellipsis">${esc(x.title)}</div>
        <div class="meta num">${isoToLabel(x.date)}${
          x.item_title && x.item_title !== x.title ? ` · ${esc(x.item_title)}` : ""}${
          x.team_name ? ` · ${icon("users", 14)} ${esc(x.team_name)}` : ""}</div></div>
      <div class="num" style="font-weight:700;white-space:nowrap">${cdLeft(x)}</div>
    </div>`).join("");
}

/* The two countdowns, side by side wherever a day is planned: a date being
   counted down to, and a clock on a habit or a task. */
function countdownHub(){
  return `<div class="hub">
      <button class="btn secondary" data-act="dc-open">${icon("calendar", 16)} ${t("date_cd")}</button>
      <button class="btn secondary" data-act="tc-open">${icon("clock", 16)} ${t("time_cd")}</button>
    </div>`;
}

function countdownBlock(list){
  list = list || [];
  return `<h2>${icon("calendar", 16)} ${t("date_cd")}
      <span class="act" data-act="cd-add">${icon("plus", 15)} ${t("add")}</span></h2>
    ${countdownRows(list.slice(0, 3))}
    ${list.length > 3 ? `<div class="t2 small" data-act="dc-open" role="button" tabindex="0"
        style="margin-top:6px;text-decoration:underline">${t("cd_all")} · ${list.length}</div>` : ""}
    ${countdownHub()}`;
}

/* Every countdown: yours by kind, then each team's. */
function countdownHubSheet(list){
  list = list || [];
  const personal = list.filter(x => !x.team_id);
  const groups = [["general", "cd_scope_general"], ["task", "cd_scope_task"],
                  ["habit", "cd_scope_habit"]].map(([scope, key]) => {
    const rows = personal.filter(x => (x.scope || "general") === scope);
    return rows.length ? `<div class="group">${CD_ICON[scope]} ${t(key)}</div>`
                         + countdownRows(rows) : "";
  }).join("");
  const byTeam = {};
  for(const x of list.filter(x => x.team_id)) (byTeam[x.team_name || ""] ||= []).push(x);
  const teams = Object.entries(byTeam).map(([name, rows]) =>
    `<div class="group">${icon("users", 14)} ${esc(name)}</div>` + countdownRows(rows)).join("");
  return `<h3>${icon("calendar", 16)} ${t("date_cd")}</h3>
    ${groups || teams ? groups + teams : `<div class="empty">${t("countdown_empty")}</div>`}
    <button class="btn" data-act="cd-add" style="margin-top:12px">${icon("plus", 16)}
      ${t("countdown_add")}</button>
    <button class="btn secondary" data-act="close" style="margin-top:8px">${t("close")}</button>`;
}

/* What a new countdown can be tied to, for the scope and owner chosen. */
function cdLinkItems(f){
  const dest = f.dest || "personal";
  if(dest === "personal"){
    if(f.scope === "task"){
      const d = state.tasks;
      return d ? [...d.overdue, ...d.upcoming, ...d.undated, ...(d.later || [])]
        .map(x => ({id:x.id, title:x.title, deadline:x.deadline})) : [];
    }
    return (state.habits?.habits || []).filter(x => !x.protected)
      .map(x => ({id:x.id, title:x.name}));
  }
  const team = (state.team?.teams || []).find(x => "team:" + x.id === dest);
  if(!team) return [];
  return f.scope === "task"
    ? (team.tasks || []).map(x => ({id:x.id, title:x.title, deadline:x.deadline}))
    : (team.habits || []).filter(x => !x.mirrored).map(x => ({id:x.id, title:x.name}));
}

function readCdForm(){
  const f = state.cdForm || (state.cdForm = {scope:"general", dest:"personal"});
  const g = id => document.getElementById(id);
  if(g("cd-title")) f.title = g("cd-title").value;
  if(g("cd-date")) f.date = g("cd-date").value;
  if(g("cd-link")) f.item = g("cd-link").value;
  return f;
}

async function ensureCdData(){
  const jobs = [];
  if(!state.tasks) jobs.push(api("/api/tasks?days=365").then(r => { state.tasks = r; })
                             .catch(() => {}));
  if(!state.habits) jobs.push(api("/api/habits").then(r => { state.habits = r; })
                              .catch(() => {}));
  if((state.teams || []).length && !state.team)
    jobs.push(api("/api/teams").then(r => { state.team = r; }).catch(() => {}));
  await Promise.all(jobs);
}

function countdownSheet(){
  const f = state.cdForm || (state.cdForm = {scope:"general", dest:"personal"});
  const teams = state.teams || [];
  const chip = (act, value, current, label) => `<div class="chip sm ${
      current === value ? "on" : ""}" data-act="${act}" data-value="${value}"
      role="radio" tabindex="0" aria-checked="${current === value}">${label}</div>`;
  const items = cdLinkItems(f);
  return `<h3>${icon("hourglass", 18)} ${t("countdown_add")}</h3>
    <label>${t("cd_scope")}</label>
    <div class="chips">${["general", "task", "habit"].map(s =>
      chip("cd-scope", s, f.scope, `${CD_ICON[s]} ${t("cd_scope_" + s)}`)).join("")}</div>
    ${teams.length ? `<label>${t("cd_whose")}</label><div class="chips">
      ${chip("cd-dest", "personal", f.dest, t("dest_personal"))}
      ${teams.map(x => chip("cd-dest", "team:" + x.id, f.dest, icon("users", 14) + " " + esc(x.name))).join("")}
      </div>` : ""}
    ${f.scope !== "general" ? `<label>${t("cd_link")}</label>
      <select id="cd-link" data-act="cd-link">
        <option value="">${t("cd_link_none")}</option>
        ${items.map(x => `<option value="${x.id}" ${String(f.item) === String(x.id)
          ? "selected" : ""}>${esc(x.title)}</option>`).join("")}
      </select>` : ""}
    <label>${t("countdown_date")}</label>
    <input type="date" id="cd-date" min="${todayISO()}" value="${esc(f.date || "")}" />
    <input id="cd-title" placeholder="${t("countdown_title_ph")}" maxlength="200"
           value="${esc(f.title || "")}" style="margin-top:10px" />
    <button class="btn" data-act="cd-save" style="margin-top:14px">
      ${icon("plus", 16)} ${t("add")}</button>
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`;
}

/* ⏱ Time countdown: the running clock, and everything a clock can go on —
   private and shared, habits and tasks — one tap from its timer. */
async function openTimeHub(kind){
  state.tcKind = kind || state.tcKind || "habit";
  openSheet(timeHubSheet(null), "tc");
  try{
    const r = await api(`/api/timers/candidates/${state.tcKind}`);
    if(state.sheetView === "tc") openSheet(timeHubSheet(r), "tc");
  }catch(e){ handleError(e); }
}

function timeHubSheet(r){
  const kind = state.tcKind || "habit";
  const seg = `<div class="seg" role="tablist" style="margin:10px 0">
      ${[["habit", "tc_habits"], ["task", "tc_tasks"]].map(([k, key]) =>
        `<div class="${kind === k ? "on" : ""}" role="tab" tabindex="0"
          aria-selected="${kind === k}" data-act="tc-kind" data-value="${k}">${t(key)}</div>`)
        .join("")}</div>`;
  let body;
  if(!r) body = `<div class="spin"></div>`;
  else if(!(r.items || []).length) body = `<div class="empty">${t("tc_empty")}</div>`;
  else body = r.items.map(x => `
    <div class="item pressable" data-act="timer-open" data-kind="${x.kind}" data-id="${x.id}"
         role="button" tabindex="0" style="min-height:50px">
      <span class="itile">${icon("clock", 16)}</span>
      <div class="grow"><div class="ellipsis">${esc(x.title)}</div>
        <div class="meta">${x.team_name ? `${icon("users", 14)} ${esc(x.team_name)}` : t("src_personal")}${
          x.timer_minutes || x.timer ? " · " + timerMeta(x) : ""}</div></div>
      ${icon("chevron", 15)}</div>`).join("");
  return `<h3>${icon("clock", 16)} ${t("time_cd")}</h3>
    ${r?.active ? timerBanner(r.active) : ""}
    ${seg}
    <div class="t3 tiny" style="margin-bottom:8px">${t("tc_hint")}</div>
    ${body}
    <button class="btn secondary" data-act="close" style="margin-top:12px">${t("close")}</button>`;
}

/* ---------- Tasks ---------- */
/* Tasks, in four views of the same data rather than four lists.

     Asosiy / Main     what actually matters right now — the week's focus, the
                       tasks pinned to today, anything late, today's work, and
                       the month underneath it
     Ochiq / Open      the inbox: every open task, searchable and filterable
     Loyihalar/Projects each project's state — how far it is, how much is left
     Bajarilgan/Done   the archive

   The calendar sits at the foot of Main rather than behind a header button.
   It is the last thing on the screen because it answers the last question a
   planner asks — what is coming after today — and putting it there means the
   whole plan is one scroll instead of a screen plus a sheet. */
SCREENS.tasks = () => {
  /* Bugun · Reja · Taqvim (#18). The plan holds the inbox, the projects and
     the archive as three chips under one tab; the calendar and both
     countdowns are a tab of their own rather than the foot of Today. */
  const tabs = [["main", t("tab_today")], ["open", t("tab_plan")],
                ["calendar", t("tab_calendar")]];
  const PLAN = ["open", "projects", "done"];
  const active = PLAN.includes(state.taskTab) ? "open" : state.taskTab;

  let h = `<div class="head">
      <h1 class="grow">${t("tasks")}</h1>
      <button class="iconbtn" data-act="task-add"
              aria-label="${t("add_task")}">${icon("plus")}</button>
    </div>
    <div class="seg" role="tablist" style="margin:12px 0 12px">
      ${tabs.map(([id, label]) => `<div class="${active === id ? "on" : ""}" role="tab"
        tabindex="0" aria-selected="${active === id}"
        data-act="task-tab" data-tab="${id}">${label}</div>`).join("")}
    </div>`;

  if(PLAN.includes(state.taskTab)){
    h += `<div class="chips" style="margin-bottom:10px">${[["open", t("open_tab")],
      ["projects", t("projects")], ["done", t("done_tab")]].map(([id, label]) =>
      `<div class="chip sm ${state.taskTab === id ? "on" : ""}" role="tab" tabindex="0"
        aria-selected="${state.taskTab === id}" data-act="task-tab"
        data-tab="${id}">${label}</div>`).join("")}</div>`;
    if(state.taskTab === "done") return h + doneTab();
    if(state.taskTab === "projects") return h + projectsTab();
    return h + openTab();
  }
  if(state.taskTab === "calendar") return h + calendarTab();
  return h + mainTab();
};

function calendarTab(){
  return countdownBlock(state.countdowns)
    + sectionHead("tone-2", "calendar", t("calendar")) + calendarBlock();
}

/* A section heading that carries a hue, so the screen reads as a few
   labelled groups rather than one uninterrupted scroll. */
function sectionHead(tone, ic, label, action){
  return `<div class="sechead ${tone}">
      <span class="itile">${icon(ic, 16)}</span>
      <div class="lbl">${label}</div>
      ${action || ""}</div>`;
}

/* The first thing the Tasks screen shows, and deliberately not the whole
   list: the week's one goal, then everything today actually asks for, then
   the month. The complete inventory is one tab across for the moment when
   the inventory is the question. */
function mainTab(){
  const d = state.tasks;
  let h = timerBanner(d?.active_timer) + weekFocusBlock();
  if(!d) return h + `<div class="spin"></div>`;

  const today = todayISO();
  /* Shared tasks are in the day's own lists, not a block below them: they
     are owed today and they score today, so a reader looking at "due today"
     has to be looking at all of it. Marked, not separated — `taskRow` says
     which team each one came from. Personal tasks carry an `overdue` flag
     from the API; shared ones are compared here, since the shared block is
     built from a flat list. */
  const sharedAll = (d.team_tasks || []).map(x => ({
    ...x, source: "team",
    overdue: Boolean(x.deadline && x.deadline < today && !x.done),
  }));
  const all = [...d.overdue, ...d.upcoming, ...d.undated, ...(d.later || []),
               ...sharedAll];
  const pinned = all.filter(x => x.top3);
  const seen = new Set(pinned.map(x => x.id + ":" + (x.source || "personal")));
  const key = x => x.id + ":" + (x.source || "personal");
  const late = all.filter(x => x.overdue && !seen.has(key(x)));
  late.forEach(x => seen.add(key(x)));
  const now = all.filter(x => x.deadline === today && !seen.has(key(x)));

  const section = (tone, ic, label, rows, opts) => rows.length
    ? sectionHead(tone, ic, label) + rows.map(x => taskRow(x, opts)).join("") : "";

  /* One hue per section, and the same hue for the same idea everywhere in the
     app: tasks are the first tone on Home and they are the first tone here. */
  const body = section("tone-5", "target", t("pinned_tasks"), pinned)
    + section("tone-4", "clock", t("overdue"), late)
    + section("tone-1", "list", t("due_today"), now, {hideDate: true});

  h += body || `<div class="empty">${t("nothing_today")}
      <button class="btn secondary sm" data-act="task-add"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;

  // The dates and the month are the Taqvim tab now; both countdowns stay a
  // tap away from Today.
  return h + countdownHub();
}

function searchBox(id, value, placeholder, action){
  return `<div class="row" style="margin:var(--s4) 0 var(--s2)">
      <div class="grow" style="position:relative">
        <input id="${id}" value="${esc(value)}" placeholder="${placeholder}"
               data-search="${action}" style="padding-left:38px" />
        <span style="position:absolute;left:12px;top:13px;color:var(--text-3)"
              >${icon("search", 17)}</span>
      </div>
      ${value ? `<button class="iconbtn" data-act="${action}-clear"
        aria-label="${t("clear")}">${icon("x", 16)}</button>` : ""}
    </div>`;
}

/* The week's focus lives here rather than on Home: it is a planning decision,
   and this is the planning screen. Home stays about today. */
function weekFocusBlock(){
  const focus = state.focus;
  if(!focus) return "";
  const primary = focus.primary;

  let h = sectionHead("tone-3", "target", t("week_focus"),
    focus.slots_free > 0 && primary
      ? `<span class="act" data-act="focus-add" data-slot="supporting">
           ${icon("plus", 14)} ${t("add_supporting")}</span>` : "");

  if(!primary){
    // One row, not a panel: the block printed "Add a main goal" as a line of
    // text and again on the button under it, and spent a third of the screen
    // on a section the user has not started. Unset, it is an invitation the
    // size of one line.
    return h + `<div class="item pressable" data-act="focus-add"
                     data-slot="primary" style="min-height:48px">
        ${icon("target", 17)}
        <div class="grow t2">${t("add_mission")}</div>
        ${icon("plus", 16)}</div>`;
  }

  h += `<div class="tinted block tone-3">
      <div class="row">
        <div class="check ${primary.done ? "on" : ""}" data-act="focus-toggle"
             data-id="${primary.id}">${icon("check", 14)}</div>
        <div class="grow" data-act="focus-open" data-id="${primary.id}"
             data-title="${esc(primary.title)}" data-priority="${primary.priority}"
             data-done="${primary.done ? 1 : 0}">
          <div class="eyebrow">${t("mission_main")}</div>
          <div class="wrap ${primary.done ? "strike" : ""}"
               style="font-size:16px;font-weight:600;margin-top:2px">
            ${esc(primary.title)}</div>
        </div>
        ${icon("chevron", 16)}
      </div></div>`;

  const extra = focus.supporting || [];
  if(extra.length){
    h += extra.map(row => `
      <div class="item" style="min-height:44px;margin-top:6px">
        <div class="check ${row.done ? "on" : ""}" style="width:21px;height:21px"
             data-act="focus-toggle" data-id="${row.id}"
             >${row.done ? icon("check", 12) : ""}</div>
        <div class="grow small wrap ${row.done ? "strike" : ""}"
             data-act="focus-open" data-id="${row.id}"
             data-title="${esc(row.title)}" data-priority="${row.priority}"
             data-done="${row.done ? 1 : 0}">${esc(row.title)}</div>
      </div>`).join("");
  }
  return h;
}

/* The inbox: every open task there is, in one place.
   Main answers "what now"; this one answers "what is there", so nothing is
   held back here — late, dated, undated and later, all of it, with a search
   box and three filters over the top. */
function openTab(){
  const d = state.tasks;
  const total = d ? [d.overdue, d.upcoming, d.undated, d.later || []]
    .reduce((n, rows) => n + rows.length, 0) : null;

  let h = `<div class="tinted block tone-2">
      <div class="bh">
        <span class="itile lg">${icon("inbox", 18)}</span>
        <div class="grow"><div class="bt">${t("inbox_zone")}</div>
          <div class="t2 tiny">${t("inbox_hint")}</div></div>
        <div class="num" style="font-size:22px;font-weight:700"
             >${total === null ? "—" : total}</div>
      </div></div>`;

  h += searchBox("task-q", state.taskQuery, t("search_tasks"), "task-search");

  /* Filters as chips rather than a menu: one tap to narrow, one to clear, and
     the active one visible without opening anything.

     Three, not seven. The list below is already grouped by horizon under its
     own headings — "this week" and "this month" were a second, competing way
     to say what the headings say, and a row of chips that scrolls sideways is
     a row where the last two are never found. High and low went with them:
     priority is visible on the row itself, and the two questions worth asking
     of a task list are "what is late" and "what has no date at all". */
  const filters = [["", t("all")], ["overdue", t("overdue")],
                   ["undated", t("no_date")]];
  h += `<div class="chips" style="margin-bottom:var(--s2)">
      ${filters.map(([id, label]) => `<div class="chip sm
        ${state.taskFilter === id ? "on" : ""}" data-act="task-filter"
        data-value="${id}">${label}</div>`).join("")}</div>`;

  if(!d) return h + `<div class="spin"></div>`;

  const f = state.taskFilter;

  /* One predicate, applied to every row, instead of a rule per section: a
     filter that behaves differently depending on which heading a task
     happens to sit under is a filter nobody can predict. */
  const keep = row => {
    if(!f) return true;
    if(f === "overdue") return row.overdue;
    if(f === "undated") return !row.deadline;
    return true;
  };

  const section = (tone, ic, label, rows) => {
    const items = (rows || []).filter(keep);
    return items.length
      ? sectionHead(tone, ic, `${label} · ${items.length}`)
        + items.map(taskRow).join("")
      : "";
  };

  let body = "";
  body += section("tone-4", "clock", t("overdue"), d.overdue);
  body += section("tone-1", "calendar", t("upcoming"), d.upcoming);
  body += section("tone-2", "inbox", t("no_date"), d.undated);
  body += section("tone-3", "list", t("later"), d.later || []);

  if(!body){
    h += (state.taskQuery || state.taskFilter)
      ? `<div class="empty">${t("no_results")}</div>`
      : `<div class="empty">${t("no_tasks_yet")}
          <button class="btn secondary sm" data-act="task-add"
                  style="margin:12px auto 0;display:flex">
            ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else h += body;

  return h;
}

function doneTab(){
  const g = state.tasksDone;
  let h = searchBox("done-q", state.doneQuery, t("search"), "done-search");
  if(!g) return h + `<div class="spin"></div>`;

  const section = (tone, label, rows) => rows.length
    ? sectionHead(tone, "check", `${label} · ${rows.length}`)
      + rows.map(doneRow).join("") : "";

  const body = section("tone-5", t("done_today"), g.today)
    + section("tone-2", t("done_week"), g.week)
    + section("tone-3", t("done_earlier"), g.earlier);

  return h + (body || `<div class="empty">${
    state.doneQuery ? t("no_results") : t("empty")}</div>`);
}

function doneRow(task){
  return `<div class="item" style="min-height:46px">
      <div class="check on" data-act="task-reopen" data-id="${task.id}"
           aria-label="${t("reopen")}">${icon("check", 14)}</div>
      <div class="grow"><div class="ellipsis strike">${esc(task.title)}</div>
        <div class="meta">${esc(task.project || t("standalone"))}
          ${task.recurrence ? `· ${icon("repeat", 12)}` : ""}</div></div>
    </div>`;
}

/* An overdue task gets four ways out instead of a red badge. Nothing on
   this row calls the user late; the actions are what a person actually
   needs at that moment. */
function taskRow(task, opts){
  const shared = task.source === "team";
  const meta = [];
  // Where it lives, on every row. See `habitRow` for why both kinds are
  // labelled rather than only the shared one.
  meta.push(shared ? `${icon("users", 14)} ${esc(task.team_name || "")}` : t("src_personal"));
  // Under a project heading the name is already on screen; repeating it in
  // every row is noise that pushes the useful details off the line.
  // Urgency is written, not only painted: the edge colour repeats the word.
  if(task.priority === "high" && task.status !== "done")
    meta.unshift(`<span class="tag hot">${t("high")}</span>`);
  if(task.project && !opts?.hideProject) meta.push(esc(task.project));
  // Same reasoning for the date under a heading that already says "today":
  // six rows each reading "13 August" beneath "Today's tasks" is a second
  // line of type per row that tells the reader nothing.
  if(task.deadline && !opts?.hideDate)
    meta.push(`<span class="num">${isoToLabel(task.deadline)}</span>`);
  if(task.due_time) meta.push(`<span class="num">${icon("clock", 12)} ${task.due_time}</span>`);
  if(task.recurrence) meta.push(icon("repeat", 12));
  if(task.remind_before !== null && task.remind_before !== undefined)
    meta.push(icon("bell", 12));
  const timed = Boolean(task.timer_minutes) && task.status !== "done"
    && !(shared && task.done);
  if(timed) meta.push(timerMeta(task));
  if(shared && task.completion && task.completion !== "all")
    meta.push(t("completion_" + task.completion));
  if(shared && task.owed === false) meta.push(t("not_assigned"));

  /* Three, so they sit on one line. Four wrapped onto a second row and made
     every late task a 300px block; "this week" is the one a person reaches
     for least and it is still in the task's own sheet. */
  const quick = task.overdue ? `
      <div class="quick">
        <span class="qlbl">${t("reschedule")}:</span>
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="today">${t("when_today")}</div>
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="tomorrow">${t("when_tomorrow")}</div>
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="none">${t("when_none")}</div>
      </div>` : "";

  return `<div class="trow pri-${task.priority}">
      ${shared ? teamBox(task, "task")
        : `<div class="check ${timed ? "timed" : ""}"
           ${timed ? `data-act="timer-open" data-kind="task"` : `data-act="task-done"`}
           data-id="${task.id}" role="${timed ? "button" : "checkbox"}" tabindex="0"
           aria-checked="false"
           aria-label="${t(timed ? "timer" : "now_done")} · ${esc(task.title)}">${
             icon(timed ? "clock" : "check", 14)}</div>`}
      <div class="grow">
        <div class="tt wrap"
             data-act="${shared ? "team-task-open" : "task-open"}"
             data-id="${task.id}">${esc(task.title)}</div>
        ${meta.length ? `<div class="td">${meta.join(" · ")}</div>` : ""}
        ${shared ? "" : quick}
      </div>
      ${shared
        ? `<button class="iconbtn sm plain" data-act="team-task-open"
                   data-id="${task.id}"
                   aria-label="${t("edit")}">${icon("chevron", 16)}</button>`
        : `<button class="iconbtn sm plain ${task.top3 ? "on" : ""}" aria-pressed="${task.top3 ? "true" : "false"}" data-act="task-top3" data-id="${task.id}"
              aria-label="${task.top3 ? t("top3_unpick") : t("top3_pick")}"
              >${icon("star", 18)}</button>`}
    </div>`;
}

/* ---------- Projects ----------
   Its own tab, because a project is a different question from a task: not
   "what do I do next" but "where has this got to". It used to be a strip of
   name-and-percentage rows at the foot of the main list, which said how far
   each one was and nothing about what that meant — a project at 60% with two
   tasks left and one due Friday is a different object from a project at 60%
   with fourteen left, and the row drew them identically.

   The tab opens on the portfolio in one line — how many are running, how much
   work is still open across all of them, where they average — and then gives
   each project a block of its own carrying its progress, what is left, its
   deadline and its state. */
function projectsTab(){
  const list = state.projects || [];
  /* Shared shelves belong on this screen too — it is where somebody comes to
     ask "where has this got to", and half the answer living on another tab
     is how a project gets forgotten. Under their own heading with the team's
     name, because filing is exactly the place the distinction matters. */
  const shared = (state.teams || []).map(team => ({
    team,
    projects: ((state.team?.teams || []).find(x => x.id === team.id)
               ?.projects) || [],
  })).filter(x => x.projects.length);

  const sharedBlock = shared.map(({team, projects}) =>
    sectionHead("tone-3", "users", esc(team.name))
    + projects.map(p => `
        <div class="prow" data-act="team-project-open" data-id="${p.id}">
          <div class="grow"><b>${esc(p.name)}</b>
            <div class="muted sm">${p.tasks_done}/${p.tasks_total}</div>
            <div class="bar" style="margin-top:4px"><i style="width:${p.percent}%"></i></div>
          </div>
          <div style="width:44px;text-align:right"><b>${p.percent}%</b></div>
        </div>`).join("")).join("");

  let h = sectionHead("tone-2", "folder", t("projects"),
    `<span class="act" data-act="project-add">${icon("plus", 14)}
       ${t("add_project")}</span>`);

  if(!list.length)
    return h + `<div class="empty">${t("no_projects")}
      <button class="btn secondary sm" data-act="project-add"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_project")}</button></div>`
      + sharedBlock;

  const live = list.filter(p => p.status !== "done" && !p.archived);
  const open = list.reduce((n, p) => n + p.tasks_open, 0);
  const average = list.length
    ? Math.round(list.reduce((n, p) => n + p.progress, 0) / list.length) : 0;

  h = `<div class="tiles">
      <div class="tinted tile tone-2">
        <span class="itile">${icon("folder", 17)}</span>
        <div class="k ellipsis">${t("pr_active")}</div>
        <div class="v num">${live.length}</div></div>
      <div class="tinted tile tone-4">
        <span class="itile">${icon("list", 17)}</span>
        <div class="k ellipsis">${t("pr_open_tasks")}</div>
        <div class="v num">${open}</div></div>
      <div class="tinted tile tone-5">
        <span class="itile">${icon("chart", 17)}</span>
        <div class="k ellipsis">${t("pr_average")}</div>
        <div class="v num">${average}%</div>
        ${bar(average)}</div>
    </div>` + h;

  /* One hue per project, cycling the theme's palette, so a list of five reads
     as five things. The tone follows the position in the list rather than the
     id, which keeps it stable while the screen is open and never lands two
     neighbours on the same colour. */
  const TONES = ["tone-1", "tone-3", "tone-5", "tone-4", "tone-2"];

  return h + list.map((p, i) => {
    const done = p.status === "done";
    const state_tag = p.archived ? t("st_archived")
      : done ? t("st_done") : t("st_active");

    // What is actually left, in words. "60%" is a measurement; "4 ta qoldi"
    // is the thing somebody opens this screen to find out.
    const facts = [];
    facts.push(p.tasks_open
      ? t("pr_left", {n: p.tasks_open})
      : p.tasks_total ? t("pr_all_done") : t("pr_no_tasks"));
    if(p.deadline) facts.push(`${icon("calendar", 12)} ${isoToLabel(p.deadline)}`);

    return `<div class="tinted block ${TONES[i % TONES.length]}
                 ${done || p.archived ? "off" : ""}"
                 data-act="project-open" data-id="${p.id}">
        <div class="bh">
          <span class="itile lg">${icon("folder", 18)}</span>
          <div class="grow" style="min-width:0">
            <div class="bt ellipsis">${esc(p.name)}</div>
            <div class="t2 tiny row" style="gap:6px;margin-top:2px">
              ${facts.join(" · ")}</div>
          </div>
          <div style="text-align:right">
            <div class="num" style="font-size:19px;font-weight:700"
                 >${p.progress}%</div>
            <div class="t3 tiny num">${p.tasks_done}/${p.tasks_total}</div>
          </div>
          ${icon("chevron", 15)}
        </div>
        <div style="margin-top:var(--s2)">${bar(p.progress)}</div>
        ${done || p.archived
          ? `<div class="tag" style="margin-top:var(--s2)">${state_tag}</div>` : ""}
      </div>`;
  }).join("") + sharedBlock;
}

/* ---------- one project and the work inside it ---------- */
SCREENS.project = () => {
  const d = state.project;
  if(!d) return `<div class="spin"></div>`;
  const p = d.project;

  let h = `<div class="head">
      <button class="iconbtn" data-act="nav" data-screen="tasks"
              aria-label="${t("tasks")}">${icon("back")}</button>
      <h1 class="grow">${esc(p.name)}</h1>
      <button class="iconbtn" data-act="project-edit" data-id="${p.id}"
              aria-label="${t("edit")}">${icon("edit")}</button>
    </div>`;

  if(p.description)
    h += `<div class="t2 small wrap" style="margin-top:8px">${esc(p.description)}</div>`;

  // Progress in words as well as a percentage: "4 / 7" alone makes the
  // reader do the arithmetic.
  h += `<div class="card" style="margin-top:12px">
      <div class="row">
        <div class="grow">
          <div style="font-size:24px;font-weight:750" class="num">${p.progress}%</div>
          <div class="t2 small">${t("of_tasks", {done:p.tasks_done,
            total:p.tasks_total})}</div>
        </div>
        <div style="text-align:right">
          ${p.deadline ? `<div class="small num">${icon("calendar", 13)}
            ${isoToLabel(p.deadline)}</div>` : ""}
          <div class="tag" style="margin-top:5px">${
            p.archived ? t("st_archived")
              : p.status === "done" ? t("st_done") : t("st_active")}</div>
        </div>
      </div>${bar(p.progress)}</div>`;

  h += `<h2>${t("project_tasks")}
      <span class="act" data-act="task-add" data-project="${p.id}">
        ${icon("plus", 14)} ${t("add_task")}</span></h2>`;

  if(!d.tasks.length){
    h += `<div class="empty">${t("no_tasks_yet")}
      <button class="btn secondary sm" data-act="task-add" data-project="${p.id}"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else {
    const open = d.tasks.filter(x => x.status !== "done");
    const done = d.tasks.filter(x => x.status === "done");
    if(open.length) h += open.map(taskRow).join("");
    if(done.length){
      h += `<div class="group">${t("completed")} · ${done.length}</div>`;
      h += done.map(doneRow).join("");
    }
  }

  h += `<div class="btns">
      ${p.status === "done"
        ? `<button class="btn secondary" data-act="project-status" data-id="${p.id}"
             data-value="active">${t("mark_active")}</button>`
        : `<button class="btn secondary" data-act="project-status" data-id="${p.id}"
             data-value="done">${icon("check", 15)} ${t("mark_done")}</button>`}
      <button class="btn secondary" data-act="project-archive" data-id="${p.id}"
              data-value="${p.archived ? 0 : 1}">
        ${p.archived ? t("unarchive") : t("archive")}</button>
    </div>
    <button class="btn danger" data-act="project-delete" data-id="${p.id}"
            style="margin-top:8px">${icon("trash", 15)} ${t("delete")}</button>`;
  return h;
};

/* ---------- Statistics ----------
   Its own screen, loaded only when opened: Home never pays for chart
   history it does not show. Every number comes from the backend, from
   the same functions Home reads, so the two cannot disagree. */
SCREENS.stats = () => {
  const st = state.stats;
  if(!st) return `<h1>${t("stats")}</h1><div class="spin"></div>`;
  const today = st.today;

  /* Today against yesterday, as a number rather than as an arrow. The header
     used to draw a single ↑ next to the percentage, which said a direction and
     withheld the size — and the size is the whole question. Yesterday's own
     score is printed underneath, because "+12%" is only meaningful next to
     what it moved from. */
  const yesterday = today.yesterday;
  const known = yesterday !== null && yesterday !== undefined;
  const change = known ? today.overall - yesterday : null;
  const dir = !known || change === 0 ? "flat" : change > 0 ? "up" : "down";

  let h = `<h1>${t("stats")}</h1>
    <div class="hero" style="margin-top:14px" data-act="overall-why">
      <div class="row">
        <div class="grow eyebrow">${t("overall")} · ${t("today")}</div>
        <button class="iconbtn sm bare" style="color:inherit;opacity:.8"
                aria-label="${t("how_calculated")}">${icon("info", 17)}</button>
      </div>
      <div class="num" style="font-size:42px;font-weight:760;
           letter-spacing:-1.5px;line-height:1.02;margin-top:2px">
        ${today.measured === false ? "—" : today.overall + "%"}</div>
      <div class="small wrap" style="margin-top:var(--s1)">
        ${known
          ? `<b>${TREND_ICON[dir] || ""}${change > 0 ? "+" : ""}${change}%</b>
             ${t("vs_yesterday")} <span class="t2">(${yesterday}%)</span>`
          : t("vs_yesterday_none")}</div>
      <div style="margin-top:var(--s2)">${bar(today.overall)}</div>
    </div>`;

  /* The three parts of today, each its own block in its own hue — the same
     three, in the same three colours, as on Home, so the two screens teach one
     vocabulary instead of two. Each carries the period's change underneath,
     which is the number this screen exists for. */
  /* A percentage never stands alone: under it, the counts it came from
     ("4 of 7 tasks done") when the summary has them, then the change. */
  const sum = state.summary?.today || {};
  const tile = (key, label, value, percent, delta, count) => `
    <div class="tinted tile ${COMPONENT_TONE[key]}">
      <div class="row" style="gap:var(--s1)">
        <span class="itile">${icon(COMPONENT_ICON[key], 17)}</span>
        <div class="grow"></div>
        <span class="wt num" title="${t("weight")}">${t("weight")} ${WEIGHTS[key]}%</span>
      </div>
      <div class="k ellipsis">${label}</div>
      <div class="v num">${value}</div>
      <div class="sub num">${count ? `<div>${count}</div>` : ""}${teamDelta(delta)}</div>
      ${bar(percent)}
    </div>`;

  h += `<div class="tiles two" style="margin-top:var(--s2)">
      ${tile("tasks", t("tasks"), pct(today.tasks),
             today.tasks || 0, st.deltas.tasks,
             sum.tasks_total ? t("of_tasks", {done: sum.tasks_done, total: sum.tasks_total}) : "")}
      ${tile("habits", t("habits"), pct(today.habits),
             today.habits || 0, st.deltas.habits,
             sum.habits_total ? t("of_habits", {done: sum.habits_done, total: sum.habits_total}) : "")}
      ${tile("focus", t("week_focus"), pct(today.focus),
             today.focus || 0, st.deltas.focus)}
      ${tile("prayer", t("prayer"),
             `${today.prayer_performed}/${today.prayer_required}`,
             today.prayer || 0, st.deltas.prayer)}
    </div>
    <div class="item" style="margin-top:var(--s1)">
      <span class="itile tone-4">${icon("flame", 17)}</span>
      <div class="grow">${t("streak")}</div>
      <div class="num" style="font-weight:660">${today.streak}</div>
    </div>`;

  h += `<div class="seg" style="margin:16px 0 12px">
      ${["week","month","year"].map(p => `<div class="${st.period === p ? "on" : ""}"
        data-act="stats-period" data-period="${p}">${t(p)}</div>`).join("")}</div>`;

  // The series are togglable, because four lines at once is a mess and
  // which two matter is the user's call, not ours.
  // Four series, four of the theme's five brand colours. The palette comes
  // from the theme rather than being fixed here, so a chart never clashes
  // with the screen it sits on.
  const SERIES = [
    {field:"overall", color:"var(--c1)", label:t("overall")},
    {field:"tasks",   color:"var(--c2)", label:t("tasks")},
    {field:"habits",  color:"var(--c3)", label:t("habits")},
    {field:"focus",   color:"var(--c5)", label:t("week_focus")},
    {field:"prayer",  color:"var(--c4)", label:t("prayer")},
  ];
  const active = SERIES.filter(k => state.statsSeries[k.field]);
  h += `<div class="card">
      ${lineChart(st.series, active.length ? active : [SERIES[0]])}
      <div class="legend">${SERIES.map(k =>
        `<span class="${state.statsSeries[k.field] ? "" : "off"}"
          data-act="series-toggle" data-field="${k.field}">
          <i style="background:${k.color}"></i>${k.label}</span>`).join("")}</div>
    </div>`;

  /* The period's averages, on one divided line rather than as four more
