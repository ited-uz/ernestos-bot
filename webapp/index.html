<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>ErnestOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ==================================================================
   ErnestOS design system.

   One set of semantic tokens; five themes that redefine them. No
   component below this block names a colour — they all reference
   semantics, which is what lets a theme change the whole visual system
   without duplicating a single component:

     --bg / --surface / --surface-2   ground and panels
     --text / --text-2 / --text-3     primary, secondary, tertiary
     --primary / --primary-2          the brand and its pressed state
     --accent / --accent-2            analytics, progress, highlights
     --border / --border-2            hairlines and stronger dividers
     --ok / --warn / --danger         state

   Each theme also sets its own structure — radius, shadow depth, border
   weight, gradient policy, type weight — because a theme that only
   changes hue is a palette, not a design.

   Spacing is an 8px scale (--s1..--s6) with 4px available as --s0.
   ================================================================== */
/* ------------------------------------------------------------------
   Structure. Shared by every theme and every mode; only the values a
   theme overrides below differ. Colour lives in the theme blocks.
   ------------------------------------------------------------------ */
:root{
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:20px;
  --radius-pill:999px;
  --border-w:1px;
  /* Shadows are composed from the mode's own tint and strength, so one
     definition covers both light and dark. */
  --shadow-1:0 1px 2px rgba(var(--shadow-rgb), calc(.05 * var(--shadow-k)));
  --shadow-2:0 8px 24px rgba(var(--shadow-rgb), calc(.08 * var(--shadow-k)));
  --shadow-3:0 16px 40px rgba(var(--shadow-rgb), calc(.12 * var(--shadow-k)));
  /* A theme opts into gradient here, once, instead of per component. */
  --primary-fill:var(--primary);
  --hero-fill:linear-gradient(135deg,var(--c1),var(--c3));
  --hero-text:#FFFFFF;
  --ring:0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
  --title-w:680;
  --display-w:700;
  --motion:200ms;
  /* Glass is a theme decision, made once here. A theme that wants frosted
     panels sets --card-bg to a translucent mix and --blur to a filter; the
     opaque themes leave both alone and pay nothing for the feature. */
  --card-bg:var(--surface);
  --card-2-bg:var(--surface-2);
  --blur:none;
  /* The ground behind everything. Themes that want light behind the glass
     paint it here rather than inside a component. */
  --backdrop:none;

  /* ---- 8px spacing scale ---- */
  --s0:4px; --s1:8px; --s2:12px; --s3:16px; --s4:24px; --s5:32px; --s6:48px;
  --pad:var(--s3);
  /* Height of the floating create button plus its offset, so page content
     can always scroll clear of it. */
  --fab-clear:76px;
}

/* ------------------------------------------------------------------
   Themes: five identities, each in a light and a dark mode.

   Every block below sets the same token names, so no combination can
   inherit another one's surfaces — that bug shipped once and is now
   impossible by construction. Structure (radius, type weight, motion)
   is keyed on the theme alone, further down; only colour depends on
   the mode.
   ------------------------------------------------------------------ */

/* Every hue below is an Apple system colour, in its light or dark variant,
   and every grey is from Apple's own neutral ramp (systemGray..systemGray6,
   label/secondaryLabel/tertiaryLabel, separator). That is not decoration: the
   set is contrast-tested at both ends, the light and dark variants of a hue
   are calibrated to feel like the same colour rather than merely to share a
   name, and the greys are the exact values a native list sits on. Picking
   hexes by eye is how an interface ends up looking almost right.

   Where a hue is used for *text or an icon* on a light ground, the darker
   accessible variant is used instead of the vivid one — systemGreen #34C759
   is 1.9:1 on white and unreadable as a label. The vivid one stays for fills,
   which is what it is for. */

/* ---- OCEAN GLASS — the default. systemBlue under frosted glass, over a
   softly lit ground. Universal, premium, safe to open on. ---- */

:root[data-theme="ocean"][data-mode="light"]{
  --bg:#F1F4F9; --surface:#FFFFFF; --surface-2:#E8ECF3;
  --text:#06070A; --text-2:#6C7280; --text-3:#A2A7B2;
  --border:#DCE0E8; --border-2:#C6CBD4;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#007AFF; --c2:#30B0C7; --c3:#5856D6; --c4:#FF9500; --c5:#34C759;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 78%, #000);
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:9,30,66; --shadow-k:1.2;
  --card-bg:color-mix(in srgb, #FFFFFF 78%, transparent);
  --card-2-bg:color-mix(in srgb, var(--surface-2) 72%, transparent);
  --backdrop:
    radial-gradient(58% 40% at 6% 0%, rgba(0,122,255,.15), transparent 70%),
    radial-gradient(50% 36% at 98% 4%, rgba(48,176,199,.13), transparent 72%),
    radial-gradient(70% 44% at 50% 100%, rgba(88,86,214,.08), transparent 72%);
}

:root[data-theme="ocean"][data-mode="dark"]{
  --bg:#060A12; --surface:#111621; --surface-2:#1A2130;
  --text:#FFFFFF; --text-2:#98A0AE; --text-3:#6C7280;
  --border:#232B3A; --border-2:#333B4D;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#0A84FF; --c2:#40C8E0; --c3:#5E5CE6; --c4:#FF9F0A; --c5:#30D158;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 78%, #fff);
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:8;
  --card-bg:color-mix(in srgb, var(--surface) 68%, transparent);
  --card-2-bg:color-mix(in srgb, var(--surface-2) 64%, transparent);
  --backdrop:
    radial-gradient(58% 40% at 6% 0%, rgba(10,132,255,.20), transparent 70%),
    radial-gradient(50% 36% at 98% 4%, rgba(64,200,224,.13), transparent 72%),
    radial-gradient(72% 46% at 50% 100%, rgba(94,92,230,.14), transparent 74%);
}

/* ---- MIDNIGHT MINIMAL — the native-looking one. Apple's exact grouped
   backgrounds and separators, one systemBlue accent, true black in the dark.
   No gradient, no blur, almost no shadow. ---- */

:root[data-theme="midnight"][data-mode="light"]{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#E5E5EA;
  --text:#000000; --text-2:#6C6C70; --text-3:#AEAEB2;
  --border:#D8D8DC; --border-2:#C6C6C8;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#5856D6; --c2:#8E8E93; --c3:#5AC8FA; --c4:#FF9500; --c5:#34C759;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 78%, #000);
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:0,0,0; --shadow-k:.5;
}

:root[data-theme="midnight"][data-mode="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E;
  --text:#FFFFFF; --text-2:#98989F; --text-3:#6C6C70;
  --border:#38383A; --border-2:#48484A;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#5E5CE6; --c2:#98989D; --c3:#64D2FF; --c4:#FF9F0A; --c5:#30D158;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 78%, #fff);
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:4;
}

/* ---- AURORA GLASS — systemIndigo into systemPurple into systemCyan, seen
   through glass. The most expressive of the five; the gradient stays on the
   headline surface and the primary button, never on a reading surface. ---- */

:root[data-theme="aurora"][data-mode="light"]{
  --bg:#F3F2F9; --surface:#FFFFFF; --surface-2:#EBE9F6;
  --text:#0C0A18; --text-2:#615F74; --text-3:#9997AB;
  --border:#DEDBEC; --border-2:#C7C3DE;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#AF52DE; --c2:#32ADE6; --c3:#5856D6; --c4:#FF2D55; --c5:#00C7BE;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 78%, #000);
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:40,26,90; --shadow-k:1.4;
  --card-bg:color-mix(in srgb, #FFFFFF 76%, transparent);
  --card-2-bg:color-mix(in srgb, var(--surface-2) 70%, transparent);
  --backdrop:
    radial-gradient(46% 32% at 0% 0%, rgba(88,86,214,.22), transparent 70%),
    radial-gradient(44% 30% at 100% 8%, rgba(50,173,230,.20), transparent 70%),
    radial-gradient(52% 34% at 78% 92%, rgba(175,82,222,.16), transparent 72%);
}

:root[data-theme="aurora"][data-mode="dark"]{
  --bg:#08060F; --surface:#151228; --surface-2:#1F1B3A;
  --text:#FFFFFF; --text-2:#A3A0C0; --text-3:#726F8E;
  --border:#292350; --border-2:#38316B;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#BF5AF2; --c2:#64D2FF; --c3:#5E5CE6; --c4:#FF375F; --c5:#66D4CF;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 78%, #fff);
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:9;
  --card-bg:color-mix(in srgb, var(--surface) 66%, transparent);
  --card-2-bg:color-mix(in srgb, var(--surface-2) 62%, transparent);
  --backdrop:
    radial-gradient(46% 32% at 0% 0%, rgba(94,92,230,.32), transparent 70%),
    radial-gradient(44% 30% at 100% 8%, rgba(100,210,255,.20), transparent 70%),
    radial-gradient(54% 36% at 80% 94%, rgba(191,90,242,.24), transparent 72%);
}

/* ---- PURE BENTO — a structured grouped list. Apple's own greys, label
   black as the brand, systemBlue as the single accent. No blur, no shadow,
   no gradient: the blocks and their hairlines are the design. ---- */

:root[data-theme="bento"][data-mode="light"]{
  --bg:#F2F2F0; --surface:#FFFFFF; --surface-2:#EAEAE6;
  --text:#111110; --text-2:#6B6B66; --text-3:#ADADA6;
  --border:#DEDED9; --border-2:#C6C6C0;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#1C1C1A; --c2:#007AFF; --c3:#00C7BE; --c4:#FF9500; --c5:#AF52DE;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 82%, #fff);
  --on-primary:#FFFFFF;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:0,0,0; --shadow-k:0;
}

:root[data-theme="bento"][data-mode="dark"]{
  --bg:#0B0B0A; --surface:#1A1A18; --surface-2:#262622;
  --text:#FFFFFF; --text-2:#99998F; --text-3:#6D6D65;
  --border:#333330; --border-2:#45453F;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#F2F2ED; --c2:#0A84FF; --c3:#66D4CF; --c4:#FF9F0A; --c5:#BF5AF2;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 82%, #000);
  --on-primary:#111110;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:0;
}

/* ---- SPATIAL LAYERED — depth instead of decoration. systemIndigo leads,
   cards sit on visible planes above the ground, radii are generous and the
   shadows are long and soft rather than dark. ---- */

:root[data-theme="spatial"][data-mode="light"]{
  --bg:#EDEFF5; --surface:#FFFFFF; --surface-2:#E3E6EF;
  --text:#0A0A14; --text-2:#5D6270; --text-3:#8F94A3;
  --border:#DDE0E9; --border-2:#C5C9D6;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#30B0C7; --c2:#007AFF; --c3:#5856D6; --c4:#FF9500; --c5:#34C759;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 78%, #000);
  /* Teal is light enough that white on it is unreadable, so the label is
     dark. Apple does the same on its yellow and mint fills. */
  --on-primary:#00252E;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#248A3D; --warn:#B25000; --danger:#D70015;
  --shadow-rgb:14,20,45; --shadow-k:2;
}

:root[data-theme="spatial"][data-mode="dark"]{
  --bg:#08090F; --surface:#161825; --surface-2:#1F2233;
  --text:#FFFFFF; --text-2:#9BA0B2; --text-3:#6B7082;
  --border:#262A3A; --border-2:#353A4D;
  /* five vivid brand colours; c1 leads, c2 carries analytics */
  --c1:#40C8E0; --c2:#0A84FF; --c3:#5E5CE6; --c4:#FF9F0A; --c5:#30D158;
  --primary:var(--c1);
  --primary-2:color-mix(in srgb, var(--c1) 78%, #fff);
  --on-primary:#00252E;
  --accent:var(--c2); --accent-2:var(--c3);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --shadow-rgb:0,0,0; --shadow-k:10;
}


/* ------------------------------------------------------------------
   Per-theme structure. Keyed on the theme alone: geometry, weight, blur
   and shadow depth are part of a theme's identity and do not change with
   the mode.

   The radii follow Apple's own: a grouped list cell is 10–12, a card is
   14–16, a sheet is 26–28. Bigger than that reads as a toy, smaller as a
   web form.
   ------------------------------------------------------------------ */
[data-theme="ocean"]{
  --radius-sm:12px; --radius:16px; --radius-lg:20px;
  --blur:blur(20px) saturate(170%);
  /* White sits on this, so it is built from fixed dark stops rather than
     from --c1/--c2, which lighten in dark mode and would take the headline
     from readable to white-on-cyan. */
  --hero-fill:linear-gradient(135deg,#0060DF,#0E7490);
  --shadow-2:0 6px 22px rgba(var(--shadow-rgb), calc(.08 * var(--shadow-k)));
}
[data-theme="midnight"]{
  --radius-sm:10px; --radius:12px; --radius-lg:14px;
  --title-w:600; --display-w:640;
  /* No gradient anywhere. The headline surface is a panel with a hairline,
     and colour appears only where something is actionable. */
  --hero-fill:var(--surface);
  --hero-text:var(--text);
  --hero-border:var(--border);
  --shadow-1:none;
  --shadow-2:0 1px 3px rgba(var(--shadow-rgb), calc(.10 * var(--shadow-k)));
  --shadow-3:0 8px 24px rgba(var(--shadow-rgb), calc(.14 * var(--shadow-k)));
  --motion:170ms;
}
[data-theme="aurora"]{
  --radius-sm:14px; --radius:20px; --radius-lg:26px;
  --title-w:650;
  --blur:blur(24px) saturate(180%);
  --primary-fill:linear-gradient(135deg,var(--c1),var(--c2));
  --hero-fill:linear-gradient(135deg,#4B49C6 0%,#8E43D6 50%,#1187A8 100%);
  --shadow-2:0 8px 28px rgba(var(--shadow-rgb), calc(.09 * var(--shadow-k)));
}
[data-theme="bento"]{
  --radius-sm:10px; --radius:12px; --radius-lg:14px;
  --title-w:680; --display-w:720;
  /* No wash of colour anywhere: bento is about the grid, not the paint. */
  --hero-fill:var(--surface);
  --hero-text:var(--text);
  --hero-border:var(--border-2);
  --shadow-1:none; --shadow-2:none; --shadow-3:none;
  --motion:150ms;
}
/* Bento has no shadow to separate a block from the ground, so the hairline
   does that job instead — which is also what makes it read as a grid. */
[data-theme="bento"] .item,
[data-theme="bento"] .trow,
[data-theme="bento"] .metric{border:var(--border-w) solid var(--border)}
[data-theme="bento"] .item + .item,
[data-theme="bento"] .trow + .trow{margin-top:var(--s0)}
[data-theme="bento"] .metrics{gap:var(--s0)}
[data-theme="bento"] .trow{border-left-width:3px}
[data-theme="spatial"]{
  --radius-sm:14px; --radius:20px; --radius-lg:28px;
  --title-w:650; --display-w:690;
  --hero-fill:linear-gradient(150deg,#3F3DB8,#7C33C4 68%,#0E7490);
  /* Depth is the whole idea, so every plane is lifted further than the
     shared scale would lift it — and lifted with a wide, soft, low-opacity
     shadow rather than a dark one, which is the difference between a card
     floating and a card with a border drawn under it. */
  --shadow-1:0 1px 4px rgba(var(--shadow-rgb), calc(.05 * var(--shadow-k)));
  --shadow-2:0 10px 30px -8px rgba(var(--shadow-rgb), calc(.09 * var(--shadow-k)));
  --shadow-3:0 24px 56px -12px rgba(var(--shadow-rgb), calc(.12 * var(--shadow-k)));
  --motion:230ms;
}
/* Spatial's whole argument is that things sit on planes. Rows are lifted off
   the ground and spaced far enough apart that the lift is legible; the card
   is lifted further still, so the two read as different heights rather than
   as the same box drawn twice. */
[data-theme="spatial"] .item,
[data-theme="spatial"] .trow,
[data-theme="spatial"] .metric{box-shadow:var(--shadow-2)}
[data-theme="spatial"] .item + .item,
[data-theme="spatial"] .trow + .trow{margin-top:var(--s1)}
[data-theme="spatial"] .metrics{gap:var(--s1)}
[data-theme="spatial"] .card{box-shadow:var(--shadow-2)}
[data-theme="spatial"] .card + .card{margin-top:var(--s2)}
[data-theme="spatial"] .item.pressable:active,
[data-theme="spatial"] .card:active{transform:translateY(1px) scale(.995)}

/* ==================================================================
   Base
   ================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
       Inter,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  /* Telegram reports its own usable height; 100vh is wrong inside the
     in-app browser, so --vh is kept in sync from JS. */
  min-height:var(--vh, 100dvh);
  padding-bottom:calc(var(--shell-b, 58px) + var(--fab-clear) + var(--s2))}
/* The theme's own light, behind every screen. `none` on the themes that do
   not use it, so the layer costs nothing there. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
             background:var(--backdrop)}
#app{padding:calc(var(--s2) + var(--safe-t, 0px)) var(--pad) var(--s2);
     max-width:640px;margin:0 auto;width:100%}

/* Type scale. One family, five sizes, and no bold below 15px. */
h1{font-size:26px;font-weight:var(--title-w);letter-spacing:-.6px;line-height:1.16;
   overflow-wrap:anywhere}
/* Home's title is a greeting, and a greeting is the least informative thing
   on the screen. At the screen-title size "Assalomu alaykum, Ernest" wrapped
   to two lines and took the top fifth of the page before the day's mission —
   the thing Home exists to show — appeared. */
h1.greet{font-size:19px;letter-spacing:-.35px}
h2{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
   color:var(--text-3);margin:var(--s4) 0 var(--s1);
   display:flex;align-items:center;justify-content:space-between;gap:var(--s1)}
h2 .act{text-transform:none;letter-spacing:0;font-size:13px;font-weight:550;
        color:var(--primary);display:inline-flex;align-items:center;gap:4px;
        position:relative;cursor:pointer}
h2 .act::after{content:"";position:absolute;inset:-10px}
h3{font-size:17px;font-weight:600;letter-spacing:-.4px}
.display{font-size:34px;font-weight:var(--display-w);letter-spacing:-1.1px;
         line-height:1}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}
.small{font-size:13px} .tiny{font-size:12px}
/* The small uppercase label above a number or a title. It was written
   inline in five places, each with its own letter-spacing; one class means
   one look. */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.42px;
         text-transform:uppercase;color:var(--text-3)}
.hero .eyebrow{color:color-mix(in srgb, var(--hero-text) 66%, transparent)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:var(--s2)}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{overflow-wrap:anywhere}
.strike{text-decoration:line-through;color:var(--text-2)}
.i{flex:none;vertical-align:-2px}
.hide{display:none}

/* ==================================================================
   Surfaces
   ================================================================== */
/* A card is a panel with a hairline. No nesting: hierarchy comes from
   whitespace and type, not from boxes inside boxes. */
.card{background:var(--card-bg);border:var(--border-w) solid var(--border);
      border-radius:var(--radius);padding:var(--s3);box-shadow:var(--shadow-1);
      backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.card + .card{margin-top:var(--s1)}
.card.tight{padding:var(--s2) var(--s3)}
.card.plain{background:none;border-color:transparent;box-shadow:none;padding:0}

/* The one surface per screen that carries the brand. */
/* The themes that do not fill the hero with colour need its edge back, or
   the block dissolves into the page. */
.hero{background:var(--hero-fill);color:var(--hero-text);
      border:var(--border-w) solid var(--hero-border, transparent);
      border-radius:var(--radius-lg);
      padding:var(--s3);box-shadow:var(--shadow-2);position:relative;
      overflow:hidden;backdrop-filter:var(--blur);
      -webkit-backdrop-filter:var(--blur)}
.hero .t2,.hero .t3{color:color-mix(in srgb, var(--hero-text) 66%, transparent)}

.stack{display:flex;flex-direction:column;gap:var(--s1)}
.divide > * + *{border-top:var(--border-w) solid var(--border);
                padding-top:var(--s2);margin-top:var(--s2)}

/* ==================================================================
   Controls
   ================================================================== */
.check{width:24px;height:24px;border-radius:var(--radius-pill);flex:none;
       display:grid;place-items:center;position:relative;cursor:pointer;
       border:2px solid var(--border-2);color:transparent;background:none;
       transition:transform var(--motion),background var(--motion),
                  border-color var(--motion)}
.check::after{content:"";position:absolute;inset:-11px}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check:active{transform:scale(.86)}
.check.lock{opacity:.45;cursor:default}
.check.sq{border-radius:var(--radius-sm)}
/* On the brand surface the ordinary border disappears, so it is keyed to
   the surface's own foreground instead. */
.hero .check{border-color:color-mix(in srgb, var(--hero-text) 55%, transparent)}
.hero .check.on{background:var(--hero-text);border-color:var(--hero-text);
                color:var(--primary)}

.btn{background:var(--primary-fill);color:var(--on-primary);border:0;
     border-radius:var(--radius-sm);padding:var(--s2) var(--s3);font:inherit;
     font-size:15px;font-weight:600;cursor:pointer;min-height:46px;width:100%;
     display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);
     box-shadow:var(--shadow-1);transition:filter var(--motion),
                transform var(--motion)}
.btn:active{filter:brightness(.93);transform:scale(.995)}
.btn:focus-visible{outline:0;box-shadow:var(--ring)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.secondary{background:var(--surface-2);color:var(--text);
               border:var(--border-w) solid var(--border);box-shadow:none}
.btn.quiet{background:none;border:var(--border-w) solid var(--border-2);
           color:var(--text);box-shadow:none}
.btn.danger{background:none;border:var(--border-w) solid var(--danger);
            color:var(--danger);box-shadow:none}
.btn.text{background:none;border:0;box-shadow:none;color:var(--primary);
          width:auto;min-height:40px;padding:var(--s0) 2px;font-weight:550}
.btn.sm{width:auto;padding:var(--s1) var(--s2);font-size:13.5px;min-height:38px}
.btns{display:flex;gap:var(--s1);margin-top:var(--s2);flex-wrap:wrap}
.btns .btn{flex:1;min-width:132px}

input,textarea,select{width:100%;background:var(--surface);
  border:var(--border-w) solid var(--border-2);color:var(--text);
  border-radius:var(--radius-sm);padding:var(--s2);font:inherit;min-height:46px;
  -webkit-appearance:none;appearance:none;transition:box-shadow var(--motion),
  border-color var(--motion)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),
       linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
       background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;
       background-size:5px 5px,5px 5px;background-repeat:no-repeat;
       padding-right:38px}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--primary);
  box-shadow:var(--ring)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
label{display:block;font-size:12px;color:var(--text-2);margin:var(--s3) 0 var(--s0);
      font-weight:550}

.chip{display:inline-flex;align-items:center;gap:var(--s0);
      background:var(--surface);border:var(--border-w) solid var(--border-2);
      border-radius:var(--radius-pill);padding:var(--s1) var(--s2);font-size:13px;
      font-weight:550;white-space:nowrap;cursor:pointer;color:var(--text-2);
      transition:background var(--motion),color var(--motion),
                 border-color var(--motion)}
.chip.on{background:var(--primary-fill);border-color:transparent;
         color:var(--on-primary)}
.chip.sm{padding:6px var(--s1);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
              margin:0 calc(var(--pad) * -1);padding:0 var(--pad) 2px}
.chips.scroll::-webkit-scrollbar{display:none}

/* Segmented control: the selected cell is filled, not merely tinted. */
.seg{display:flex;background:var(--surface-2);
     border:var(--border-w) solid var(--border);border-radius:var(--radius-pill);
     padding:3px;gap:2px}
.seg > *{flex:1;text-align:center;padding:var(--s1) 6px;
         border-radius:var(--radius-pill);font-size:13px;font-weight:550;
         cursor:pointer;color:var(--text-2);white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;transition:background var(--motion),
         color var(--motion)}
.seg > *.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.hero .seg{background:color-mix(in srgb, var(--hero-text) 14%, transparent);
           border-color:transparent}
.hero .seg > *{color:color-mix(in srgb, var(--hero-text) 70%, transparent)}
.hero .seg > *.on{background:color-mix(in srgb, var(--hero-text) 92%, transparent);
                  color:var(--primary)}

.sw{width:44px;height:26px;border-radius:var(--radius-pill);flex:none;
    position:relative;background:var(--surface-2);
    border:var(--border-w) solid var(--border-2);cursor:pointer;
    transition:background var(--motion),border-color var(--motion)}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:var(--text-3);
  transition:transform var(--motion),background var(--motion)}
.sw.on{background:var(--primary);border-color:transparent}
.sw.on::before{transform:translateX(18px);background:var(--on-primary)}
.setrow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) 0;
        border-bottom:var(--border-w) solid var(--border)}
.setrow:last-child{border-bottom:0}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.p-high{background:var(--danger)} .p-medium{background:var(--warn)}
.p-low{background:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;
     font-weight:550;color:var(--text-2);
     border:var(--border-w) solid var(--border);border-radius:var(--radius-pill);
     padding:3px var(--s1)}
.tag.hot{color:var(--danger);
         border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.hero .tag{color:inherit;background:color-mix(in srgb,var(--hero-text) 14%,transparent);
           border-color:color-mix(in srgb,var(--hero-text) 28%,transparent)}

/* ==================================================================
   Progress
   ================================================================== */
.bar{height:6px;background:var(--surface-2);border-radius:var(--radius-pill);
     overflow:hidden}
.bar > span{display:block;height:100%;border-radius:var(--radius-pill);
            background:var(--primary-fill);transition:width var(--motion)}
.bar.accent > span{background:var(--accent)}
.hero .bar{background:color-mix(in srgb, var(--hero-text) 22%, transparent)}
.hero .bar > span{background:var(--hero-text)}

/* Three numbers on one line, divided rather than boxed: three separate
   cards for three small facts is three containers too many. */
/* Day, week and month, side by side. Three cells of identical shape on one
   line, so the eye compares the numbers rather than the layouts; a hairline
   divides them, because three boxes for three facts about the same score is
   three boxes too many. Same grid as the trio underneath, on purpose — the
   card then reads as two rows of three rather than as two different ideas. */
.scores{display:grid;grid-template-columns:repeat(3,1fr);align-items:start}
.scores > div{padding:0 var(--s1);min-width:0}
.scores > div + div{border-left:var(--border-w) solid var(--border)}
.score-cell .k{font-size:11px;color:var(--text-3);font-weight:550;
               text-transform:uppercase;letter-spacing:.4px}
/* The delta sits on the same line as the number and wraps under it on a
   narrow phone rather than pushing the percentage out of the cell. */
.score-cell .v{font-size:20px;font-weight:660;letter-spacing:-.4px;
               margin-top:2px;display:flex;align-items:baseline;gap:var(--s0);
               flex-wrap:wrap}
/* Today leads: it is the only one of the three the user can still change. */
.score-cell.lead .k{color:var(--text-2)}
.score-cell.lead .v{font-size:25px;font-weight:700;letter-spacing:-.7px}
.scores > div:first-child{padding-left:0}

.trio{display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.trio > div{padding:0 var(--s1);text-align:center;min-width:0}
.trio > div + div{border-left:var(--border-w) solid var(--border)}
.trio .k{font-size:11px;color:var(--text-3);font-weight:550;
         text-transform:uppercase;letter-spacing:.4px}
.trio .v{font-size:17px;font-weight:600;margin-top:2px;letter-spacing:-.3px}
.hero .trio > div + div{border-left-color:color-mix(in srgb,
                        var(--hero-text) 24%, transparent)}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.metric{background:var(--card-bg);border:0;
        backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
        border-radius:var(--radius);padding:var(--s2) var(--s3);min-width:0}
.metric .k{font-size:11px;color:var(--text-3);text-transform:uppercase;
           letter-spacing:.4px;font-weight:550}
.metric .v{font-size:20px;font-weight:600;letter-spacing:-.4px;margin-top:2px;
           display:flex;align-items:baseline;gap:var(--s0);flex-wrap:wrap}
.metric.wide{grid-column:1 / -1;display:flex;align-items:center;
             justify-content:space-between;gap:var(--s2)}
.metric.wide .v{margin-top:0}
.delta{font-size:12.5px;font-weight:600}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)}
.delta.flat{color:var(--text-3)}

/* ==================================================================
   Tinted blocks
   ==================================================================
   Three facts about the same day used to be three cells of one grey card,
   and the eye read them as one object. A block now carries a hue of its
   own — one of the theme's five brand colours, set once in `--tint` — so
   tasks, habits and prayer are three things on the screen rather than one
   paragraph of numbers.

   The tint paints the frame: the wash the block sits on, its hairline, its
   icon tile and its bar. It never paints body text. systemGreen is 1.9:1 on
   white, and legibility is not where a palette gets spent — so a glyph is
   the tint pushed a little towards the foreground colour, which darkens it
   on a light ground and lightens it on a dark one without either mode
   needing a rule of its own.

   Nothing here names a colour, so the whole set repaints with the theme. */
.tinted{--tint:var(--c1);
  background:
    linear-gradient(180deg,
      color-mix(in srgb, var(--tint) 13%, transparent),
      color-mix(in srgb, var(--tint) 4%, transparent)),
    var(--card-bg);
  border:var(--border-w) solid color-mix(in srgb, var(--tint) 30%, var(--border));
  border-radius:var(--radius);
  box-shadow:var(--shadow-1);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
/* The five hues, named by position rather than by colour: a screen asks for
   "the second tone", not "the teal one", and a theme decides what that is. */
.tone-1{--tint:var(--c1)} .tone-2{--tint:var(--c2)} .tone-3{--tint:var(--c3)}
.tone-4{--tint:var(--c4)} .tone-5{--tint:var(--c5)}

/* The rounded icon tile in front of a block's title — the one shape that
   makes a list of blocks scannable without reading a word of it. */
/* The fallback matters: a tile is also used on its own, outside a tinted
   block, where there is no `--tint` to inherit. */
.itile{width:30px;height:30px;border-radius:9px;flex:none;display:grid;
  place-items:center;
  background:color-mix(in srgb, var(--tint, var(--c1)) 18%, transparent);
  color:color-mix(in srgb, var(--tint, var(--c1)) 84%, var(--text))}
.itile.lg{width:34px;height:34px;border-radius:10px}

/* Today in three tiles: one per measurable part of the day, each its own
   object, each opening the screen that owns it. */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s1)}
/* Four parts read better two by two than as four slivers on one line. */
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
/* What this part is worth in the score, on the block itself. */
.wt{font-size:10.5px;font-weight:650;color:var(--text-3);
    background:color-mix(in srgb, var(--tint, var(--c1)) 14%, transparent);
    border-radius:var(--radius-pill);padding:2px 7px;flex:none}
.tile{padding:var(--s2);min-width:0;cursor:pointer;
      transition:transform var(--motion)}
.tile:active{transform:scale(.985)}
.tile .k{font-size:10.5px;font-weight:600;letter-spacing:.36px;
         text-transform:uppercase;color:var(--text-2);margin-top:var(--s1)}
.tile .v{font-size:20px;font-weight:670;letter-spacing:-.5px;margin-top:1px;
         line-height:1.15}
.tile .sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.tile .bar{margin-top:var(--s1);height:5px;
           background:color-mix(in srgb, var(--tint) 15%, var(--surface-2))}
.tile .bar > span{background:var(--tint)}

/* A tinted block used as a full-width panel: the icon tile, a title, and
   whatever the block is about underneath. */
.block{padding:var(--s3)}
.block + .block{margin-top:var(--s1)}
.tinted.off{opacity:.6}
.tinted[data-act]{cursor:pointer;transition:transform var(--motion)}
.tinted[data-act]:active{transform:scale(.995)}
.block .bh{display:flex;align-items:center;gap:var(--s2)}
.block .bt{font-size:15px;font-weight:620;letter-spacing:-.2px}
.block .bar > span{background:var(--tint)}

/* A section heading that carries the same hue as the blocks under it, so a
   screen reads as a few labelled groups instead of one long scroll. */
.sechead{display:flex;align-items:center;gap:var(--s1);
         margin:var(--s4) 0 var(--s1)}
.sechead .lbl{font-size:12px;font-weight:600;letter-spacing:.4px;
              text-transform:uppercase;color:var(--text-3);flex:1;min-width:0}
.sechead .act{text-transform:none;letter-spacing:0;font-size:13px;
              font-weight:550;color:var(--primary);display:inline-flex;
              align-items:center;gap:4px;position:relative;cursor:pointer}
.sechead .act::after{content:"";position:absolute;inset:-10px}
.sechead .dotline{width:22px;height:3px;border-radius:2px;flex:none;
                  background:var(--tint, var(--primary))}

/* ==================================================================
   Rows
   ================================================================== */
/* A row is carried by its own surface, not by an outline. Eight tasks used
   to be eight outlined boxes stacked six pixels apart — sixteen horizontal
   lines for eight facts. The fill already separates the row from the ground,
   so the border is a second separator doing the same job, and the rows sit
   close enough to read as one list. */
.item{background:var(--card-bg);border:0;
      backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
      border-radius:var(--radius);padding:var(--s2) var(--s3);
      display:flex;align-items:center;gap:var(--s2);min-height:52px}
.item + .item{margin-top:2px}
.item .meta{font-size:12.5px;color:var(--text-2);margin-top:2px;display:flex;
            align-items:center;gap:6px;flex-wrap:wrap}
.item.off{opacity:.55}
.item.pressable{cursor:pointer;transition:transform var(--motion)}
.item.pressable:active{transform:scale(.995)}

/* A task row's only decoration is the priority edge. */
.trow{background:var(--card-bg);border:0;
      backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
      border-left:3px solid transparent;border-radius:var(--radius);
      padding:var(--s2) var(--s3);display:flex;align-items:flex-start;
      gap:var(--s2)}
.trow + .trow{margin-top:2px}
/* Only the exception is marked. "Medium" is the default every task is born
   with, so colouring it painted an amber stripe down the whole list and left
   the genuinely urgent one indistinguishable from the rest. */
.trow.pri-high{border-left-color:var(--danger)}
.trow .tt{font-weight:550;line-height:1.35;overflow-wrap:anywhere;cursor:pointer}
.trow .td{font-size:12.5px;color:var(--text-2);margin-top:3px;display:flex;
          align-items:center;gap:6px;flex-wrap:wrap}
.trow .quick{display:flex;gap:5px;margin-top:var(--s1);flex-wrap:wrap}
.group{font-size:12.5px;font-weight:600;color:var(--text-2);
       margin:var(--s3) 0 6px;display:flex;align-items:center;gap:6px}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.strip .d{border-radius:var(--radius-sm);background:var(--surface);
          border:var(--border-w) solid var(--border);padding:6px 2px;
          text-align:center;min-width:0;cursor:pointer}
.strip .d.now{border-color:var(--primary);
              background:color-mix(in srgb, var(--primary) 10%, var(--surface))}
.strip .dow{font-size:9.5px;font-weight:600;color:var(--text-3);
            text-transform:uppercase}
.strip .dd{font-size:14px;font-weight:600;margin-top:2px}
.strip .mk{height:4px;margin-top:3px;display:flex;justify-content:center;gap:2px}
.strip .mk i{width:4px;height:4px;border-radius:50%;background:var(--primary)}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;
          margin-bottom:var(--s2);gap:var(--s1)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;
          width:100%}
.cal-dow{text-align:center;font-size:9.5px;color:var(--text-3);padding:2px 0;
         font-weight:600;min-width:0;overflow:hidden;text-transform:uppercase}
.cal-day{aspect-ratio:1;min-width:0;border-radius:var(--radius-sm);
         background:var(--surface-2);border:var(--border-w) solid transparent;
         display:flex;flex-direction:column;align-items:center;
         justify-content:center;font-size:12.5px;gap:3px}
.cal-day.empty{background:transparent}
.cal-day.today{border-color:var(--primary);color:var(--primary);font-weight:600}
.cal-day.has{cursor:pointer}
.cal-dots{display:flex;gap:2px;height:4px}
.cal-dots i{width:4px;height:4px;border-radius:50%}
.k-task{background:var(--c1)} .k-project{background:var(--c2)}
.k-birthday{background:var(--c4)}

/* Habit history grid */
.hgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.hgrid i{aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.hgrid i.due{background:var(--border-2)}
.hgrid i.done{background:var(--ok)}

/* Prayer: name on its own line, states in one strip that scrolls. */
.prow{padding:var(--s1) 0;border-bottom:var(--border-w) solid var(--border)}
.prow:last-of-type{border-bottom:0}
.prow .pn{font-size:14.5px;font-weight:550;display:flex;align-items:center;
          gap:6px;margin-bottom:6px}
.prow .ps{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
          margin:0 calc(var(--s3) * -1);padding:1px var(--s3)}
.prow .ps::-webkit-scrollbar{display:none}
@media (min-width:480px){
  .prow{display:flex;align-items:center;gap:var(--s2)}
  .prow .pn{width:100px;flex:none;margin-bottom:0}
  .prow .ps{flex:1;justify-content:flex-end;overflow:visible;margin:0;padding:0}
}
.st{border-radius:var(--radius-pill);
    border:var(--border-w) solid var(--border-2);background:var(--surface);
    padding:6px var(--s1);font-size:12.5px;font-weight:550;cursor:pointer;
    white-space:nowrap;color:var(--text-2);transition:background var(--motion),
    color var(--motion)}
/* Each state keeps its own colour when chosen, so a day reads at a glance. */
/* Text on a filled state chip. Every theme's --on-primary is the
   readable foreground for its own filled surfaces. */
.st.on{color:var(--on-primary);border-color:transparent}
.st.jamaat.on{background:var(--ok)}
.st.on_time.on{background:color-mix(in srgb, var(--ok) 82%, var(--surface))}
.st.qaza.on{background:var(--warn)}
.st.missed.on{background:var(--danger)}

/* ==================================================================
   Chrome
   ================================================================== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;
    grid-template-columns:repeat(4,1fr);
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:saturate(140%) blur(18px);
    -webkit-backdrop-filter:saturate(140%) blur(18px);
    border-top:var(--border-w) solid var(--border);
    padding-bottom:var(--safe-b, 0px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  nav{background:var(--surface)}
  .sheet-inner{background:var(--surface)}
}
nav button{background:0;border:0;color:var(--text-3);padding:7px 4px 8px;
           font-size:10.5px;font-weight:550;cursor:pointer;display:grid;gap:2px;
           justify-items:center;min-height:52px;
           transition:color var(--motion)}
nav button.on{color:var(--primary)}
nav button .ic{display:grid;place-items:center;height:24px}

.fab{position:fixed;right:calc(var(--pad) + 2px);z-index:41;
     bottom:calc(var(--shell-b, 58px) + var(--s3));
     width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
     background:var(--primary-fill);color:var(--on-primary);
     box-shadow:var(--shadow-3);display:grid;place-items:center;
     transition:transform var(--motion),filter var(--motion)}
.fab:active{transform:scale(.94);filter:brightness(.94)}

/* The privacy promise, once, at the foot of Home — in the page, not welded
   above the navigation on every screen. As fixed chrome it cost a bar and a
   second hairline above the tab bar on all four screens, forever, to repeat
   a sentence that is read once. It is still in the app on the first screen
   the user lands on, and again in Settings under "About privacy". */
.privacy-strip{margin:var(--s4) 0 var(--s1);text-align:center;
  font-size:11px;line-height:1.35;color:var(--text-3)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
       align-items:flex-end;z-index:50}
.sheet.show{display:flex}
.sheet-inner{background:var(--surface);width:100%;max-width:640px;margin:0 auto;
             border-radius:calc(var(--radius-lg) + 6px)
                           calc(var(--radius-lg) + 6px) 0 0;
             border-top:var(--border-w) solid var(--border);

/* An icon button is a target, not a boxed object. Outlined and filled, every
   gear, chevron and star read as a control competing with the content beside
   it — a list of six tasks came with six grey squares down its right edge.

   that needs to stand off a coloured surface. */
.iconbtn{width:38px;height:38px;min-width:38px;border-radius:var(--radius-sm);
         flex:none;display:grid;place-items:center;background:none;
         border:0;color:var(--text-3);
         position:relative;cursor:pointer;
         transition:color var(--motion),background var(--motion)}
.iconbtn::after{content:"";position:absolute;inset:-4px}
.iconbtn:active{color:var(--primary);background:var(--surface-2)}
.iconbtn.sm{width:32px;height:32px;min-width:32px}
.iconbtn.bare{background:none;border-color:transparent;color:var(--text-3)}
.iconbtn[disabled]{opacity:.35;pointer-events:none}
.hero .iconbtn{background:color-mix(in srgb, var(--hero-text) 14%, transparent);
               border-color:transparent;color:inherit}
.card.flat{box-shadow:none}
/* Drag handle for reordering. */
.handle{cursor:grab;touch-action:none;color:var(--text-3);flex:none;padding:0 2px}

  *{animation:none!important;transition:none!important}

/* ==================================================================
   ErnestOS Mini App.

   Screens are pure functions of `state` returning HTML; the page is
   re-rendered from that state. Nothing patches a node by id, so
   removing a feature cannot leave a dangling lookup that blanks the
   page — a failure this app shipped with once before.

   Every string lives in DICT, in all three languages. A key that
   exists in one language and not another is a bug, and the test suite
   checks for it rather than trusting review.
   ================================================================== */

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
tg?.disableVerticalSwipes?.();

/* Telegram's in-app browser reports a usable height that 100vh gets
   wrong, and the value changes as the keyboard opens. Mirror it, plus
   both safe-area insets, into custom properties. */
function syncViewport(){
  const root = document.documentElement;
  const h = tg?.viewportStableHeight || tg?.viewportHeight || window.innerHeight;
  root.style.setProperty("--vh", h + "px");
  const inset = tg?.contentSafeAreaInset || tg?.safeAreaInset;
  const outer = tg?.safeAreaInset;
  root.style.setProperty("--safe-t",
    Math.max(inset?.top ?? 0, outer?.top ?? 0) + "px");
  root.style.setProperty("--safe-b",
    `max(${Math.max(inset?.bottom ?? 0, outer?.bottom ?? 0)}px, env(safe-area-inset-bottom, 0px))`);
}
syncViewport();
tg?.onEvent?.("viewportChanged", syncViewport);
tg?.onEvent?.("safeAreaChanged", syncViewport);
tg?.onEvent?.("contentSafeAreaChanged", syncViewport);
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", () => setTimeout(syncViewport, 250));

   is visible in testing instead of silently shipping. */

  let s = D()[k];
  if(s === undefined) s = DICT.uz[k] ?? k;
  if(vars) for(const [key, value] of Object.entries(vars))
    s = String(s).split("{" + key + "}").join(value);
  return s;
};

/* ---------- api ---------- */
async function api(path, options = {}){
  const res = await fetch(path, {
    ...options,
    headers:{"Content-Type":"application/json",
             "X-Telegram-Init-Data": tg?.initData || "", ...(options.headers||{})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if(!res.ok){
    const err = new Error("http_" + res.status);
    err.status = res.status;
    try{ err.detail = (await res.json())?.detail; }catch(_){}
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

let toastTimer;
/* A toast may carry one action. Undo is offered wherever the action is
   reversible in one call, which is what makes a destructive tap safe to
   make with a thumb. */
function toast(msg, undoLabel, undoFn){
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>` +
    (undoFn ? `<span class="undo" id="toast-undo">${esc(undoLabel)}</span>` : "");
  el.classList.add("show");
  if(undoFn) document.getElementById("toast-undo").onclick = () => {
    el.classList.remove("show");
    undoFn();
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), undoFn ? 5000 : 2000);
}

/* Telegram's own Back button, wired to whatever is currently "back":
   the open sheet first, then a sub-screen, then nothing. Without this,
   the hardware back gesture closes the whole Mini App from a detail
   view, which loses whatever the user was doing. */

  const bb = tg?.BackButton;

/* A signed delta, drawn with its own arrow so the direction survives a
   monochrome screen. Zero is written as a dash, not "+0%". */
function deltaTag(value){
  if(!value) return `<span class="delta flat">·</span>`;
  const up = value > 0;
  return `<span class="delta ${up ? "up" : "down"}">${up ? "↑" : "↓"}${Math.abs(value)}</span>`;
}

/* Local dates without pulling in a formatting library: the payload
   already carries ISO strings and the month names are in DICT. */
function isoToLabel(iso){
  if(!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${D().months[m - 1]}`;
}
function shiftISO(iso, days){
  const dt = new Date(iso + "T00:00:00");
  dt.setDate(dt.getDate() + days);
  return dt.toISOString().slice(0, 10);
}
const todayISO = () => state.home?.date || new Date().toISOString().slice(0, 10);

/* ---------- line chart (inline SVG, no libraries) ---------- */
function lineChart(series, keys){
  if(!series.length) return `<div class="empty">${t("no_data")}</div>`;
  const W = 320, H = 148, L = 18, R = 8, TOP = 12, BOT = 24;
  const stepX = series.length > 1 ? (W - L - R) / (series.length - 1) : 0;
  const y = v => H - BOT - (v / 100) * (H - TOP - BOT);
  const x = i => L + i * stepX;

  const grid = [0, 50, 100].map(v =>
    `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"
       stroke-width="1" stroke-dasharray="2 5"/>
     <text x="0" y="${y(v)+3}" font-size="8" fill="var(--text-3)">${v}</text>`).join("");

  const paths = keys.map((k, n) => {
    const pts = series.map((p, i) => `${x(i)},${y(p[k.field] ?? 0)}`).join(" ");
    const area = `${L},${y(0)} ${pts} ${x(series.length-1)},${y(0)}`;
    const dots = series.length <= 12
      ? series.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[k.field] ?? 0)}" r="2.5"
          fill="${k.color}"/>`).join("") : "";
    return `<polygon points="${area}" fill="${k.color}" opacity="${n === 0 ? .10 : .05}"/>
      <polyline points="${pts}" fill="none" stroke="${k.color}" stroke-width="2.3"
        stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");

  // Anchor the first and last labels inward so they are not clipped by
  // the SVG edge; everything between stays centred on its point.
  const every = Math.ceil(series.length / 6);
  const last = series.length - 1;
  const labels = series.map((p, i) => {
    if(i % every !== 0 && i !== last) return "";
    const anchor = i === 0 ? "start" : i === last ? "end" : "middle";
    return `<text x="${x(i)}" y="${H-6}" font-size="8.5" fill="var(--text-3)"
              text-anchor="${anchor}">${p.label}</text>`;
  }).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${paths}${labels}</svg>`;
}

const SCREENS = {};

/* Home, top to bottom: who and when, then ONE action, then today's
   numbers, then the three that matter, the week's focus, the rest of
   today, and the week strip. Everything on this screen is either the
   next action or a number about today. Editing and deleting live on the
   screens that own the data, so a mis-tap here cannot destroy
   anything. */
SCREENS.home = () => {
  const d = state.home;
  if(!d) return `<div class="spin"></div>`;

  /* Four blocks and nothing else, in the order they are needed:

       who and when   →  the one thing to do today
                      →  how today is going
                      →  the rest of today's work

     Everything that used to live here — the top three, the week's focus,
     birthdays — is one tap away on the screen that owns it. The month grid
     went the same way: it is forty-two cells about the rest of the month on
     a screen whose whole job is today, and it now opens from the date in the
     header, which is where somebody looking for a month would tap anyway.
     The point of Home is that opening it answers the question without
     scrolling. */
  return headBlock(d)
       + nowBlock(d)
       + scoreBlock(d)
       + todayBlock(d)
       + tasksBlock(d)
       + privacyNote();
};

/* The privacy promise, once, at the foot of the first screen — not a fixed
   bar above the tab bar on all four. */
function privacyNote(){

}
