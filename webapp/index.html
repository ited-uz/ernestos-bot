/* Setup is finished in the chat. A spinner that never ended was the answer
   to a 409 here before. */
function setupScreen(){
  return `<div style="padding:40px 0 0;text-align:center">
      <div class="state-ico">${icon("user", 26)}</div>
      <h1 style="margin-top:12px">${t("setup_title")}</h1>
      <div class="t2 small" style="margin-top:8px;max-width:340px;margin-left:auto;
           margin-right:auto">${t("setup_body")}</div>
      <div style="margin-top:22px;text-align:left">
        <button class="btn" data-act="back-to-bot">${t("back_to_bot")}</button>
        <button class="btn secondary" data-act="reload" style="margin-top:8px">
          ${t("retry")}</button>
      </div></div>`;
}

function readOnlyBanner(){
  return state.readOnly ? `<div class="banner" data-act="sub-open" role="button" tabindex="0">
      ${icon("shield", 16)} <div class="grow">${t("read_only")}</div>${icon("chevron", 15)}</div>` : "";
}

/* An error is never a dead end: every failure screen carries the action
   that could fix it. */
function errorScreen(){
  return `<div style="padding:40px 0 0;text-align:center">
      <div class="state-ico">${icon("info", 26)}</div>
      <h1 style="margin-top:12px">${esc(state.error)}</h1>
      <div style="margin-top:20px;text-align:left">
        <button class="btn" data-act="reload">${t("retry")}</button>
        <button class="btn secondary" data-act="nav" data-screen="home"
                style="margin-top:8px">${t("go_home")}</button>
      </div></div>`;
}

/* Light or dark, resolved once. `auto` follows Telegram's own colour scheme
   when it reports one and the operating system otherwise, so the app matches
   the chat it opened from. */
function resolveMode(){
  if(state.appearance === "light" || state.appearance === "dark")
    return state.appearance;
  if(tg?.colorScheme === "light" || tg?.colorScheme === "dark")
    return tg.colorScheme;
  return window.matchMedia("(prefers-color-scheme: light)").matches
    ? "light" : "dark";
}

function render(){
  const root = document.documentElement;
  /* Two attributes drive the entire visual system: which identity, and which
     mode. Every theme defines both, so no combination inherits another's
     surfaces. */
  root.dataset.theme = themeOf(state.me?.theme);
  root.dataset.mode = resolveMode();

  const app = document.getElementById("app");
  if(state.blocked)         app.innerHTML = blockedScreen();
  else if(state.needsSetup) app.innerHTML = setupScreen();
  else if(state.error)      app.innerHTML = errorScreen();
  else if(state.loading)    app.innerHTML = `<div class="spin"></div>`;
  else app.innerHTML = readOnlyBanner() + queueBanner() + (state.screen === "home" ? trialBanner() : "")
    + groupBar(state.screen)
    + (state.screenError ? `<div class="empty">${esc(state.screenError)}
      <button class="btn secondary" data-act="retry-screen">${t("retry_screen")}</button></div>`
      : `<div class="${screenClass()}">${(SCREENS[state.screen] || SCREENS.home)()}</div>`);

  const chromeOff = Boolean(state.blocked || state.error || state.loading
                            || state.needsSetup);
  const active = NAV_OF[state.screen] || state.screen;
  /* An empty bar is hidden by CSS (`nav:empty`), so the tab bar appears with
     the first screen's content rather than over a blank page. */
  document.getElementById("nav").innerHTML = chromeOff ? "" : NAV.map(n => `
    <button data-act="nav" data-screen="${n.id}"
            class="${active === n.id ? "on" : ""} ${n.apart ? "apart" : ""}"
            aria-current="${active === n.id ? "page" : "false"}">
      <span class="ic">${icon(n.icon, 21)}</span><span>${t(n.key)}</span></button>`).join("");
  /* + types it, the microphone says it. Both one tap, on every main screen. */
  document.getElementById("fab").innerHTML = chromeOff ? "" : `
    ${state.me?.agent?.available && state.screen !== "money" ? `<button class="fab-mic" data-act="voice-start"
        aria-label="${t("quick_voice")}">${icon("mic", 22)}</button>` : ""}
    <button class="fab-add" data-act="${state.screen !== "money" ? "quick-add"
      : state.moneyTab === "debts" ? "debt-add" : "money-add"}"
        aria-label="${t(state.screen === "money" ? "money_add" : "quick_add")}">${icon("plus", 30)}</button>`;

  syncShell();
  syncBackButton();
}

/* The navigation is the only fixed thing left at the bottom, and its height
   still changes with the language, the font size and the safe area. Measure
   the real node rather than guessing a padding that is wrong on one phone. */
function syncShell(){
  const nav = document.getElementById("nav");
  const root = document.documentElement;
  const navH = nav.offsetHeight || 60;
  root.style.setProperty("--nav-h", navH + "px");
  // Room under the last row for the + and microphone buttons.
  const fab = document.getElementById("fab");
  root.style.setProperty("--shell-b", navH + (fab && fab.innerHTML.trim() ? 84 : 0) + "px");
}

/* ==================================================================
   Loading
   ================================================================== */
async function loadScreen(screen){
  state.screenError = null;
  try{
    if(screen === "home"){
      /* One request. Home used to wait on /api/summary (a month of scores
         recomputed per open) and /api/progress/me as well, to draw
         percentages and a level card that now live on Statistics — the
         slowest part of opening the app was for blocks it no longer shows. */
      setState({home: await api("/api/home")});
    } else if(screen === "money"){
      await loadMoney(state.moneyMonth);
    } else if(screen === "team"){
      const team = await api("/api/teams");
      state.teamActivity = {};
      state.teamGraph = {};
      setState({team, teams: (team.teams || []).map(x => ({id:x.id, name:x.name}))});
    } else if(screen === "habits"){
      // The entry is pinned to the day it was opened for: text typed at 23:59
      // and saved after midnight still belongs to that day.
      const day = (state.journalDay && (journalPendingCount() || hasJaiPending()))
        ? state.journalDay : todayISO();
      const [habits, prayer, journal] = await Promise.all([
        api("/api/habits"), api("/api/prayers"),
        api("/api/journal?day=" + day),
      ]);
      setState({habits, prayer, journal: journal.entry, journalDay: day,
                journalQuestions: journal.questions,
                teams: habits.teams || state.teams});
    } else if(screen === "tasks"){
      const seq = ++taskLoadSeq;
      /* The month is part of this screen now rather than a sheet opened from
         it, so it is fetched with the rest — but only once: moving between the
         tabs must not re-request a grid that is already drawn, and paging to
         another month must not be undone by the next tab tap. */
      const [tasks, projects, focus, calendar, countdowns] = await Promise.all([
        api(taskPageURL()), api("/api/projects"),
        api("/api/focus"),
        state.calendar && !state.calendarStale ? Promise.resolve(state.calendar)
          : api(state.calendar
              ? `/api/calendar?year=${state.calendar.year}&month=${state.calendar.month}`
              : "/api/calendar"),
        // A failure here costs the countdown block, not the screen.
        api("/api/countdowns").catch(() => ({countdowns: state.countdowns || []})),
      ]);
      if(seq !== taskLoadSeq) return;
      state.calendarStale = false;
      setState({tasks, tasksDone:tasks.groups, projects: projects.projects, focus: focus.week, calendar,
                countdowns: countdowns.countdowns,
                teams: tasks.teams || state.teams});
      /* The Projects tab lists shared shelves beside private ones, so the
         team payload has to be here too. Fetched once and reused, and a
         failure only costs the shared block rather than the screen. */
      if((tasks.teams || []).length && !state.team){
        try{ state.team = await api("/api/teams"); }catch(_){}
      }
    } else if(screen === "steps"){
      setState({progress: await api("/api/progress/me")});
    } else if(screen === "stats"){
      await loadStats(state.statsPeriod);
    } else if(screen === "project"){
      const p = state.project?.project;
      if(p) setState({project: await api(projectPath(p.id, p.source === "team"))});
    }
  }catch(e){
    if(state.screen === screen) setState({screenError:errorMessage(e)});
    handleError(e);
  }
}

/* Where one project and its tasks are read from — personal or a team's. */
const projectPath = (id, team) => team ? `/api/teams/projects/${id}/tasks`
                                       : `/api/projects/${id}/tasks`;
const projectEditPath = id => state.project?.project?.source === "team"
  ? `/api/teams/projects/${id}` : `/api/projects/${id}`;
/* Opening a project from anywhere: the same screen for both kinds, and the
   back arrow returns to the screen it was opened from. */
async function openProject(id, team){
  haptic();
  try{
    const back = state.screen === "project" ? state.projectBack : state.screen;
    if(team && !state.team){ try{ state.team = await api("/api/teams"); }catch(_){} }
    setState({screen:"project", projectBack: back || "tasks",
              project: await api(projectPath(id, team))});
  }catch(e){ handleError(e); }
}

/* The team the screen is currently showing. Several places need it and none
   of them should re-derive the "first one when nothing is picked" rule. */
function teamCurrent(){
  const teams = state.team?.teams || [];
  return teams.find(x => x.id === state.teamId) || teams[0] || null;
}

/* Re-reads the habit list without touching the rest of the screen. Used after
   anything that changes a *derived* habit, so two tabs can never disagree
   about whether the same day is done. */
async function refreshHabits(){
  try{ state.habits = await api("/api/habits"); }
  catch(_){ /* the visible data stays as it was; the next load corrects it */ }
}

async function loadStats(period){
  try{
    const [stats, team, summary, progress] = await Promise.all([
      api("/api/stats?period=" + period),
      // The shared record is drawn here too; a failure costs that block
      // rather than the screen.
      state.team ? Promise.resolve(state.team)
                 : ((state.teams || []).length
                      ? api("/api/teams").catch(() => null) : null),
      // The counts behind today's percentages; a failure only drops them.
      api("/api/summary").catch(() => null),
      // Level, XP and rank, drawn at the foot of this screen.
      api("/api/progress/me").catch(() => null),
    ]);
    setState({stats, statsPeriod: period, team: team || state.team,
              summary: summary || state.summary,
              progress: progress || state.progress});
  }catch(e){ setState({screenError:errorMessage(e)}); handleError(e); }
}

function goto(screen, patch){
  haptic();
  if(screen === "habits" || screen === "tasks") state.trackerLast = screen;
  if(["steps", "stats", "team"].includes(screen)) state.profileLast = screen;
  setState({screen, error:null, screenError:null, reorderMode:false, ...(patch || {})});
  loadScreen(screen);
}

//: Whatever the user typed before a failed save, so a retry does not
//: start from a blank field.
let lastDraft = null;

function errorMessage(e){
  if(e.status === 401) return t("session_expired");
  if(e.status === 429) return t("rate_wait", {n:e.retryAfter || 30});
  if(e.status === 422) return t("invalid_input");
  if(e.status === 404) return t("not_found_item");
  return e.status ? t("error") : t("offline");
}
function handleError(e, draft){
  console.error("ErnestOS:", e);
  if(e.status === 403 && e.detail === "forbidden"){ toast(t("forbidden")); return; }
  if(e.status === 403){
    // Reading stays open; the ask is a sheet over the screen, with a way through.
    state.readOnly = true;
    openSheet(blockedSheet(), "sub");
    render();
    checkSubscription(true);
    return;
  }
  if(e.status === 402 && e.detail === "plan_limit"){
    haptic("medium");
    return openSheet(plansSheet(e.body), "plans");
  }
  if(e.status === 409 && e.detail === "onboarding_required"){
    setState({needsSetup:true, loading:false}); return; }
  if(e.status === 409 && e.detail === "mirrored"){ toast(t("habit_mirrored")); return; }
  if(e.status === 409 && e.detail === "not_assigned"){ toast(t("not_assigned")); return; }
  if(e.status === 422 && e.detail === "owner_must_transfer"){
    toast(t("owner_must_transfer")); return; }
  if(e.status === 409 && e.detail === "top3_full"){ toast(t("top3_full")); return; }
  if(e.status === 409 && e.detail === "timer_required"){
    toast(t("timer_required")); return; }
  if(e.status === 409 && e.detail === "already_done"){ toast(t("timer_done")); return; }
  if(draft){
    lastDraft = draft;
    openSheet(`
      <h3>${e.status ? t("error") : t("offline")}</h3>
      <div class="hint">${t("draft_kept")}</div>
      <div class="card" style="margin-top:10px">${esc(
        Object.values(draft.body || {}).filter(v => typeof v === "string").join(" · ")
      )}</div>
      <button class="btn" data-act="retry-draft" style="margin-top:14px">
        ${t("retry")}</button>
      <button class="btn secondary" data-act="close" style="margin-top:8px">
        ${t("cancel")}</button>`);
    return;
  }
  toast(errorMessage(e));
}

/* Re-checks membership against Telegram. Called from the blocked screen,
   so joining the channel and tapping check continues the session instead
   of restarting the app. */
async function checkSubscription(quiet){
  try{
    const r = await api("/api/subscription");
    if(r.subscribed){
      state.readOnly = false;
      const me = await api("/api/me");
      state.lang = me.language || state.lang;
      setState({me, blocked:null, error:null, loading:false});
      if(state.sheetView === "sub") closeSheet();
      await loadScreen(state.screen);
      return true;
    }
    state.subInfo = {channel: r.channel,
      note: quiet ? "" : r.state === "unknown" ? t("sub_unknown") : t("sub_still")};
  }catch(_){
    state.subInfo = {channel: state.subInfo?.channel, note: t("sub_unknown")};
  }
  if(sheetOpen() && state.sheetView === "sub") openSheet(blockedSheet(), "sub");
  return false;
}

/* ==================================================================
   Actions
   ================================================================== */
let saveInFlight = false;
async function save(request, reload, quiet, message, draft){
  if(saveInFlight) return;
  saveInFlight = true;
  // One key per submission; a retry of the same draft sends the same key.
  const key = draft?.key || newKey();
  idemKey = key;
  const busy = pressedBtn && document.contains(pressedBtn) ? pressedBtn : null;
  pressedBtn = null;
  busy?.classList.add("busy"); busy?.setAttribute("aria-busy", "true");
  try{
    await request();
    idemKey = null;
    lastDraft = null;
    state.calendarStale = true;
    closeSheet();
    if(!quiet) toast(message || t("saved"));
    // A caller that updated `state` itself and passed no reload target still
    // needs the screen redrawn, or the write lands in the data and not on the
    // screen.
    if(reload) await loadScreen(reload);
    else render();
  }catch(e){
    idemKey = null;
    handleError(e, draft && {...draft, request, reload, key});
  }finally{
    saveInFlight = false;
    busy?.classList.remove("busy"); busy?.removeAttribute("aria-busy");
  }
}

/* An optimistic tick: the row changes now, the request follows, and a
   failure puts it back. Waiting 300ms for a checkbox is what makes an
   app feel like a web page. */
/* Per item (K06): `undo` puts back only this item, so a failure never
   rewinds a whole list over other ticks that succeeded meanwhile. Requests
   for one item go out one after another (`chain`), so a quick done → undo →
   done reaches the server in the order it was tapped. */
const tickChains = {};
function optimistic(mutate, request, reload, queued, undo, chain){
  const snapshot = undo ? null : JSON.stringify({home:state.home, habits:state.habits,
                                                 tasks:state.tasks, project:state.project});
  mutate();
  render();
  const run = () => request().then(() => { state.calendarStale = true; if(reload) loadScreen(reload); })
    .catch(e => {
      // No connection at all: the tick stays on screen and waits in the
      // queue instead of being undone (audit #18).
      if(queued && isOffline(e)){ if(enqueue(queued)) return; }
      if(undo) undo(); else setState(JSON.parse(snapshot));
      render();
      handleError(e);
    });
  if(!chain) return run();
  const next = (tickChains[chain] || Promise.resolve()).then(run, run);
  tickChains[chain] = next.finally(() => { if(tickChains[chain] === next) delete tickChains[chain]; });
  return next;
}

/* ---------- offline queue (audit #18) ----------
   Recording what was done — a habit tick, a task done, a prayer, an amount —
   must not need a signal. Such an action that fails for want of a network is
   kept on the phone with its own idempotency key and sent, in order, once
   the connection is back; the server answers a repeat of the same key with
   the first answer, so nothing is applied twice. A refusal (4xx) is never
   dropped silently: the item stays, marked with the reason, until the user
   retries or removes it from the queue sheet (K04). */
const queueKey = () => `ernestos-queue-${state.me?.telegram_id || "anon"}`;
const isOffline = e => !e?.status && (e?.name === "TypeError" || e?.name === "AbortError"
  || e?.name === "TimeoutError" || /fetch|network|Failed/i.test(String(e?.message || "")));
function loadQueue(){ try{ return JSON.parse(localStorage.getItem(queueKey()) || "[]"); }catch(_){ return []; } }
/* True only when the phone actually kept it: "saved on this device" is never
   said about something that did not reach storage (K08). */
function storeQueue(q){
  try{ q.length ? localStorage.setItem(queueKey(), JSON.stringify(q)) : localStorage.removeItem(queueKey());
       return true; }
  catch(_){ return false; }
}
function enqueue(item){
  const q = loadQueue();
  // The key the first attempt already carried, if any: a request that timed
  // out may have reached the server, and its replay must not apply twice.
  // The body already says the state wanted and the day it was meant for, so
  // a replay after midnight lands on the right day (K05).
  q.push({...item, key: item.key || newKey(), at: Date.now(), day: item.day || todayISO()});
  if(!storeQueue(q)){ toast(t("queue_store_failed")); return false; }
  toast(t("queued_offline"));
  render();
  return true;
}
/* Why an item is waiting for the person rather than the network. */
const queueReason = e => e.status === 401 ? "auth" : e.status === 402 ? "plan"
  : e.status === 403 ? "forbidden" : e.status === 404 ? "gone"
  : e.status === 409 ? "conflict" : "invalid";
let flushing = null;
function flushQueue(){
  if(flushing) return flushing;
  flushing = (async () => {
    let sent = 0, blocked = 0;
    /* In order, one at a time. Nothing is ever dropped here (K04):
       - no network, 5xx, 429, or the same key still running → stop, retry later;
       - 401 (signed out) → stop; it goes once the person is back in;
       - any other refusal → the item waits for the person, marked with why,
         and the rest of the queue carries on. Only the person discards. */
    for(;;){
      const item = loadQueue().find(x => !x.blocked);
      if(!item) break;
      try{
        await api(item.path, {method: item.method, body: item.body,
                              headers: {"X-Idempotency-Key": item.key}});
        sent++;
        storeQueue(loadQueue().filter(x => x.key !== item.key));
      }catch(e){
        if(isOffline(e) || e.status >= 500 || e.status === 429
           || (e.status === 409 && e.detail === "in_progress")) break;
        if(e.status === 401){ state.queueNeedsLogin = true; break; }
        storeQueue(loadQueue().map(x => x.key === item.key
          ? {...x, blocked:{reason: queueReason(e), status: e.status, detail: e.detail || null}} : x));
        blocked++;
      }
    }
    if(blocked) toast(t("queue_refused", {n: blocked}));
    else if(sent) toast(t("queue_synced", {n: sent}));
    if(sent || blocked){ state.calendarStale = true; await loadScreen(state.screen); }
  })().finally(() => { flushing = null; render(); });
  return flushing;
}
function queueBanner(){
  const q = loadQueue();
  const stuck = q.filter(x => x.blocked).length, waiting = q.length - stuck;
  return (waiting ? `<div class="banner" data-act="queue-flush" role="button" tabindex="0">
      ${icon("clock", 16)} <div class="grow">${t("queue_pending", {n: waiting})}</div>${icon("repeat", 15)}</div>` : "")
    + (stuck ? `<div class="banner" data-act="queue-review" role="button" tabindex="0"
        style="border-color:var(--warn)">${icon("info", 16)}
        <div class="grow">${t("queue_review", {n: stuck})}</div>${icon("chevron", 15)}</div>` : "");
}
/* What the phone is still holding, and why: each item can be sent again or
   dropped by the person — never by the app. */
function queueSheet(){
  const q = loadQueue();
  const row = x => `<div class="card tight" style="margin-top:8px">
      <div class="row"><b class="grow wrap">${esc(x.label || x.path)}</b>
        <span class="t3 tiny">${esc(x.day || "")}</span></div>
      <div class="t2 small">${x.blocked ? t("queue_why_" + x.blocked.reason) : t("queue_waiting")}</div>
      <div class="chips" style="margin-top:8px">
        <div class="chip sm" data-act="queue-retry" data-key="${esc(x.key)}">${t("queue_retry")}</div>
        <div class="chip sm" data-act="queue-drop" data-key="${esc(x.key)}">${t("queue_drop")}</div></div></div>`;
  return `<h3>${icon("clock", 18)} ${t("queue_title")}</h3>
    ${q.length ? q.map(row).join("") : `<div class="hint">${t("queue_empty")}</div>`}
    <button class="btn secondary" data-act="close" style="margin-top:var(--s3)">${t("close")}</button>`;
}
window.addEventListener("online", () => flushQueue());
document.addEventListener("visibilitychange", () => { if(!document.hidden && loadQueue().length) flushQueue(); });
/* Phone app: a push while open refreshes the bell; a tapped one opens the
   inbox; coming back to the app catches up on what arrived meanwhile. */
window.addEventListener("ernest:push", () => refreshInbox());
window.addEventListener("ernest:open-inbox", () => {
  window.ErnestApp?.takePendingInbox?.();
  if(state.me) A["inbox-open"]();
});
document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshInbox(); });
/* Recording never continues in the background (K01). */
document.addEventListener("visibilitychange", () => {
  if(document.hidden && voice.rec && voice.rec.state === "recording"){ voiceAbandon(); closeSheet(); }
});
document.addEventListener("visibilitychange", async () => {
  if(document.hidden || !state.planPending) return;
  state.planPending = false;
  await refreshPlan();
  if(state.sheetView === "plans") openSheet(plansSheet(), "plans");
});

const A = {
  "tasks-more": moreTasks,
  "offer-dismiss": () => { try{ localStorage.setItem(offerKey(), "1"); }catch(_){} render(); },
  "retry-screen": () => loadScreen(state.screen),
  "agent-open": () => {
    const name = state.me?.bot_username?.replace(/^@/, "");
    if(name && tg?.openTelegramLink) tg.openTelegramLink(`https://t.me/${name}?start=agent`);
    else tg?.close?.();
  },
  nav: el => goto(navTarget(el.dataset.screen)),
  reload: () => { setState({error:null, loading:true}); boot(); },
  tab: el => { haptic(); setState({tab:el.dataset.tab, reorderMode:false}); },
  "go-tab": el => goto("habits", {tab:el.dataset.tab}),
  "task-tab": el => { haptic(); setState({taskTab:el.dataset.tab});
                      loadScreen("tasks"); },
  close: closeSheet,
  settings: () => {
    openSettings("root");
    // The invite card's numbers; the sheet does not wait for them.
    api("/api/referrals/me").then(r => { state.referral = r;
      if(sheetOpen() && (state.settingsView || "root") === "root" && !state.sheetView) reopenSettings(); })
      .catch(() => {});
  },
  "plan-period": el => { haptic(); state.planPeriod = el.dataset.p;
    openSheet(plansSheet(), "plans"); },
  "avatar-pick": async el => {
    const file = el.files?.[0];
    el.value = "";
    if(!file) return;
    try{
      const image = await shrinkImage(file);
      const r = await api("/api/avatar", {method:"POST", body:{image}});
      state.avatarLocal = image;
      Object.assign(state.me, {avatar_custom:r.avatar_custom, avatar_token:r.avatar_token, has_photo:true});
      notify("success"); toast(t("avatar_saved"));
      reopenSettings(); render();
    }catch(e){ if(e?.status) handleError(e); else toast(t("avatar_bad")); }
  },
  "avatar-remove": async () => {
    try{
      await api("/api/avatar", {method:"DELETE"});
      state.avatarLocal = null;
      state.me.avatar_custom = null;
      try{ const me = await api("/api/me"); Object.assign(state.me, me); }catch(_){}
      reopenSettings(); render();
    }catch(e){ handleError(e); }
  },
  /* Signing out of the phone app: the microphone stops, what can still be
     sent is sent, and anything left is named before the person leaves — it
     stays on this phone, under this account, for the next sign-in (K07).
     In Telegram there is no session of ours to end; the window closes. */
  "sign-out": async () => {
    haptic("medium");
    if(!IS_APP){ tg?.close?.(); return; }
    voiceAbandon();
    try{ await flushQueue(); }catch(_){}
    try{ await journalChain; }catch(_){}
    const left = loadQueue().length + journalPendingCount();
    if(!confirm(left ? t("sign_out_pending", {n:left}) : t("app_sign_out_ask"))) return;
    clearTimeout(journalTimer);
    window.ErnestApp?.signOut();
  },
  "set-look": () => { haptic(); openSettings("look"); },
  "set-notify": () => { haptic(); openSettings("notify"); },
  "set-account": () => { haptic(); openSettings("account"); },

  /* ---- quick capture: one field, five seconds ---- */
  /* Picking a destination re-renders the open sheet rather than the screen
     behind it, so the chips light up without the sheet closing. */
  "dest-pick": el => {
    haptic();
    state.dest = el.dataset.value;
    /* On the task sheet the destination changes the form itself — a team's
       shelves and "who does it" — so the sheet is redrawn. */
    if(document.getElementById("task-title") && !state.form?.id){
      readTaskForm();
      state.form.project_id = null;
      if(state.dest.startsWith("team:") && !state.team)
        api("/api/teams").then(r => { state.team = r;
          if(document.getElementById("task-title")) rerenderTaskSheet(); }).catch(() => {});
      return rerenderTaskSheet();
    }
    const sheet = document.querySelector(".sheet-inner");
    if(!sheet) return;
    for(const chip of sheet.querySelectorAll('[data-act="dest-pick"]'))
      chip.classList.toggle("on", chip.dataset.value === state.dest);
  },

  "voice-start": async el => {
    haptic("medium");
    voice.then = null;
    // From a button: its target. Retry and consent keep the one in progress.
    if(el?.dataset) voice.target = el.dataset.target === "journal" ? "journal" : "agent";
    if(!state.me?.agent?.available) return toast(t("agent_off"));
    if(!state.me?.agent?.consent) return openSheet(voiceConsentSheet(), "voice");
    if(!voiceSupported()) return A["agent-open"]();
    try{ voice.stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(_){ toast(t(IS_APP ? "voice_denied_app" : "voice_denied")); return A["agent-open"](); }
    const mime = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4", "audio/webm"]
      .find(m => MediaRecorder.isTypeSupported?.(m)) || "";
    try{ voice.rec = new MediaRecorder(voice.stream, mime ? {mimeType: mime} : undefined); }
    catch(_){ voiceStopTracks(); return A["agent-open"](); }
    voice.mime = voice.rec.mimeType || mime || "audio/webm";
    voice.chunks = []; voice.cancelled = false;
    const session = voice.session = (voice.session || 0) + 1;
    const rec = voice.rec;
    rec.ondataavailable = e => { if(e.data?.size && session === voice.session) voice.chunks.push(e.data); };
    rec.onstop = () => {
      if(session !== voice.session) return;          // abandoned meanwhile
      voiceStopTracks();
      if(!voice.cancelled && voice.chunks.length) voiceSend();
    };
    voice.rec.start(250);
    voice.started = Date.now();
    openSheet(voiceRecordingSheet(), "voice");

  "team-toggle": el => {
    haptic();
    const id = Number(el.dataset.id), key = newKey();
    const kind = el.dataset.kind;
    let wanted = null;
    const setAll = v => {
      const lists = [];
      for(const team of (state.team?.teams || []))
        lists.push(kind === "task" ? team.tasks : team.habits);
      lists.push(kind === "task" ? state.tasks?.team_tasks : state.habits?.team_habits);
      if(kind === "task") lists.push(state.home?.team_today);
      for(const cat of Object.values(state.habits?.grouped || {})) lists.push(cat);
      for(const list of lists)
        for(const row of (list || []))
          if(row.id === id && (kind === "task" || row.source === "team" || row.team_id)) row.done = v;
    };
    const path = `/api/teams/${kind}s/${id}/toggle`;
    /* The same row can be on screen in several places — the Team tab, the
       shared rows inside Tasks and Habits, Home — so every copy is set. The
       request says which state is wanted, so a replay never flips twice. */
    const lists = [...(state.team?.teams || []).map(tm => kind === "task" ? tm.tasks : tm.habits),
                   kind === "task" ? state.tasks?.team_tasks : state.habits?.team_habits,
                   kind === "task" ? state.home?.team_today : null];
    for(const list of lists) for(const row of (list || [])) if(row.id === id && wanted === null) wanted = !row.done;
    if(wanted === null) wanted = true;
    const want = wanted, body = {done: want};
    optimistic(() => setAll(want),
      () => api(path, {method:"POST", body, headers:{"X-Idempotency-Key": key}}),
      state.screen, {path, method:"POST", body, key, label: el.dataset.title || ""},
      () => setAll(!want), "t" + kind + id);
  },

  "ref-share": () => {
    const r = state.referral;
    if(!r?.link) return;
    haptic();
    /* Telegram's own share picker. The user chooses the recipients, in
       Telegram's UI — nothing is ever sent on their behalf, and no contacts
       are read. `openTelegramLink` keeps it inside the client rather than
       bouncing out to a browser. */
    const url = "https://t.me/share/url?url=" + encodeURIComponent(r.link)
              + "&text=" + encodeURIComponent(t("ref_share_text"));
    if(tg?.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, "_blank");

  "ref-copy": async () => {
    const r = state.referral;
    if(!r?.link) return;
    haptic();
    try{
      /* The Clipboard API needs a secure context and permission, and neither
         is guaranteed inside a WebView. The textarea fallback works where it
         does not, and if both fail the user is told rather than left with a
         button that silently did nothing. */
      if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(r.link);
      else {
        const box = document.createElement("textarea");
        box.value = r.link;
        box.setAttribute("readonly", "");
        box.style.cssText = "position:fixed;opacity:0";
        document.body.appendChild(box);
        box.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(box);
        if(!ok) throw new Error("copy refused");
      }
      notify("success");
      toast(t("ref_copied"));
    }catch(_){ toast(t("ref_copy_failed")); }
  },

     works rather than failing silently — a backup button that does nothing is
     worse than no backup button. */
  backup: async () => {
    if(window.ErnestApp?.saveFile){
      try{
        const data = await api("/api/export");
        await window.ErnestApp.saveFile(`ernestos-${todayISO()}.json`,
          JSON.stringify(data, null, 2), "application/json");
        toast(t("file_ready"));
      }catch(e){ handleError(e); }
      return;
    }
    try{
      const data = await api("/api/export");
      const blob = new Blob([JSON.stringify(data, null, 2)],
                            {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ernestos-${todayISO()}.json`;
      if(a.download === undefined) throw new Error("no download support");
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(t("backup_saved"));
    }catch(_){
      try{ await api("/api/export/send", {method:"POST"});
           toast(t("export_sent")); }
      catch(e){ handleError(e); }
    }
  },
  "wipe-data": () => { haptic(); openSheet(wipeDataSheet()); },
  "wipe-data-confirm": async () => {
    // Step two of two. The first tap opened a sheet naming what goes; this one
    // sends the word the server insists on, so a stray tap cannot reach here.
    try{
      // No autosave may land after the wipe and bring an entry back.
      await forgetLocalDrafts();
      await api("/api/account/wipe", {method:"POST", body:{confirm:"WIPE"}});
      await forgetLocalDrafts();
      state.journal = null;
      closeSheet();
      toast(t("wipe_done"));
      state.calendar = null;
      await loadScreen(state.screen);
    }catch(e){ handleError(e); }
  },
  feedback: () => openSheet(feedbackSheet()),
  "feedback-send": async () => {
    const message = trimmed("fb-text");
    if(!message) return;
    try{
      const r = await api("/api/feedback", {method:"POST", body:{message}});
      closeSheet();
      // Never claim delivery that did not happen.
      toast(r.delivered ? t("feedback_sent") : t("feedback_saved"));
    }catch(e){ closeSheet(); handleError(e); }
  },
  "delete-account": () => openSheet(deleteAccountSheet()),
  "delete-account-go": async () => {
    if(trimmed("del-confirm").toUpperCase() !== "DELETE") return;
    try{
      await forgetLocalDrafts();
      await api("/api/account/delete", {method:"POST",
        body:{confirm:"DELETE"}});
      await forgetLocalDrafts();
      closeSheet();
      setState({error:t("account_deleted"), loading:false, me:null, home:null});
      tg?.close?.();
    }catch(e){ closeSheet(); handleError(e); }
  },

  /* ---- statistics ---- */
  "stats-period": el => { haptic(); loadStats(el.dataset.period); },
  "prayer-detail": () => { haptic();
    if(state.stats?.prayer_detail)
      openSheet(prayerDetailSheet(state.stats.prayer_detail)); },
  "series-toggle": el => { haptic();
    state.statsSeries[el.dataset.field] = !state.statsSeries[el.dataset.field];
    render(); },
  "stats-download": async () => {
    // The bot sends the file into the chat: Telegram's browser blocks
    // plain downloads, and putting the credential in a URL would leak it.
    haptic("medium");
    if(window.ErnestApp?.saveFile){
      try{
        const res = await fetch("/api/stats/csv?period=" + state.statsPeriod,
                                {headers:{"X-Telegram-Init-Data": tg?.initData || ""}});
        if(!res.ok){
          const err = new Error("http_" + res.status); err.status = res.status;
          try{ err.body = await res.json(); err.detail = err.body?.detail; }catch(_){}
          throw err;
        }
        const name = (res.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/)?.[1]
                     || `ernestos-${state.statsPeriod}-${todayISO()}.csv`;
        await window.ErnestApp.saveFile(name, await res.text(), "text/csv");
        toast(t("file_ready"));
      }catch(e){ handleError(e); }
      return;
    }
    try{
      await api("/api/stats/export?period=" + state.statsPeriod, {method:"POST"});
      toast(t("report_sent"));
    }catch(e){ handleError(e); }
  },

  /* ---- subscription ---- */
  "sub-join": el => { tg?.openTelegramLink?.(el.dataset.url)
    || window.open(el.dataset.url, "_blank"); },
  "sub-check": async el => {
    el.textContent = t("sub_checking");
    await checkSubscription(false);
  },
  "sub-open": () => { openSheet(blockedSheet(), "sub"); checkSubscription(true); },
  "back-to-bot": () => { tg?.close?.(); },
  "set-modules": () => { haptic(); openSettings("modules"); },
  "mod-toggle": async el => {
    haptic();
    const mods = {...(state.me?.modules || {})};
    mods[el.dataset.key] = !mods[el.dataset.key];
    try{
      const r = await api("/api/modules", {method:"POST",
        body:{modules: Object.keys(mods).filter(k => mods[k])}});
      state.me = {...state.me, modules: r.modules};
      reopenSettings();
      toast(t("saved"));
      await loadScreen(state.screen);
    }catch(e){ handleError(e); }
  },
};

/* A write to the team, then the team reloaded, then the sheet it came from
   redrawn on the fresh data — so a switch flips where it was tapped. */
async function teamWrite(request, reopen, message){
  const team = teamCurrent();
  if(!team) return;
  haptic();
  // The sheet this came from. If another has been opened meanwhile, the
  // answer must not paint the old one back over it.
  const view = state.sheetView;
  try{
    await request(team);
    state.team = await api("/api/teams");
    if(state.teamActivity) delete state.teamActivity[team.id];
    const fresh = teamCurrent();
    if(state.sheetView !== view || !sheetOpen()){ /* the user moved on */ }
    else if(reopen === "members" && fresh) openSheet(teamMembersSheet(fresh), "team-members");
    else if(reopen && fresh) openSheet(teamMenuSheet(fresh), "team-menu");
    else closeSheet();
    render();
    toast(message || t("saved"));
  }catch(e){ handleError(e); }
}

async function prefSave(patch, redraw = true){
  try{
    const r = await api("/api/prefs", {method:"POST", body:patch});
    state.me = {...state.me, prefs:r.prefs};
    /* A switch has to be redrawn, because the switch itself is the only thing
       showing its new state. A time field and the timezone select are already
       showing exactly what the user picked — and rebuilding the sheet under an
       open picker closes it, which on iOS meant a value could be set once and
       never adjusted. */

/* The grid now lives in a sheet, and `setState` only repaints `#app` — so the
   new month is written back into the sheet directly. */
async function shiftMonth(delta){
  const c = state.calendar;
  if(!c) return;
  let year = c.year, month = c.month + delta;
  if(month < 1){ month = 12; year--; }
  if(month > 12){ month = 1; year++; }
  try{ state.calendar = await api(`/api/calendar?year=${year}&month=${month}`); }
  catch(e){ return handleError(e); }
  if(sheetOpen()) openSheet(calendarSheet()); else render();
}

/* ---------- habit reordering ----------
   The list is written back whole, so the server stores an order the user
   can see rather than a diff it has to reconstruct. The local list moves
   first so the row does not visibly snap back while the request is in
   flight; a failed save reloads the truth. */
async function saveOrder(ids){
  const previous = state.habits;
  try{
    const body = await api("/api/habits/reorder",
      {method:"PATCH", body:{habit_ids:ids}});
    const grouped = {};
    (state.habits?.categories || []).forEach(c => grouped[c] = []);
    body.habits.forEach(x => (grouped[x.category] = grouped[x.category] || []).push(x));
    setState({habits:{...state.habits, habits: body.habits, grouped}});
  }catch(e){
    setState({habits: previous});
    handleError(e);
  }
}

function moveHabit(index, delta){
  const items = state.habits?.habits || [];
  const target = index + delta;
  if(index < 0 || target < 0 || target >= items.length) return;
  haptic();
  const ids = items.map(x => x.id);
  [ids[index], ids[target]] = [ids[target], ids[index]];
  saveOrder(ids);
}

/* Touch drag. Telegram's in-app browser does not fire HTML5 drag events
   on iOS, so the reorder is driven by pointer events, which work on both. */
let dragFrom = null;
const reorderRowAt = y =>
  document.elementFromPoint(window.innerWidth / 2, y)?.closest("[data-drag-id]");

document.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".handle");
  if(!handle) return;
  const row = handle.closest("[data-drag-id]");
  if(!row) return;
  dragFrom = Number(row.dataset.index);
  row.style.opacity = ".55";
  row.setPointerCapture?.(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if(dragFrom === null) return;
  e.preventDefault();
  document.querySelectorAll("[data-drag-id]")
    .forEach(x => x.style.borderColor = "");
  const over = reorderRowAt(e.clientY);
  if(over) over.style.borderColor = "var(--accent)";
}, {passive:false});
document.addEventListener("pointerup", e => {
  if(dragFrom === null) return;
  const over = reorderRowAt(e.clientY);
  const from = dragFrom;
  dragFrom = null;
  if(!over) return render();
  const to = Number(over.dataset.index);
  if(to === from) return render();
  const ids = (state.habits?.habits || []).map(x => x.id);
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  haptic("medium");
  saveOrder(ids);
});

/* A form control carries its action on `change`, never on `click`.

   This is the bug that made the report times and the timezone impossible to
   edit. Clicking an `<input type="time">` or a `<select>` is how its picker
   *opens*; the delegated click handler below matched the control, called
   `preventDefault()` — which stopped the picker from ever appearing — and
   then ran the save with the value that was already in the field. The screen
   answered "Saqlandi" every time and nothing ever changed, which is the worst
   shape a bug can take: it looks like it worked.

   The tag is the rule rather than a list of act names, so a control added
   later cannot bring the behaviour back by accident. */
const CHANGE_TAGS = new Set(["INPUT", "SELECT", "TEXTAREA"]);

/* One delegated listener: rebuilt HTML never loses its handlers because
   the handler lives on document, not on the nodes. */
const lastTap = new WeakMap();
//: The button that started the current action, so a save can show it working.
let pressedBtn = null;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  if(el.classList.contains("busy")) return;
  if(CHANGE_TAGS.has(el.tagName)) return;
  const action = A[el.dataset.act];
  if(!action) return;
  e.preventDefault();
  /* A second tap on the same button a moment later is a double tap, not a
     second intent — it must not write twice. Checkboxes are exempt: ticking
     and unticking quickly is a real thing to do. */
  const now = Date.now();
  if(el.tagName === "BUTTON" && now - (lastTap.get(el) || 0) < 700) return;
  lastTap.set(el, now);
  pressedBtn = el.tagName === "BUTTON" ? el : null;
  const out = action(el);
  // An async action shows its button as busy until it settles.
  if(el.tagName === "BUTTON" && out && typeof out.then === "function"){
    el.classList.add("busy"); el.setAttribute("aria-busy", "true");
    out.catch(handleError).finally(() => { el.classList.remove("busy"); el.removeAttribute("aria-busy"); });
  }
});
/* Enter and Space act on anything focusable that has an action, so every
   box and row works from a keyboard as well as a finger (#20). */
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest?.("[data-act][tabindex]");
  if(!el || CHANGE_TAGS.has(el.tagName) || el.tagName === "BUTTON") return;
  e.preventDefault();
  A[el.dataset.act]?.(el);
});
// Search runs on Enter rather than per keystroke: one request per intent.
document.addEventListener("keydown", e => {
  const el = e.target.closest("[data-search]");
  if(el && e.key === "Enter"){ e.preventDefault(); A[el.dataset.search]?.(el); }
});
/* …and the other half of the same rule: every form control with an action
   runs it here, when the value has actually changed. */
document.addEventListener("change", e => {
  // A day/month/year select keeps its field's hidden date in step.
  const box = e.target.closest("[data-datef]");
  if(box) syncDateField(box);
  const el = e.target.closest("[data-act]");
  if(el && CHANGE_TAGS.has(el.tagName)) A[el.dataset.act]?.(el);
});
window.matchMedia("(prefers-color-scheme: light)")
  .addEventListener?.("change", () => render());
tg?.onEvent?.("themeChanged", () => render());
window.addEventListener("resize", syncShell);
tg?.onEvent?.("viewportChanged", syncShell);

/* ---------- boot ---------- */
async function boot(){
  try{ state.appearance = localStorage.getItem("ernestos-appearance") || "auto"; }
  catch(_){}
  /* A link from the bot can open a screen directly: `?s=money`. */
  const wanted = new URLSearchParams(location.search).get("s");
  if(wanted && SCREENS[wanted] && wanted !== "project") state.screen = wanted;
  try{
    /* The account and the first screen are asked for at the same time, and
       nothing — not the tab bar either — is drawn until both are in. They
       used to be three requests in a row (me → teams → home), each waiting
       on the one before. Home's own request answering 409 for an account
       still in setup is expected, and settled by /api/me below. */
    const first = state.screen === "home"
      ? api("/api/home").catch(e => ({failed: e})) : null;
    const me = await api("/api/me");
    state.lang = me.language || "uz";
    if(!me.onboarded){
      // Setup is finished in the chat; say so rather than spin (409 before).
      setState({me, loading:false, needsSetup:true});
      return;
    }
    // The channel gate stops writes, not reading: a banner, not a wall (#15).
    state.readOnly = Boolean(me.gated);
    /* The destination picker is on every add sheet, so the team names come
       with the account rather than from a request of their own. */
    state.teams = me.teams || [];
    if(first){
      const home = await first;
      if(home.failed) throw home.failed;
      state.home = home;
    }
    setState({me, loading:false, blocked:null, error:null, needsSetup:false});
    // Ticks recorded while offline in an earlier session go out now.
    if(loadQueue().length) flushQueue();
    if(IS_APP){
      refreshInbox();
      // A tapped push opens the inbox, whether it woke the app or not.
      if(window.ErnestApp?.takePendingInbox?.()) A["inbox-open"]();
    }
    if(!first) await loadScreen(state.screen);
    if(Object.keys(loadDraft()).length) toast(t("draft_restored"));
  }catch(e){
    console.error("ErnestOS boot failed:", e);
    if(e.status === 403){ setState({loading:false}); await checkSubscription(true); return; }
    setState({loading:false,
      error: errorMessage(e)});
  }
}
boot();
</script>
</body>
</html>
