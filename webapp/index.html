<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>ErnestOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ==================================================================
   Design tokens.

   Each theme redefines the whole palette — surfaces, accent, glow and
   the three habit-tier colours — so switching theme restyles the app
   rather than just recolouring buttons.
   ================================================================== */
:root{
  --bg:#080d17; --bg-glow:#12203a; --surface:#0f1727; --surface-2:#141e33;
  /* Anything tappable sits on --tap, a step lighter than --surface, so a
     button is distinguishable from a plain panel at a glance. */
  --tap:#18233d; --tap-line:#2a3a5c;
  --line:#1e2b45; --line-soft:#18233a;
  --text:#eaf0fa; --muted:#7e8fab; --faint:#4d5c76;
  --accent:#4f8cff; --accent-2:#7cb0ff; --accent-dim:#1a2f57; --on-accent:#04101f;
  --ok:#2fd27a; --warn:#f5a524; --danger:#f4515f;
  --t1:#f4515f; --t2:#f5a524; --t3:#2fd27a;

  --r-sm:10px; --r:14px; --r-lg:20px;
  --pad:16px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --ring:0 0 0 1px rgba(255,255,255,.04) inset;
}
[data-theme="emerald"]{
  --bg:#04120e; --bg-glow:#0a2b21; --surface:#08201a; --surface-2:#0c2b22;
  --tap:#103428; --tap-line:#1a5a44;
  --line:#124635; --line-soft:#0f3a2c;
  --accent:#12d18a; --accent-2:#5ce7b4; --accent-dim:#0a3a2c; --on-accent:#03170f;
  --t1:#fb7185; --t2:#fbbf24; --t3:#12d18a;
}
[data-theme="obsidian"]{
  --bg:#000; --bg-glow:#151519; --surface:#0d0d10; --surface-2:#141418;
  --tap:#1b1b21; --tap-line:#33333d;
  --line:#26262e; --line-soft:#1d1d24;
  --text:#f4f4f5; --muted:#8b8b95; --faint:#55555f;
  --accent:#e4e4e7; --accent-2:#fafafa; --accent-dim:#232329; --on-accent:#09090b;
  --t1:#f87171; --t2:#fbbf24; --t3:#4ade80;
}
[data-theme="rose"]{
  --bg:#14060c; --bg-glow:#2e0d1c; --surface:#1e0912; --surface-2:#290d19;
  --tap:#331120; --tap-line:#5a2038;
  --line:#45182b; --line-soft:#391423;
  --accent:#ff4d6d; --accent-2:#ff8098; --accent-dim:#450f21; --on-accent:#1a0308;
  --t1:#ff8098; --t2:#fbbf24; --t3:#2fd27a;
}
[data-theme="pink"]{
  --bg:#14061a; --bg-glow:#2d0d38; --surface:#1d0824; --surface-2:#280c31;
  --tap:#320f3c; --tap-line:#582066;
  --line:#44184f; --line-soft:#391442;
  --accent:#f65bb5; --accent-2:#fb92cf; --accent-dim:#420f3b; --on-accent:#1b0413;
  --t1:#fb7185; --t2:#fbbf24; --t3:#2fd27a;
}
[data-theme="aurora"]{
  --bg:#07061a; --bg-glow:#1a1147; --surface:#100d2e; --surface-2:#17123c;
  --tap:#1d1748; --tap-line:#3a2f80;
  --line:#2a2166; --line-soft:#221a54;
  --accent:#8b7bff; --accent-2:#c4a8ff; --accent-dim:#241a58; --on-accent:#0a0620;
  --t1:#f472b6; --t2:#facc15; --t3:#22d3ee;
}

/* The three themes below keep the surfaces neutral and put the saturation on
   the accent alone, so anything tappable reads as tappable before the text is
   read. `graphite` is the default a new account starts on. */
[data-theme="graphite"]{
  --bg:#0a0a0c; --bg-glow:#16161c; --surface:#141418; --surface-2:#1a1a20;
  --tap:#20202a; --tap-line:#33333f;
  --line:#26262e; --line-soft:#1e1e25;
  --text:#f4f4f6; --muted:#9494a0; --faint:#63636f;
  --accent:#5b5bf5; --accent-2:#8b8bff; --accent-dim:#1c1c48; --on-accent:#fff;
  --ok:#3dc98a; --warn:#e8a33d; --danger:#f2545b;
  --t1:#f2545b; --t2:#e8a33d; --t3:#3dc98a;
}
[data-theme="midnight"]{
  --bg:#0b1116; --bg-glow:#12202a; --surface:#111a22; --surface-2:#16222c;
  --tap:#1b2a36; --tap-line:#2c4252;
  --line:#20303c; --line-soft:#1a2833;
  --text:#eaf1f6; --muted:#8598a6; --faint:#5b6e7c;
  --accent:#ff8a3d; --accent-2:#ffb07a; --accent-dim:#3a1e0a; --on-accent:#1a0a00;
  --ok:#3fbf8f; --warn:#f0b429; --danger:#f26b6b;
  --t1:#f26b6b; --t2:#f0b429; --t3:#4fc3e8;
}

/* Light appearance overlays every theme */
:root[data-appearance="light"],
:root[data-appearance="auto"]:not([data-dark="1"]){
  --bg:#f4f7fc; --bg-glow:#e3ecfa; --surface:#fff; --surface-2:#f6f9fd;
  --tap:#eef4fd; --tap-line:#cfdcee;
  --line:#e2e9f4; --line-soft:#edf2f9;
  --text:#0d1626; --muted:#5f6f88; --faint:#9aa8bd;
  --accent-dim:#e6efff; --on-accent:#fff;
  --shadow:0 8px 24px rgba(16,26,43,.07);
  --ring:0 0 0 1px rgba(0,0,0,.02) inset;
}

/* `paper` is light by design, not by appearance — a warm paper surface with an
   ink accent. It is declared after the light overlay, and the second selector
   carries enough specificity to out-rank it, so choosing paper gives the same
   palette whether the phone is in light or dark mode. */
[data-theme="paper"],
:root[data-theme="paper"][data-appearance][data-dark]{
  --bg:#f7f5f1; --bg-glow:#efede7; --surface:#fff; --surface-2:#f2f0eb;
  --tap:#edeae3; --tap-line:#dad6cc;
  --line:#e3e0d9; --line-soft:#edeae3;
  --text:#16150f; --muted:#6e6b60; --faint:#9a968a;
  --accent:#15140e; --accent-2:#37331f; --accent-dim:#eae7de; --on-accent:#fff;
  --ok:#3e7a55; --warn:#b4802b; --danger:#c4452f;
  --t1:#c4452f; --t2:#b4802b; --t3:#3e7a55;
  --shadow:0 8px 24px rgba(30,26,15,.08);
  --ring:0 0 0 1px rgba(0,0,0,.02) inset;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% 0%, var(--bg-glow) 0%, transparent 62%);
  background-attachment:fixed;
  color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* Telegram reports its own usable height; --vh is kept in sync from JS
     because 100vh is wrong inside the in-app browser. */
  min-height:var(--vh, 100dvh);
  /* Room for the two fixed strips at the bottom: the privacy line and the
     navigation. --shell-b is measured from the real nodes after every render,
     so a two-line privacy message on a narrow screen still cannot cover the
     last card on the page. */
  padding-bottom:calc(var(--shell-b, 130px) + 12px);
}
#app{padding:calc(14px + var(--safe-t, 0px)) var(--pad) 12px;
     max-width:620px;margin:0 auto;width:100%}

h1{font-size:20px;font-weight:760;letter-spacing:-.4px;line-height:1.3;
   overflow-wrap:anywhere}
h2{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:1.2px;
   color:var(--faint);margin:26px 0 10px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}

.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* header */
.hero{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.avatar{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;
        font-weight:750;font-size:18px;color:var(--on-accent);overflow:hidden;
        background:linear-gradient(140deg,var(--accent),var(--accent-2));
        box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.gear{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;
      background:var(--tap);border:1px solid var(--tap-line);font-size:16px;
      box-shadow:var(--ring);min-width:40px}
/* Compact variant still keeps a 40px tap area via the padded ::after. */
.gear.mini{width:32px;height:32px;min-width:32px;border-radius:10px;font-size:13px;
           position:relative}
.gear.mini::after{content:"";position:absolute;inset:-5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:15px;margin-bottom:10px;box-shadow:var(--ring)}
.card.glow{background:linear-gradient(150deg,var(--accent-dim),var(--surface) 70%);
           border-color:var(--accent-dim)}

.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
      min-height:56px;box-shadow:var(--ring)}
.item .meta{font-size:12px;color:var(--muted);margin-top:3px;
            display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item.t1{border-left:3px solid var(--t1)}
.item.t2{border-left:3px solid var(--t2)}
.item.t3{border-left:3px solid var(--t3)}
.item.pick{border-style:dashed;border-color:var(--danger)}

.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;
       display:grid;place-items:center;font-size:14px;position:relative;
       transition:transform .12s,background .15s}
/* Invisible 44px hit area around the 26px control — comfortable to tap
   without making the tick itself look heavy. */
.check::after{content:"";position:absolute;inset:-9px}
.check.on{background:var(--ok);border-color:var(--ok);color:#04140a}
.check:active{transform:scale(.9)}
.check.lock{opacity:.42}

.btn{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--on-accent);
     border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:680;
     cursor:pointer;min-height:48px;width:100%;box-shadow:var(--shadow)}
.btn:active{filter:brightness(.94)}
.btn.ghost{background:var(--tap);color:var(--text);border:1px solid var(--tap-line);box-shadow:var(--ring)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.btn.sm{width:auto;padding:10px 14px;font-size:13px;min-height:42px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:140px}

input,textarea,select{width:100%;background:var(--tap);border:1px solid var(--tap-line);
  color:var(--text);border-radius:12px;padding:13px;font:inherit;min-height:48px;
  -webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
       linear-gradient(135deg,var(--muted) 50%,transparent 50%);
       background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;
       background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:11px;color:var(--faint);margin:15px 0 6px;
      text-transform:uppercase;letter-spacing:.8px;font-weight:700}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--tap);
      border:1px solid var(--tap-line);border-radius:999px;padding:8px 14px;font-size:13px;
      font-weight:600;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* Prayer statuses read faster with their own colour than as identical chips. */
.pill.st-jamaat.on{background:#16a34a;border-color:#16a34a;color:#fff}
.pill.st-on_time.on{background:#22c55e;border-color:#22c55e;color:#04140a}
.pill.st-qaza.on{background:#f59e0b;border-color:#f59e0b;color:#1a1204}
.pill.st-missed.on{background:#ef4444;border-color:#ef4444;color:#fff}
.prayer-card{border-left:3px solid var(--line)}
.prayer-card.set-jamaat,.prayer-card.set-on_time{border-left-color:var(--ok)}
.prayer-card.set-qaza{border-left-color:var(--warn)}
.prayer-card.set-missed{border-left-color:var(--danger)}
/* One privacy line for the whole app, fixed just above the navigation.
   It used to be repeated as a card on four screens, which reads as nagging
   and pushed the real content down every time. */
.privacy-strip{position:fixed;left:0;right:0;bottom:var(--nav-h, 62px);z-index:39;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid var(--line);
  padding:7px calc(var(--pad) + 4px);text-align:center;
  font-size:11.5px;line-height:1.35;color:var(--muted);
  /* Two lines at most, even at 320px. */
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pills.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
              margin:0 calc(var(--pad) * -1);padding:0 var(--pad) 2px}
.pills.scroll::-webkit-scrollbar{display:none}

.swatch{width:28px;height:28px;border-radius:9px;flex:none;box-shadow:var(--ring)}
.theme-row{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;
           background:var(--tap);border:1px solid var(--tap-line);margin-bottom:7px}
.theme-row.on{border-color:var(--accent);background:var(--accent-dim)}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.p-high{background:var(--danger)} .p-medium{background:var(--warn)} .p-low{background:var(--ok)}

.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:9px}
.bar span{display:block;height:100%;border-radius:3px;
          background:linear-gradient(90deg,var(--accent),var(--accent-2))}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .card{text-align:center;padding:14px 6px;margin:0}
.stat .v{font-size:20px;font-weight:760;letter-spacing:-.5px}
.stat .k{font-size:10px;color:var(--faint);margin-top:3px;text-transform:uppercase;
         letter-spacing:.6px;font-weight:700}

/* Home's four numbers: two columns, so nothing shrinks below readable at
   320px and nothing scrolls sideways. */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
        padding:13px 14px;box-shadow:var(--ring);min-width:0}
.metric .k{font-size:10.5px;color:var(--faint);text-transform:uppercase;
           letter-spacing:.6px;font-weight:750}
.metric .v{font-size:21px;font-weight:760;letter-spacing:-.5px;margin-top:4px;
           display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.trend{font-size:13px;font-weight:700}
.trend.up{color:var(--ok)} .trend.down{color:var(--danger)}
.trend.flat{color:var(--muted)}

/* Priority is carried by a coloured edge *and* a written label — colour
   alone would say nothing to a colour-blind user or in a screenshot. */
.mission{display:flex;align-items:flex-start;gap:12px;padding:16px;
         border-radius:var(--r);margin-bottom:8px;background:var(--surface);
         border:1px solid var(--line);border-left:4px solid var(--t2);
         box-shadow:var(--ring)}
.mission.pri-high{border-left-color:var(--t1)}
.mission.pri-medium{border-left-color:var(--t2)}
.mission.pri-low{border-left-color:var(--t3)}
.mission-title{font-size:16px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:10.5px;font-weight:750;letter-spacing:.5px;
     text-transform:uppercase;margin-top:6px;color:var(--muted)}
.tag.pri-high{color:var(--t1)} .tag.pri-medium{color:var(--t2)}
.tag.pri-low{color:var(--t3)}

.group{font-size:12px;font-weight:750;color:var(--muted);margin:16px 0 7px;
       overflow-wrap:anywhere}
.trow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      border-left:4px solid var(--t2);padding:12px 14px;margin-bottom:7px;
      box-shadow:var(--ring)}
.trow.pri-high{border-left-color:var(--t1)}
.trow.pri-medium{border-left-color:var(--t2)}
.trow.pri-low{border-left-color:var(--t3)}
.trow .tt{font-weight:640;line-height:1.35;overflow-wrap:anywhere}
.trow .td{font-size:12.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}

/* Reordering habits: a drag handle for touch, plus explicit up/down buttons,
   because a drag is invisible to a screen reader and impossible one-handed. */
.reorder-hint{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.item.dragging{opacity:.55}
.item.dragover{border-color:var(--accent)}
.handle{font-size:17px;color:var(--faint);cursor:grab;touch-action:none;
        padding:0 2px;flex:none}
.move{width:34px;height:34px;min-width:34px;border-radius:10px;flex:none;
      display:grid;place-items:center;background:var(--tap);
      border:1px solid var(--tap-line);font-size:13px;position:relative}
.move::after{content:"";position:absolute;inset:-5px}
.move[disabled]{opacity:.35}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
         background:var(--tap);border:1px solid var(--tap-line);font-size:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;
          width:100%}
.cal-dow{text-align:center;font-size:9px;color:var(--faint);padding:2px 0;font-weight:750;
         min-width:0;overflow:hidden;
         text-transform:uppercase;letter-spacing:.4px}
.cal-day{aspect-ratio:1;min-width:0;border-radius:9px;background:var(--surface-2);
         border:1px solid transparent;display:flex;flex-direction:column;
         align-items:center;justify-content:center;font-size:12px;gap:3px}
.cal-day.empty{background:transparent}
.cal-day.today{border-color:var(--accent);color:var(--accent);font-weight:760}
.cal-dots{display:flex;gap:2px;height:4px}
.cal-dots i{width:4px;height:4px;border-radius:50%}
.k-task{background:var(--accent)} .k-project{background:var(--warn)}
.k-birthday{background:var(--t1)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:grid;grid-template-columns:repeat(4,1fr);
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-top:1px solid var(--line);padding-bottom:var(--safe-b, 0px)}
nav button{background:0;border:0;color:var(--faint);padding:9px 4px 10px;font-size:10px;
           font-weight:700;cursor:pointer;display:grid;gap:3px;justify-items:center;
           min-height:56px;letter-spacing:.2px}
nav button.on{color:var(--accent)}
nav .ic{font-size:19px;line-height:1}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
       align-items:flex-end;z-index:50;backdrop-filter:blur(3px)}
.sheet.show{display:flex}
.sheet-inner{background:var(--surface);width:100%;max-width:620px;margin:0 auto;
             border-radius:22px 22px 0 0;border-top:1px solid var(--line);
             padding:8px var(--pad) calc(20px + var(--safe-b, 0px));
             max-height:88vh;max-height:calc(var(--vh, 100dvh) - 40px);overflow-y:auto;
             -webkit-overflow-scrolling:touch}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--line);
         margin:0 auto 14px}
.sheet h3{font-size:17px;margin-bottom:4px;font-weight:730}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe-b,0px));
       background:var(--surface-2);border:1px solid var(--line);color:var(--text);
       padding:11px 18px;border-radius:12px;z-index:60;opacity:0;transition:opacity .2s;
       pointer-events:none;font-size:14px;box-shadow:var(--shadow);max-width:86vw;
       text-align:center}
.toast.show{opacity:1}

.empty{text-align:center;color:var(--faint);padding:28px 12px;font-size:14px}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);
      border-radius:50%;animation:r .7s linear infinite;margin:44px auto}
@keyframes r{to{transform:rotate(360deg)}}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);
        margin-top:8px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;
          vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app"><div class="spin"></div></div>

/* ==================================================================
   ErnestOS Mini App.

   Screens are pure functions of `state` returning HTML; the page is
   re-rendered from that state. Nothing patches a node by id, so
   removing a feature cannot leave a dangling lookup that blanks the
   page — a failure this app shipped with once before.
   ================================================================== */

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
tg?.disableVerticalSwipes?.();

/* Telegram's in-app browser reports a usable height that 100vh gets wrong,
   and the value changes as the keyboard opens. Mirror it into --vh. */
function syncViewport(){
  const root = document.documentElement;
  const h = tg?.viewportStableHeight || tg?.viewportHeight || window.innerHeight;
  root.style.setProperty("--vh", h + "px");
  const inset = tg?.safeAreaInset || tg?.contentSafeAreaInset;
  root.style.setProperty("--safe-t", (inset?.top ?? 0) + "px");
  root.style.setProperty("--safe-b",
    `max(${inset?.bottom ?? 0}px, env(safe-area-inset-bottom, 0px))`);
}
syncViewport();
tg?.onEvent?.("viewportChanged", syncViewport);
tg?.onEvent?.("safeAreaChanged", syncViewport);
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", () => setTimeout(syncViewport, 250));

/* ---------- api ---------- */
async function api(path, options = {}){
  const res = await fetch(path, {
    ...options,
    headers:{"Content-Type":"application/json",
             "X-Telegram-Init-Data": tg?.initData || "", ...(options.headers||{})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if(!res.ok){
    const err = new Error("http_" + res.status);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

/* ---------- line chart (inline SVG, no libraries) ---------- */
function lineChart(series, keys){
  if(!series.length) return `<div class="empty">${t("empty")}</div>`;
  const W = 320, H = 150, L = 18, R = 8, TOP = 12, BOT = 24;
  const stepX = series.length > 1 ? (W - L - R) / (series.length - 1) : 0;
  const y = v => H - BOT - (v / 100) * (H - TOP - BOT);
  const x = i => L + i * stepX;

  const grid = [0, 50, 100].map(v =>
    `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"
       stroke-width="1" stroke-dasharray="2 5"/>
     <text x="0" y="${y(v)+3}" font-size="8" fill="var(--faint)">${v}</text>`).join("");

  const paths = keys.map((k, n) => {
    const pts = series.map((p, i) => `${x(i)},${y(p[k.field])}`).join(" ");
    const area = `${L},${y(0)} ${pts} ${x(series.length-1)},${y(0)}`;
    const dots = series.length <= 12
      ? series.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[k.field])}" r="2.6"
          fill="${k.color}"/>`).join("") : "";
    return `
      <polygon points="${area}" fill="${k.color}" opacity="${n === 0 ? .10 : .06}"/>
      <polyline points="${pts}" fill="none" stroke="${k.color}" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");

  // Anchor the first and last labels inward so they are not clipped by the
  // SVG edge; everything between stays centred on its point.
  const every = Math.ceil(series.length / 6);
  const last = series.length - 1;
  const labels = series.map((p, i) => {
    if(i % every !== 0 && i !== last) return "";
    const anchor = i === 0 ? "start" : i === last ? "end" : "middle";
    return `<text x="${x(i)}" y="${H-6}" font-size="8.5" fill="var(--faint)"
              text-anchor="${anchor}">${p.label}</text>`;
  }).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${paths}${labels}</svg>
    <div class="legend">${keys.map(k =>
      `<span><i style="background:${k.color}"></i>${k.label}</span>`).join("")}</div>`;
}

const SCREENS = {};

/* Home, top to bottom: who and when, one line of encouragement, four
   numbers, one mission, today's work, the month. Nothing else — every extra
   section here is one more thing to read before the screen answers "how is
   today going?". Editing and deleting live on the screens that own the data,
   so a mis-tap on Home cannot destroy anything. */
SCREENS.home = () => {
  const d = state.home;
  if(!d) return `<div class="spin"></div>`;
  const initial = (d.name || "E").charAt(0).toUpperCase();
  const avatar = state.me?.has_photo
    ? `<img src="/api/avatar?tgdata=${encodeURIComponent(tg?.initData || "")}" alt="" />` : esc(initial);

  let h = `
    <div class="hero">
      <div class="grow">
        <h1>${t("greet")}, ${esc(d.name)}</h1>
      </div>
      <button class="gear" data-act="settings" aria-label="${t("settings")}">⚙️</button>
      <div class="avatar" aria-hidden="true">${avatar}</div>
    </div>
    <div class="muted small">${esc(d.date_label)}</div>`;

  // The quote is optional and stays small when empty: an empty motivational
  // card is a demand for input, not encouragement.
  h += d.quote
    ? `<div class="card glow" data-act="quote" style="margin-top:12px">${esc(d.quote)}</div>`
    : `<div class="muted small" data-act="quote"
            style="margin-top:8px;text-decoration:underline">✎ ${t("quote_add")}</div>`;

  h += metricsBlock(d);
  h += `<h2>${t("h_mission")}</h2>` + missionBlock(d.mission);
  h += `<h2>${t("h_tasks")}</h2>` + todayTasksBlock(d.tasks_today);
  h += `<h2>${t("h_calendar")}</h2>` + calendarBlock();
  return h;
};

const TREND_ICON = {up:"↑", down:"↓", flat:""};

function metricsBlock(d){
  const o = d.overall || {value:0, trend:"flat"};
  const arrow = TREND_ICON[o.trend] || "";
  // The arrow carries the direction and the label spells it out, so the
  // colour is confirmation rather than the only signal.
  const trend = arrow
    ? `<span class="trend ${o.trend}" aria-label="${t(o.trend === "up" ? "move_up" : "move_down")}"
        >${arrow}</span>` : "";
  const cell = (key, value, extra = "") =>
    `<div class="metric"><div class="k">${key}</div>
       <div class="v num">${value}${extra}</div></div>`;
  return `<div class="metrics">
      ${cell(t("h_habits"), `${d.habits.done} / ${d.habits.total}`)}
      ${cell(t("prayer"), `${d.prayer.score} / ${d.prayer.max}`)}
      ${cell(t("streak_short"), d.streak)}
      ${cell(t("overall"), `${o.value}%`, trend)}
    </div>`;
}

function missionBlock(mission){
  if(!mission)
    return `<button class="btn ghost" data-act="focus-add">＋ ${t("add_focus")}</button>`;
  return `<div class="mission pri-${mission.priority}" data-act="mission-open"
               data-id="${mission.id}" data-title="${esc(mission.title)}"
               data-priority="${mission.priority}">
      <div class="grow">
        <div class="mission-title">${esc(mission.title)}</div>
        <div class="tag pri-${mission.priority}">${t(mission.priority)}</div>
      </div></div>`;
}

function todayTasksBlock(groups){
  if(!groups || !groups.length) return `<div class="empty">${t("empty")}</div>`;
  return groups.map(group => `
    <div class="group">${esc(group.project || t("standalone"))}</div>
    ${group.tasks.map(task => `
      <div class="trow pri-${task.priority}" data-act="task-open" data-id="${task.id}">
        <div class="tt">${esc(task.title)}</div>
        <div class="td">${t(task.priority)}${task.deadline ? ` · ${task.deadline}` : ""}</div>
        ${task.description
          ? `<div class="td">${esc(task.description)}</div>` : ""}
      </div>`).join("")}`).join("");
}

function calendarBlock(){
  const c = state.calendar;
  if(!c) return `<div class="card"><div class="spin"></div></div>`;
  const dows = DICT[state.lang].dow.map(d => `<div class="cal-dow">${d}</div>`).join("");
  let cells = "";
  for(let i = 0; i < c.first_weekday; i++) cells += `<div class="cal-day empty"></div>`;
  for(let day = 1; day <= c.days_in_month; day++){
    const iso = `${c.year}-${String(c.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const events = c.events[iso] || [];
    const kinds = [...new Set(events.map(e => e.kind))].slice(0, 4);
    cells += `<div class="cal-day num ${iso===c.today?"today":""}"
      ${events.length?`data-act="cal-day" data-date="${iso}"`:""}>
      <span>${day}</span>
      <span class="cal-dots">${kinds.map(k=>`<i class="k-${k}"></i>`).join("")}</span></div>`;
  }
  return `<div class="card">
    <div class="cal-head">
      <div class="cal-nav" data-act="cal-prev">‹</div>
      <b>${DICT[state.lang].months[c.month-1]} ${c.year}</b>
      <div class="cal-nav" data-act="cal-next">›</div>
    </div>
    <div class="cal-grid">${dows}${cells}</div></div>`;
}

        data-act="tab" data-tab="${id}">${t(key)}</div>`).join("")}
    </div>`;
  if(state.tab === "prayer") return h + prayerTab();
  if(state.tab === "journal") return h + journalTab();

  const tiers = {non_negotiable:"t1", target:"t2", bonus:"t3"};
  let h = "";

  if(state.deleteMode)
    h += `<div class="card glow">${t("pick_delete")}</div>`;
  else if(state.reorderMode)
    h += `<div class="reorder-hint">${t("reorder_hint")}</div>`;
  else if(data.streak)
    h += `<div class="card" style="text-align:center">🔥 <b class="num">${data.streak}</b>
            <span class="muted small">${t("streak")}</span></div>`;

  if(state.reorderMode) return h + reorderList() + `
    <button class="btn" data-act="reorder-off" style="margin-top:14px">${t("finish")}</button>`;

  data.categories.forEach(cat => {
    const items = data.grouped[cat] || [];
    if(!items.length) return;
    h += `<h2>${t(cat)}</h2>`;
    h += items.map(x => {
      const clock = x.target_time
        ? `<span class="meta num" style="margin:0">⏰ ${x.target_time}</span>` : "";
      if(state.deleteMode){
        // Derived habits have no delete affordance at all.
        return x.protected ? "" : `
          <div class="item ${tiers[cat]} pick" data-act="habit-delete" data-id="${x.id}">
            <div class="grow ellipsis">${esc(x.name)}</div><div>🗑</div></div>`;
      }
      return `
        <div class="item ${tiers[cat]}">
          <div class="check ${x.done?"on":""} ${x.protected?"lock":""}"
               ${x.protected?'data-act="auto-habit"':`data-act="habit-toggle" data-id="${x.id}"`}
          >${x.done?"✓":""}</div>
          <div class="grow">
            <div class="ellipsis">${esc(x.name)}${x.protected?" 🔒":""}</div>
            ${clock ? `<div class="meta">${clock} · ${t("wake_hint")}</div>` : ""}
          </div>
          ${x.system_key === "wakeup"
            ? `<div class="gear mini" data-act="wake-time" data-time="${x.target_time||"05:00"}">⏰</div>` : ""}
        </div>`;
    }).join("");
  });

  h += state.deleteMode
    ? `<button class="btn" data-act="delete-mode-off" style="margin-top:14px">${t("finish")}</button>`
    : `<div class="btns">
         <button class="btn" data-act="habit-add">+ ${t("add_habit")}</button>
         <button class="btn ghost" data-act="reorder-on">↕ ${t("reorder")}</button>
         <button class="btn ghost" data-act="delete-mode-on">🗑 ${t("del_habit")}</button>
       </div>`;
  return h;
}

/* Reordering shows one flat list, not the three tiers: dragging between
   tiers would silently change a habit's category. The Up/Down buttons are
   not a fallback for the drag — they are the accessible way to do it, and
   they work with one thumb. */
function reorderList(){
  const items = state.habits?.habits || [];
  return items.map((x, i) => `
    <div class="item" draggable="true" data-drag-id="${x.id}" data-index="${i}">
      <div class="handle" aria-hidden="true">⋮⋮</div>
      <div class="grow ellipsis">${esc(x.name)}</div>
      <button class="move" data-act="habit-up" data-index="${i}"
              aria-label="${t("move_up")}" ${i === 0 ? "disabled" : ""}>↑</button>
      <button class="move" data-act="habit-down" data-index="${i}"
              aria-label="${t("move_down")}"
              ${i === items.length - 1 ? "disabled" : ""}>↓</button>
    </div>`).join("");
}

function prayerTab(){
  const p = state.prayer;
  if(!p) return `<div class="spin"></div>`;
  const female = state.me?.gender === "female";
  let h = "";
  if(female){
    h += `<div class="item" data-act="excused">
        <div class="check ${p.excused?"on":""}">${p.excused?"✓":""}</div>
        <div class="grow">🌸 ${t("excused")}</div></div>`;
  }
  const ICON = {bomdod:"🌅", peshin:"☀️", asr:"🌤", shom:"🌆", xufton:"🌙"};
  const STATUS_ICON = {jamaat:"🕌", on_time:"✅", qaza:"⏳", missed:"❌"};

  ["bomdod","peshin","asr","shom","xufton"].forEach(name => {
    const cur = p.prayers[name];
    h += `<div class="card prayer-card ${cur ? "set-" + cur : ""}">
      <div style="font-weight:680;margin-bottom:10px">${ICON[name]} ${t(name)}</div>
      <div class="pills">${p.statuses.map(st =>
        `<div class="pill st-${st} ${cur===st?"on":""}" data-act="prayer"
          data-prayer="${name}" data-status="${st}">${STATUS_ICON[st]} ${t(st)}</div>`).join("")}</div></div>`;
  });

  const pct = Math.round(p.score / p.max * 100);
  h += `<div class="card glow" style="text-align:center">
      <div class="num" style="font-size:28px;font-weight:760">${p.score} / ${p.max}</div>
      <div class="muted small">${t("score")}</div>
      ${bar(pct)}</div>`;
  return h;
}

function journalTab(){
  const entry = state.journal, questions = state.journalQuestions;
  if(!questions.length) return `<div class="spin"></div>`;
  const answers = entry?.answers || {};
  let h = `<div class="card glow small">${t("journal_hint")}</div>`;
  questions.forEach((q, i) => {
    h += `<label>${i+1}. ${esc(q.text)}</label>
      <textarea id="jq-${q.id}" style="min-height:76px">${esc(answers[q.id] || "")}</textarea>`;
  });
  h += `<div class="btns">
      <button class="btn" data-act="journal-save">${t("save")}</button>
      <button class="btn ghost" data-act="journal-history">${t("journal_history")}</button></div>`;
  if(state.journalHistory){
    h += `<h2>${t("journal_history")}</h2>`;
    h += state.journalHistory.length ? state.journalHistory.map(e => `
      <div class="item" data-act="journal-open" data-day="${e.day}">
        <div class="grow"><div class="num">${e.day}</div>
          <div class="meta">${esc(e.preview) || "—"}</div></div>
        <div class="muted small">${e.complete?"✓":t("journal_partial")}</div>
      </div>`).join("") : `<div class="empty">${t("empty")}</div>`;
  }
  return h;
}

/* ---------- Statistics ---------- */

  return `<h1>${t("stats")}</h1>
    <div class="card glow" style="margin-top:14px;text-align:center">
      <div class="k muted small">${t("st_overall")}</div>
      <div class="num" style="font-size:34px;font-weight:770;letter-spacing:-1px">
        ${today.overall}%
        ${arrow ? `<span class="trend ${today.trend}">${arrow}</span>` : ""}</div>
      ${bar(today.overall)}
    </div>
    <div class="metrics">
      <div class="metric"><div class="k">${t("st_tasks")}</div>
        <div class="v num">${pct(today.tasks)}</div></div>
      <div class="metric"><div class="k">${t("st_habits")}</div>
        <div class="v num">${pct(today.habits)}</div></div>
      <div class="metric"><div class="k">${t("st_prayer")}</div>
        <div class="v num">${pct(today.prayer)}</div>

      <div class="metric"><div class="k">${t("streak_short")}</div>
        <div class="v num">🔥 ${today.streak}</div></div>
    </div>

    <div class="pills" style="margin:18px 0 12px">
      ${["week","month","year"].map(p =>
        `<div class="pill ${st.period===p?"on":""}" data-act="stats-period"
          data-period="${p}">${t(p)}</div>`).join("")}
    </div>
    <div class="card">${lineChart(st.series, [
      {field:"habits", color:"var(--accent)", label:t("habits")},
      {field:"prayer", color:"var(--t3)",     label:t("prayer")},
    ])}</div>
    <div class="stat">
      <div class="card"><div class="v num">${st.habit_avg}%</div><div class="k">${t("habits")}</div></div>
      <div class="card"><div class="v num">${st.prayer_avg}%</div><div class="k">${t("prayer")}</div></div>
      <div class="card"><div class="v num">🔥 ${st.prayer_streak}</div><div class="k">${t("prayer")}</div></div>

/* ---------- Tasks ---------- */
SCREENS.tasks = () => {
  let h = `<h1>${t("tasks")}</h1>
    <div class="pills" style="margin:14px 0 6px">
      <div class="pill ${state.taskTab==="open"?"on":""}" data-act="task-tab" data-tab="open">${t("upcoming")}</div>
      <div class="pill ${state.taskTab==="done"?"on":""}" data-act="task-tab" data-tab="done">${t("done_tab")}</div>
    </div>`;

  if(state.taskTab === "done"){
    const list = state.tasksDone;
    if(!list) return h + `<div class="spin"></div>`;
    return h + (list.length ? list.map(task => `
      <div class="item">
        <div class="check on" data-act="task-reopen" data-id="${task.id}">✓</div>
        <div class="grow"><div class="ellipsis">${esc(task.title)}</div>
          <div class="meta">${esc(task.project || t("standalone"))}</div></div>
      </div>`).join("") : `<div class="empty">${t("empty")}</div>`);
  }

  const d = state.tasks;
  if(!d) return h + `<div class="spin"></div>`;
  const section = (label, items) => items.length
    ? `<h2>${label}</h2>` + items.map(taskRow).join("") : "";
  h += section(t("overdue"), d.overdue);
  h += section(t("upcoming"), d.upcoming);
  h += section(t("no_date"), d.undated);
  if(!d.overdue.length && !d.upcoming.length && !d.undated.length)
    h += `<div class="empty">${t("empty")}</div>`;

  h += `<div class="btns">
    <button class="btn" data-act="task-add">+ ${t("add_task")}</button>
    <button class="btn ghost" data-act="project-add">+ ${t("add_project")}</button></div>`;

  // Projects are a section of Tasks, not a fifth tab. Tapping one opens it.
  if(state.projects.length){
    h += `<h2>${t("h_projects")}</h2>` + state.projects.map(p => `
      <div class="card" data-act="project-open" data-id="${p.id}"><div class="row">
        <div class="grow ellipsis">${esc(p.name)}</div>
        <div class="muted small num">${p.tasks_done}/${p.tasks_total}</div>
        <div class="muted">›</div>
      </div>${bar(p.progress)}</div>`).join("");
  }
  return h;
};

/* ---------- render ---------- */
const NAV = [
  {id:"home",   icon:"🏠", key:"home"},
  {id:"habits", icon:"✅", key:"habits"},
  {id:"tasks",  icon:"⚡", key:"tasks"},
  {id:"stats",  icon:"📊", key:"stats"},
];

//: A project opens from Tasks, so the Tasks tab stays lit while inside one.
const NAV_OF = {project:"tasks"};

function render(){
  const root = document.documentElement;
  root.dataset.theme = state.me?.theme || "graphite";
  root.dataset.appearance = state.appearance;
  root.dataset.dark = (state.appearance === "dark" ||
    (state.appearance === "auto" &&
     !window.matchMedia("(prefers-color-scheme: light)").matches)) ? "1" : "0";

  const app = document.getElementById("app");
  if(state.error)        app.innerHTML = `<div class="empty">${esc(state.error)}</div>`;
  else if(state.loading) app.innerHTML = `<div class="spin"></div>`;
  else                   app.innerHTML = (SCREENS[state.screen] || SCREENS.home)();

  document.getElementById("privacy").textContent = t("privacy_line");

  const active = NAV_OF[state.screen] || state.screen;
  document.getElementById("nav").innerHTML = NAV.map(n => `
    <button data-act="nav" data-screen="${n.id}" class="${active===n.id?"on":""}"
            aria-current="${active===n.id?"page":"false"}">
      <span class="ic" aria-hidden="true">${n.icon}</span><span>${t(n.key)}</span></button>`).join("");

  syncShell();
}

/* The privacy strip and the navigation are both fixed, and their combined
   height changes with the language, the font size and the safe area. Measure
   the real nodes rather than guessing a padding that is wrong on one phone. */
function syncShell(){
  const nav = document.getElementById("nav");
  const privacy = document.getElementById("privacy");
  const root = document.documentElement;
  const navH = nav.offsetHeight || 62;
  root.style.setProperty("--nav-h", navH + "px");
  root.style.setProperty("--shell-b", (navH + (privacy.offsetHeight || 30)) + "px");
}

/* ---------- loading ---------- */
async function loadScreen(screen){
  try{
    if(screen === "home"){
      const [home, calendar] = await Promise.all([api("/api/home"), api("/api/calendar")]);
      setState({home, calendar});
    } else if(screen === "habits"){
      const [habits, prayer, journal] = await Promise.all([
        api("/api/habits"), api("/api/prayers"), api("/api/journal?day=" + todayISO()),
      ]);
      setState({habits, prayer, journal: journal.entry, journalQuestions: journal.questions});
    } else if(screen === "tasks"){
      const [tasks, projects] = await Promise.all([api("/api/tasks?days=7"), api("/api/projects")]);
      setState({tasks, projects: projects.projects});
      if(state.taskTab === "done") setState({tasksDone:(await api("/api/tasks/done")).tasks});
    } else if(screen === "stats"){
      // Only here. Home must never pull the full chart history.
      await loadStats(state.statsPeriod);
    } else if(screen === "project"){
      const id = state.project?.project?.id;
      if(id) setState({project: await api(`/api/projects/${id}/tasks`)});
    }
  }catch(e){ handleError(e); }
}
async function loadStats(period){
  try{ setState({stats: await api("/api/stats?period=" + period), statsPeriod: period}); }
  catch(e){ handleError(e); }
}
const todayISO = () => state.home?.date || new Date().toISOString().slice(0,10);

//: Whatever the user typed before a failed save, so a retry does not start
//: from a blank field.
let lastDraft = null;

function handleError(e, draft){
  console.error("ErnestOS:", e);
  if(e.status === 403){ setState({error:t("sub_required"), loading:false}); return; }
  if(draft){
    lastDraft = draft;
    openSheet(`
      <h3>${e.status ? t("error") : t("offline")}</h3>
      <div class="muted small">${t("draft_kept")}</div>
      <div class="card" style="margin-top:10px">${esc(
        Object.values(draft.body || {}).filter(v => typeof v === "string").join(" · ")
      )}</div>
      <button class="btn" data-act="retry-draft" style="margin-top:14px">${t("retry")}</button>
      <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`);
    return;
  }
  toast(e.status ? t("error") : t("offline"));
}

/* A mission is a title and an importance. Adding fields here — a deadline, a
   description, sub-goals — is how a weekly focus turns back into a project. */
function missionSheet(mission){
  const priority = mission?.priority || "medium";
  const editing = Boolean(mission?.id);
  return `
    <h3>${editing ? t("edit") : t("add_focus")}</h3>
    <input id="focus-title" placeholder="${t("focus_title")}"
           value="${esc(mission?.title || "")}" />
    <label>${t("importance")}</label>
    <select id="focus-priority">${["high","medium","low"].map(p =>
      `<option value="${p}" ${priority===p?"selected":""}>${t(p)}</option>`).join("")}</select>
    <button class="btn" style="margin-top:16px"
      ${editing ? `data-act="focus-update" data-id="${mission.id}"`
                : `data-act="focus-save"`}>${t("save")}</button>
    ${editing ? `<button class="btn danger" data-act="focus-delete"
      data-id="${mission.id}" style="margin-top:8px">${t("delete")}</button>` : ""}
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`;
}

/* ---------- habit reordering ---------- */

/* The list is written back whole, so the server stores an order the user can
   see rather than a diff it has to reconstruct. The local list moves first so
   the row does not visibly snap back while the request is in flight; a failed
   save reloads the truth. */
async function saveOrder(ids){
  const previous = state.habits;
  try{
    const body = await api("/api/habits/reorder", {method:"PATCH", body:{habit_ids:ids}});
    const grouped = {};
    (state.habits?.categories || []).forEach(c => grouped[c] = []);
    body.habits.forEach(x => (grouped[x.category] = grouped[x.category] || []).push(x));
    setState({habits:{...state.habits, habits: body.habits, grouped}});
  }catch(e){
    setState({habits: previous});
    handleError(e);
  }
}

function moveHabit(index, delta){
  const items = state.habits?.habits || [];
  const target = index + delta;
  if(index < 0 || target < 0 || target >= items.length) return;
  haptic();
  const ids = items.map(x => x.id);
  [ids[index], ids[target]] = [ids[target], ids[index]];
  saveOrder(ids);
}

/* Touch drag. Telegram's in-app browser does not fire HTML5 drag events on
   iOS, so the reorder is driven by pointer events, which work on both. */
let dragFrom = null;

function reorderRowAt(y){
  return document.elementFromPoint(window.innerWidth / 2, y)?.closest("[data-drag-id]");
}

document.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".handle");
  if(!handle) return;
  const row = handle.closest("[data-drag-id]");
  if(!row) return;
  dragFrom = Number(row.dataset.index);
  row.classList.add("dragging");
  row.setPointerCapture?.(e.pointerId);
  e.preventDefault();
});

document.addEventListener("pointermove", e => {
  if(dragFrom === null) return;
  e.preventDefault();
  document.querySelectorAll(".dragover").forEach(x => x.classList.remove("dragover"));
  reorderRowAt(e.clientY)?.classList.add("dragover");
}, {passive:false});

document.addEventListener("pointerup", e => {
  if(dragFrom === null) return;
  const over = reorderRowAt(e.clientY);
  const from = dragFrom;
  dragFrom = null;
  document.querySelectorAll(".dragging,.dragover")
    .forEach(x => x.classList.remove("dragging", "dragover"));
  if(!over) return render();
  const to = Number(over.dataset.index);
  if(to === from) return render();
  const ids = (state.habits?.habits || []).map(x => x.id);
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  haptic("medium");
  saveOrder(ids);
});

function confirmSheet(action, id){
  openSheet(`<h3>${t("delete")}?</h3>
    <button class="btn danger" data-act="${action}" data-id="${id}" style="margin-top:14px">${t("delete")}</button>
    <button class="btn ghost" data-act="close" style="margin-top:8px">${t("cancel")}</button>`);
}

async function shiftMonth(delta){
  const c = state.calendar;
  let year = c.year, month = c.month + delta;
  if(month < 1){ month = 12; year--; }
  if(month > 12){ month = 1; year++; }
  try{ setState({calendar: await api(`/api/calendar?year=${year}&month=${month}`)}); }
  catch(e){ handleError(e); }
}

async function save(request, reload, quiet, message, draft){
  try{
    await request();
    lastDraft = null;
    closeSheet();
    if(!quiet) toast(message || t("saved"));
    if(reload) await loadScreen(reload);
  }catch(e){
    closeSheet();
    handleError(e, draft && {...draft, request, reload});
  }
}

async function settingSave(patch){
  try{
    await api("/api/settings", {method:"POST", body:patch});
    const me = await api("/api/me");
    state.lang = me.language;
    setState({me});
    openSheet(settingsSheet());
    toast(t("saved"));
    await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

/* One delegated listener: rebuilt HTML never loses its handlers because the
   handler lives on document, not on the nodes. */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const action = A[el.dataset.act];
  if(action){ e.preventDefault(); action(el); }
});
window.matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", render);
// The strips are fixed, so their height has to be re-measured whenever the
// viewport changes underneath them.
window.addEventListener("resize", syncShell);
tg?.onEvent?.("viewportChanged", syncShell);

/* ---------- boot ---------- */
(async function boot(){
  try{ state.appearance = localStorage.getItem("ernestos-appearance") || "auto"; }catch(_){}
  try{
    const me = await api("/api/me");
    state.lang = me.language || "uz";
    setState({me, loading:false});
    await loadScreen("home");
  }catch(e){
    console.error("ErnestOS boot failed:", e);
    setState({loading:false,
      error: e.status === 403 ? t("sub_required") : e.status ? t("error") : t("offline")});
  }
})();
