<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>ErnestOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ==================================================================
   ErnestOS design system.

   One set of semantic tokens; five themes that redefine them. No
   component below this block names a colour — they all reference
   semantics, which is what lets a theme change the whole visual system
   without duplicating a single component:

     --bg / --surface / --surface-2   ground and panels
     --text / --text-2 / --text-3     primary, secondary, tertiary
     --primary / --primary-2          the brand and its pressed state
     --accent / --accent-2            analytics, progress, highlights
     --border / --border-2            hairlines and stronger dividers
     --ok / --warn / --danger         state

   Each theme also sets its own structure — radius, shadow depth, border
   weight, gradient policy, type weight — because a theme that only
   changes hue is a palette, not a design.

   Spacing is an 8px scale (--s1..--s6) with 4px available as --s0.
   ================================================================== */
:root{
  /* ---- 01 CALM — default. Modern productivity software: clean light
     ground, white panels, blue used deliberately rather than
     everywhere, cyan reserved for analytics, navy for authority. ---- */
  --bg:#F7F9FC;
  --surface:#FFFFFF;
  --surface-2:#EEF2F7;
  --text:#111827;
  --text-2:#6B7280;
  --text-3:#9AA4B2;
  --primary:#3563E9;
  --primary-2:#2A50C0;
  --on-primary:#FFFFFF;
  --accent:#47B5D6;
  --accent-2:#172554;
  --border:#E5EAF0;
  --border-2:#D3DBE6;
  --ok:#12A150;
  --warn:#C77700;
  --danger:#D64550;

  /* ---- structure ---- */
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:20px;
  --radius-pill:999px;
  --border-w:1px;
  --shadow-1:0 1px 2px rgba(17,24,39,.05);
  --shadow-2:0 8px 24px rgba(17,24,39,.08);
  --shadow-3:0 16px 40px rgba(17,24,39,.12);
  /* A theme opts into gradient here, once, instead of per component. */
  --primary-fill:var(--primary);
  --hero-fill:linear-gradient(135deg,var(--primary),var(--primary-2));
  --hero-text:#FFFFFF;
  --ring:0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
  --title-w:680;
  --display-w:700;
  --motion:200ms;

  /* ---- 8px spacing scale ---- */
  --s0:4px; --s1:8px; --s2:12px; --s3:16px; --s4:24px; --s5:32px; --s6:48px;
  --pad:var(--s3);
  /* Height of the floating create button plus its offset, so page
     content can always scroll clear of it. */
  --fab-clear:76px;
}

/* ---- 02 TITAN — obsidian, steel and titanium. Executive productivity
   and premium fintech, not a gaming rig: high contrast, tighter
   geometry, heavier numbers, no neon. ---- */
[data-theme="titan"]{
  --bg:#090B0E;
  --surface:#11151A;
  --surface-2:#171C22;
  --text:#F4F7FA;
  --text-2:#89939E;
  --text-3:#5E6874;
  --primary:#3478F6;
  --primary-2:#315C7D;
  --on-primary:#FFFFFF;
  --accent:#A7B0BA;
  --accent-2:#315C7D;
  --border:#252C34;
  --border-2:#323B45;
  --ok:#2BB673;
  --warn:#D9903A;
  --danger:#E5484D;

  --radius-sm:8px;
  --radius:14px;
  --radius-lg:16px;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 10px 28px rgba(0,0,0,.55);
  --shadow-3:0 18px 44px rgba(0,0,0,.6);
  --primary-fill:var(--primary);
  /* Steel: a restrained top-lit gradient, not a metal texture. */
  --hero-fill:linear-gradient(160deg,#1C2530,#12171D);
  --hero-text:var(--text);
  --title-w:700;
  --display-w:720;
}

/* ---- 03 MUSE — warm ivory, dusty rose, lavender. Elegant and warm,
   still a serious productivity system: softest radius of the five, low
   contrast, no pastel candy. ---- */
[data-theme="muse"]{
  --bg:#FCF8F7;
  --surface:#FFFFFF;
  --surface-2:#F7EEF1;
  --text:#30282C;
  --text-2:#806F76;
  --text-3:#A99A9F;
  --primary:#C9798D;
  --primary-2:#704052;
  --on-primary:#FFFFFF;
  --accent:#9B8AC4;
  --accent-2:#704052;
  --border:#EBDDE1;
  --border-2:#DCC8CE;
  --ok:#4F9D77;
  --warn:#C08A3E;
  --danger:#C0555F;

  --radius-sm:14px;
  --radius:20px;
  --radius-lg:24px;
  --shadow-1:0 1px 2px rgba(112,64,82,.05);
  --shadow-2:0 8px 24px rgba(112,64,82,.08);
  --shadow-3:0 16px 40px rgba(112,64,82,.10);
  --primary-fill:var(--primary);
  --hero-fill:linear-gradient(135deg,var(--primary),var(--primary-2));
  --hero-text:#FFFFFF;
  --title-w:640;
  --display-w:660;
}

/* ---- 04 RAGE — carbon black with red used as emphasis, not as
   wallpaper: roughly 70% neutral, 20% surface, 10% signal. Tighter
   radius, more solid cards, faster interactions. ---- */
[data-theme="rage"]{
  --bg:#101010;
  --surface:#171717;
  --surface-2:#202020;
  --text:#F5F5F5;
  --text-2:#8D8D8D;
  --text-3:#666666;
  --primary:#E63946;
  --primary-2:#C22B37;
  --on-primary:#FFFFFF;
  --accent:#FF6B35;
  --accent-2:#F5F5F5;
  --border:#2A2A2A;
  --border-2:#3A3A3A;
  --ok:#3DBE6B;
  --warn:#FF6B35;
  --danger:#E63946;

  --radius-sm:8px;
  --radius:12px;
  --radius-lg:14px;
  --shadow-1:0 1px 2px rgba(0,0,0,.6);
  --shadow-2:0 8px 22px rgba(0,0,0,.6);
  --shadow-3:0 16px 36px rgba(0,0,0,.7);
  --primary-fill:var(--primary);
  --hero-fill:linear-gradient(135deg,#1C1C1C,#141414);
  --hero-text:var(--text);
  --title-w:720;
  --display-w:760;
  /* Execution mode: interactions land faster. */
  --motion:150ms;
}

/* ---- 05 NEXUS — deep ink with indigo, violet and cyan. Futuristic
   without becoming a crypto dashboard: gradient is reserved for the one
   headline surface, glass for the two layers that genuinely float. ---- */
[data-theme="nexus"]{
  --bg:#0D0D16;
  --surface:#151521;
  --surface-2:#1D1D2B;
  --text:#F5F4FF;
  --text-2:#9997AE;
  --text-3:#6E6C85;
  --primary:#625BF6;
  --primary-2:#8B5CF6;
  --on-primary:#FFFFFF;
  --accent:#20C7D9;
  --accent-2:#8B5CF6;
  --border:#29283A;
  --border-2:#38374D;
  --ok:#20C7D9;
  --warn:#E0A33C;
  --danger:#F0546C;

  --radius-sm:10px;
  --radius:16px;
  --radius-lg:20px;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 10px 30px rgba(0,0,0,.55);
  --shadow-3:0 18px 46px rgba(0,0,0,.6);
  --primary-fill:linear-gradient(135deg,var(--primary),var(--primary-2));
  --hero-fill:linear-gradient(135deg,#625BF6 0%,#8B5CF6 52%,#20C7D9 100%);
  --hero-text:#FFFFFF;
  --title-w:660;
  --display-w:700;
}

/* ==================================================================
   Base
   ================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%}
body{
  background:var(--bg);
  color:var(--text);
  font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",
       Roboto,sans-serif;
  font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;
  /* Telegram reports its own usable height; 100vh is wrong inside the
     in-app browser, so --vh is kept in sync from JS. */
  min-height:var(--vh, 100dvh);
  padding-bottom:calc(var(--shell-b, 128px) + var(--fab-clear) + var(--s2))}
#app{padding:calc(var(--s2) + var(--safe-t, 0px)) var(--pad) var(--s2);
     max-width:640px;margin:0 auto;width:100%}

/* Type scale. One family, five sizes, and no bold below 15px. */
h1{font-size:26px;font-weight:var(--title-w);letter-spacing:-.5px;line-height:1.2;
   overflow-wrap:anywhere}
h2{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
   color:var(--text-3);margin:var(--s4) 0 var(--s1);
   display:flex;align-items:center;justify-content:space-between;gap:var(--s1)}
h2 .act{text-transform:none;letter-spacing:0;font-size:13px;font-weight:550;
        color:var(--primary);display:inline-flex;align-items:center;gap:4px;
        position:relative;cursor:pointer}
h2 .act::after{content:"";position:absolute;inset:-10px}
h3{font-size:17px;font-weight:600;letter-spacing:-.2px}
.display{font-size:34px;font-weight:var(--display-w);letter-spacing:-1.2px;
         line-height:1}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}
.small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:var(--s2)}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{overflow-wrap:anywhere}
.strike{text-decoration:line-through;color:var(--text-2)}
.i{flex:none;vertical-align:-2px}
.hide{display:none}

/* ==================================================================
   Surfaces
   ================================================================== */
/* A card is a panel with a hairline. No nesting: hierarchy comes from
   whitespace and type, not from boxes inside boxes. */
.card{background:var(--surface);border:var(--border-w) solid var(--border);
      border-radius:var(--radius);padding:var(--s3);box-shadow:var(--shadow-1)}
.card + .card{margin-top:var(--s1)}
.card.tight{padding:var(--s2) var(--s3)}
.card.plain{background:none;border-color:transparent;box-shadow:none;padding:0}

/* The one surface per screen that carries the brand. */
.hero{background:var(--hero-fill);color:var(--hero-text);
      border:var(--border-w) solid transparent;border-radius:var(--radius-lg);
      padding:var(--s3);box-shadow:var(--shadow-2);position:relative;
      overflow:hidden}
.hero .t2,.hero .t3{color:color-mix(in srgb, var(--hero-text) 66%, transparent)}

.stack{display:flex;flex-direction:column;gap:var(--s1)}
.divide > * + *{border-top:var(--border-w) solid var(--border);
                padding-top:var(--s2);margin-top:var(--s2)}

/* ==================================================================
   Controls
   ================================================================== */
.check{width:24px;height:24px;border-radius:var(--radius-pill);flex:none;
       display:grid;place-items:center;position:relative;cursor:pointer;
       border:2px solid var(--border-2);color:transparent;background:none;
       transition:transform var(--motion),background var(--motion),
                  border-color var(--motion)}
.check::after{content:"";position:absolute;inset:-11px}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check:active{transform:scale(.86)}
.check.lock{opacity:.45;cursor:default}
.check.sq{border-radius:var(--radius-sm)}
/* On the brand surface the ordinary border disappears, so it is keyed to
   the surface's own foreground instead. */
.hero .check{border-color:color-mix(in srgb, var(--hero-text) 55%, transparent)}
.hero .check.on{background:var(--hero-text);border-color:var(--hero-text);
                color:var(--primary)}

.btn{background:var(--primary-fill);color:var(--on-primary);border:0;
     border-radius:var(--radius-sm);padding:var(--s2) var(--s3);font:inherit;
     font-size:15px;font-weight:600;cursor:pointer;min-height:46px;width:100%;
     display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);
     box-shadow:var(--shadow-1);transition:filter var(--motion),
                transform var(--motion)}
.btn:active{filter:brightness(.93);transform:scale(.995)}
.btn:focus-visible{outline:0;box-shadow:var(--ring)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.secondary{background:var(--surface-2);color:var(--text);
               border:var(--border-w) solid var(--border);box-shadow:none}
.btn.quiet{background:none;border:var(--border-w) solid var(--border-2);
           color:var(--text);box-shadow:none}
.btn.danger{background:none;border:var(--border-w) solid var(--danger);
            color:var(--danger);box-shadow:none}
.btn.text{background:none;border:0;box-shadow:none;color:var(--primary);
          width:auto;min-height:40px;padding:var(--s0) 2px;font-weight:550}
.btn.sm{width:auto;padding:var(--s1) var(--s2);font-size:13.5px;min-height:38px}
.btns{display:flex;gap:var(--s1);margin-top:var(--s2);flex-wrap:wrap}
.btns .btn{flex:1;min-width:132px}

input,textarea,select{width:100%;background:var(--surface);
  border:var(--border-w) solid var(--border-2);color:var(--text);
  border-radius:var(--radius-sm);padding:var(--s2);font:inherit;min-height:46px;
  -webkit-appearance:none;appearance:none;transition:box-shadow var(--motion),
  border-color var(--motion)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),
       linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
       background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;
       background-size:5px 5px,5px 5px;background-repeat:no-repeat;
       padding-right:38px}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--primary);
  box-shadow:var(--ring)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
label{display:block;font-size:12px;color:var(--text-2);margin:var(--s3) 0 var(--s0);
      font-weight:550}

.chip{display:inline-flex;align-items:center;gap:var(--s0);
      background:var(--surface);border:var(--border-w) solid var(--border-2);
      border-radius:var(--radius-pill);padding:var(--s1) var(--s2);font-size:13px;
      font-weight:550;white-space:nowrap;cursor:pointer;color:var(--text-2);
      transition:background var(--motion),color var(--motion),
                 border-color var(--motion)}
.chip.on{background:var(--primary-fill);border-color:transparent;
         color:var(--on-primary)}
.chip.sm{padding:6px var(--s1);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
              margin:0 calc(var(--pad) * -1);padding:0 var(--pad) 2px}
.chips.scroll::-webkit-scrollbar{display:none}

/* Segmented control: the selected cell is filled, not merely tinted. */
.seg{display:flex;background:var(--surface-2);
     border:var(--border-w) solid var(--border);border-radius:var(--radius-pill);
     padding:3px;gap:2px}
.seg > *{flex:1;text-align:center;padding:var(--s1) 6px;
         border-radius:var(--radius-pill);font-size:13px;font-weight:550;
         cursor:pointer;color:var(--text-2);white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;transition:background var(--motion),
         color var(--motion)}
.seg > *.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.hero .seg{background:color-mix(in srgb, var(--hero-text) 14%, transparent);
           border-color:transparent}
.hero .seg > *{color:color-mix(in srgb, var(--hero-text) 70%, transparent)}
.hero .seg > *.on{background:color-mix(in srgb, var(--hero-text) 92%, transparent);
                  color:var(--primary)}

.sw{width:44px;height:26px;border-radius:var(--radius-pill);flex:none;
    position:relative;background:var(--surface-2);
    border:var(--border-w) solid var(--border-2);cursor:pointer;
    transition:background var(--motion),border-color var(--motion)}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:var(--text-3);
  transition:transform var(--motion),background var(--motion)}
.sw.on{background:var(--primary);border-color:transparent}
.sw.on::before{transform:translateX(18px);background:var(--on-primary)}
.setrow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) 0;
        border-bottom:var(--border-w) solid var(--border)}
.setrow:last-child{border-bottom:0}

.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.p-high{background:var(--danger)} .p-medium{background:var(--warn)}
.p-low{background:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;
     font-weight:550;color:var(--text-2);
     border:var(--border-w) solid var(--border);border-radius:var(--radius-pill);
     padding:3px var(--s1)}
.tag.hot{color:var(--danger);
         border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.hero .tag{color:inherit;background:color-mix(in srgb,var(--hero-text) 14%,transparent);
           border-color:color-mix(in srgb,var(--hero-text) 28%,transparent)}

/* ==================================================================
   Progress
   ================================================================== */
.bar{height:6px;background:var(--surface-2);border-radius:var(--radius-pill);
     overflow:hidden}
.bar > span{display:block;height:100%;border-radius:var(--radius-pill);
            background:var(--primary-fill);transition:width var(--motion)}
.bar.accent > span{background:var(--accent)}
.hero .bar{background:color-mix(in srgb, var(--hero-text) 22%, transparent)}
.hero .bar > span{background:var(--hero-text)}

/* Three numbers on one line, divided rather than boxed: three separate
   cards for three small facts is three containers too many. */
.trio{display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.trio > div{padding:0 var(--s1);text-align:center;min-width:0}
.trio > div + div{border-left:var(--border-w) solid var(--border)}
.trio .k{font-size:11px;color:var(--text-3);font-weight:550;
         text-transform:uppercase;letter-spacing:.4px}
.trio .v{font-size:17px;font-weight:600;margin-top:2px;letter-spacing:-.3px}
.hero .trio > div + div{border-left-color:color-mix(in srgb,
                        var(--hero-text) 24%, transparent)}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1)}
.metric{background:var(--surface);border:var(--border-w) solid var(--border);
        border-radius:var(--radius);padding:var(--s2) var(--s3);min-width:0}
.metric .k{font-size:11px;color:var(--text-3);text-transform:uppercase;
           letter-spacing:.4px;font-weight:550}
.metric .v{font-size:20px;font-weight:600;letter-spacing:-.4px;margin-top:2px;
           display:flex;align-items:baseline;gap:var(--s0);flex-wrap:wrap}
.metric.wide{grid-column:1 / -1;display:flex;align-items:center;
             justify-content:space-between;gap:var(--s2)}
.metric.wide .v{margin-top:0}
.delta{font-size:12.5px;font-weight:600}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)}
.delta.flat{color:var(--text-3)}

/* ==================================================================
   Rows
   ================================================================== */
.item{background:var(--surface);border:var(--border-w) solid var(--border);
      border-radius:var(--radius);padding:var(--s2) var(--s3);
      display:flex;align-items:center;gap:var(--s2);min-height:52px}
.item + .item{margin-top:6px}
.item .meta{font-size:12.5px;color:var(--text-2);margin-top:2px;display:flex;
            align-items:center;gap:6px;flex-wrap:wrap}
.item.off{opacity:.55}
.item.pressable{cursor:pointer;transition:transform var(--motion)}
.item.pressable:active{transform:scale(.995)}

/* A task row's only decoration is the priority edge. */
.trow{background:var(--surface);border:var(--border-w) solid var(--border);
      border-left:3px solid var(--border-2);border-radius:var(--radius);
      padding:var(--s2) var(--s3);display:flex;align-items:flex-start;
      gap:var(--s2)}
.trow + .trow{margin-top:6px}
.trow.pri-high{border-left-color:var(--danger)}
.trow.pri-medium{border-left-color:var(--warn)}
.trow.pri-low{border-left-color:var(--ok)}
.trow .tt{font-weight:550;line-height:1.35;overflow-wrap:anywhere;cursor:pointer}
.trow .td{font-size:12.5px;color:var(--text-2);margin-top:3px;display:flex;
          align-items:center;gap:6px;flex-wrap:wrap}
.trow .quick{display:flex;gap:5px;margin-top:var(--s1);flex-wrap:wrap}
.group{font-size:12.5px;font-weight:600;color:var(--text-2);
       margin:var(--s3) 0 6px;display:flex;align-items:center;gap:6px}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.strip .d{border-radius:var(--radius-sm);background:var(--surface);
          border:var(--border-w) solid var(--border);padding:6px 2px;
          text-align:center;min-width:0;cursor:pointer}
.strip .d.now{border-color:var(--primary);
              background:color-mix(in srgb, var(--primary) 10%, var(--surface))}
.strip .dow{font-size:9.5px;font-weight:600;color:var(--text-3);
            text-transform:uppercase}
.strip .dd{font-size:14px;font-weight:600;margin-top:2px}
.strip .mk{height:4px;margin-top:3px;display:flex;justify-content:center;gap:2px}
.strip .mk i{width:4px;height:4px;border-radius:50%;background:var(--primary)}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;
          margin-bottom:var(--s2);gap:var(--s1)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;
          width:100%}
.cal-dow{text-align:center;font-size:9.5px;color:var(--text-3);padding:2px 0;
         font-weight:600;min-width:0;overflow:hidden;text-transform:uppercase}
.cal-day{aspect-ratio:1;min-width:0;border-radius:var(--radius-sm);
         background:var(--surface-2);border:var(--border-w) solid transparent;
         display:flex;flex-direction:column;align-items:center;
         justify-content:center;font-size:12.5px;gap:3px}
.cal-day.empty{background:transparent}

.sheet .hint{font-size:13px;color:var(--text-2);margin-top:var(--s0);

       transition:border-color var(--motion)}

.head{display:flex;align-items:center;gap:var(--s2)}
.avatar{width:42px;height:42px;border-radius:var(--radius-sm);flex:none;

const tg = window.Telegram?.WebApp;

tg?.disableVerticalSwipes?.();

/* Telegram's in-app browser reports a usable height that 100vh gets
   wrong, and the value changes as the keyboard opens. Mirror it, plus
   both safe-area insets, into custom properties. */
function syncViewport(){
  const root = document.documentElement;
  const h = tg?.viewportStableHeight || tg?.viewportHeight || window.innerHeight;
  root.style.setProperty("--vh", h + "px");
  const inset = tg?.contentSafeAreaInset || tg?.safeAreaInset;
  const outer = tg?.safeAreaInset;
  root.style.setProperty("--safe-t",
    Math.max(inset?.top ?? 0, outer?.top ?? 0) + "px");
  root.style.setProperty("--safe-b",
    `max(${Math.max(inset?.bottom ?? 0, outer?.bottom ?? 0)}px, env(safe-area-inset-bottom, 0px))`);
}
syncViewport();
tg?.onEvent?.("viewportChanged", syncViewport);
tg?.onEvent?.("safeAreaChanged", syncViewport);
tg?.onEvent?.("contentSafeAreaChanged", syncViewport);
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", () => setTimeout(syncViewport, 250));

/* ---------- themes ----------
   The picker shows each theme's three brand colours as a preview strip, so
   the swatch is the thing the user will actually see rather than a dot. Every
   theme is a complete visual system; the tokens live in the stylesheet and
   nothing here needs to know what they are. */
const THEMES = [
  {id:"calm",  a:"#3563E9", b:"#47B5D6", c:"#172554", bg:"#F7F9FC"},
  {id:"titan", a:"#3478F6", b:"#315C7D", c:"#A7B0BA", bg:"#090B0E"},
  {id:"muse",  a:"#C9798D", b:"#9B8AC4", c:"#704052", bg:"#FCF8F7"},
  {id:"rage",  a:"#E63946", b:"#FF6B35", c:"#F5F5F5", bg:"#101010"},
  {id:"nexus", a:"#625BF6", b:"#8B5CF6", c:"#20C7D9", bg:"#0D0D16"},
];
const THEME_NAMES = {calm:"Calm", titan:"Titan", muse:"Muse",
                     rage:"Rage", nexus:"Nexus"};
//: An account holding an unknown theme renders as the default and shows the
//: default ticked, rather than a picker with nothing selected.
const DEFAULT_THEME = "calm";
const themeOf = name => THEMES.some(x => x.id === name) ? name : DEFAULT_THEME;
const themeMeta = name => THEMES.find(x => x.id === themeOf(name));

const D = () => DICT[state.lang] || DICT.uz;
/* A missing key returns the key itself rather than "undefined", so a gap
   is visible in testing instead of silently shipping. */
const t = (k, vars) => {
  let s = D()[k];
  if(s === undefined) s = DICT.uz[k] ?? k;
  if(vars) for(const [key, value] of Object.entries(vars))
    s = String(s).split("{" + key + "}").join(value);
  return s;
};
const esc = s => String(s ?? "").replace(/[<>&"']/g,
  c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
function setState(patch){ Object.assign(state, patch); render(); }

/* ---------- api ---------- */
async function api(path, options = {}){
  const res = await fetch(path, {
    ...options,
    headers:{"Content-Type":"application/json",
             "X-Telegram-Init-Data": tg?.initData || "", ...(options.headers||{})},
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if(!res.ok){
    const err = new Error("http_" + res.status);
    err.status = res.status;
    try{ err.detail = (await res.json())?.detail; }catch(_){}
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

let toastTimer;
/* A toast may carry one action. Undo is offered wherever the action is
   reversible in one call, which is what makes a destructive tap safe to
   make with a thumb. */
function toast(msg, undoLabel, undoFn){
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>` +
    (undoFn ? `<span class="undo" id="toast-undo">${esc(undoLabel)}</span>` : "");
  el.classList.add("show");
  if(undoFn) document.getElementById("toast-undo").onclick = () => {
    el.classList.remove("show");
    undoFn();
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), undoFn ? 5000 : 2000);
}

const notify = s => tg?.HapticFeedback?.notificationOccurred?.(s || "success");

/* Telegram's own Back button, wired to whatever is currently "back":
   the open sheet first, then a sub-screen, then nothing. Without this,
   the hardware back gesture closes the whole Mini App from a detail
   view, which loses whatever the user was doing. */
function syncBackButton(){
  const bb = tg?.BackButton;
  if(!bb) return;
  if(sheetOpen() || state.screen === "project" || state.showCalendar) bb.show?.();
  else bb.hide?.();

const val = id => document.getElementById(id)?.value ?? "";
const trimmed = id => val(id).trim();

/* A signed delta, drawn with its own arrow so the direction survives a
   monochrome screen. Zero is written as a dash, not "+0%". */
function deltaTag(value){
  if(!value) return `<span class="delta flat">·</span>`;
  const up = value > 0;
  return `<span class="delta ${up ? "up" : "down"}">${up ? "↑" : "↓"}${Math.abs(value)}</span>`;
}

/* Local dates without pulling in a formatting library: the payload
   already carries ISO strings and the month names are in DICT. */
function isoToLabel(iso){
  if(!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${D().months[m - 1]}`;
}
function shiftISO(iso, days){
  const dt = new Date(iso + "T00:00:00");
  dt.setDate(dt.getDate() + days);
  return dt.toISOString().slice(0, 10);
}
const todayISO = () => state.home?.date || new Date().toISOString().slice(0, 10);

/* ---------- line chart (inline SVG, no libraries) ---------- */
function lineChart(series, keys){
  if(!series.length) return `<div class="empty">${t("no_data")}</div>`;
  const W = 320, H = 148, L = 18, R = 8, TOP = 12, BOT = 24;
  const stepX = series.length > 1 ? (W - L - R) / (series.length - 1) : 0;
  const y = v => H - BOT - (v / 100) * (H - TOP - BOT);
  const x = i => L + i * stepX;

  const grid = [0, 50, 100].map(v =>
    `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"
       stroke-width="1" stroke-dasharray="2 5"/>
     <text x="0" y="${y(v)+3}" font-size="8" fill="var(--text-3)">${v}</text>`).join("");

  const paths = keys.map((k, n) => {
    const pts = series.map((p, i) => `${x(i)},${y(p[k.field] ?? 0)}`).join(" ");
    const area = `${L},${y(0)} ${pts} ${x(series.length-1)},${y(0)}`;
    const dots = series.length <= 12
      ? series.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[k.field] ?? 0)}" r="2.5"
          fill="${k.color}"/>`).join("") : "";
    return `<polygon points="${area}" fill="${k.color}" opacity="${n === 0 ? .10 : .05}"/>
      <polyline points="${pts}" fill="none" stroke="${k.color}" stroke-width="2.3"
        stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");

  // Anchor the first and last labels inward so they are not clipped by
  // the SVG edge; everything between stays centred on its point.
  const every = Math.ceil(series.length / 6);
  const last = series.length - 1;
  const labels = series.map((p, i) => {
    if(i % every !== 0 && i !== last) return "";
    const anchor = i === 0 ? "start" : i === last ? "end" : "middle";
    return `<text x="${x(i)}" y="${H-6}" font-size="8.5" fill="var(--text-3)"
              text-anchor="${anchor}">${p.label}</text>`;
  }).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${paths}${labels}</svg>`;
}

const SCREENS = {};

/* Home, top to bottom: who and when, then ONE action, then today's
   numbers, then the three that matter, the week's focus, the rest of
   today, and the week strip. Everything on this screen is either the
   next action or a number about today. Editing and deleting live on the
   screens that own the data, so a mis-tap here cannot destroy
   anything. */
SCREENS.home = () => {
  const d = state.home;
  if(!d) return `<div class="spin"></div>`;

  /* Four blocks and nothing else, in the order they are needed:

       who and when   →  the one thing to do today
                      →  how today is going
                      →  the rest of today's work

     Everything that used to live here — the top three, the week's focus,
     the month grid, birthdays — is one tap away on the screen that owns
     it. The point of Home is that opening it answers the question
     without scrolling. */
  return headBlock(d)
       + missionBlock(d)
       + scoreBlock(d)
       + tasksBlock(d);
};

function headBlock(d){
  const initial = (d.name || "E").charAt(0).toUpperCase();
  /* Telegram already knows the user's photo and hands it to the Mini App in
     initData, so there is nothing to upload and nothing to ask for. The
     signed-blob endpoint stays as the fallback for an avatar that was sent
     to the bot before this existed. */
  const tgPhoto = tg?.initDataUnsafe?.user?.photo_url;
  const avatar = tgPhoto
    ? `<img src="${esc(tgPhoto)}" alt="" />`
    : state.me?.has_photo
      ? `<img src="/api/avatar?tgdata=${encodeURIComponent(tg?.initData || "")}" alt="" />`
      : esc(initial);

  let h = `
    <div class="head">
      <div class="grow">
        <h1>${t("greet")}, ${esc(d.name)}</h1>
        <div class="t2 small" style="margin-top:2px">${esc(d.date_label)}</div>
      </div>
      <button class="iconbtn" data-act="settings"
              aria-label="${t("settings")}">${icon("settings")}</button>
      <div class="avatar" aria-hidden="true">${avatar}</div>
    </div>`;

  // The quote is one quiet line, and an empty one is a link rather than an
  // empty card demanding to be filled.
  h += d.quote
    ? `<div class="t2 small wrap" data-act="quote"
            style="margin-top:var(--s2)">“${esc(d.quote)}”</div>`
    : `<div class="t3 tiny" data-act="quote"
            style="margin-top:var(--s1);text-decoration:underline">
         ${t("quote_add")}</div>`;

  // Returning after a break gets one offer, not a wall of red.
  const b = d.break;
  if(b && b.suggest_reset && !state.dismissedBreak){
    h += `<div class="card tight" style="margin-top:var(--s2)">
        <div class="row">
          <div class="grow"><b>${t("welcome_back")}</b>
            <div class="t2 tiny">${t("overdue_waiting", {n:b.overdue})}</div></div>
          <button class="btn sm secondary" data-act="fresh-start">
            ${t("recover")}</button>
          <button class="iconbtn sm bare" data-act="break-dismiss"
                  aria-label="${t("close")}">${icon("x", 15)}</button>
        </div></div>`;
  }
  return h;
}

/* The day's one mission: a single task, chosen from the tasks that already
   exist. Not three, not a separate list — the question "what is today
   about?" has one answer or it has none. */
function missionBlock(d){
  const pick = (d.top3 || [])[0];

  if(!pick){
    return `<div class="hero" style="margin-top:var(--s3)"
                 data-act="mission-pick">
        <div class="t2 tiny" style="text-transform:uppercase;letter-spacing:.6px;
             font-weight:600">${t("today_mission")}</div>

          <div class="grow" style="font-size:17px;font-weight:600;opacity:.85">
            ${t("mission_add")}</div>
          ${icon("plus", 20)}
        </div></div>`;
  }

  const done = pick.status === "done";
  return `<div class="hero" style="margin-top:var(--s3)">
      <div class="row">
        <div class="grow t2 tiny" style="text-transform:uppercase;
             letter-spacing:.6px;font-weight:600">${t("today_mission")}</div>
        <button class="iconbtn sm bare" data-act="mission-pick"
                aria-label="${t("mission_change")}"
                style="color:inherit;opacity:.7">${icon("edit", 15)}</button>
      </div>

}

/* One number with a day/week/month switch, and the three parts on a single
   divided line underneath. Three separate cards for three small facts was
   three containers too many, and it pushed today's tasks off the screen. */
function scoreBlock(d){
  const period = state.scorePeriod || "day";
  const s = state.summary;
  const periods = [["day", t("period_day")], ["week", t("period_week")],
                   ["month", t("period_month")]];

  let value, tasks, habits, prayer, delta = null;
  if(period === "day" || !s){
    value = d.overall.value;
    tasks = pct(d.overall.components.tasks);
    habits = `${d.habits.done}/${d.habits.total}`;
    prayer = d.prayer.excused ? "✓"
      : `${d.prayer.performed}/${d.prayer.required}`;
  } else {
    const w = s.windows[period];
    value = w.overall;
    tasks = `${w.tasks}%`;
    habits = `${w.habits}%`;
    prayer = `${w.prayer}%`;
    delta = w.delta;
  }

  return `<div class="card" style="margin-top:var(--s3)">
      <div class="seg" style="margin-bottom:var(--s3)">
        ${periods.map(([id, label]) => `<div class="${period === id ? "on" : ""}"
          data-act="score-period" data-period="${id}">${label}</div>`).join("")}
      </div>
      <div class="row" style="align-items:flex-end">
        <div class="grow">
          <div class="display num">${value}%</div>
          <div class="t3 tiny" style="margin-top:2px">${t("overall")}</div>
        </div>
        ${delta !== null ? deltaTag(delta) : ""}
        <button class="iconbtn sm bare" data-act="overall-why"
                aria-label="${t("how_calculated")}">${icon("info", 17)}</button>
      </div>
      <div class="bar" style="margin:var(--s2) 0 var(--s3)">
        <span style="width:${Math.max(0, Math.min(100, value))}%"></span></div>
      <div class="trio">
        <div><div class="k">${t("tasks")}</div>
          <div class="v num">${tasks}</div></div>
        <div><div class="k">${t("habits")}</div>
          <div class="v num">${habits}</div></div>
        <div><div class="k">${t("prayer")}</div>
          <div class="v num">${prayer}</div></div>
      </div></div>`;
}

/* Today's work, grouped by the project it belongs to. */
function tasksBlock(d){
  const groups = d.tasks_today || [];
  const missionId = (d.top3 || [])[0]?.id;

  let h = `<h2>${t("today_tasks")}
      <span class="act" data-act="task-add">${icon("plus", 15)}
        ${t("add_task")}</span></h2>`;

  const rows = groups
    .map(g => ({...g, tasks: g.tasks.filter(x => x.id !== missionId)}))
    .filter(g => g.tasks.length);

  if(!rows.length){
    return h + `<div class="empty">${t("no_tasks_yet")}
      <button class="btn secondary sm" data-act="task-add">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  }

  return h + rows.map(group => `
    ${group.project
      ? `<div class="group">${icon("target", 13)} ${esc(group.project)}</div>`
      : `<div class="group">${esc(t("standalone"))}</div>`}
    ${group.tasks.map(x => taskRow(x, {hideProject: true})).join("")}`).join("");
}

function calendarBlock(){
  const c = state.calendar;
  if(!c) return `<div class="card"><div class="spin"></div></div>`;
  const dows = D().dow.map(x => `<div class="cal-dow">${x}</div>`).join("");
  let cells = "";
  for(let i = 0; i < c.first_weekday; i++) cells += `<div class="cal-day empty"></div>`;
  for(let day = 1; day <= c.days_in_month; day++){
    const iso = `${c.year}-${String(c.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const events = c.events[iso] || [];
    const kinds = [...new Set(events.map(e => e.kind))].slice(0, 4);
    cells += `<div class="cal-day num ${iso === c.today ? "today" : ""}
      ${events.length ? "has" : ""}"
      ${events.length ? `data-act="day-open" data-date="${iso}"` : ""}>
      <span>${day}</span>
      <span class="cal-dots">${kinds.map(k => `<i class="k-${k}"></i>`).join("")}</span></div>`;
  }
  return `<div class="card">
    <div class="cal-head">
      <button class="iconbtn sm" data-act="cal-prev"
              aria-label="‹">${icon("back", 16)}</button>
      <b>${D().months[c.month - 1]} ${c.year}</b>
      <button class="iconbtn sm" data-act="cal-next"
              aria-label="›">${icon("chevron", 16)}</button>
    </div>
    <div class="cal-grid">${dows}${cells}</div></div>`;
}

/* ---------- Habits / Prayer / Journal ---------- */
SCREENS.habits = () => {
  const tabs = [["habits","habits"],["prayer","prayer"],["journal","journal"]];
  let h = `<h1>${t(state.tab)}</h1>
    <div class="seg" style="margin:12px 0 14px">
      ${tabs.map(([id, key]) => `<div class="${state.tab === id ? "on" : ""}"
        data-act="tab" data-tab="${id}">${t(key)}</div>`).join("")}
    </div>`;
  if(state.tab === "prayer") return h + prayerTab();
  if(state.tab === "journal") return h + journalTab();
  return h + habitsTab();
};

const TIERS = {non_negotiable:"t1", target:"t2", bonus:"t3"};

function habitsTab(){
  const data = state.habits;
  if(!data) return `<div class="spin"></div>`;

  if(state.reorderMode) return `<div class="t2 small"
      style="margin-bottom:10px">${t("reorder_hint")}</div>`
    + reorderList()
    + `<button class="btn" data-act="reorder-off"
         style="margin-top:14px">${t("finish")}</button>`;

  let h = "";
  if(data.streak)
    h += `<div class="card flat" style="text-align:center">🔥
        <b class="num">${data.streak}</b>
        <span class="t2 small">${t("streak")}</span></div>`;

  // The wake-up control sits in the habit it belongs to, and it is a
  // real button rather than an instruction to go and use the chat.
  const anyDue = data.habits.some(x => x.due);

  data.categories.forEach(cat => {
    const items = (data.grouped[cat] || []);
    if(!items.length) return;
    h += `<h2>${t(cat)}</h2>`;
    h += items.map(x => habitRow(x, cat, data.wake)).join("");
  });

  if(!anyDue) h += `<div class="empty">${t("no_habits_today")}</div>`;

  // Editing, pausing and deleting a habit all live in the habit's own
  // sheet, one tap in. A screen-wide "delete mode" made removal as
  // prominent as ticking, and a mis-tap there costs every log the habit
  // ever had.
  h += `<div class="btns">
      <button class="btn" data-act="habit-add">
        ${icon("plus", 16)} ${t("add_habit")}</button>
      <button class="btn secondary" data-act="reorder-on">
        ${icon("drag", 16)} ${t("reorder")}</button>
    </div>`;
  return h;
}

function habitRow(x, cat, wake){
  if(x.paused){
    return `<div class="item ${TIERS[cat]} off">
        <div class="grow"><div class="ellipsis">${esc(x.name)}</div>
          <div class="meta">${t("paused")}</div></div>
        <button class="btn secondary sm" data-act="habit-resume" data-id="${x.id}">
          ${icon("play", 15)} ${t("resume")}</button></div>`;
  }

  const isWake = x.system_key === "wakeup";
  // A wake-up that has not happened yet gets the button; once it has, the
  // row shows the time it actually happened.
  const wakeBtn = isWake && wake && !wake.logged
    ? `<button class="btn sm" data-act="wake">☀️ ${t("wake_btn")}</button>` : "";
  const wakeMeta = isWake && wake && wake.logged
    ? (wake.done
        ? t("wake_done_at", {time: wake.at || wake.now})
        : t("wake_late_at", {time: wake.at || wake.now}))
    : isWake && x.target_time ? `${t("wake_target")} ${x.target_time}` : "";

  const meta = [];
  if(wakeMeta) meta.push(wakeMeta);
  else if(!x.due) meta.push(t("not_today"));
  else if(x.protected) meta.push(t("habit_auto_prayer"));
  if(x.remind_at) meta.push(`${icon("bell", 12)} ${x.remind_at}`);
  if(x.schedule !== "daily" && !isWake) meta.push(scheduleLabel(x));

  const box = !x.due
    ? `<div class="check lock" aria-hidden="true"></div>`
    : x.protected
      ? `<div class="check ${x.done ? "on" : ""} lock"
             data-act="auto-habit">${x.done ? icon("check", 14) : ""}</div>`
      : `<div class="check ${x.done ? "on" : ""}" data-act="habit-toggle"
             data-id="${x.id}">${icon("check", 14)}</div>`;

  return `<div class="item ${TIERS[cat]} ${x.due ? "" : "off"}">
      ${box}
      <div class="grow" data-act="habit-open" data-id="${x.id}">
        <div class="ellipsis">${esc(x.name)}</div>
        ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
      </div>
      ${wakeBtn || `<button class="iconbtn sm plain" data-act="habit-open"
          data-id="${x.id}" aria-label="${t("edit")}">${icon("chevron", 16)}</button>`}
    </div>`;
}

function scheduleLabel(x){
  if(x.schedule === "weekdays") return t("weekdays_only");
  if(x.schedule === "daily") return t("every_day");
  return (x.days || []).map(d => D().dow[d]).join(" ");
}

/* Reordering shows one flat list, not the three tiers: dragging between
   tiers would silently change a habit's category. The Up/Down buttons
   are not a fallback for the drag — they are the accessible way to do
   it, and they work with one thumb. */
function reorderList(){
  const items = state.habits?.habits || [];
  return items.map((x, i) => `
    <div class="item" data-drag-id="${x.id}" data-index="${i}">
      <div class="handle" aria-hidden="true"
           style="cursor:grab;touch-action:none;color:var(--text-3)">
        ${icon("drag", 18)}</div>
      <div class="grow ellipsis">${esc(x.name)}</div>
      <button class="iconbtn sm" data-act="habit-up" data-index="${i}"
              aria-label="${t("move_up")}" ${i === 0 ? "disabled" : ""}
              >${icon("up", 15)}</button>
      <button class="iconbtn sm" data-act="habit-down" data-index="${i}"
              aria-label="${t("move_down")}"
              ${i === items.length - 1 ? "disabled" : ""}>${icon("down", 15)}</button>
    </div>`).join("");
}

/* ---------- prayer ----------
   Five compact rows, not five decorated cards. Entering five prayers is
   a five-tap job and the UI should not make it feel like a form. */
function prayerTab(){
  const p = state.prayer;
  if(!p) return `<div class="spin"></div>`;

  // Gender is only asked here, only once, and only because the set of
  // statuses genuinely differs. The reason is on screen with the

  if(!state.me?.gender){

        <div class="btns">

            ${t("male")}</button>
          <button class="btn secondary" data-act="set-gender" data-value="female">
            ${t("female")}</button>
        </div></div>`;
  }

  const ICON = {bomdod:"🌅", peshin:"☀️", asr:"🌤", shom:"🌆", xufton:"🌙"};
  const female = state.me?.gender === "female";
  let h = "";

  if(female){
    h += `<div class="item" data-act="excused" style="min-height:46px">
        <div class="check ${p.excused ? "on" : ""}">${icon("check", 14)}</div>
        <div class="grow">🌸 ${t("excused")}</div></div>`;
  }

  h += `<div class="card">`;
  ["bomdod","peshin","asr","shom","xufton"].forEach(name => {
    const cur = p.prayers[name];
    h += `<div class="prow">

          <span class="ellipsis">${t(name)}</span></div>
        <div class="ps">${p.statuses.map(st =>
          `<div class="st ${st} ${cur === st ? "on" : ""}" data-act="prayer"
            data-prayer="${name}" data-status="${st}">${t(st)}</div>`).join("")}
          ${cur ? `<div class="st" data-act="prayer-clear" data-prayer="${name}"
            aria-label="${t("prayer_clear")}">${icon("x", 13)}</div>` : ""}
        </div></div>`;

  h += `</div>`;

  // Two numbers, never merged: how many were prayed, and how well they were
  // prayed. The bar tracks the first of those, because that is the one the
  // `5x namoz` habit turns on.
  h += `<div class="metrics">
      <div class="metric"><div class="k">${t("performed")}</div>

}

/* ---------- journal ----------
   Not homework. Whatever is written is saved, the count is stated
   plainly, and nothing on this screen calls an unfinished entry a
   failure. Drafts survive Telegram being closed mid-sentence. */
function journalTab(){
  const entry = state.journal, questions = state.journalQuestions;
  if(!questions.length) return `<div class="spin"></div>`;
  const answers = entry?.answers || {};
  const draft = loadDraft();
  const answered = questions.filter(q =>
    String(draft[q.id] ?? answers[q.id] ?? "").trim()).length;

  let h = `<div class="row" style="margin-bottom:12px">
      <div class="grow small ${answered === questions.length ? "" : "t2"}">
        ${answered === questions.length ? `✓ ${t("journal_complete")}`
          : t("journal_progress", {done:answered, total:questions.length})}</div>
      <div class="t3 tiny" id="jsave"></div>
    </div>`;

  h += `<div class="t3 tiny" style="margin-bottom:10px">${t("journal_hint")}</div>`;

  questions.forEach((q, i) => {
    const value = draft[q.id] ?? answers[q.id] ?? "";
    h += `<label>${i + 1}. ${esc(q.text)}</label>
      <textarea id="jq-${q.id}" data-journal="${q.id}"
        style="min-height:72px">${esc(value)}</textarea>`;
  });

  // Mood is an optional one-tap check-in, not a mood diary. ErnestOS is
  // not a mental-health app and must not pretend to be one.
  const moods = [["awful","😞"],["low","😕"],["ok","😐"],["good","🙂"],["great","😄"]];
  h += `<label>${t("mood_q")} <span class="t3">(${t("optional")})</span></label>
    <div class="chips">${moods.map(([id, face]) =>
      `<div class="chip ${entry?.mood === id ? "on" : ""}" data-act="mood"
        data-value="${id}" aria-label="${t("mood_" + id)}"
        >${face}</div>`).join("")}</div>`;

  h += `<div class="btns">
      <button class="btn" data-act="journal-save">${t("save")}</button>
      <button class="btn secondary" data-act="journal-history">
        ${icon("book", 16)} ${t("journal_history")}</button></div>`;

  if(state.journalHistory){
    h += `<h2>${t("journal_history")}</h2>`;
    h += state.journalHistory.length ? state.journalHistory.map(e => `
      <div class="item" data-act="journal-open" data-day="${e.day}">
        <div class="grow"><div class="num small">${isoToLabel(e.day)}</div>
          <div class="meta">${esc(e.preview) || "—"}</div></div>
        <div class="t3 tiny">${e.complete ? "✓"
          : `${e.answered}/${e.total}`}</div>
      </div>`).join("") : `<div class="empty">${t("empty")}</div>`;
  }
  return h;
}

/* ---------- journal drafts ----------
   Telegram can be closed by a call, a swipe or the OS at any moment. A
   long entry lost to that is the fastest way to teach someone never to
   write a long entry again, so every keystroke goes to localStorage and
   the backend gets a debounced save. */
const draftKey = () => `ernestos-journal-${todayISO()}`;

function loadDraft(){
  try{ return JSON.parse(localStorage.getItem(draftKey()) || "{}"); }
  catch(_){ return {}; }
}
function saveDraft(id, value){
  try{
    const draft = loadDraft();
    draft[id] = value;
    localStorage.setItem(draftKey(), JSON.stringify(draft));
  }catch(_){}
}
function clearDraft(){
  try{ localStorage.removeItem(draftKey()); }catch(_){}
}

let journalTimer;
function onJournalInput(el){
  saveDraft(el.dataset.journal, el.value);
  const note = document.getElementById("jsave");
  if(note) note.textContent = t("autosaved");
  clearTimeout(journalTimer);
  // Debounced so a paragraph is one request, not one per keystroke.
  journalTimer = setTimeout(async () => {
    try{
      const body = {answers:{[el.dataset.journal]: el.value}};
      const r = await api("/api/journal", {method:"POST", body});
      if(note) note.textContent = "✓";
      state.journal = {...(state.journal || {}), answered:r.answered,
                       complete:r.complete,
                       answers:{...(state.journal?.answers || {}),
                                [el.dataset.journal]: el.value}};
    }catch(_){
      // The draft is already on disk, so a failed save is recoverable.
      if(note) note.textContent = "…";
    }
  }, 900);
}
document.addEventListener("input", e => {
  const el = e.target.closest("[data-journal]");
  if(el) onJournalInput(el);
});

/* ---------- Tasks ---------- */
SCREENS.tasks = () => {
  let h = `<div class="head">
      <h1 class="grow">${t("tasks")}</h1>
      <button class="iconbtn" data-act="task-add"

    </div>
    <div class="seg" style="margin:12px 0 12px">
      <div class="${state.taskTab === "open" ? "on" : ""}"
           data-act="task-tab" data-tab="open">${t("open_tab")}</div>
      <div class="${state.taskTab === "done" ? "on" : ""}"
           data-act="task-tab" data-tab="done">${t("done_tab")}</div>
    </div>`;

function searchBox(id, value, placeholder, action){
  return `<div class="row" style="margin:var(--s4) 0 var(--s2)">
      <div class="grow" style="position:relative">

              >${icon("search", 17)}</span>

        aria-label="${t("clear")}">${icon("x", 16)}</button>` : ""}

/* The week's focus lives here rather than on Home: it is a planning decision,
   and this is the planning screen. Home stays about today. */
function weekFocusBlock(){
  const focus = state.focus;
  if(!focus) return "";
  const primary = focus.primary;

  let h = `<h2>${t("week_focus")}
      ${focus.slots_free > 0 && primary
        ? `<span class="act" data-act="focus-add" data-slot="supporting">
             ${icon("plus", 14)} ${t("add_supporting")}</span>` : ""}</h2>`;

  if(!primary){
    return h + `<div class="empty">${t("add_mission")}
      <button class="btn secondary sm" data-act="focus-add" data-slot="primary">
        ${icon("target", 16)} ${t("add_mission")}</button></div>`;
  }

  h += `<div class="card">
      <div class="row">
        <div class="check ${primary.done ? "on" : ""}" data-act="focus-toggle"
             data-id="${primary.id}">${icon("check", 14)}</div>
        <div class="grow" data-act="focus-open" data-id="${primary.id}"
             data-title="${esc(primary.title)}" data-priority="${primary.priority}"
             data-done="${primary.done ? 1 : 0}">
          <div class="t3 tiny" style="text-transform:uppercase;letter-spacing:.5px;
               font-weight:600">${t("mission_main")}</div>
          <div class="wrap ${primary.done ? "strike" : ""}"
               style="font-size:16px;font-weight:600;margin-top:2px">
            ${esc(primary.title)}</div>
        </div>
        ${icon("chevron", 16)}
      </div></div>`;

  const extra = focus.supporting || [];
  if(extra.length){
    h += extra.map(row => `
      <div class="item" style="min-height:44px;margin-top:6px">
        <div class="check ${row.done ? "on" : ""}" style="width:21px;height:21px"
             data-act="focus-toggle" data-id="${row.id}"
             >${row.done ? icon("check", 12) : ""}</div>
        <div class="grow small wrap ${row.done ? "strike" : ""}"
             data-act="focus-open" data-id="${row.id}"
             data-title="${esc(row.title)}" data-priority="${row.priority}"
             data-done="${row.done ? 1 : 0}">${esc(row.title)}</div>
      </div>`).join("");
  }
  return h;
}

function openTab(){
  const d = state.tasks;
  let h = weekFocusBlock();
  h += searchBox("task-q", state.taskQuery, t("search_tasks"), "task-search");

  /* Filters as chips rather than a menu: one tap to narrow, one to clear, and
     the active one visible without opening anything. Two kinds are offered —
     a horizon (this week, this month) and a property (overdue, undated,
     priority) — because "what is coming up" and "what is urgent" are different
     questions and the answer to both is a different subset of the same list. */
  const filters = [["", t("all")], ["week", t("filter_week")],
                   ["month", t("filter_month")], ["overdue", t("overdue")],
                   ["undated", t("no_date")], ["high", t("high")],
                   ["low", t("low")]];
  h += `<div class="chips scroll" style="margin-bottom:var(--s2)">
      ${filters.map(([id, label]) => `<div class="chip sm
        ${state.taskFilter === id ? "on" : ""}" data-act="task-filter"
        data-value="${id}">${label}</div>`).join("")}</div>`;

  if(!d) return h + `<div class="spin"></div>`;

  const f = state.taskFilter;
  const today = todayISO();
  const horizon = days => shiftISO(today, days);

  /* One predicate, applied to every row, instead of a rule per section: a
     filter that behaves differently depending on which heading a task
     happens to sit under is a filter nobody can predict. */
  const keep = row => {
    if(!f) return true;
    if(f === "high" || f === "low") return row.priority === f;
    if(f === "overdue") return row.overdue;
    if(f === "undated") return !row.deadline;
    if(f === "week") return row.deadline && row.deadline <= horizon(7);
    if(f === "month") return row.deadline && row.deadline <= horizon(30);
    return true;
  };

  const section = (label, rows) => {
    const items = (rows || []).filter(keep);
    return items.length ? `<h2>${label}</h2>` + items.map(taskRow).join("") : "";
  };

  let body = "";
  body += section(t("overdue"), d.overdue);
  body += section(t("upcoming"), d.upcoming);
  body += section(t("no_date"), d.undated);
  body += section(t("later"), d.later || []);

  if(!body){
    h += (state.taskQuery || state.taskFilter)
      ? `<div class="empty">${t("no_results")}</div>`
      : `<div class="empty">${t("no_tasks_yet")}
          <button class="btn secondary sm" data-act="task-add"
                  style="margin:12px auto 0;display:flex">
            ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else h += body;

  h += projectsSection();
  return h;
}

function doneTab(){
  const g = state.tasksDone;
  let h = searchBox("done-q", state.doneQuery, t("search"), "done-search");
  if(!g) return h + `<div class="spin"></div>`;

  const section = (label, rows) => rows.length
    ? `<h2>${label}</h2>` + rows.map(doneRow).join("") : "";

  const body = section(t("done_today"), g.today)
    + section(t("done_week"), g.week)
    + section(t("done_earlier"), g.earlier);

  return h + (body || `<div class="empty">${
    state.doneQuery ? t("no_results") : t("empty")}</div>`);
}

function doneRow(task){
  return `<div class="item" style="min-height:46px">
      <div class="check on" data-act="task-reopen" data-id="${task.id}"
           aria-label="${t("reopen")}">${icon("check", 14)}</div>
      <div class="grow"><div class="ellipsis strike">${esc(task.title)}</div>
        <div class="meta">${esc(task.project || t("standalone"))}
          ${task.recurrence ? `· ${icon("repeat", 12)}` : ""}</div></div>
    </div>`;
}

/* An overdue task gets four ways out instead of a red badge. Nothing on
   this row calls the user late; the actions are what a person actually
   needs at that moment. */
function taskRow(task, opts){
  const meta = [];
  // Under a project heading the name is already on screen; repeating it in
  // every row is noise that pushes the useful details off the line.
  if(task.project && !opts?.hideProject) meta.push(esc(task.project));
  if(task.deadline) meta.push(`<span class="num">${isoToLabel(task.deadline)}</span>`);
  if(task.due_time) meta.push(`<span class="num">${icon("clock", 12)} ${task.due_time}</span>`);
  if(task.recurrence) meta.push(icon("repeat", 12));
  if(task.remind_before !== null && task.remind_before !== undefined)
    meta.push(icon("bell", 12));

  const quick = task.overdue ? `
      <div class="quick">
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="today">${t("when_today")}</div>
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="tomorrow">${t("when_tomorrow")}</div>
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="week">${t("when_week")}</div>
        <div class="chip sm" data-act="task-move" data-id="${task.id}"
             data-when="none">${t("when_none")}</div>
      </div>` : "";

  return `<div class="trow pri-${task.priority}">
      <div class="check" data-act="task-done" data-id="${task.id}"
           aria-label="${t("now_done")}">${icon("check", 14)}</div>
      <div class="grow">
        <div class="tt wrap" data-act="task-open" data-id="${task.id}">
          ${esc(task.title)}</div>
        ${meta.length ? `<div class="td">${meta.join(" · ")}</div>` : ""}
        ${quick}
      </div>
      <button class="iconbtn sm plain" data-act="task-top3" data-id="${task.id}"
              aria-label="${task.top3 ? t("top3_unpick") : t("top3_pick")}"
              >${task.top3 ? "★" : "☆"}</button>
    </div>`;
}

/* Projects are a section of Tasks, not a fifth tab. */
function projectsSection(){
  const list = state.projects || [];
  let h = `<h2>${t("projects")}
      <span class="act" data-act="project-add">${icon("plus", 14)}
        ${t("add_project")}</span></h2>`;
  if(!list.length)
    return h + `<div class="empty">${t("no_projects")}
      <button class="btn secondary sm" data-act="project-add"

/* ---------- one project and the work inside it ---------- */
SCREENS.project = () => {
  const d = state.project;
  if(!d) return `<div class="spin"></div>`;
  const p = d.project;

  let h = `<div class="head">
      <button class="iconbtn" data-act="nav" data-screen="tasks"
              aria-label="${t("tasks")}">${icon("back")}</button>
      <h1 class="grow">${esc(p.name)}</h1>
      <button class="iconbtn" data-act="project-edit" data-id="${p.id}"
              aria-label="${t("edit")}">${icon("edit")}</button>
    </div>`;

  if(p.description)
    h += `<div class="t2 small wrap" style="margin-top:8px">${esc(p.description)}</div>`;

  // Progress in words as well as a percentage: "4 / 7" alone makes the
  // reader do the arithmetic.
  h += `<div class="card" style="margin-top:12px">
      <div class="row">
        <div class="grow">
          <div style="font-size:24px;font-weight:750" class="num">${p.progress}%</div>
          <div class="t2 small">${t("of_tasks", {done:p.tasks_done,
            total:p.tasks_total})}</div>
        </div>
        <div style="text-align:right">
          ${p.deadline ? `<div class="small num">${icon("calendar", 13)}

              : p.status === "done" ? t("st_done") : t("st_active")}</div>
        </div>
      </div>${bar(p.progress)}</div>`;

  h += `<h2>${t("project_tasks")}
      <span class="act" data-act="task-add" data-project="${p.id}">
        ${icon("plus", 14)} ${t("add_task")}</span></h2>`;

  if(!d.tasks.length){
    h += `<div class="empty">${t("no_tasks_yet")}
      <button class="btn secondary sm" data-act="task-add" data-project="${p.id}"
              style="margin:12px auto 0;display:flex">
        ${icon("plus", 16)} ${t("add_first_task")}</button></div>`;
  } else {
    const open = d.tasks.filter(x => x.status !== "done");

    if(open.length) h += open.map(taskRow).join("");
    if(done.length){
      h += `<div class="group">${t("completed")} · ${done.length}</div>`;
      h += done.map(doneRow).join("");
    }
  }

  h += `<div class="btns">
      ${p.status === "done"
        ? `<button class="btn secondary" data-act="project-status" data-id="${p.id}"
             data-value="active">${t("mark_active")}</button>`
        : `<button class="btn secondary" data-act="project-status" data-id="${p.id}"
             data-value="done">${icon("check", 15)} ${t("mark_done")}</button>`}
      <button class="btn secondary" data-act="project-archive" data-id="${p.id}"
              data-value="${p.archived ? 0 : 1}">
        ${p.archived ? t("unarchive") : t("archive")}</button>
    </div>
    <button class="btn danger" data-act="project-delete" data-id="${p.id}"
            style="margin-top:8px">${icon("trash", 15)} ${t("delete")}</button>`;
  return h;
};

/* ---------- Statistics ----------
   Its own screen, loaded only when opened: Home never pays for chart

SCREENS.stats = () => {
  const st = state.stats;
  if(!st) return `<h1>${t("stats")}</h1><div class="spin"></div>`;
  const today = st.today;
  const arrow = TREND_ICON[today.delta] || "";

  let h = `<h1>${t("stats")}</h1>
    <div class="hero" style="margin-top:14px" data-act="overall-why">
      <div class="row">
        <div class="grow">
          <div class="k">${t("overall")}</div>
          <div class="num" style="font-size:32px;font-weight:760;letter-spacing:-1px">
            ${today.overall}%
            ${arrow ? `<span class="delta ${today.delta}">${arrow}</span>` : ""}</div>
        </div>
        <div class="tag">${icon("info", 13)} ${t("how_calculated")}</div>
      </div></div>`;

  // Four numbers, each with how it moved. A percentage on its own is not
  // actionable; a percentage and a direction is.
  const cell = (key, value, delta) =>
    `<div class="metric"><div class="k">${t(key)}</div>
       <div class="v num">${pct(value)} ${deltaTag(delta)}</div></div>`;
  h += `<div class="metrics">
      ${cell("tasks", today.tasks, st.deltas.tasks)}
      ${cell("habits", today.habits, st.deltas.habits)}
      <div class="metric wide"><div class="k">${t("prayer")}</div>
        <div class="v num">${today.prayer_performed} / ${today.prayer_required}
          ${deltaTag(st.deltas.prayer)}
          <span class="k">🔥 ${today.streak}</span></div></div>
    </div>`;

  h += `<div class="seg" style="margin:16px 0 12px">
      ${["week","month","year"].map(p => `<div class="${st.period === p ? "on" : ""}"
        data-act="stats-period" data-period="${p}">${t(p)}</div>`).join("")}</div>`;

  // The series are togglable, because four lines at once is a mess and
  // which two matter is the user's call, not ours.
  const SERIES = [
    {field:"overall", color:"var(--accent)",  label:t("overall")},
    {field:"tasks",   color:"var(--t2)",      label:t("tasks")},
    {field:"habits",  color:"var(--t1)",      label:t("habits")},
    {field:"prayer",  color:"var(--warn)",    label:t("prayer")},
  ];
  const active = SERIES.filter(k => state.statsSeries[k.field]);
  h += `<div class="card">
      ${lineChart(st.series, active.length ? active : [SERIES[0]])}
      <div class="legend">${SERIES.map(k =>
        `<span class="${state.statsSeries[k.field] ? "" : "off"}"
          data-act="series-toggle" data-field="${k.field}">
          <i style="background:${k.color}"></i>${k.label}</span>`).join("")}</div>
    </div>`;

  h += `<h2>${t("average")}</h2>
    <div class="metrics">
      ${cell("overall", st.averages.overall, st.deltas.overall)}
      ${cell("tasks", st.averages.tasks, st.deltas.tasks)}
      ${cell("habits", st.averages.habits, st.deltas.habits)}
      ${cell("prayer", st.averages.prayer, st.deltas.prayer)}
    </div>
    <div class="t3 tiny" style="margin-top:6px">${t("vs_prev")}</div>`;

  if(st.best_day){
    h += `<div class="card" style="margin-top:12px"><div class="row">
        <div class="grow"><div class="k t3 tiny"
          style="text-transform:uppercase;letter-spacing:.6px;font-weight:750"
          >${t("best_day")}</div>
          <div style="font-weight:680;margin-top:2px">${isoToLabel(st.best_day.day)}</div>
        </div>
        <div class="num" style="font-size:20px;font-weight:740"
          >${st.best_day.overall}%</div></div></div>`;
  }

  // Prayer as five separate facts, not one opaque score.
  const pd = st.prayer_detail;
  h += `<h2>${t("prayer_detail")}</h2>
    <div class="metrics">
      <div class="metric"><div class="k">${t("pr_full_days")}</div>
        <div class="v num">${pd.full_days} / ${pd.days}</div></div>
      <div class="metric"><div class="k">${t("pr_on_time")}</div>
        <div class="v num">${pd.on_time_percent}%</div></div>
      <div class="metric"><div class="k">${t("pr_jamaat")}</div>
        <div class="v num">${pd.jamaat}</div></div>
      <div class="metric"><div class="k">${t("pr_qaza")}</div>
        <div class="v num">${pd.qaza}</div></div>
      <div class="metric"><div class="k">${t("pr_missed")}</div>
        <div class="v num">${pd.missed}</div></div>
      <div class="metric"><div class="k">${t("pr_consistency")}</div>
        <div class="v num">${pd.consistency}%</div></div>
    </div>`;

  h += `<div class="btns">
      <button class="btn secondary" data-act="stats-download">
        ${icon("download", 16)} ${t("download")}</button></div>`;
  return h;
};

/* The task form. First view is one field and four chips, because that
   covers almost every task anyone ever writes. Dates, times, reminders,
   repeats, projects and descriptions exist, and they are one tap down
   rather than seven fields to scroll past.

   `state.form` holds the in-progress choices so a chip can re-render the
   sheet without losing what was typed. */
state.form = {};

function taskSheet(task, presetProject){
  const editing = Boolean(task?.id);
  const f = state.form;
  const projects = state.projects || [];
  const options = projects.map(p =>
    `<option value="${p.id}" ${String(p.id) === String(f.project_id) ? "selected" : ""}
      >${esc(p.name)}</option>`).join("");

  const chips = [["today", t("when_today")], ["tomorrow", t("when_tomorrow")],
                 ["week", t("when_week")], ["none", t("when_none")]];

  return `
    <h3>${icon("list", 18)} ${editing ? t("edit") : t("add_task")}</h3>
    <input id="task-title" placeholder="${t("task_name")}"
           value="${esc(f.title || "")}" />

    <div class="chips" style="margin-top:10px">
      ${chips.map(([id, label]) => `<div class="chip sm
        ${f.when === id ? "on" : ""}" data-act="task-when"
        data-value="${id}">${label}</div>`).join("")}
      <div class="chip sm ${f.when === "pick" ? "on" : ""}"
           data-act="task-when" data-value="pick">
        ${icon("calendar", 14)} ${f.when === "pick" && f.deadline
          ? isoToLabel(f.deadline) : t("when_pick")}</div>
    </div>

    ${f.when === "pick" ? `<label>${t("deadline")}</label>
      <input type="date" id="task-deadline" value="${f.deadline || ""}"
             data-form="deadline" />` : ""}

    <details ${f.open ? "open" : ""}>
      <summary>${icon("chevron", 15)}<span class="chev"></span>
        ${t("more_options")}</summary>

      <label>${t("due_time")} <span class="t3">(${t("optional")})</span></label>
      <input type="time" id="task-time" value="${f.due_time || ""}" />

      <label>${t("reminder")}</label>
      <select id="task-remind">
        <option value="" ${f.remind_before === null || f.remind_before === undefined
          ? "selected" : ""}>${t("remind_none")}</option>
        ${[0, 10, 60, 1440].map(m =>
          `<option value="${m}" ${String(f.remind_before) === String(m)
            ? "selected" : ""}>${t("remind_" + m)}</option>`).join("")}
      </select>

      <label>${t("repeat")}</label>
      <select id="task-repeat">
        <option value="">${t("repeat_none")}</option>
        ${["daily","weekdays","weekly","monthly"].map(r =>
          `<option value="${r}" ${f.recurrence === r ? "selected" : ""}
            >${t("repeat_" + r)}</option>`).join("")}
      </select>

      <label>${t("priority")}</label>
      <div class="chips">${["high","medium","low"].map(p =>
        `<div class="chip sm ${(f.priority || "medium") === p ? "on" : ""}"
          data-act="task-priority" data-value="${p}">
          <span class="dot p-${p}"></span>${t(p)}</div>`).join("")}</div>

      <label>${t("project")}</label>
      <select id="task-project">
        <option value="">${t("standalone")}</option>${options}</select>

      <label>${t("task_desc")}</label>
      <textarea id="task-desc">${esc(f.description || "")}</textarea>
    </details>

    <button class="btn" style="margin-top:16px"
      ${editing ? `data-act="task-update" data-id="${task.id}"`
                : `data-act="task-save"${presetProject ? ` data-project="${presetProject}"` : ""}`}
      >${t("save")}</button>
    ${editing ? `<button class="btn danger" data-act="task-delete-go"
      data-id="${task.id}" style="margin-top:8px">
      ${icon("trash", 15)} ${t("delete")}</button>` : ""}
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`;
}

/* Reads the sheet's current inputs into state.form, so re-rendering for
   a chip tap never loses typed text. */
function readTaskForm(){
  const f = state.form;
  const get = id => document.getElementById(id);
  if(get("task-title")) f.title = get("task-title").value;
  if(get("task-deadline")) f.deadline = get("task-deadline").value || null;
  if(get("task-time")) f.due_time = get("task-time").value || null;
  if(get("task-desc")) f.description = get("task-desc").value;
  if(get("task-project")) f.project_id = get("task-project").value || null;
  if(get("task-remind")){
    const v = get("task-remind").value;
    f.remind_before = v === "" ? null : Number(v);
  }
  if(get("task-repeat")) f.recurrence = get("task-repeat").value || "";
  const details = document.querySelector(".sheet details");
  if(details) f.open = details.open;
  return f;
}

/* Turns the chip choice into an actual date. `pick` keeps whatever the
   date input holds. */
function formDeadline(){
  const f = state.form;
  const today = todayISO();
  if(f.when === "today") return today;
  if(f.when === "tomorrow") return shiftISO(today, 1);
  if(f.when === "week") return shiftISO(today, 7);
  if(f.when === "none") return null;
  if(f.when === "pick") return f.deadline || null;
  return f.deadline ?? null;
}

function taskBody(){
  const f = readTaskForm();
  return {
    title: (f.title || "").trim(),
    description: f.description || "",
    deadline: formDeadline(),
    due_time: f.due_time || null,
    remind_before: f.remind_before ?? null,
    recurrence: f.recurrence || "",
    priority: f.priority || "medium",
    project_id: f.project_id ? Number(f.project_id) : null,
  };
}

/* ---------- habit sheet ----------
   Name, tier, which days, reminder, and the habit's own history. Pause
   sits next to delete and reads as the softer option, because for a
   holiday or an injury it is the right one and deleting throws away
   every log. */
function habitSheet(h){
  const days = h.days || [0,1,2,3,4,5,6];
  const custom = h.schedule !== "daily" && h.schedule !== "weekdays";
  const grid = h.grid || [];

  return `
    <h3>${icon("check", 18)} ${t("edit_habit")}</h3>
    ${h.protected
      ? `<div class="hint">${t("auto_habit")}</div>`
      : `<input id="habit-name" value="${esc(h.name)}" />`}

    ${h.protected ? "" : `<label>${t("category")}</label>
      <div class="chips">${["non_negotiable","target","bonus"].map(c =>
        `<div class="chip sm ${h.category === c ? "on" : ""}"
          data-act="habit-cat" data-id="${h.id}" data-value="${c}">${t(c)}</div>`).join("")}
      </div>`}

    <label>${t("schedule")}</label>
    <div class="chips">
      <div class="chip sm ${h.schedule === "daily" ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="daily">${t("every_day")}</div>
      <div class="chip sm ${h.schedule === "weekdays" ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="weekdays">${t("weekdays_only")}</div>
      <div class="chip sm ${custom ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="custom">${t("pick_days")}</div>
    </div>
    ${custom ? `<div class="chips" style="margin-top:8px">
      ${D().dow.map((label, i) => `<div class="chip sm
        ${days.includes(i) ? "on" : ""}" data-act="habit-day"
        data-id="${h.id}" data-day="${i}">${label}</div>`).join("")}</div>` : ""}

    ${h.system_key === "wakeup" ? `<label>${t("wake_at")}</label>
      <div class="field">
        <input type="time" id="habit-target" value="${h.target_time || "05:00"}" />
        <button class="btn sm" data-act="habit-target-save" data-id="${h.id}"
                style="min-width:96px">${t("save")}</button>
      </div>` : ""}

    <label>${t("reminder")} <span class="t3">(${t("optional")})</span></label>
    <div class="field">
      <input type="time" id="habit-remind" value="${h.remind_at || ""}" />
      <button class="btn sm" data-act="habit-remind-save" data-id="${h.id}"
              style="min-width:96px">${t("save")}</button>
    </div>

    <label>${t("history")}</label>
    <div class="metrics">
      <div class="metric"><div class="k">${t("streak")}</div>
        <div class="v num">🔥 ${h.streak}</div></div>
      <div class="metric"><div class="k">${t("completion")}</div>
        <div class="v num">${h.percent}%</div></div>
      <div class="metric wide"><div class="k">${t("last7")} · ${t("last30")}</div>
        <div class="v num">${h.last7_done}/${h.last7_due}
          <span class="k">${h.last30_done}/${h.last30_due}</span></div></div>
    </div>
    <div class="hgrid" style="margin-top:10px">${grid.map(g =>
      `<i class="${g.done ? "done" : g.due ? "due" : ""}" title="${g.day}"></i>`).join("")}</div>

    ${h.protected ? "" : `
      <div class="btns">
        <button class="btn secondary" data-act="habit-pause" data-id="${h.id}"
                data-value="${h.paused ? 0 : 1}">
          ${h.paused ? icon("play", 15) + " " + t("resume")
                     : icon("pause", 15) + " " + t("pause")}</button>
        ${h.name !== undefined ? `<button class="btn secondary"
          data-act="habit-name-save" data-id="${h.id}">${t("save")}</button>` : ""}
      </div>
      <button class="btn danger" data-act="habit-delete-confirm" data-id="${h.id}"
              style="margin-top:8px">${icon("trash", 15)} ${t("delete")}</button>`}
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("close")}</button>`;
}

/* ---------- mission sheet ----------
   A title and how much it matters. Adding a deadline, a description or
   sub-goals here is how a weekly focus turns back into a project. */
function missionSheet(mission, slot){
  const priority = mission?.priority || "medium";
  const editing = Boolean(mission?.id);
  const done = mission?.done === "1" || mission?.done === true;
  return `
    <h3>${icon("target", 18)} ${editing ? t("mission")
      : slot === "supporting" ? t("add_supporting") : t("add_mission")}</h3>
    <input id="focus-title" placeholder="${t("mission")}"
           value="${esc(mission?.title || "")}" />
    <label>${t("priority")}</label>
    <div class="chips">${["high","medium","low"].map(p =>
      `<div class="chip sm ${priority === p ? "on" : ""}" data-act="focus-pri"
        data-value="${p}">${t(p)}</div>`).join("")}</div>
    <input type="hidden" id="focus-priority" value="${priority}" />
    <button class="btn" style="margin-top:16px"
      ${editing ? `data-act="focus-update" data-id="${mission.id}"`
                : `data-act="focus-save"`}>${t("save")}</button>
    ${editing ? `
      <button class="btn secondary" data-act="focus-carry" data-id="${mission.id}"
              style="margin-top:8px">${t("mission_carry")}</button>
      <button class="btn danger" data-act="focus-delete" data-id="${mission.id}"

    <button class="btn secondary" data-act="close" style="margin-top:8px">

}

/* ---------- top-3 picker ----------
   Chooses from the tasks that already exist rather than creating a
   parallel list. Picking one also dates it for today, which is what the
   user meant. */
function pickTaskSheet(){
  const d = state.tasks;
  const current = (state.home?.top3 || [])[0];
  const pool = d
    ? [...d.overdue, ...d.upcoming, ...d.undated, ...(d.later || [])]
        .filter(x => x.status !== "done").slice(0, 40)
    : [];

  return `<h3>${icon("target", 18)} ${t("pick_task")}</h3>
    ${current ? `<button class="btn secondary" data-act="mission-clear"
      data-id="${current.id}" style="margin-top:var(--s2)">
      ${icon("x", 15)} ${t("mission_change")}</button>` : ""}
    <div class="stack" style="margin-top:var(--s2)">
    ${pool.length ? pool.map(x => `
      <div class="item pressable" data-act="mission-set" data-id="${x.id}">
        <div class="grow"><div class="ellipsis">${esc(x.title)}</div>
          <div class="meta">${x.deadline ? isoToLabel(x.deadline) : t("no_date")}
            ${x.project ? `· ${esc(x.project)}` : ""}</div></div>
        ${current && current.id === x.id ? icon("check", 16) : icon("chevron", 15)}
      </div>`).join("")
      : `<div class="empty">${t("no_tasks_yet")}
          <button class="btn secondary sm" data-act="task-add">
            ${icon("plus", 16)} ${t("add_first_task")}</button></div>`}
    </div>
    <button class="btn secondary" data-act="close" style="margin-top:var(--s3)">
      ${t("close")}</button>`;
}

/* ---------- overall explanation ----------
   The formula, spelled out, with the same numbers that produced it. A
   score the user cannot check is a score they stop believing. */
function overallSheet(x){
  return `<h3>${icon("info", 18)} ${t("how_calculated")}</h3>
    <div class="hint">${t("overall_rule")}<br>${t("overall_absent")}</div>
    <div class="card" style="margin-top:12px">
      <div class="row"><div class="grow"><b>${t("overall")}</b></div>
        <div class="num" style="font-size:22px;font-weight:750">${x.value}%</div></div>
    </div>
    ${x.parts.map(p => `
      <div class="item" style="min-height:44px">
        <div class="grow"><div>${t(p.key)}</div>
          <div class="meta">${p.percent === null ? t("not_counted")
            : `${p.done} / ${p.total}`}</div></div>
        <div class="num ${p.percent === null ? "t3" : ""}">${pct(p.percent)}</div>
      </div>`).join("")}
    <div class="t3 tiny" style="margin-top:8px">

}

/* ---------- day detail ----------
   Every row here opens the actual thing. A calendar full of text that
   cannot be tapped is a calendar nobody taps. */
function daySheet(iso, events){

    ${events.length ? events.map(e => `
      <div class="item" style="min-height:46px"
           data-act="event-open" data-kind="${e.kind}" data-id="${e.id}">
        <div>${kind[e.kind] || ""}</div>
        <div class="grow"><div class="ellipsis ${e.status === "done" ? "strike" : ""}"
          >${esc(e.title)}</div>
          ${e.due_time ? `<div class="meta num">${e.due_time}</div>` : ""}
          ${e.turning ? `<div class="meta">${e.turning} ${t("turning")}</div>` : ""}
        </div>${icon("chevron", 15)}</div>`).join("")

/* ---------- fresh start ----------
   Says exactly what will happen, to how many tasks, and that nothing is
   deleted. A reset that does not explain itself is one users are right
   to be afraid of. */
function freshStartSheet(p){
  const modes = [["today", t("fs_today")], ["week", t("fs_week")],
                 ["undate", t("fs_undate")], ["archive", t("fs_archive")]];
  return `<h3>${icon("repeat", 18)} ${t("fresh_start")}</h3>
    <div class="hint"><b>${t("fresh_start_n", {n:p.overdue})}</b><br>
      ${t("fresh_start_body")}</div>
    ${p.overdue ? modes.map(([id, label]) => `
      <button class="btn secondary" data-act="fresh-go" data-mode="${id}"
              style="margin-top:8px">${label}</button>`).join("")
