    const url = "https://t.me/share/url?url=" + encodeURIComponent(r.link)
              + "&text=" + encodeURIComponent(t("ref_share_text"));
    if(tg?.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, "_blank");
  },
  "ref-copy": async () => {
    const r = state.referral;
    if(!r?.link) return;
    haptic();
    try{
      /* The Clipboard API needs a secure context and permission, and neither
         is guaranteed inside a WebView. The textarea fallback works where it
         does not, and if both fail the user is told rather than left with a
         button that silently did nothing. */
      if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(r.link);
      else {
        const box = document.createElement("textarea");
        box.value = r.link;
        box.setAttribute("readonly", "");
        box.style.cssText = "position:fixed;opacity:0";
        document.body.appendChild(box);
        box.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(box);
        if(!ok) throw new Error("copy refused");
      }
      notify("success");
      toast(t("ref_copied"));
    }catch(_){ toast(t("ref_copy_failed")); }
  },

  /* ---- data and privacy ---- */
  "set-privacy": () => { haptic(); openSettings("privacy"); },
  "privacy-info": () => openSheet(privacySheet()),
  sessions: () => openSheet(sessionsSheet()),
  export: async () => {
    try{ await api("/api/export/send", {method:"POST"});
         toast(t("export_sent")); }
    catch(e){ handleError(e); }
  },
  /* A backup is the same bytes as the export, taken a different way: straight
     into a file on the device. Telegram's in-app browser blocks ordinary
     downloads, so a browser that refuses falls back to the route that always
     works rather than failing silently — a backup button that does nothing is
     worse than no backup button. */
  backup: async () => {
    try{
      const data = await api("/api/export");
      const blob = new Blob([JSON.stringify(data, null, 2)],
                            {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ernestos-${todayISO()}.json`;
      if(a.download === undefined) throw new Error("no download support");
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(t("backup_saved"));
    }catch(_){
      try{ await api("/api/export/send", {method:"POST"});
           toast(t("export_sent")); }
      catch(e){ handleError(e); }
    }
  },
  "wipe-data": () => { haptic(); openSheet(wipeDataSheet()); },
  "wipe-data-confirm": async () => {
    // Step two of two. The first tap opened a sheet naming what goes; this one
    // sends the word the server insists on, so a stray tap cannot reach here.
    try{
      await api("/api/account/wipe", {method:"POST", body:{confirm:"WIPE"}});
      closeSheet();
      toast(t("wipe_done"));
      state.calendar = null;
      await loadScreen(state.screen);
    }catch(e){ handleError(e); }
  },
  feedback: () => openSheet(feedbackSheet()),
  "feedback-send": async () => {
    const message = trimmed("fb-text");
    if(!message) return;
    try{
      const r = await api("/api/feedback", {method:"POST", body:{message}});
      closeSheet();
      // Never claim delivery that did not happen.
      toast(r.delivered ? t("feedback_sent") : t("feedback_saved"));
    }catch(e){ closeSheet(); handleError(e); }
  },
  "delete-account": () => openSheet(deleteAccountSheet()),
  "delete-account-go": async () => {
    if(trimmed("del-confirm").toUpperCase() !== "DELETE") return;
    try{
      await api("/api/account/delete", {method:"POST",
        body:{confirm:"DELETE"}});
      closeSheet();
      setState({error:t("account_deleted"), loading:false, me:null, home:null});
      tg?.close?.();
    }catch(e){ closeSheet(); handleError(e); }
  },

  /* ---- statistics ---- */
  "stats-period": el => { haptic(); loadStats(el.dataset.period); },
  "prayer-detail": () => { haptic();
    if(state.stats?.prayer_detail)
      openSheet(prayerDetailSheet(state.stats.prayer_detail)); },
  "series-toggle": el => { haptic();
    state.statsSeries[el.dataset.field] = !state.statsSeries[el.dataset.field];
    render(); },
  "stats-download": async () => {
    // The bot sends the file into the chat: Telegram's browser blocks
    // plain downloads, and putting the credential in a URL would leak it.
    haptic("medium");
    try{
      await api("/api/stats/export?period=" + state.statsPeriod, {method:"POST"});
      toast(t("report_sent"));
    }catch(e){ handleError(e); }
  },

  /* ---- subscription ---- */
  "sub-join": el => { tg?.openTelegramLink?.(el.dataset.url)
    || window.open(el.dataset.url, "_blank"); },
  "sub-check": async el => {
    el.textContent = t("sub_checking");
    await checkSubscription(false);
  },
  "sub-open": () => { openSheet(blockedSheet(), "sub"); checkSubscription(true); },
  "back-to-bot": () => { tg?.close?.(); },
  "set-modules": () => { haptic(); openSettings("modules"); },
  "mod-toggle": async el => {
    haptic();
    const mods = {...(state.me?.modules || {})};
    mods[el.dataset.key] = !mods[el.dataset.key];
    try{
      const r = await api("/api/modules", {method:"POST",
        body:{modules: Object.keys(mods).filter(k => mods[k])}});
      state.me = {...state.me, modules: r.modules};
      reopenSettings();
      toast(t("saved"));
      await loadScreen(state.screen);
    }catch(e){ handleError(e); }
  },
};

/* ---------- team helpers ---------- */

/* A write to the team, then the team reloaded, then the sheet it came from
   redrawn on the fresh data — so a switch flips where it was tapped. */
async function teamWrite(request, reopen, message){
  const team = teamCurrent();
  if(!team) return;
  haptic();
  // The sheet this came from. If another has been opened meanwhile, the
  // answer must not paint the old one back over it.
  const view = state.sheetView;
  try{
    await request(team);
    state.team = await api("/api/teams");
    if(state.teamActivity) delete state.teamActivity[team.id];
    const fresh = teamCurrent();
    if(state.sheetView !== view || !sheetOpen()){ /* the user moved on */ }
    else if(reopen === "members" && fresh) openSheet(teamMembersSheet(fresh), "team-members");
    else if(reopen && fresh) openSheet(teamMenuSheet(fresh), "team-menu");
    else closeSheet();
    render();
    toast(message || t("saved"));
  }catch(e){ handleError(e); }
}

function inviteStatus(inv){
  if(!inv || inv.expired || !inv.expires_at) return t("invite_expired");
  return t("invite_until", {when: shortMoment(inv.expires_at)});
}

/* The ⋯ sheet: the invite (for those who may invite), requests, your own
   notification level, members and roles, rename, leave (#26, #29, #30). */
function teamMenuSheet(team){
  const p = team.permissions || {};
  const inv = team.invite || {};
  let h = `<h3>${esc(team.name)}</h3>`;
  if(p.invite){
    h += `<label>${t("team_invite")}</label>
      ${team.invite_link && !inv.expired ? `
        <input id="team-link" readonly value="${esc(team.invite_link)}">
        <div class="btns">
          <button class="btn" data-act="team-copy">${t("team_copy")}</button>
          <button class="btn secondary" data-act="team-share">${t("share")}</button>
        </div>` : ""}
      <div class="t2 small" style="margin-top:6px">${inviteStatus(inv)}</div>
      <div class="btns">
        <button class="btn secondary sm" data-act="team-invite-renew">${t("invite_renew")}</button>
        <button class="btn secondary sm" data-act="team-invite-revoke">${t("invite_revoke")}</button>
      </div>
      <div class="setrow"><div class="grow lbl">${t("approval_label")}</div>
        <div class="sw ${inv.approval ? "on" : ""}" data-act="team-approval" role="switch"
             tabindex="0" aria-checked="${inv.approval ? "true" : "false"}"></div></div>`;
    const reqs = state.teamRequests?.[team.id] || [];
    if(reqs.length) h += `<label>${t("requests_title")}</label>` + reqs.map(r => `
      <div class="row" style="padding:4px 0"><div class="grow">${esc(r.name)}</div>
        <button class="btn sm" data-act="team-request" data-id="${r.id}"
                data-value="1">${t("approve")}</button>
        <button class="btn sm secondary" data-act="team-request" data-id="${r.id}"
                data-value="0">${t("decline")}</button></div>`).join("");
  }
  h += `<label>${icon("bell", 13)} ${t("notify_title")}</label>
    <div class="stack">${["all", "important", "assigned", "off"].map(level => `
      <div class="item pressable" data-act="team-notify" data-value="${level}"
           role="radio" tabindex="0" aria-checked="${team.notify === level}">
        <div class="grow"><div>${t("notify_" + level)}</div>
          <div class="t3 tiny">${t("notify_" + level + "_hint")}</div></div>
        ${team.notify === level ? icon("check", 16) : ""}</div>`).join("")}</div>
    <div class="btns" style="margin-top:12px">
      <button class="btn secondary" data-act="team-members">${t("members_roles")}</button>
      ${p.rename ? `<button class="btn secondary" data-act="team-rename">${t("team_rename")}</button>` : ""}
    </div>
    <button class="btn danger" data-act="team-leave" style="margin-top:8px">${t("team_leave")}</button>
    <button class="btn secondary" data-act="close" style="margin-top:8px">${t("close")}</button>`;
  return h;
}

function teamMembersSheet(team){
  const p = team.permissions || {};
  const me = state.me?.telegram_id;
  return `<h3>${t("members_roles")}</h3>` + (team.members || []).map(m => {
    const actions = [];
    if(m.user_id !== me && m.role !== "owner"){
      if(p.roles) actions.push(`<button class="btn sm secondary" data-act="team-role"
        data-id="${m.user_id}" data-value="${m.role === "admin" ? "member" : "admin"}">${
          t(m.role === "admin" ? "make_member" : "make_admin")}</button>`);
      if(p.remove_members && (p.roles || m.role === "member"))
        actions.push(`<button class="btn sm danger" data-act="team-kick"
          data-id="${m.user_id}">${t("remove_member")}</button>`);
      if(p.transfer) actions.push(`<button class="btn sm secondary" data-act="team-transfer"
          data-id="${m.user_id}">👑 ${t("give_owner")}</button>`);
    }
    return `<div class="card tight" style="margin-top:6px">
      <div class="row"><div class="grow"><b>${esc(m.name)}</b>${
        m.is_you ? ` <span class="muted">(${t("you")})</span>` : ""}
        <div class="muted sm">${t("role_" + m.role)}</div></div></div>
      ${actions.length ? `<div class="chips" style="margin-top:6px">${actions.join("")}</div>` : ""}
    </div>`;
  }).join("") + `<button class="btn secondary" data-act="team-menu"
      style="margin-top:12px">${t("back")}</button>`;
}

/* ---------- habit helpers: a shared habit is changed through the team ---------- */
const habitIsTeam = id => state.habitSheet?.source === "team"
  && String(state.habitSheet.id) === String(id);
const habitHistoryPath = id => habitIsTeam(id)
  ? `/api/teams/habits/${id}/history` : `/api/habits/${id}/history`;
function habitPatch(id, body){
  return api(habitIsTeam(id) ? `/api/teams/habits/${id}` : `/api/habits/${id}`,
             {method:"PATCH", body});
}
function habitPause(id, paused, from){
  return habitIsTeam(id)
    ? api(`/api/teams/habits/${id}`, {method:"PATCH", body:{paused, from}})
    : api(`/api/habits/${id}/pause`, {method:"POST", body:{paused, from}});
}
async function reopenHabit(id){
  try{ openSheet(habitSheet(await api(habitHistoryPath(id)))); }
  catch(e){ handleError(e); }
}

/* Opens the edit sheet for a task found in whatever is currently loaded. */
/* A shared task opens the very same sheet a private one does — deadline,
   time, priority, reminder, repeat, project. Sending the reader to the Team
   tab instead answered a question they had not asked, and none of those
   fields were reachable at all. */
async function openTeamTaskSheet(id){
  try{
    const task = await api(`/api/teams/tasks/${id}`);
    state.form = {
      id: task.id, title: task.title, description: task.description || "",
      deadline: task.deadline, due_time: task.due_time,
      remind_before: task.remind_before, recurrence: task.recurrence || "",
      priority: task.priority, project_id: task.project_id,
      when: task.deadline ? "pick" : "none", open:false,
      source: "team", team_id: task.team_id,
      completion: task.completion || "all", assignees: task.assignees || [],
      members: task.members || [],
      timer_minutes: task.timer_minutes, timer_mode: task.timer_mode,
    };
    openSheet(taskSheet(task));
  }catch(e){ handleError(e); }
}

function openTaskSheet(id){
  const pools = [state.tasks?.overdue, state.tasks?.upcoming, state.tasks?.undated,
                 state.tasks?.later, state.project?.tasks, state.home?.top3,
                 ...(state.home?.tasks_today || []).map(g => g.tasks)];
  const task = pools.flat().filter(Boolean).find(x => String(x.id) === String(id));
  if(!task) return;
  state.form = {
    id: task.id, title: task.title, description: task.description || "",
    deadline: task.deadline, due_time: task.due_time,
    remind_before: task.remind_before, recurrence: task.recurrence || "",
    priority: task.priority, project_id: task.project_id,
    when: task.deadline ? "pick" : "none", open:false,
    timer_minutes: task.timer_minutes, timer_mode: task.timer_mode,
  };
  openSheet(taskSheet(task));
}

async function settingSave(patch){
  try{
    await api("/api/settings", {method:"POST", body:patch});
    const me = await api("/api/me");
    state.lang = me.language;
    setState({me});
    reopenSettings();
    toast(t("saved"));
    await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

async function prefSave(patch, redraw = true){
  try{
    const r = await api("/api/prefs", {method:"POST", body:patch});
    state.me = {...state.me, prefs:r.prefs};
    /* A switch has to be redrawn, because the switch itself is the only thing
       showing its new state. A time field and the timezone select are already
       showing exactly what the user picked — and rebuilding the sheet under an
       open picker closes it, which on iOS meant a value could be set once and
       never adjusted. */
    if(redraw){ render(); reopenSettings(); }
    toast(t("saved"));
    // A timezone change moves what "today" means, so the screen is refetched.
    if(patch.timezone) await loadScreen(state.screen);
  }catch(e){ handleError(e); }
}

/* The grid now lives in a sheet, and `setState` only repaints `#app` — so the
   new month is written back into the sheet directly. */
async function shiftMonth(delta){
  const c = state.calendar;
  if(!c) return;
  let year = c.year, month = c.month + delta;
  if(month < 1){ month = 12; year--; }
  if(month > 12){ month = 1; year++; }
  try{ state.calendar = await api(`/api/calendar?year=${year}&month=${month}`); }
  catch(e){ return handleError(e); }
  if(sheetOpen()) openSheet(calendarSheet()); else render();
}

/* ---------- habit reordering ----------
   The list is written back whole, so the server stores an order the user
   can see rather than a diff it has to reconstruct. The local list moves
   first so the row does not visibly snap back while the request is in
   flight; a failed save reloads the truth. */
async function saveOrder(ids){
  const previous = state.habits;
  try{
    const body = await api("/api/habits/reorder",
      {method:"PATCH", body:{habit_ids:ids}});
    const grouped = {};
    (state.habits?.categories || []).forEach(c => grouped[c] = []);
    body.habits.forEach(x => (grouped[x.category] = grouped[x.category] || []).push(x));
    setState({habits:{...state.habits, habits: body.habits, grouped}});
  }catch(e){
    setState({habits: previous});
    handleError(e);
  }
}

function moveHabit(index, delta){
  const items = state.habits?.habits || [];
  const target = index + delta;
  if(index < 0 || target < 0 || target >= items.length) return;
  haptic();
  const ids = items.map(x => x.id);
  [ids[index], ids[target]] = [ids[target], ids[index]];
  saveOrder(ids);
}

/* Touch drag. Telegram's in-app browser does not fire HTML5 drag events
   on iOS, so the reorder is driven by pointer events, which work on both. */
let dragFrom = null;
const reorderRowAt = y =>
  document.elementFromPoint(window.innerWidth / 2, y)?.closest("[data-drag-id]");

document.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".handle");
  if(!handle) return;
  const row = handle.closest("[data-drag-id]");
  if(!row) return;
  dragFrom = Number(row.dataset.index);
  row.style.opacity = ".55";
  row.setPointerCapture?.(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if(dragFrom === null) return;
  e.preventDefault();
  document.querySelectorAll("[data-drag-id]")
    .forEach(x => x.style.borderColor = "");
  const over = reorderRowAt(e.clientY);
  if(over) over.style.borderColor = "var(--accent)";
}, {passive:false});
document.addEventListener("pointerup", e => {
  if(dragFrom === null) return;
  const over = reorderRowAt(e.clientY);
  const from = dragFrom;
  dragFrom = null;
  if(!over) return render();
  const to = Number(over.dataset.index);
  if(to === from) return render();
  const ids = (state.habits?.habits || []).map(x => x.id);
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  haptic("medium");
  saveOrder(ids);
});

/* A form control carries its action on `change`, never on `click`.

   This is the bug that made the report times and the timezone impossible to
   edit. Clicking an `<input type="time">` or a `<select>` is how its picker
   *opens*; the delegated click handler below matched the control, called
   `preventDefault()` — which stopped the picker from ever appearing — and
   then ran the save with the value that was already in the field. The screen
   answered "Saqlandi" every time and nothing ever changed, which is the worst
   shape a bug can take: it looks like it worked.

   The tag is the rule rather than a list of act names, so a control added
   later cannot bring the behaviour back by accident. */
const CHANGE_TAGS = new Set(["INPUT", "SELECT", "TEXTAREA"]);

/* One delegated listener: rebuilt HTML never loses its handlers because
   the handler lives on document, not on the nodes. */
const lastTap = new WeakMap();
//: The button that started the current action, so a save can show it working.
let pressedBtn = null;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  if(CHANGE_TAGS.has(el.tagName)) return;
  const action = A[el.dataset.act];
  if(!action) return;
  e.preventDefault();
  /* A second tap on the same button a moment later is a double tap, not a
     second intent — it must not write twice. Checkboxes are exempt: ticking
     and unticking quickly is a real thing to do. */
  const now = Date.now();
  if(el.tagName === "BUTTON" && now - (lastTap.get(el) || 0) < 700) return;
  lastTap.set(el, now);
  pressedBtn = el.tagName === "BUTTON" ? el : null;
  const out = action(el);
  // An async action shows its button as busy until it settles.
  if(el.tagName === "BUTTON" && out && typeof out.then === "function"){
    el.classList.add("busy"); el.setAttribute("aria-busy", "true");
    out.finally(() => { el.classList.remove("busy"); el.removeAttribute("aria-busy"); });
  }
});
/* Enter and Space act on anything focusable that has an action, so every
   box and row works from a keyboard as well as a finger (#20). */
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest?.("[data-act][tabindex]");
  if(!el || CHANGE_TAGS.has(el.tagName) || el.tagName === "BUTTON") return;
  e.preventDefault();
  A[el.dataset.act]?.(el);
});
// Search runs on Enter rather than per keystroke: one request per intent.
document.addEventListener("keydown", e => {
  const el = e.target.closest("[data-search]");
  if(el && e.key === "Enter"){ e.preventDefault(); A[el.dataset.search]?.(el); }
});
/* …and the other half of the same rule: every form control with an action
   runs it here, when the value has actually changed. */
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if(el && CHANGE_TAGS.has(el.tagName)) A[el.dataset.act]?.(el);
});
window.matchMedia("(prefers-color-scheme: light)")
  .addEventListener?.("change", () => render());
tg?.onEvent?.("themeChanged", () => render());
window.addEventListener("resize", syncShell);
tg?.onEvent?.("viewportChanged", syncShell);

/* ---------- boot ---------- */
async function boot(){
  try{ state.appearance = localStorage.getItem("ernestos-appearance") || "auto"; }
  catch(_){}
  try{
    const me = await api("/api/me");
    state.lang = me.language || "uz";
    if(!me.onboarded){
      // Setup is finished in the chat; say so rather than spin (409 before).
      setState({me, loading:false, needsSetup:true});
      return;
    }
    // The channel gate stops writes, not reading: a banner, not a wall (#15).
    state.readOnly = Boolean(me.gated);
    setState({me, loading:false, blocked:null, error:null, needsSetup:false});
    /* The destination picker appears on every add sheet, including the one
       behind the FAB on Home, so the team list has to be known before the
       first tap rather than after the Tasks screen has been visited. One
       small request, and a failure leaves the picker hidden rather than the
       app broken. */
    try{ state.teams = (await api("/api/teams")).teams
           .map(x => ({id:x.id, name:x.name})); }
    catch(_){ state.teams = []; }
    await loadScreen("home");
    if(Object.keys(loadDraft()).length) toast(t("draft_restored"));
  }catch(e){
    console.error("ErnestOS boot failed:", e);
    if(e.status === 403){ setState({loading:false}); await checkSubscription(true); return; }
    setState({loading:false,
      error: e.status ? t("error") : t("offline")});
  }
}
boot();
