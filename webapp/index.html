  ];
  const active = SERIES.filter(k => state.statsSeries[k.field]);
  h += `<div class="card">
      ${lineChart(st.series, active.length ? active : [SERIES[0]])}
      <div class="legend">${SERIES.map(k =>
        `<span class="${state.statsSeries[k.field] ? "" : "off"}"
          data-act="series-toggle" data-field="${k.field}">
          <i style="background:${k.color}"></i>${k.label}</span>`).join("")}</div>
    </div>`;

  /* The period's averages, on one divided line rather than as four more
     boxed cells. The four cells that used to sit here carried the *same*
     four deltas as the four at the top of the screen, so half of the block
     was a second printing of numbers already read. */
  h += `<h2>${t("average")}</h2>
    <div class="card"><div class="trio" style="grid-template-columns:repeat(5,1fr)">
      <div><div class="k">${t("overall")}</div>
        <div class="v num">${pct(st.averages.overall)}</div></div>
      <div><div class="k">${t("tasks")}</div>
        <div class="v num">${pct(st.averages.tasks)}</div></div>
      <div><div class="k">${t("habits")}</div>
        <div class="v num">${pct(st.averages.habits)}</div></div>
      <div><div class="k">${t("team")}</div>
        <div class="v num">${pct(st.averages.team)}</div></div>
      <div><div class="k">${t("prayer")}</div>
        <div class="v num">${pct(st.averages.prayer)}</div></div>
    </div></div>`;

  if(st.best_day){
    h += `<div class="card" style="margin-top:12px"><div class="row">
        <div class="grow"><div class="eyebrow">${t("best_day")}</div>
          <div style="font-weight:680;margin-top:2px">${isoToLabel(st.best_day.day)}</div>
        </div>
        <div class="num" style="font-size:20px;font-weight:740"
          >${st.best_day.overall}%</div></div></div>`;
  }

  /* Prayer is still five separate facts rather than one opaque score, but
     six more cells at the foot of a screen that already carries eleven
     numbers is where a page stops being read. It is one row that opens
     them. */
  h += `<div class="item pressable" style="margin-top:var(--s3)"
             data-act="prayer-detail">
      ${icon("moon", 17)}<div class="grow">${t("prayer_detail")}</div>
      ${icon("chevron", 15)}</div>`;

  // The shared record belongs on the statistics screen too: somebody
  // reviewing their month should not have to remember that half of it is
  // filed under another tab.
  h += teamStatsOnStats();

  h += `<div class="btns">
      <button class="btn secondary" data-act="stats-download">
        ${icon("download", 16)} ${t("download")}</button></div>`;
  return h;
};

/* Each team's week, on the statistics screen, as a compact row per member. */
function teamStatsOnStats(){
  const teams = state.team?.teams || [];
  if(!teams.length) return "";
  return teams.map(team => {
    const board = team.board || {};
    const periods = board.periods || {};
    if(!(periods.week || []).length) return "";
    // Names, not "you": this is about specific people side by side.
    const block = (key, label) => `<div class="t3 tiny" style="margin-top:8px">${label}</div>`
      + (periods[key] || []).map(r => {
        const pct = r.percent === null || r.percent === undefined ? 0 : r.percent;
        return `<div style="margin-top:4px">
            <div class="row" style="padding:0 0 3px">
              <div class="grow">${esc(r.name)}</div>
              ${teamDelta(r.delta)}
              <div style="width:48px;text-align:right"><b class="band-${bandOf(r.percent)}">${
                r.percent === null || r.percent === undefined ? "—" : r.percent + "%"}</b></div>
            </div>
            <div class="bar"><i class="band-${bandOf(r.percent)}" style="width:${pct}%"></i></div>
            <div class="muted sm">${r.done}/${r.total}</div>
          </div>`;
      }).join("");
    return sectionHead("tone-3", "users", esc(team.name),
      `<span class="act" data-act="team-open" data-id="${team.id}">${
        t("team_open")} ${icon("chevron", 13)}</span>`)
      + `<div class="card"><div class="muted sm">${teamUnits(board.units)}</div>
          ${block("day", t("team_p_day"))}${block("week", t("team_p_week"))}
          ${block("month", t("team_p_month"))}</div>`;
  }).join("");
}

function prayerDetailSheet(pd){
  const cellrow = (key, value) =>
    `<div class="metric"><div class="k">${t(key)}</div>
       <div class="v num">${value}</div></div>`;
  return `<h3>${icon("moon", 18)} ${t("prayer_detail")}</h3>
    <div class="metrics" style="margin-top:var(--s2)">
      ${cellrow("pr_full_days", `${pd.full_days} / ${pd.days}`)}
      ${cellrow("pr_on_time", pd.on_time_percent + "%")}
      ${cellrow("pr_jamaat", pd.jamaat)}
      ${cellrow("pr_qaza", pd.qaza)}
      ${cellrow("pr_missed", pd.missed)}
      ${cellrow("pr_consistency", pd.consistency + "%")}
    </div>
    <button class="btn secondary" data-act="close" style="margin-top:var(--s3)">
      ${t("close")}</button>`;
}

/* ==================================================================
   Sheets
   ================================================================== */

/* The task form. First view is one field and four chips, because that
   covers almost every task anyone ever writes. Dates, times, reminders,
   repeats, projects and descriptions exist, and they are one tap down
   rather than seven fields to scroll past.

   `state.form` holds the in-progress choices so a chip can re-render the
   sheet without losing what was typed. */
state.form = {};

/* Where a new item goes: your own list, or one of your teams.

   Rendered as chips rather than a dropdown because the choice is the point —
   a select hides the current value behind a tap, and "did that go to the
   shared list or mine?" is exactly the question this is meant to stop
   somebody asking afterwards. Hidden entirely when there is no team, so a
   solo user never sees a decision they do not have. */
/* Shared work, shown inside a personal screen.

   It appears here because a day's plan that leaves out half of what you owe
   is not a plan — but under its own heading, with the team's name on it, so
   it is never mistaken for your own list. The score beside it on the same
   screen is built from the personal list alone; that is the point of keeping
   these rows visually apart rather than interleaved. */
function teamBlock(rows, kind){
  if(!rows?.length) return "";
  const byTeam = {};
  for(const row of rows) (byTeam[row.team_name] ||= []).push(row);

  return Object.entries(byTeam).map(([name, items]) => `
    <div class="card">
      <div class="card-t">${icon("users", 14)} ${esc(name)}</div>
      ${items.map(x => `
        <div class="row">
          <div class="check ${x.done ? "on" : ""}" data-act="team-toggle"
               data-kind="${kind}" data-id="${x.id}"></div>
          <div class="grow">
            <div class="${x.done ? "done" : ""}">${esc(x.title || x.name)}</div>
            ${x.done_count > (x.done ? 1 : 0)
              ? `<div class="muted sm">✓ ${x.done_count}</div>` : ""}
          </div>
        </div>`).join("")}
    </div>`).join("");
}

function destPicker(){
  const teams = state.teams || state.team?.teams || [];
  if(!teams.length) return "";
  const current = state.dest || "personal";
  const chip = (value, label) => `<div class="chip sm ${current === value ? "on" : ""}"
      data-act="dest-pick" data-value="${value}">${label}</div>`;
  return `<label>${t("dest_where")}</label>
    <div class="chips">
      ${chip("personal", t("dest_personal"))}
      ${teams.map(x => chip("team:" + x.id, esc(x.name))).join("")}
    </div>`;
}

/* The chosen destination, as the two things every caller needs: whether it is
   a team, and which one. */
function destOf(){
  const value = state.dest || "personal";
  return value.startsWith("team:")
    ? {team: true, id: Number(value.slice(5))} : {team: false, id: null};
}

function taskSheet(task, presetProject){
  const editing = Boolean(task?.id);
  const f = state.form;
  /* A shared task files onto the team's shelves, never onto a private one —
     a project is a shelf inside one workspace, and offering somebody else's
     would produce a task nobody could find. */
  /* A new task headed for a team is a shared task from the first keystroke:
     it files onto the team's shelves and asks who does it. */
  const teamDest = !editing && destOf().team;
  const shared = f.source === "team" || task?.source === "team" || teamDest;
  const teamId = f.team_id || task?.team_id || (teamDest ? destOf().id : null);
  const projects = shared
    ? ((state.team?.teams || []).find(x => x.id === teamId)?.projects || [])
    : (state.projects || []);
  const options = projects.map(p =>
    `<option value="${p.id}" ${String(p.id) === String(f.project_id) ? "selected" : ""}
      >${esc(p.name)}</option>`).join("");

  /* "week" is seven days from today — the label says so and shows the date,
     so a Monday tap reads "next Monday", not "this week". */
  const chips = [["today", t("when_today")], ["tomorrow", t("when_tomorrow")],
                 ["week", `${t("when_week")} · ${isoToLabel(shiftISO(todayISO(), 7))}`],
                 ["none", t("when_none")]];

  return `
    <h3>${icon("list", 18)} ${editing ? t("edit") : t("add_task")}</h3>
    <input id="task-title" placeholder="${t("task_name")}"
           value="${esc(f.title || "")}" />

    ${editing ? taskOwnerPicker(f, task, shared)
      /* Added inside a project, the task goes where the project is — a
         team's project makes it a team task — so there is nothing to ask. */
      : presetProject ? "" : destPicker()}
    ${shared ? teamTaskOptions(f, task, teamId) : ""}

    <div class="chips" style="margin-top:10px">
      ${chips.map(([id, label]) => `<div class="chip sm
        ${f.when === id ? "on" : ""}" data-act="task-when"
        data-value="${id}">${label}</div>`).join("")}
      <div class="chip sm ${f.when === "pick" ? "on" : ""}"
           data-act="task-when" data-value="pick">
        ${icon("calendar", 14)} ${t("when_pick")}</div>
    </div>

    ${f.when === "pick" ? `<label>${t("deadline")}</label>
      ${dateField("task-deadline", f.deadline || "")}` : ""}

    <details ${f.open ? "open" : ""}>
      <summary>${icon("chevron", 15)}<span class="chev"></span>
        ${t("more_options")}${taskSettingsLine(f)}</summary>

      <label>🕐 ${t("due_time")} <span class="t3">(${t("optional")})</span></label>
      <input type="time" id="task-time" value="${f.due_time || ""}" />

      <label>🔔 ${t("reminder")}</label>
      <div class="chips">
        <div class="chip sm ${f.remind_before === null || f.remind_before === undefined ? "on" : ""}"
             data-act="task-remind" data-value="">${t("none_short")}</div>
        ${REMINDER_OFFSETS.map(m => `<div class="chip sm ${String(f.remind_before) === String(m) ? "on" : ""}"
             data-act="task-remind" data-value="${m}">${t("remind_s_" + m)}</div>`).join("")}
      </div>

      <label>🔁 ${t("repeat")}</label>
      <div class="chips">
        ${["", "daily", "weekdays", "weekly", "monthly", "after:7", "after:30"].map(r => `<div class="chip sm
             ${(f.recurrence || "") === r ? "on" : ""}" data-act="task-repeat"
             data-value="${r}">${r ? repeatLabel(r) : t("none_short")}</div>`).join("")}
      </div>

      <label>${t("priority")}</label>
      <div class="chips">${["high","medium","low"].map(p =>
        `<div class="chip sm ${(f.priority || "medium") === p ? "on" : ""}"
          data-act="task-priority" data-value="${p}">
          <span class="dot p-${p}"></span>${t(p)}</div>`).join("")}</div>

      <label>${t("project")}</label>
      <select id="task-project">
        <option value="">${t("standalone")}</option>${options}</select>

      ${editing ? timerSetting(shared ? "ttask" : "task", {...f, id: task.id})
                : timerPicker("task-timer", f.timer_minutes)}

      <label>${t("task_desc")}</label>
      <textarea id="task-desc">${esc(f.description || "")}</textarea>
    </details>

    <button class="btn" style="margin-top:16px"
      ${editing ? `data-act="task-update" data-id="${task.id}"`
                : `data-act="task-save"${presetProject ? ` data-project="${presetProject}"` : ""}`}
      >${t("save")}</button>
    ${editing && !shared && task.status !== "done" ? blockPicker(task) : ""}
    ${editing ? `<button class="btn danger" data-act="task-delete-go"
      data-id="${task.id}" style="margin-top:8px">
      ${icon("trash", 15)} ${t("delete")}</button>` : ""}
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`;
}

/* "after:7" is counted from the day it was finished, not from the calendar. */
function repeatLabel(r){
  if(String(r).startsWith("after:")) return t("repeat_after", {n: r.slice(6)});
  if(String(r).startsWith("days:")) return t("repeat_custom");
  return t("repeat_" + r);
}

/* A measured habit's goal, its unit and the minimal version for a hard day.
   On an existing habit each change saves at once. */
function qtyFields(h, live){
  const act = live ? `data-act="habit-qty-set" data-id="${h.id}"` : "";
  return `<label>${t("qty_label")}</label>
    <div class="row" style="gap:var(--s2)">
      <input id="hq-target" type="number" min="0" max="100000" inputmode="numeric" style="flex:1"
             value="${h.target_qty || ""}" placeholder="${t("qty_target_ph")}" ${act} />
      <input id="hq-unit" maxlength="16" style="flex:1" value="${esc(h.unit || "")}"
             placeholder="${t("qty_unit_ph")}" ${act} /></div>
    <input id="hq-min" type="number" min="0" max="100000" inputmode="numeric" style="margin-top:8px"
           value="${h.min_qty || ""}" placeholder="${t("qty_min_ph")}" ${act} />`;
}
function readQty(){
  const target = Math.round(Number(val("hq-target")) || 0);
  const min = Math.round(Number(val("hq-min")) || 0);
  return {target_qty: target, min_qty: target && min && min < target ? min : null,
          unit: target ? val("hq-unit").trim() : null};
}

/* How much of a measured habit was done today (audit #6). */
function habitQtySheet(h){
  const steps = [1, 5, 10].filter(n => n < h.target_qty);
  return `<h3>${esc(h.name)}</h3>
    <div class="hint">${t("qty_goal", {n: h.target_qty, u: esc(h.unit || "")})}${h.min_qty
      ? " · " + t("qty_min_is", {n: h.min_qty}) : ""}</div>
    <input id="habit-qty" type="number" min="0" max="1000000" inputmode="numeric"
           value="${h.qty || ""}" placeholder="0" style="margin-top:10px" />
    <div class="chips" style="margin-top:8px">${steps.map(n =>
      `<div class="chip sm" data-act="habit-qty-add" data-n="${n}">+${n}</div>`).join("")}
      <div class="chip sm" data-act="habit-qty-add" data-n="${h.target_qty}" data-set="1">${t("qty_all")}</div></div>
    <button class="btn" data-act="habit-qty-save" data-id="${h.id}" style="margin-top:14px">${t("save")}</button>`;
}

/* Waiting on somebody else: the task stays, out of "Now" until the day to
   check again (audit #12). */
function blockPicker(task){
  if(task.blocked) return `<div class="card tight" style="margin-top:12px">
      <div class="small">⏳ ${t("block_" + task.blocked)}${task.blocked_until
        ? ` · ${t("block_until", {d: isoToLabel(task.blocked_until)})}` : ""}</div>
      <button class="btn sm secondary" data-act="task-unblock" data-id="${task.id}"
              style="margin-top:8px">${t("block_clear")}</button></div>`;
  const today = todayISO();
  return `<label>⏳ ${t("block_label")}</label>
    <div class="chips">
      <div class="chip sm" data-act="task-block" data-id="${task.id}" data-reason="reply"
           data-until="${shiftISO(today, 2)}">${t("block_reply")} · ${t("block_in", {n: 2})}</div>
      <div class="chip sm" data-act="task-block" data-id="${task.id}" data-reason="reply"
           data-until="${shiftISO(today, 7)}">${t("block_reply")} · ${t("block_in", {n: 7})}</div>
      <div class="chip sm" data-act="task-block" data-id="${task.id}" data-reason="depends"
           data-until="${shiftISO(today, 3)}">${t("block_depends")} · ${t("block_in", {n: 3})}</div>
    </div>`;
}

/* Who does a shared task: everybody, any one of you, or the named people (#24). */
function teamTaskOptions(f, task, teamId){
  if(!teamId) return "";
  const members = f.members || task?.members
    || (state.team?.teams || []).find(x => x.id === teamId)?.members || [];
  const policy = f.completion || task?.completion || "all";
  const chosen = new Set((f.assignees ?? task?.assignees ?? []).map(Number));
  return `<label>${t("who_does")}</label>
    <div class="chips">${["all", "any", "assignees"].map(p => `<div class="chip sm ${
      policy === p ? "on" : ""}" data-act="task-completion" data-value="${p}" role="radio"
      tabindex="0" aria-checked="${policy === p}">${t("completion_" + p)}</div>`).join("")}</div>
    ${policy === "assignees" ? `<div class="chips" style="margin-top:6px">${members.map(m => `
      <div class="chip sm ${chosen.has(m.user_id) ? "on" : ""}" data-act="task-assignee"
           data-id="${m.user_id}" role="checkbox" tabindex="0"
           aria-checked="${chosen.has(m.user_id)}">${esc(m.name)}</div>`).join("")}</div>` : ""}`;
}

/* What is already set, readable without opening the section:
   "· 🕐 10:00 · 🔔 30 daq · 🔁 Har kuni". */
function taskSettingsLine(f){
  const bits = [];
  if(f.due_time) bits.push("🕐 " + f.due_time);
  if(f.remind_before !== null && f.remind_before !== undefined && f.remind_before !== "")
    bits.push("🔔 " + t("remind_s_" + f.remind_before));
  if(f.recurrence) bits.push("🔁 " + repeatLabel(f.recurrence));
  if(f.priority === "high") bits.push("🔴 " + t("high"));
  return bits.length ? `<span class="t3 small sumline">${bits.join(" · ")}</span>` : "";
}

/* An existing deadline shown as the chip it matches: today's task opens on
   "Bugun", not on a date picker. */
function whenOf(deadline){
  if(!deadline) return "none";
  const today = todayISO();
  return deadline === today ? "today" : deadline === shiftISO(today, 1) ? "tomorrow" : "pick";
}

function rerenderTaskSheet(){
  const f = state.form;
  openSheet(taskSheet(f.id ? {id: f.id, source: f.source, team_id: f.team_id} : null,
                      f.project_id));
}

/* Reads the sheet's current inputs into state.form, so re-rendering for
   a chip tap never loses typed text. */
function readTaskForm(){
  const f = state.form;
  const get = id => document.getElementById(id);
  if(get("task-title")) f.title = get("task-title").value;
  if(get("task-deadline")) f.deadline = get("task-deadline").value || null;
  if(get("task-time")) f.due_time = get("task-time").value || null;
  if(get("task-desc")) f.description = get("task-desc").value;
  if(get("task-project")) f.project_id = get("task-project").value || null;
  if(get("task-timer")) f.timer_minutes = pickedTimer("task-timer");
  const details = document.querySelector(".sheet details");
  if(details) f.open = details.open;
  return f;
}

/* Turns the chip choice into an actual date. `pick` keeps whatever the
   date input holds. */
function formDeadline(){
  const f = state.form;
  const today = todayISO();
  if(f.when === "today") return today;
  if(f.when === "tomorrow") return shiftISO(today, 1);
  if(f.when === "week") return shiftISO(today, 7);
  if(f.when === "none") return null;
  if(f.when === "pick") return f.deadline || null;
  return f.deadline ?? null;
}

/* Move a task between your own list and a team's, from the task itself.

   Changing your mind about where something belongs is ordinary — "finish the
   maths" starts private and becomes something the two of you are doing.
   Recreating it by hand loses the deadline, the reminder and the repeat, so
   nobody does it and the task sits in the wrong place instead. */
/* Move a whole shelf, and everything on it, between private and shared.
   The tasks travel with it: a project that arrived somewhere empty would be
   a folder rather than a move. */
function projectOwnerPicker(p){
  const teams = state.teams || [];
  if(!teams.length || !p?.id) return "";
  const shared = p.source === "team" || Boolean(p.team_id);
  const current = shared ? "team:" + p.team_id : "personal";
  const chip = (value, label) => `<div class="chip sm ${current === value ? "on" : ""}"
      data-act="project-move" data-id="${p.id}"
      data-from="${shared ? "team" : "personal"}"
      data-value="${value}">${label}</div>`;
  return `<label>${t("dest_where")}</label>
    <div class="chips">
      ${chip("personal", t("src_personal"))}
      ${teams.map(x => chip("team:" + x.id, esc(x.name))).join("")}
    </div>`;
}

function taskOwnerPicker(f, task, shared){
  const teams = state.teams || [];
  if(!teams.length) return "";
  const id = f.id || task?.id;
  const current = shared ? "team:" + (f.team_id || task?.team_id) : "personal";
  const chip = (value, label) => `<div class="chip sm ${current === value ? "on" : ""}"
      data-act="task-move" data-id="${id}"
      data-from="${shared ? "team" : "personal"}"
      data-value="${value}">${label}</div>`;
  return `<label>${t("dest_where")}</label>
    <div class="chips">
      ${chip("personal", t("src_personal"))}
      ${teams.map(x => chip("team:" + x.id, esc(x.name))).join("")}
    </div>`;
}

function taskBody(){
  const f = readTaskForm();
  const timer = document.getElementById("task-timer")
    ? {timer_minutes: pickedTimer("task-timer")} : {};
  return {
    ...timer,
    title: (f.title || "").trim(),
    description: f.description || "",
    deadline: formDeadline(),
    due_time: f.due_time || null,
    remind_before: f.remind_before ?? null,
    recurrence: f.recurrence || "",
    priority: f.priority || "medium",
    project_id: f.project_id ? Number(f.project_id) : null,
  };
}

/* ---------- habit sheet ----------
   Name, tier, which days, reminder, and the habit's own history. Pause
   sits next to delete and reads as the softer option, because for a
   holiday or an injury it is the right one and deleting throws away
   every log. */
function habitSheet(h){
  state.habitSheet = h;
  const team = h.source === "team";
  /* What may be changed here. Every personal habit — the three rituals too —
     can be renamed, re-tiered, given a reminder, paused and removed; a ritual
     only keeps its daily schedule and its automatic box. A shared habit is
     changed by its creator, an admin or the owner, and a mirrored one is read
     from each member's own habit. */
  const locked = team ? (h.mirrored || h.can_manage === false) : false;
  const days = h.days || [0,1,2,3,4,5,6];
  const custom = h.schedule !== "daily" && h.schedule !== "weekdays";
  const grid = h.grid || [];

  return `
    <h3>${icon("check", 18)} ${t("edit_habit")}</h3>
    ${locked
      ? `<div class="hint"><b>${esc(h.name)}</b> — ${t(h.mirrored ? "habit_mirrored"
          : team ? "forbidden" : "auto_habit")}</div>`
      : `<input id="habit-name" value="${esc(h.name)}" data-act="habit-name-set" data-id="${h.id}"
           enterkeyhint="done" />
         <div class="t3 tiny" style="margin-top:6px">✓ ${t("autosave_hint")}</div>`}

    ${locked ? "" : `<label>${t("habit_tier")}</label>
      <div class="chips">${["non_negotiable","target","bonus"].map(c =>
        `<div class="chip sm ${h.category === c ? "on" : ""}"
          data-act="habit-cat" data-id="${h.id}" data-value="${c}">${t(c)}</div>`).join("")}
      </div>`}

    ${/* The three defaults — Get up, 5x namoz, Kundalik — are every day, by
          definition: they are the floor the whole system is measured against,
          and "5x namoz on Mondays and Thursdays" is not a thing this product
          has an opinion about. Offering a day picker for them asked a question
          with only one right answer, and any other answer quietly punched a
          hole in the score. They say "every day" instead. */
      h.protected || locked
      ? `<label>${t("schedule")}</label>
         <div class="t2 small">${team ? scheduleLabel(h)
           : `${t("every_day")} · ${t("habit_always_daily")}`}</div>`
      : `<label>${t("schedule")}</label>
    <div class="chips">
      <div class="chip sm ${h.schedule === "daily" ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="daily">${t("every_day")}</div>
      <div class="chip sm ${h.schedule === "weekdays" ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="weekdays">${t("weekdays_only")}</div>
      <div class="chip sm ${custom ? "on" : ""}"
           data-act="habit-sched" data-id="${h.id}" data-value="custom">${t("pick_days")}</div>
    </div>
    ${custom ? `<div class="chips" style="margin-top:8px">
      ${D().dow.map((label, i) => `<div class="chip sm
        ${days.includes(i) ? "on" : ""}" data-act="habit-day"
        data-id="${h.id}" data-day="${i}">${label}</div>`).join("")}</div>` : ""}`}

    ${h.system_key === "wakeup" ? `<label>⏰ ${t("wake_at")}</label>
      <input type="time" id="habit-target" value="${h.target_time || "05:00"}"
             data-act="habit-target-set" data-id="${h.id}" />` : ""}

    ${team && locked ? "" : `<label>🔔 ${t("reminder")}</label>
    <div class="chips">
      <div class="chip sm ${h.remind_at ? "" : "on"}" data-act="habit-remind-pick" data-id="${h.id}"
           data-value="">${t("remind_none")}</div>
      ${["07:00", "12:00", "21:00"].map(v => `<div class="chip sm ${h.remind_at === v ? "on" : ""}"
           data-act="habit-remind-pick" data-id="${h.id}" data-value="${v}">${v}</div>`).join("")}
    </div>
    <input type="time" id="habit-remind" value="${h.remind_at || ""}" style="margin-top:8px"
           aria-label="${t("reminder")}" data-act="habit-remind-set" data-id="${h.id}" />
    ${h.remind_at ? reminderSwitchNote() : ""}`}

    ${locked || h.protected ? "" : timerSetting(team ? "thabit" : "habit", h)}
    ${team || h.protected ? "" : qtyFields(h, true)}

    ${ritualSharePicker(h)}

    <label>${t("history")}</label>
    <div class="hstat">
      <div><b class="num">${icon("flame", 15)} ${h.streak}</b><span>${t("streak")}</span></div>
      <div><b class="num">${h.percent}%</b><span>${t("completion")}</span></div>
      <div><b class="num">${h.last7_done}/${h.last7_due}</b><span>${t("last7")}</span></div>
      <div><b class="num">${h.last30_done}/${h.last30_due}</b><span>${t("last30")}</span></div>
    </div>
    <div class="hgrid" style="margin-top:10px">${grid.map(g =>
      `<i class="${g.done ? "done" : g.due ? "due" : ""}" title="${g.day}"></i>`).join("")}</div>

    ${partnerRecords(h)}
    ${ownerPicker(h)}

    <button class="btn" data-act="habit-done" data-id="${h.id}" style="margin-top:16px">✓ ${t("done_btn")}</button>
    ${locked ? "" : `
      <div class="btns">
        <button class="btn secondary" data-act="habit-pause" data-id="${h.id}"
                data-value="${h.paused || h.pause_from ? 0 : 1}">
          ${h.paused || h.pause_from ? icon("play", 15) + " " + t("resume")
                     : icon("pause", 15) + " " + t("pause")}</button>
        <button class="btn danger"
              data-act="${h.source === "team" ? "team-habit-delete" : "habit-delete-confirm"}"
              data-id="${h.id}" data-name="${esc(h.name)}">${icon("trash", 15)} ${t("delete")}</button>
      </div>`}`;
}

/* How everybody else in the team is getting on with this habit.

   The reason to keep a habit with somebody is to see how they are doing with
   it; a shared habit that showed only your own grid would be a private habit
   wearing a label. Shown as the same three numbers the reader sees about
   themselves, so the two are comparable at a glance rather than by arithmetic. */
function partnerRecords(h){
  const others = (h.members || []).filter(m => !m.is_you);
  if(!others.length) return "";
  return `<label>${icon("users", 14)} ${esc(h.team_name || "")}</label>
    ${others.map(m => `
      <div class="row">
        <div class="grow"><b>${esc(m.name)}</b>
          <div class="muted sm">${m.last30_done}/${m.last30_due} · ${m.percent}%
            ${m.streak ? ` · ${icon("flame", 13)} ${m.streak}` : ""}</div>
        </div>
        <div class="${m.done_today ? "check on" : "check"}"
             style="pointer-events:none">${m.done_today ? icon("check", 14) : ""}</div>
      </div>`).join("")}`;
}

/* The ready-made ten: the three rituals and seven ordinary habits most
   people keep. ✓ on your list, + not yet; a tap flips it. Taking one off
   archives it with its history, and putting it back brings that history
   back — so this list is also how a removed ritual returns. */
function presetsSheet(list){
  const TIER = {non_negotiable:"t1", target:"t2", bonus:"t3"};
  const body = !list ? `<div class="spin"></div>` : list.map(p => `
    <div class="item preset">
      <span class="hrow-tier ${TIER[p.category] || "t2"}"></span>
      <div class="grow"><div class="ellipsis">${esc(p.name)}</div>
        <div class="ptier">${t(p.category)}${p.system ? " · " + t("auto_short") : ""}</div></div>
      <button class="btn sm ${p.added ? "secondary" : ""}" data-act="preset-toggle"
              data-key="${esc(p.key)}" data-on="${p.added ? 0 : 1}"
              style="min-width:112px">
        ${p.added ? `${icon("x", 15)} ${t("preset_remove")}`
                  : `${icon("plus", 15)} ${t("preset_add")}`}</button>
    </div>`).join("");
  const added = (list || []).filter(p => p.added).length;
  return `<h3>${icon("tiles", 18)} ${t("presets")}</h3>
    <div class="hint">${t("presets_hint")}${list ? ` · ${added}/${list.length}` : ""}</div>
    <div style="margin-top:var(--s2)">${body}</div>
    <button class="btn secondary" data-act="close" style="margin-top:12px">${t("close")}</button>`;
}

/* Get up, prayer and the journal: personal, and — per team — shown there too.

   A ritual is each person's own and is recorded once, in their own list, so
   it is not moved into a team the way an ordinary habit is. Switching a team
   on puts a mirrored row there: every member's tick is read from their own
   ritual, the team sees who has done it, and nothing is counted twice. */
function ritualSharePicker(h){
  const teams = state.teams || [];
  if(h.source === "team" || !h.system_key || !teams.length) return "";
  const shared = (state.habits?.shared_rituals || {})[h.system_key] || [];
  return `<label>${t("ritual_where")}</label>
    <div class="chips">
      <div class="chip sm on" aria-disabled="true">${icon("user", 14)} ${t("src_personal")}</div>
      ${teams.map(x => `<div class="chip sm ${shared.includes(x.id) ? "on" : ""}"
          data-act="ritual-share" data-key="${esc(h.system_key)}" data-team="${x.id}"
          data-on="${shared.includes(x.id) ? 0 : 1}" role="switch" tabindex="0"
          aria-checked="${shared.includes(x.id)}">${icon("users", 14)} ${esc(x.name)}</div>`)
        .join("")}
    </div>
    <div class="t3 tiny" style="margin-top:6px">${t("ritual_share_hint")}</div>`;
}

/* Move a habit between your own list and a team's.

   Shown on every editable habit, because "where does this live" is a setting
   like any other and burying it would mean recreating the habit by hand to
   change it — which loses the streak, which is usually the whole reason it is
   worth sharing. The logs travel with it. */
function ownerPicker(h){
  const teams = state.teams || [];
  if(h.protected || !teams.length) return "";
  const current = h.source === "team" ? "team:" + h.team_id : "personal";
  const chip = (value, label) => `<div class="chip sm ${current === value ? "on" : ""}"
      data-act="habit-move" data-id="${h.id}"
      data-from="${h.source === "team" ? "team" : "personal"}"
      data-value="${value}">${label}</div>`;
  return `<label>${t("dest_where")}</label>
    <div class="chips">
      ${chip("personal", t("src_personal"))}
      ${teams.map(x => chip("team:" + x.id, esc(x.name))).join("")}
    </div>`;
}

/* ---------- mission sheet ----------
   A title and how much it matters. Adding a deadline, a description or
   sub-goals here is how a weekly focus turns back into a project. */
function missionSheet(mission, slot){
  const priority = mission?.priority || "medium";
  const editing = Boolean(mission?.id);
  const done = mission?.done === "1" || mission?.done === true;
  return `
    <h3>${icon("target", 18)} ${editing ? t("mission")
      : slot === "supporting" ? t("add_supporting") : t("add_mission")}</h3>
    <input id="focus-title" placeholder="${t("mission")}"
           value="${esc(mission?.title || "")}" />
    <label>${t("priority")}</label>
    <div class="chips">${["high","medium","low"].map(p =>
      `<div class="chip sm ${priority === p ? "on" : ""}" data-act="focus-pri"
        data-value="${p}">${t(p)}</div>`).join("")}</div>
    <input type="hidden" id="focus-priority" value="${priority}" />
    <button class="btn" style="margin-top:16px"
      ${editing ? `data-act="focus-update" data-id="${mission.id}"`
                : `data-act="focus-save"`}>${t("save")}</button>
    ${editing ? `
      <button class="btn secondary" data-act="focus-carry" data-id="${mission.id}"
              style="margin-top:8px">${t("mission_carry")}</button>
      <button class="btn danger" data-act="focus-delete" data-id="${mission.id}"
              style="margin-top:8px">${icon("trash", 15)} ${t("delete")}</button>` : ""}
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("cancel")}</button>`;
}

/* ---------- top-3 picker ----------
   Chooses from the tasks that already exist rather than creating a
   parallel list. Picking one also dates it for today, which is what the
   user meant. */
function pickTaskSheet(){
  const d = state.tasks;
  const current = (state.home?.top3 || [])[0];
  const pool = d
    ? [...d.overdue, ...d.upcoming, ...d.undated, ...(d.later || [])]
        .filter(x => x.status !== "done").slice(0, 40)
    : [];

  return `<h3>${icon("target", 18)} ${t("pick_task")}</h3>
    ${current ? `<button class="btn secondary" data-act="mission-clear"
      data-id="${current.id}" style="margin-top:var(--s2)">
      ${icon("x", 15)} ${t("mission_change")}</button>` : ""}
    <div class="stack" style="margin-top:var(--s2)">
    ${pool.length ? pool.map(x => `
      <div class="item pressable" data-act="mission-set" data-id="${x.id}">
        <div class="grow"><div class="ellipsis">${esc(x.title)}</div>
          <div class="meta">${x.deadline ? isoToLabel(x.deadline) : t("no_date")}
            ${x.project ? `· ${esc(x.project)}` : ""}</div></div>
        ${current && current.id === x.id ? icon("check", 16) : icon("chevron", 15)}
      </div>`).join("")
      : `<div class="empty">${t("no_tasks_yet")}
          <button class="btn secondary sm" data-act="task-add">
            ${icon("plus", 16)} ${t("add_first_task")}</button></div>`}
    </div>
    <button class="btn secondary" data-act="close" style="margin-top:var(--s3)">
      ${t("close")}</button>`;
}

/* ---------- overall explanation ----------
   The formula, spelled out, with the same numbers that produced it. A
   score the user cannot check is a score they stop believing. */
/* The arithmetic behind the headline, from the same payload that produced it.

   The weight column is the one that has to be shown: a number built from four
   unequal parts is not checkable without it, and the weight a part *actually*
   carried today is not the weight on the tin — a user with no prayer module
   sees 47/29/24, because the missing 15 was split across the rest in
   proportion. Printing the nominal figures to that user would be a lie about
   their own score. */
function overallSheet(x){
  const weights = x.weights || {};
  const nominal = x.nominal_weights || {};
  const shifted = x.counted.length < Object.keys(nominal).length;

  return `<h3>${icon("info", 18)} ${t("how_calculated")}</h3>
    <div class="hint">${t("overall_rule")}<br>${t("overall_absent")}</div>
    <div class="tinted block tone-2" style="margin-top:var(--s2)">
      <div class="bh">
        <span class="itile lg">${icon("chart", 18)}</span>
        <div class="grow"><div class="bt">${t("overall")}</div>
          <div class="t2 tiny">${t("weighted_note")}</div></div>
        <div class="num" style="font-size:24px;font-weight:750">${x.value}%</div>
      </div>
    </div>
    ${x.parts.map(p => {
      const absent = p.percent === null;
      const share = weights[p.key];
      return `<div class="item" style="min-height:48px">
        <span class="itile ${COMPONENT_TONE[p.key] || "tone-1"}"
              >${icon(COMPONENT_ICON[p.key] || "list", 16)}</span>
        <div class="grow"><div>${t(p.key)}</div>
          <div class="meta">${absent ? t("not_counted") : `${p.done} / ${p.total}`}
            ${share !== undefined ? `· ${t("weight")} ${share}%` : ""}</div></div>
        <div class="num ${absent ? "t3" : ""}"
             style="font-weight:640">${pct(p.percent)}</div>
      </div>`;
    }).join("")}
    ${shifted ? `<div class="t3 tiny" style="margin-top:var(--s2)">
      ${t("weight_shift")}</div>` : ""}
    <div class="t3 tiny" style="margin-top:var(--s1)">
      ${t("priority_note")}</div>
    <button class="btn secondary" data-act="close" style="margin-top:14px">
      ${t("close")}</button>`;
}

/* One hue and one glyph per component, everywhere in the app: the tile on
   Home, the block on Statistics and the row in this sheet are the same three
   — now four — things, and they teach one vocabulary by never changing. */
const COMPONENT_TONE = {tasks:"tone-1", habits:"tone-5", team:"tone-3",
                        prayer:"tone-2"};
/* The nominal weights, for display on Statistics only. The score itself is
   computed on the server — there is no second copy of the formula here. */
const WEIGHTS = {tasks:40, habits:25, team:20, prayer:15};
const COMPONENT_ICON = {tasks:"list", habits:"check", team:"users",
                        prayer:"moon"};

/* ---------- day detail ----------
   Every row here opens the actual thing. A calendar full of text that
   cannot be tapped is a calendar nobody taps. */
function daySheet(iso, events){
  const kind = {task:icon("list", 15), project:icon("target", 15), birthday:"🎂"};
  /* A day that is over is a record, not a plan: it shows what was done on it
     and offers nothing to add. Planning — a new task on that date — is for
     today and the days ahead. */
  const past = iso < (state.calendar?.today || todayISO());
  const shown = events;
  const add = past ? "" : `<button class="btn" data-act="task-add-on" data-date="${iso}"
            style="margin-top:12px">${icon("plus", 16)} ${t("add_task")}</button>`;
  return `<h3>${icon("calendar", 18)} ${isoToLabel(iso)}</h3>
    ${past ? `<div class="hint">${t("day_past_hint")}</div>` : ""}
    ${shown.length ? shown.map(e => `
      <div class="item" style="min-height:46px"
           data-act="event-open" data-kind="${e.kind}" data-id="${e.id}">
        <div>${e.status === "done" ? icon("check", 15) : kind[e.kind] || ""}</div>
        <div class="grow"><div class="ellipsis ${e.status === "done" && !past ? "strike" : ""}"
          >${esc(e.title)}</div>
          ${e.due_time ? `<div class="meta num">${e.due_time}</div>` : ""}
          ${e.turning ? `<div class="meta">${e.turning} ${t("turning")}</div>` : ""}
        </div>${icon("chevron", 15)}</div>`).join("")
      : `<div class="empty">${past ? t("day_past_empty") : t("day_free")}</div>`}
    ${add}
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("close")}</button>`;
}

/* ---------- birthdays ---------- */
function birthdaySheet(){
  const list = state.birthdays || [];
  return `<h3>🎂 ${t("birthdays")}</h3>
    ${list.length ? list.map(b => {
      const when = b.days_left === 0 ? t("bday_today")
        : b.days_left === 1 ? t("bday_tomorrow")
        : `${b.days_left} ${t("days")}`;
      return `<div class="item" style="min-height:46px">
          <div class="grow"><div class="ellipsis">${esc(b.person_name)}</div>
            <div class="meta">${when} · ${b.turning} ${t("turning")}
              ${b.note ? `· ${esc(b.note)}` : ""}</div></div>
          <button class="iconbtn sm plain" data-act="birthday-delete" data-id="${b.id}"
                  aria-label="${t("delete")}">${icon("trash", 15)}</button></div>`;
    }).join("") : `<div class="empty">${t("empty")}</div>`}
    <label>${t("person_name")}</label>
    <input id="bd-name" placeholder="${t("person_name")}" />
    <label>${t("birth_date")}</label>
    ${dateField("bd-date", "", [new Date(todayISO()).getFullYear() - 100, new Date(todayISO()).getFullYear()])}
    <label>${t("note")} <span class="t3">(${t("optional")})</span></label>
    <input id="bd-note" placeholder="${t("note")}" />
    <button class="btn" data-act="birthday-save" style="margin-top:14px">
      ${icon("plus", 16)} ${t("add")}</button>
    <button class="btn secondary" data-act="close" style="margin-top:8px">
      ${t("close")}</button>`;
}

/* ---------- fresh start ----------
   Says exactly what will happen, to how many tasks, and that nothing is
   deleted. A reset that does not explain itself is one users are right
   to be afraid of. */
function freshStartSheet(p){
  const modes = [["focus", t("fs_focus")], ["week", t("fs_week")], ["today", t("fs_today")],
                 ["undate", t("fs_undate")], ["archive", t("fs_archive")]];
  return `<h3>${icon("repeat", 18)} ${t("fresh_start")}</h3>
    <div class="hint"><b>${t("fresh_start_n", {n:p.overdue})}</b><br>
      ${t("fresh_start_body")}</div>
    ${p.overdue ? modes.map(([id, label]) => `
      <button class="btn ${id === "focus" ? "" : "secondary"}" data-act="fresh-preview" data-mode="${id}"
              style="margin-top:8px">${label}</button>`).join("")
      : `<div class="empty">${t("empty")}</div>`}
    <button class="btn secondary" data-act="close" style="margin-top:12px">
      ${t("cancel")}</button>`;
}

/* The result before it happens: how many land on each day and which ones
   are today's, then one button to do it (audit #15). */
function freshPreviewSheet(p, mode){
  state.freshPlan = {p, mode};
  const drop = state.freshDrop || (state.freshDrop = new Set());
  const plan = (p.plan || []).filter(x => !drop.has(x.id));
  /* "Still needed?" first: what is not needed goes to the archive and takes
     no day from what is (audit #15). */
  // Stays open once something is marked, so several can be marked in a row.
  const triage = mode === "archive" ? "" : `<details style="margin-top:8px" ${drop.size ? "open" : ""}>
      <summary>${t("fs_triage", {n: (p.plan || []).length})}</summary>
      ${(p.plan || []).map(x => `<div class="row small" style="gap:8px;margin-top:6px">
        <span class="grow ellipsis ${drop.has(x.id) ? "strike t3" : ""}">${esc(x.title)}</span>
        <div class="chip sm ${drop.has(x.id) ? "on" : ""}" data-act="fresh-drop" data-id="${x.id}">${t("fs_not_needed")}</div>
      </div>`).join("")}</details>`;
  const today = todayISO();
  const byDay = {};
  for(const x of plan) if(!x.archive) byDay[x.to || "none"] = (byDay[x.to || "none"] || 0) + 1;
  const days = Object.keys(byDay).sort().map(d => `<div class="row small">
      <span class="grow">${d === "none" ? t("when_none") : d === today ? t("today") : isoToLabel(d)}</span>
      <b class="num">${byDay[d]}</b></div>`).join("");
  const todays = plan.filter(x => x.to === today && !x.archive);
  return `<h3>${icon("repeat", 18)} ${t("fs_preview")}</h3>
    ${mode === "archive" ? `<div class="hint">${t("fs_archive_n", {n: plan.length})}</div>` : `

      `<div class="small">• ${esc(x.title)}</div>`).join("")}${todays.length > 5

/* ---------- settings ----------
   Every control writes the moment it is touched, so there is no Save
   button on any of these sheets. The toast is the confirmation.

   Three sheets behind a short list, not one scroll. It used to be a single
   sheet holding a language picker, a mode switch, five theme cards, a
   timezone select, four notification switches with two time fields, a
   profile block and five data rows — roughly forty controls in one column,
   where finding the timezone meant scrolling past every theme in the app.
   The split is by the question being asked: how it looks, when it speaks,
   and what it holds. */
function settingsSheet(){
  const me = state.me || {};
  /* An icon tile per row, in its own colour, the way a native settings list
     does it: the colour is what the eye returns to, and three grey chevrons
     in a column are three rows nobody can tell apart at a glance. */
  const row = (act, ic, tone, label, hint) => `
    <div class="item pressable" style="min-height:56px" data-act="${act}">
      <span class="itile ${tone}">${icon(ic, 17)}</span>
      <div class="grow"><div style="font-weight:550">${label}</div>
        <div class="t3 tiny">${hint}</div></div>
      ${icon("chevron", 15)}</div>`;
  const name = [me.first_name, me.last_name].filter(Boolean).join(" ") || "ErnestOS";

  /* Who is signed in, first: the picture (tap to change), the name, and the
     handle — so nobody has to guess which account this is. */
  const profile = `<div class="set-profile">
      <label class="avatar xl" aria-label="${t("avatar_change")}">
        ${avatarHtml(me.first_name)}<span class="avatar-edit">✏️</span>
        <input type="file" accept="image/*" data-act="avatar-pick" hidden /></label>
      <div class="grow" style="min-width:0">
        <div class="pname">${esc(name)}</div>
        <div class="t3 small">${me.username ? "@" + esc(me.username)
                                            : `${t("member")} #${me.member_no ?? "—"}`}</div>
        ${me.avatar_custom ? `<button class="btn text" data-act="avatar-remove"
            style="padding-left:0;min-height:32px;font-size:13px">${t("avatar_remove")}</button>` : ""}
      </div></div>`;

  /* The plan in one card; the plans themselves only behind its button. */
  const p = me.plan || {};
  const plan = p.enabled ? `<div class="card tight set-card">
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
        <span class="plan-pill">${icon("star", 13)} ${PLAN_NAME[p.tier] || "Free"}</span>
        <span class="t2 small">${p.tier === "free" ? t("plan_current") : esc(planLine())}</span></div>
      ${p.tier === "free" ? `<div class="t3 tiny" style="margin-top:4px">${t("plan_free_cta")}</div>` : ""}
      <button class="btn ${p.tier === "max" ? "secondary" : ""}" data-act="set-plan"
              style="margin-top:10px">${t(p.tier === "max" ? "plan_change" : "plan_upgrade")}</button>
    </div>` : "";

  /* Invite: the next step's bar right here, the full ladder one tap away. */
  const r = state.referral, steps = r?.steps || [];
  const q = r?.counts?.qualified ?? 0;
  const next = steps.find(x => !x.reached);
  const invite = steps.length ? `<div class="tinted block tone-2 pressable set-card" data-act="set-referral">
      <div class="bh"><div class="grow"><div class="bt">${t("ref_grow_title")}</div>
        <div class="t2 tiny">${next ? `${q} / ${next.target} → ${refReward(next)}` : t("ref_all_done")}</div></div>
        ${icon("chevron", 15)}</div>
      <div style="margin-top:8px">${bar(next ? Math.min(100, Math.round(q / next.target * 100)) : 100)}</div>
    </div>` : row("set-referral", "gift", "tone-2", t("ref_title"), t("ref_hint"));

  return `
    ${sheetHead(`${icon("settings", 18)} ${t("settings")}`)}
    ${profile}
    ${plan}
    ${invite}

    <label>${t("set_app")}</label>
    ${row("set-look", "sun", "tone-4", t("appearance"), t("appearance_hint"))}
    ${row("set-notify", "bell", "tone-1", t("notifications"), t("notify_hint"))}
    ${row("set-modules", "check", "tone-4", t("modules"), t("modules_hint"))}
    ${row("set-account", "user", "tone-3", t("account"), t("account_hint"))}
    ${row("quote", "edit", "tone-2", t("quote_add"),
          state.home?.quote ? `“${esc(state.home.quote)}”` : t("quote_ph"))}
    ${row("set-privacy", "shield", "tone-5", t("privacy_data"), t("privacy_hint"))}

    <button class="btn set-signout" data-act="sign-out">${t("sign_out")}</button>
    ${IS_APP ? "" : `<div class="t3 tiny" style="text-align:center;margin-top:6px">${t("sign_out_tg_hint")}</div>`}
    <button class="set-delete" data-act="delete-account">${t("delete_account_short")}</button>
    ${me.version ? `<div class="t3 tiny" style="text-align:center;margin-top:4px">
        ErnestOS v${esc(me.version)} · ${esc(me.build || "")}</div>` : ""}`;
}
const refReward = x => t("ref_months", {n:Math.max(1, Math.round(x.days / 30)), plan:PLAN_NAME[x.tier] || "Pro"});

/* Every zone the platform knows, not a shortlist of twelve.

   The server sends the common ones first and the rest of the IANA database
   after them, so the two are split into groups here rather than run together:
   a flat list of five hundred opens on Africa/Abidjan, and the person who
   needed Asia/Tashkent has to scroll past four continents to reach a zone that
   was one tap away before. The region prefix is dropped from the label inside
   each group — the group heading already says it — which is what keeps the
   city readable on a 375px phone.

   A stored zone the server no longer offers is still listed, selected, rather
   than silently reset to somebody else's city. */
function timezonePicker(zones, current){
  const common = zones.slice(0, TZ_COMMON_COUNT);
  const rest = zones.slice(TZ_COMMON_COUNT);
  const option = z =>
    `<option value="${esc(z)}" ${current === z ? "selected" : ""}>${esc(z)}</option>`;

  const byRegion = {};
  rest.forEach(z => {
    const region = z.includes("/") ? z.split("/")[0] : "UTC";
    (byRegion[region] = byRegion[region] || []).push(z);
  });

  return `<select id="tz-select" data-act="set-tz">
      ${zones.includes(current) ? ""
        : `<option value="${esc(current)}" selected>${esc(current)}</option>`}
      <optgroup label="${t("tz_common")}">${common.map(option).join("")}</optgroup>
      ${Object.keys(byRegion).sort().map(region => `
        <optgroup label="${esc(region.split("_").join(" "))}">
          ${byRegion[region].map(z => `<option value="${esc(z)}"
            ${current === z ? "selected" : ""}
            >${esc(z.split("/").slice(1).join(" / ").split("_").join(" "))}</option>`
          ).join("")}
        </optgroup>`).join("")}
    </select>`;
}

         data-act="delete-account">
      <span style="color:var(--danger)">${icon("trash", 17)}</span>

/* ---------- Privacy & Data ----------
   Everything about who owns what, in one place, instead of four rows buried
   under Account. It opens by saying the thing that is actually true and that
   the user is entitled to hold us to — the data is theirs — and then gives
   them the four buttons that make that sentence mean something: take a copy,
   read the policy, wipe the contents, or leave entirely.

   The two destructive rows are last, in red, and neither of them fires on one
   tap: erasing everything asks a second time, and deleting the account asks
   for a typed word. A second tap in the same place as the first is not a
   confirmation, it is the same gesture twice. */
/* ---------- personal progression ----------
   One card at the foot of Home, and a sheet behind it. Deliberately *below*
   the day's own numbers: today's work is what Home is for, and a level is a
   slow number that changes on the scale of weeks. Putting it at the top would
   make the first thing anybody sees each morning a score about the past.

   The card carries four things and no more — who you are becoming, how far to
   the next one, how today went, and where you stand. Everything else is one
   tap away.

   Referral status is *not* on this card, and that is the product rule rather
   than a layout choice: personal progression measures how somebody runs their
   own life, referral progression measures who they brought in, and a card that
   mixes them would suggest inviting people is a way to level up. It is not. */
/* ---------- Qadam: every good thing done is a step ----------
   Today's checkpoints, the all-time total and a five-level path. Numbers
   come from /api/progress/me (steps_snapshot); nothing is computed here. */
const STEP_ICON = {starter:"👟", builder:"⛰️", discipline:"⛺", steady:"🌲", master:"👑"};
const STEP_TODAY_ICON = {tasks:"✅", habits:"🔁", prayer:"🕌", journal:"📔", goal:"🎯"};
/* Qadam: one progress system, read in five seconds. The level and how far
   to the next one; streak, freeze days and rank on one line; today's five
   steps as rows that open where each is done; the path below. */
const STEP_GO = {tasks:["tasks"], habits:["habits", "habits"], prayer:["habits", "prayer"],
                 journal:["habits", "journal"], goal:["home"]};
SCREENS.steps = () => {
  const p = state.progress, st = p?.steps;
  if(!st) return `<div class="spin"></div>`;
  const lvl = st.levels[st.level - 1];
  const nextLvl = st.levels[st.level];
  const span = st.next ? st.next - lvl.min : 1;
  const pct = st.next ? Math.round(Math.min(1, (st.total - lvl.min) / span) * 100) : 100;
  const rank = p.rank || {};
  const streak = p.streak?.current ?? 0;
  const path = st.levels.map((l, i) => {
    const s_ = i + 1 < st.level ? "past" : i + 1 === st.level ? "now" : "lock";
    return `<div class="step-node ${s_}">
        <div class="dot">${STEP_ICON[l.key]}${s_ === "lock" ? '<span class="lk">🔒</span>' : ""}</div>
        <div class="nm">${t("step_lvl_" + l.key)}</div>
        <div class="rg">${l.max === null ? l.min + "+" : `${l.min}–${l.max}`}</div></div>`;
  }).join('<div class="step-line"></div>');
  const next = st.today.find(c => !c.ok && !c.empty);
  const counted = st.today_counted ?? st.today.length;
  return `<div class="qhero">
      <div class="qtop">
        <div class="badge">${STEP_ICON[lvl.key]}</div>
        <div class="grow">
          <div class="ln">${t("step_lvl_" + lvl.key)}</div>
          <div class="t2 small">${t("steps_level_n", {n: st.level})}</div>
        </div>
        <div class="qtotal"><div class="tv num">${st.total}</div><div class="t3 tiny">${t("steps_total")}</div></div>
      </div>
      <div class="sbar big"><i style="width:${pct}%"></i></div>
      <div class="t2 small">${nextLvl ? t("steps_to_next", {n: st.next - st.total, name: t("step_lvl_" + nextLvl.key)})
        : t("steps_max")}</div>
      <div class="qstats" data-act="progress-open" role="button" tabindex="0">
        <div><b class="num">📈 ${streak}</b><span>${t("streak_days")}</span></div>
        <div><b class="num">❄️ ${st.freeze || 0}</b><span>${t("steps_freeze_short")}</span></div>
        <div><b class="num">🏆 ${rank.eligible ? "#" + rank.global : "—"}</b><span>${rank.eligible
          ? t("rank_global") : t("steps_rank_in", {n: rank.days_remaining ?? 0})}</span></div>
      </div>
    </div>

    <div class="steps-sub row"><span class="grow">${t("steps_today")}</span>
      <span class="t2 small num">${st.today_done}/${counted}</span></div>
    <div class="card qlist">${st.today.map(c => {
      /* A full tick only for the whole plan; one of ten is "started". An
         empty goal row is an offer, not a miss. */
      const full = c.complete ?? c.ok;
      if(c.empty) return `<div class="qrow" data-act="steps-go" data-key="${c.key}" role="button" tabindex="0">
        <span class="ci">${STEP_TODAY_ICON[c.key] || "•"}</span>
        <div class="grow t2">${t("step_goal_add")}</div>${icon("plus", 14)}</div>`;
      const count = c.total ? (c.done > c.total ? `${c.done}` : `${c.done}/${c.total}`) : `${c.done}`;
      return `<div class="qrow ${full ? "ok" : ""}"
        data-act="steps-go" data-key="${c.key}" role="button" tabindex="0">
        <span class="ci">${STEP_TODAY_ICON[c.key] || "•"}</span>
        <div class="grow">${t("step_" + c.key)}${c.ok && !full
          ? ` <span class="t3 tiny">· ${t("step_started")}</span>` : ""}</div>
        <span class="t2 small num">${count}</span>
        <span class="ck">${full ? icon("check", 14) : c.ok ? "·" : ""}</span></div>`;
    }).join("")}</div>
    ${next ? `<button class="btn steps-go" data-act="steps-go" data-key="${next.key}">
        ${t("steps_next")}: ${t("step_" + next.key)} →</button>`
      : `<div class="hint" style="text-align:center;margin-top:12px">${t("steps_all_done")}</div>`}

    <div class="steps-sub">${t("steps_path")}</div>
    <div class="card"><div class="steps-path">${path}</div></div>
    <div class="item pressable" style="margin-top:var(--s2)" data-act="progress-open">
      <span style="font-size:18px">🏅</span><div class="grow">${t("steps_more")}</div>${icon("chevron", 15)}</div>
    <div class="t3 tiny" style="text-align:center;margin-top:12px">${t("steps_motto")}</div>`;
};

/* The detail, in a sheet rather than a fifth tab. The bottom navigation is
   four items and has been since the app was designed around them; a
   progression screen is something people open occasionally, not one of the
   four places they live. */
function progressSheet(){
  const p = state.progress;
  if(!p) return `<div class="spin"></div>`;

  // One level system: Qadam. This sheet is the detail behind it — today's
  // score, consistency, rank and achievements — with no second level.
  const rank = p.rank, d = p.daily;
  const xp = n => String(n ?? 0).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

  let h = `<h3>🏅 ${t("steps_more")}</h3>`;

  /* Today, with the same four components the overall score is built from and
     the same weights printed on them. Not a second formula — the API sends the
     stored breakdown, so this cannot drift from the number above it. */
  const LABEL = {tasks:"tasks", habits:"habits", team:"team", prayer:"prayer"};
  const rows = Object.entries(LABEL)
    .filter(([key]) => d.breakdown?.[key] !== null && d.breakdown?.[key] !== undefined)
    .map(([key, label]) => `
      <div class="row" style="gap:var(--s2);margin-top:var(--s1)">
        <div class="grow t2 small">${t(label)}</div>
        <span class="wt num">${Math.round((d.weights?.[key] || 0) * 100)}%</span>
        <div class="num" style="min-width:42px;text-align:right">
          ${d.breakdown[key]}</div>
      </div>`).join("");

  h += `<label>${t("today")}</label>
    <div class="card tight">
      <div class="row">
        <div class="grow" style="font-size:22px;font-weight:700">
          ${d.score} <span class="t3" style="font-size:15px">/ 100</span></div>
        <div class="num" style="font-size:17px;font-weight:650">
          ${d.grade} · ${t("grade_" + d.grade)}</div>
      </div>
      ${rows || `<div class="t3 tiny" style="margin-top:var(--s1)">
        ${t("nothing_measured_yet")}</div>`}
      ${!d.perfect_day && d.to_perfect > 0 && d.score > 0
        ? `<div class="t2 tiny" style="margin-top:var(--s2)">
             ${t("to_perfect_day", {n: d.to_perfect})}</div>` : ""}
      ${d.perfect_day ? `<div class="t2 tiny" style="margin-top:var(--s2)">
        ${icon("check", 14)} ${t("perfect_day")}</div>` : ""}
    </div>`;

  h += `<label>${t("consistency")}</label>
    <div class="metrics">
      <div class="metric"><div class="k">${t("streak_days")}</div>
        <div class="v num">📈 ${p.streak.current}</div></div>
      <div class="metric"><div class="k">${t("best")}</div>
        <div class="v num">${p.streak.best}</div></div>
      <div class="metric"><div class="k">${t("perfect_days")}</div>
        <div class="v num">${p.perfect_days}</div></div>
      <div class="metric wide"><div class="k">${t("recovery_days")}</div>
        <div class="v num">${p.streak.recovery_remaining} / 2</div></div>
    </div>
    <div class="t3 tiny" style="margin-top:var(--s1)">
      ${t("streak_days_hint", {n: p.streak.threshold})}. ${t("recovery_hint", {n: p.streak.threshold})}</div>`;

  h += `<label>${t("rank")}</label>`;
  if(!rank.eligible){
    /* Not "—". A locked rank with a countdown is information; a dash is a
       screen refusing to explain itself. */
    h += `<div class="card tight"><div class="t2 small">
        ${t("rank_locked", {n: rank.days_remaining})}</div></div>`;
  }else{
    const move = rank.movement;
    h += `<div class="metrics">
        <div class="metric"><div class="k">${t("rank_global")}</div>
          <div class="v num">#${rank.global}${
            move ? `<span class="delta ${move > 0 ? "up" : "down"}">${
              move > 0 ? "↑" : "↓"}${Math.abs(move)}</span>` : ""}</div></div>
        <div class="metric"><div class="k">${t("rank_weekly")}</div>
          <div class="v num">#${rank.weekly}</div></div>
        <div class="metric"><div class="k">${t("rank_best")}</div>
          <div class="v num">#${rank.best}</div></div>
        <div class="metric"><div class="k">${t("rank_users")}</div>
          <div class="v num">${xp(rank.users)}</div></div>
      </div>
      ${rank.top_percent !== null ? `<div class="t2 small"
        style="margin-top:var(--s1)">${t("top_percent_of",
          {p: rank.top_percent, n: xp(rank.users)})}</div>` : ""}
      <div class="t3 tiny" style="margin-top:var(--s1)">
        ${t("rank_privacy")}</div>`;
  }

  h += `<label>${t("achievements")}</label>`;
  const list = state.achievements;
  if(!list){
    h += `<div class="spin"></div>`;
  }else{
    h += list.map(a => `
      <div class="item ${a.unlocked ? "" : "off"}">
        <div class="check ${a.unlocked ? "on" : ""} lock">
          ${a.unlocked ? icon("check", 14) : ""}</div>
        <div class="grow">
          <div class="ellipsis">${t("ach_" + a.key)}</div>
          <div class="meta">${a.unlocked ? t("unlocked")
            : `${a.progress} / ${a.target}`}</div>
        </div>
      </div>`).join("");
  }

  h += `<button class="btn secondary" data-act="close"
          style="margin-top:var(--s3)">${t("close")}</button>`;
  return h;
}

/* ---------- referrals ----------
   One screen: how many friends genuinely arrived, how far to the next level,
   and two buttons. Counts only — the API deliberately never says *who* joined,
   so there is nothing here that could show one user another user's activity.

   `state.referral` is null until /api/referrals/me answers, so the sheet opens
   on a spinner rather than on an empty card that fills in and jumps. */
const REF_LEVELS = ["new", "inviter", "builder", "connector", "ambassador"];

function referralSheet(){
  const r = state.referral;
  if(!r) return `<h3>${icon("gift", 18)} ${t("ref_head")}</h3>
    <div class="spin"></div>`;

  if(!r.configured){
    return `<h3>${icon("gift", 18)} ${t("ref_head")}</h3>
      <div class="hint" style="margin-top:var(--s2)">${t("ref_not_configured")}</div>
      <button class="btn secondary" data-act="settings"
              style="margin-top:16px">${t("close")}</button>`;
  }

  const qualified = r.counts.qualified;
  const next = r.next_milestone;
  /* The bar tracks confirmed friends toward the next milestone — not clicks,
     not link opens. Anything else would be a number that moves without
     anything having happened. */
  const percent = next
    ? Math.min(100, Math.round(qualified / next.target * 100)) : 100;
  const levelName = t("ref_lvl_" + (REF_LEVELS.includes(r.level.key)
    ? r.level.key : "new"));

  /* The plan ladder: every step with its own bar, filling as friends arrive. */
  const steps = r.steps || [];
  const ladder = steps.length ? `<div class="card tight ref-steps">${steps.map(x => `
      <div class="ref-step ${x.reached ? "done" : ""}">
        <div class="row"><span>${t("ref_step_n", {n:x.target})} → <b>${refReward(x)}</b></span>
          <span class="t2">${x.granted ? t("ref_got") : `${x.have} / ${x.target}`}</span></div>
        ${bar(Math.round(x.have / x.target * 100))}</div>`).join("")}
      ${r.friend_days ? `<div class="t3 tiny">${t("ref_friend_gets", {n:r.friend_days})}</div>` : ""}
    </div>` : "";

  return `
    ${sheetHead(steps.length ? t("ref_grow_title") : t("ref_head"))}
    <div class="t2 small" style="margin-top:4px">${t("ref_body")}</div>
    ${ladder}

    ${steps.length ? "" : `<div class="tinted block tone-2" style="margin-top:var(--s3)">
      <div class="bh">
        <span class="itile lg">${icon("gift", 18)}</span>
        <div class="grow">
          <div class="bt">${esc(levelName)}</div>
          <div class="t2 tiny">${qualified} ${t("ref_qualified")}${
            r.counts.pending ? ` · ${r.counts.pending} ${t("ref_pending")}` : ""}</div>
        </div>
      </div>
      <div style="margin-top:var(--s2)">${bar(percent)}</div>
      <div class="t3 tiny" style="margin-top:6px">${
        next ? `${t("ref_next")}: ${qualified} / ${next.target}`
             : t("ref_max")}</div>
    </div>`}

    <div class="t3 tiny" style="margin-top:var(--s2)">${t("ref_rule")}</div>

    <button class="btn" data-act="ref-copy" style="margin-top:var(--s3)">
      ${t("ref_copy_big")}</button>
    <button class="btn secondary" data-act="ref-share" style="margin-top:8px">
      ${t("ref_share")}</button>`;
}

/* Five productivity screens, then Money on its own, after a hairline: what
   somebody spends is not part of how their day went, and nothing on the
   first five reads from it. */
/* Four places, one tap each. Kundalik holds Habits and Tasks, Profil holds
   Statistics, the team and settings; inside them a switch at the top moves
   between the two, and the bar below stays put — leaving is always one tap. */
const NAV = [
  {id:"home",    icon:"home",   key:"nav_home"},
  {id:"tracker", icon:"check",  key:"nav_tracker"},
  {id:"money",   icon:"wallet", key:"nav_money"},
  {id:"profile", icon:"steps",  key:"nav_steps"},
];
//: Which tab stays lit for each screen. A project opens from Tasks.
const NAV_OF = {habits:"tracker", tasks:"tracker", project:"tracker",
                steps:"profile", stats:"profile", team:"profile", more:"profile"};
//: A tab opens where the person last was inside it.
function navTarget(id){
  if(id === "tracker") return state.trackerLast || "habits";
  if(id === "profile") return state.profileLast || "steps";
  return id;
}
/* Which header parts the floating + replaces: in Habits and Tasks (except
   Projects, whose + adds a project) and in Money the header + is hidden, so
   there is one + on the screen, never two. */
function screenClass(){
  const sc = state.screen;
  const grouped = ["habits", "tasks", "steps", "stats", "team"].includes(sc);
  const nohead = (sc === "habits" && state.tab === "habits") || (sc === "tasks" && state.taskTab !== "projects");
  return [grouped ? "grouped" : "", nohead ? "nohead" : "", "screen-" + sc].join(" ");
}
/* The switch at the top of a two-screen tab. */
function groupBar(screen){
  const seg = (items, cur) => `<div class="seg big groupseg">${items.map(([id, key]) =>
    `<div class="${cur === id ? "on" : ""}" data-act="nav" data-screen="${id}">${t(key)}</div>`).join("")}</div>`;
  if(screen === "habits" || screen === "tasks")
    return seg([["habits", "habits"], ["tasks", "tasks"]], screen);
  if(screen === "steps" || screen === "stats" || screen === "team"){
    const me = state.me || {};
    const name = esc(me.first_name || me.name || "");
    const st = state.progress?.steps;
    return `<div class="profile-head">
        <div class="avatar" data-act="settings">${avatarHtml(me.first_name || me.name)}</div>
        <div class="grow"><div class="pname">${name}</div>
          <div class="t3 tiny">${st ? `${STEP_ICON[st.level_key] || ""} ${t("step_lvl_" + st.level_key)} · ${
            t("steps_level_n", {n: st.level})}` : t("nav_profile")}</div></div>
        <button class="iconbtn" data-act="settings" aria-label="${t("settings")}">${icon("settings", 22)}</button>
      </div>` + seg([["steps", "nav_steps"], ["stats", "nav_stats"], ["team", "team"]], screen);
  }
  return "";
}

const offerKey = () => `ernestos-presets-offer-v1-${state.me?.telegram_id || "anon"}`;
function presetsOffer(d){
  // Only for somebody with almost no habits: an account that already has the
  // ready-made set does not need to be told about it on every visit.
  if((d?.counts?.habits?.total || 0) >= 3) return "";
  try{ if(localStorage.getItem(offerKey())) return ""; }catch(_){}
  return `<div class="card" style="margin:12px 0">
    <div>${t("presets_offer")}</div><div class="hint">${t("presets_offer_hint")}</div>
    <div class="btns"><button class="btn secondary sm" data-act="presets-open">${t("habits")}</button>
    <button class="btn secondary sm" data-act="offer-dismiss">${t("dismiss")}</button></div></div>`;
}
function trialBanner(){
  const trial = state.me?.trial;
  if(!trial?.required || trial.subscribed || state.readOnly) return "";
  return `<div class="banner" data-act="sub-open" role="button" tabindex="0">
    ${icon("info", 16)}<div class="grow small">${t("trial_notice", {n:trial.free_actions || 20})}
    <div>${t("trial_remaining", {n:trial.remaining})}</div></div></div>`;
}
SCREENS.more = () => `<h1>${t("more")}</h1>` + [
  ["team", "users", "team"], ["money", "wallet", "money"]
].map(([screen, ic, key]) => `<button class="btn secondary" style="margin:12px 0"
  data-act="nav" data-screen="${screen}">${icon(ic, 20)} ${t(key)}</button>`).join("")
  + `<button class="btn secondary" data-act="settings">${icon("settings", 20)} ${t("settings")}</button>
    <h2>${t("agent_title")}</h2><div class="hint">${t(state.me?.agent?.available ? "agent_ready" : "agent_off")}</div>
    ${state.me?.agent?.available ? `<button class="btn secondary" data-act="agent-open">${t("agent_open")}</button>` : ""}`;

/* The blocked screen. A full screen with a way out, not a 403 string:
   join, check, and the session continues from where it was. */
function blockedScreen(){
  const b = state.blocked || {};
  return `<div style="padding:40px 0 0;text-align:center">
      <div class="state-ico">${icon("shield", 26)}</div>
      <h1 style="margin-top:12px">${t("sub_title")}</h1>
      <div class="t2 small" style="margin-top:8px;max-width:340px;
           margin-left:auto;margin-right:auto">${t("sub_body")}</div>

      <div style="margin-top:22px;text-align:left">

          data-url="${esc(b.channel)}">${icon("globe", 16)} ${t("sub_join")}</button>` : ""}

/* The subscription ask as a sheet: reading stays open underneath it (#15). */
function blockedSheet(){
  const b = state.subInfo || state.me?.trial || {};
  return `<div style="text-align:center">
      <div class="state-ico">${icon("shield", 26)}</div>
      <h3 style="margin-top:8px">${t("sub_title")}</h3>

    </div>

    <button class="btn secondary" data-act="close" style="margin-top:8px">${t("close")}</button>`;
