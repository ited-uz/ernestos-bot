name: android

# Builds the Android app (mobile/) on every push that touches it, and on
# demand from the Actions tab ("Run workflow").
#
# The app needs the server's address. Set it once as a repository variable:
#   Settings → Secrets and variables → Actions → Variables → ERNEST_API_URL
#   (e.g. https://ernestos.up.railway.app), or type it when running by hand.
# Without it the build still runs, to prove the project compiles, but no APK
# is published.
on:
  push:
    paths:
      - "mobile/**"
      - "webapp/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address (https://…). Empty = the ERNEST_API_URL variable."
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ github.event.inputs.api_url || vars.ERNEST_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        working-directory: mobile
        run: npm ci

      # Push notifications need Firebase's google-services.json. Store it as
      # the GOOGLE_SERVICES_JSON secret (the file's text, or base64 of it);
      # without it the app builds with push off and the inbox still works.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > mobile/android/app/google-services.json
            fi
            echo "Firebase config written: push on."
          else
            echo "::notice::GOOGLE_SERVICES_JSON secret not set — APK built without push notifications."
          fi

      - name: Build the web layer
        working-directory: mobile
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::ERNEST_API_URL is not set — compiling only, no APK will be published."
            ERNEST_API_URL=https://server.invalid node scripts/build-www.mjs
          else
            ERNEST_API_URL="$API_URL" node scripts/build-www.mjs
          fi
          npx cap sync android

      # A fixed signing key (secret ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD,
      # made once with scripts/make_android_key.py): updates install over the
      # last build, and Google sign-in recognises the app by its SHA-1.
      # Without them the APK gets a throwaway key each run.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ernestos.p12"
            echo "ERNEST_KEYSTORE=$RUNNER_TEMP/ernestos.p12" >> "$GITHUB_ENV"
            echo "ERNEST_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            # The certificate's SHA-1 is public (Google Cloud asks for it); the key stays secret.
            SHA1=$(keytool -list -v -storetype pkcs12 -keystore "$RUNNER_TEMP/ernestos.p12" \
                     -storepass:env KEYSTORE_PASSWORD 2>/dev/null | awk '/SHA1:/{print $2; exit}')
            echo "Signing key SHA-1: $SHA1"
            echo "### Signing key SHA-1 (Google Cloud → Android client): \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::ANDROID_KEYSTORE_B64 not set — APK signed with a throwaway debug key (no in-place updates, no native Google sign-in)."
          fi

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }} -PversionName=13.1.${{ github.run_number }}

      - name: Publish the APK
        if: env.API_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: ErnestOS-android-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
